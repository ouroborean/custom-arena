# custom.anima-arena.com on the anima-arena VM (docs/deploy.md): the built client from
# /var/www/custom-arena, and /api (HTTP and the /api/ws game socket) proxied to the server on :8795.
# Installed by deploy/install.sh to /etc/nginx/sites-available/custom-arena (+ a sites-enabled link).

map $http_upgrade $ca_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name custom.anima-arena.com;
    # certbot renews by webroot through here.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name custom.anima-arena.com;
    ssl_certificate     /etc/letsencrypt/live/custom.anima-arena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/custom.anima-arena.com/privkey.pem;

    root /var/www/custom-arena;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $ca_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # The service worker and the page must never be cached stale: they decide which build runs.
    location = /sw.js      { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Vite's hashed bundles never change.
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
