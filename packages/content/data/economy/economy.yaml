# The economy (GDD §8.4, docs/equipment.md §3): currencies, rolling, match rewards, drop tables,
# forging and salvage. Everything here is data; the numbers are first guesses to tune.

currencies:
  gold: { name: Gold, start: 300 }

# Rolling a character (new accounts get their first 3 free).
roll:
  cost: { gold: 100 }

# Per match kind. Private matches earn nothing. A loss only pays when it was played out (not a
# surrender, forfeit or AFK), and nothing pays below `minTurns`. `practice` is a verified match
# against a bot (the server issues it and replays it before paying): a baseline of Gold, and half
# the casual chance of a drop.
rewards:
  casual:
    minTurns: 8
    win: { currency: { gold: 40 }, drops: { table: standard, count: 1 } }
    loss: { currency: { gold: 15 } }
    draw: { currency: { gold: 20 } }
  ranked:
    minTurns: 8
    win: { currency: { gold: 60 }, drops: { table: standard, count: 1 } }
    loss: { currency: { gold: 20 } }
    draw: { currency: { gold: 30 } }
  practice:
    minTurns: 8
    win: { currency: { gold: 25 }, drops: { table: standard, count: 1, chance: 0.5 } }
    loss: { currency: { gold: 15 } }
    draw: { currency: { gold: 20 } }

# Item drops per account per UTC day; further wins still pay gold.
dailyDropCap: 10

dropTables:
  # Components only: forged pieces are made by players.
  standard:
    types: { Skill: 35, Shard: 50, Sigil: 15 }

# Forging two unequipped pieces into one (docs/equipment.md §6), by the result's component count.
forge:
  cost:
    "2": { gold: 50 }
    "3": { gold: 100 }

# Splitting a forged piece back into its components.
split:
  cost: { gold: 25 }

# Salvaging an unequipped piece pays gold for each of its components, by component type.
salvage:
  Skill: { gold: 10 }
  Shard: { gold: 5 }
  Sigil: { gold: 30 }
