# Forged equipment names (docs/forging-names.md). A piece is named `[prefix] Base [suffix]` from its
# components, in forge order:
#   skills    1: the Skill component's name · 2: `pairs` · 3: the third skill's `prefixes` entry + the first
#             two's pair ("Reckless Saint Bow")
#   shards    with skills: "<Element>-Infused" or "<Fusion>-Infused" prefix · alone: 1 "<Element> Shard",
#             2 "<Fusion> Crystal" (or `crystals`, by fusion id), 3 "Geode " + `geodes`
#   sigil     its `suffix` ends the name; alone it's "Sigil of …"
# Keys list skill or element ids in alphabetical order, joined with "+".

