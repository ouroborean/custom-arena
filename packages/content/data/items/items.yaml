# Equipment components (docs/equipment.md, docs/forging-names.md). Every piece of equipment is built
# from these: one component on its own, or up to 3 forged together (at most 1 Sigil, no skill twice).
# A forged piece's id is its components' ids joined with "+", in forge order, e.g.
# "longsword+wind_shard+sigil_momentum"; its name comes from data/items/forging.yaml.
#   Skill  grants one base skill (added if the character lacks it).
#   Shard  adds one element to the wearer's infusion pool (the player chooses the skill it goes on).
#   Sigil  a passive, implemented by a status (`passiveEffect`, in statuses.passives-*.yaml) applied to
#          the wearer at match start; `suffix` names forged pieces that carry it.

