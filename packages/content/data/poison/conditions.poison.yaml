# Named conditions, checked with { check: { cond: <name>, unit: <selector> } }.

# Prey: more than 2 total stacks of Toxin, Weakness, Vulnerable and Confusion; or below 20 HP; or
# explicitly marked as Prey.
prey:
  or:
    - { has: { unit: it, effect: prey } }
    - { stackTotal: { unit: it, effects: [toxin, weakness, vulnerable, confusion], moreThan: 2 } }
    - { hpAtMost: { unit: it, value: 19 } }
    # Evolution: Telltale Venom (any Toxin counts) and Delirium (each Debuff stack counts as 2).
    - { and: [{ has: { unit: it, effect: telltale_venom } }, { has: { unit: it, effect: toxin } }] }
    - { and: [{ has: { unit: it, effect: delirium } }, { stackTotal: { unit: it, effects: [toxin, weakness, vulnerable, confusion], moreThan: 1 } }] }
    # Brimstone: Acrid Orb (while Marked) and Scent of Cinders (while Ignited or Scorched).
    - { and: [{ has: { unit: it, effect: acrid_orb } }, { has: { unit: it, effect: mark } }] }
    # Stasis: Frozen Quarry makes Frost debuffs count toward it.
    - and:
        - { has: { unit: it, effect: frozen_quarry } }
        - { stackTotal: { unit: it, effects: [toxin, weakness, vulnerable, confusion, frostbitten, chilled, numb], moreThan: 2 } }
    - and:
        - { has: { unit: it, effect: cinder_scent } }
        - { or: [{ has: { unit: it, effect: ignite } }, { has: { unit: it, effect: scorched } }] }
