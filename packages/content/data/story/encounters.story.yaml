# Story encounters (GDD §2.2): three per chapter — a skirmish, a battle and a boss.
# Enemy kits come from their class and element (docs/single-player.md §2); bosses carry a trait
# (statuses.bosses.yaml) and a short script. Check the curve after edits: npm run sim -- --story

embers_1:
  name: "Ash Raiders"
  description: "Raiders from the ash wastes are burning the border towns. Two of them block the road."
  enemies:
      - { name: "Ash Raider", classId: mage, element: Fire, hp: 73, skillCount: 3 }
      - { name: "Cinder Adept", classId: druid, element: Fire, hp: 73, skillCount: 3 }
  ai: { tier: easy }
  rewards:
    first: { currency: { gold: 50 } }
    repeat: { currency: { gold: 10 } }

