# Achievements (GDD §8.4 "achievement predicates"): each counts finished matches that match `when`,
# and pays its reward once when `count` is reached (in a row, with `streak`). Modes: casual, ranked,
# private, story, tutorial. Numbers are first guesses.

first_victory:
  name: First Victory
  description: Win a match of any kind.
  when: { outcome: win }
  count: 1
  reward: { currency: { gold: 50 } }

online_debut:
  name: Arena Debut
  description: Win a casual or ranked match.
  when: { outcome: win, modes: [casual, ranked] }
  count: 1
  reward: { currency: { gold: 100 } }

on_a_roll:
  name: On a Roll
  description: Win 3 casual or ranked matches in a row.
  when: { outcome: win, modes: [casual, ranked] }
  count: 3
  streak: true
  reward: { currency: { gold: 150 } }

contender:
  name: Contender
  description: Win 10 ranked matches.
  when: { outcome: win, modes: [ranked] }
  count: 10
  reward: { currency: { gold: 300 } }

quick_work:
  name: Quick Work
  description: Win a match by turn 16.
  when: { outcome: win, maxTurns: 16 }
  count: 1
  reward: { currency: { gold: 75 } }

first_chapter:
  name: Embers Doused
  description: Defeat the Cinder Tyrant.
  when: { outcome: win, encounter: embers_3 }
  count: 1
  reward: { currency: { gold: 100 } }

story_complete:
  name: Hero of the Ten Realms
  description: Defeat the Mountain Heart, the last story boss.
  when: { outcome: win, encounter: heartstone_3 }
  count: 1
  reward: { currency: { gold: 500 }, items: [lightning_shard+ice_shard+sigil_caprice] }

# Class mastery: 10 wins with a class on the team pays one of its class armors.
warrior_path:
  name: Warrior's Path
  description: Win 10 matches with a Warrior on your team.
  when: { outcome: win, withClass: warrior }
  count: 10
  reward: { items: [fullplate+sigil_ancestors] }

