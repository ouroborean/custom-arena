# The 30 Life (Earth + Earth) variants, from the "Fusion Spec Kits" design doc. Ids are "<base>.life".
# Keywords: Flourish (overflow healing raises max HP, up to +30 per unit; macro flourish_it) and
# Bloom (a Life character's Seedling that survives becomes a Treant; macro bloom_it).

strike.life:
  archetype: Strike
  element: Life
  name: Oakfist
  description: Deals 20 damage to target enemy, plus 5 per 10 max HP the user has gained from Flourish.
  cost: W
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: damage
      to: primary
      amount: { sum: [20, { mul: [5, { div: [{ counter: flourish }, 10] }] }] }

smash.life:
  archetype: Smash
  element: Life
  name: Groundswell
  description: >-
    Deals 30 damage to target enemy. Every other unit in the battle, on both sides and minions
    included, heals 15, which can Flourish.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 30 }
    - op: forEach
      in: { filter: allUnits, exclude: primary, where: { not: { isEventTarget: it } } }
      do:
        - { op: heal, to: it, amount: 15 }
        - { op: macro, id: flourish_it }

charge.life:
  archetype: Charge
  element: Life
  name: Sapling Charge
  description: >-
    Deals 15 damage to target enemy, and the user creates a Seedling that takes the next hit aimed
    at the user.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: summon, minion: seedling }
    - op: apply
      to: actor
      effect:
        id: sapling_guard
        name: Sapling Guard
        kind: Buff
        element: Life
        description: The next hit on the bearer lands on one of their minions instead.
        modifiers:
          - { mod: redirectDamage }
        triggers:
          - on: damaged
            consume: true
            do: []

riposte.life:
  archetype: Riposte
  element: Life
  name: Thornwall
  description: >-
    For 1 turn, counters the first Harmful skill used on the user. A Seedling sprouts in its path, and its
    user is Taunted by the Seedling for 1 turn. Invisible.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: thornwall
        name: Thornwall
        kind: Buff
        element: Life
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer; a Seedling sprouts and Taunts its user.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: summon, minion: seedling }
              - { op: apply, to: eventSource, effect: taunt, from: lastSummoned, duration: { enemyTurns: 1 } }

rage.life:
  archetype: Rage
  element: Life
  name: Wild Growth
  description: >-
    The user creates a Seedling. For 3 turns, another sprouts for them at the start of each of their turns,
    and they deal 5 more direct damage for each allied Seedling (up to 20 more).
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: seedling }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: wild_growth_surge
        name: Wild Growth
        kind: Buff
        element: Life
        description: A Seedling sprouts at the start of each of the bearer's turns; +5 direct damage per allied Seedling, up to 20.
        modifiers:
          - mod: damageDealt
            amount: 0
            when: { direct: true }
            value:
              if: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [seedling] } } } }, atLeast: 4 } }
              then: 20
              else: { mul: [5, { countOf: { filter: allAllies, where: { minion: { unit: it, types: [seedling] } } } }] }
        triggers:
          - on: turnStart
            do:
              - { op: summon, minion: seedling }

shot.life:
  archetype: Shot
  element: Life
  name: Ripening Seed
  description: >-
    Deals 5 damage to target enemy and plants a seed in them for 3 turns. It ripens at the end of each of the
    user's turns: to 10, then to 25. Using this on them again harvests it first: it bursts for that much
    damage, and the user heals half of what it dealt, which can Flourish. The user tends one seed at a time:
    planting one withers their seed in any other enemy, with no burst.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # The harvest: a seed of 2 stacks is worth 10, of 3 stacks 25 (a fresh one, nothing).
    - op: if
      cond: { has: { unit: primary, effect: ripening_seed, mine: true } }
      then:
        - op: set
          var: ripe
          value:
            if: { compare: { value: { stacks: { unit: primary, effect: ripening_seed } }, atLeast: 3 } }
            then: 25
            else: { if: { compare: { value: { stacks: { unit: primary, effect: ripening_seed } }, atLeast: 2 } }, then: 10, else: 0 }
        - { op: removeEffect, from: primary, effect: ripening_seed }
        - op: if
          cond: { compare: { value: { var: ripe }, atLeast: 1 } }
          then:
            - { op: damage, to: primary, amount: { var: ripe } }
            - op: forEach
              in: actor
              do:
                - { op: heal, to: it, amount: { div: [{ lastDamage: true }, 2] } }
                - { op: macro, id: flourish_it }
    # One seed at a time: the user's seed elsewhere is removed, unharvested.
    - op: forEach
      in: { filter: allEnemies, where: { and: [{ has: { unit: it, effect: ripening_seed, mine: true } }, { not: { isPrimary: it } }] } }
      do: [{ op: removeEffect, from: it, effect: ripening_seed }]
    - { op: damage, to: primary, amount: 5 }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: ripening_seed
        name: Ripening Seed
        kind: Debuff
        element: Life
        stacking: unique
        maxStacks: 3
        description: Ripens at the end of each of the user's turns (10, then 25); the user's next Ripening Seed on the bearer harvests it, and on anyone else withers it.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { compare: { value: { effectStacks: true }, atMost: 2 } }
                then: [{ op: addStacksSelf, amount: 1 }]

snipe.life:
  archetype: Snipe
  element: Life
  name: Heartwood Spear
  description: >-
    At the end of each of the user's turns while it channels, Channel Growth. In 2 turns, deals 50
    damage to target enemy. Channeled.
  cost: Wr
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 2 }
      effect:
        id: heartwood_spear
        name: Heartwood Spear (growing)
        kind: Neutral
        element: Life
        interruptible: true
        description: Channel Growth at the end of each of the user's turns; strikes its target when it ends.
        triggers:
          - on: turnEnd
            do:
              - { op: macro, id: channel_growth }
        onExpire:
          - { op: damage, to: effectTargets, amount: 50 }

trap.life:
  archetype: Trap
  element: Life
  name: Strangling Roots
  description: >-
    For 2 turns, each skill target enemy uses tightens the roots: 1 Weakness for 2 turns (max 3). At
    3, a Seedling sprouts for the user. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: strangling_roots
        name: Strangling Roots
        kind: Debuff
        element: Life
        visibility: hidden
        # Re-casting refreshes it; only the bearer's skills tighten it (its stacks count the tightenings).
        stacking: unique
        description: Each skill the bearer uses gives them 1 Weakness (max 3); at 3, a Seedling sprouts for the trapper.
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { compare: { value: { effectStacks: true }, atMost: 3 } }
                then:
                  - { op: apply, to: bearer, effect: weakness, duration: { enemyTurns: 2 } }
                  - op: if
                    cond: { compare: { value: { effectStacks: true }, atLeast: 3 } }
                    then:
                      - { op: summon, minion: seedling }
                  - { op: addStacksSelf, amount: 1 }

maneuver.life:
  archetype: Maneuver
  element: Life
  name: Take Root
  description: >-
    The user becomes Invulnerable for 1 turn and creates a Boulder. If the Boulder still stands at
    the start of their next turn, it cracks open into a Worldsprout.
  cost: r
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - { op: summon, minion: boulder }
    - op: apply
      to: lastSummoned
      duration: { raw: 2 }
      effect:
        id: take_root
        name: Taking Root
        kind: Neutral
        element: Life
        description: Cracks open into a Worldsprout at the start of its owner's next turn.
        onExpire:
          - { op: transformMinion, to: bearer, minion: worldsprout }

companion.life:
  archetype: Companion
  element: Life
  name: Patient Acorn
  description: >-
    Summons an Acorn (5 HP, not a Seedling) permanently. At the end of each of your turns, it gains
    10 max HP and heals 10, without limit. Crush (r): damage to target enemy equal to half its HP.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: acorn }

bolt.life:
  archetype: Bolt
  element: Life
  name: Growing Thorn
  description: >-
    Deals 15 damage to target enemy and lodges a thorn in them for 2 turns: at the end of each of the
    user's turns, it deals them 10 damage and the user heals 5, which can Flourish.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: growing_thorn
        name: Growing Thorn
        kind: Debuff
        element: Life
        description: At the end of each of the applier's turns, 10 damage to the bearer, and the applier heals 5 (Flourishing).
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: bearer, amount: 10, direct: false }
              - op: forEach
                in: actor
                do:
                  - { op: heal, to: it, amount: 5 }
                  - { op: macro, id: flourish_it }

blast.life:
  archetype: Blast
  element: Life
  name: Verdant Wave
  description: Deals 25 damage to all enemies. The user creates a Seedling for each enemy left below 50 HP (max 2).
  cost: Irr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - { op: set, var: low, value: { countOf: { filter: allEnemies, where: { hpAtMost: { unit: it, value: 49 } } } } }
    - op: repeat
      times: { if: { compare: { value: { var: low }, atLeast: 2 } }, then: 2, else: { var: low } }
      do:
        - { op: summon, minion: seedling }

consume.life:
  archetype: Consume
  element: Life
  name: Harvest
  description: >-
    Target ally heals 10, plus the remaining HP of one of the user's Seedlings or Treants, which is sacrificed;
    this can Flourish. If the user has none, they create a Seedling.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: set, var: sap, value: 0 }
    - { op: set, var: reaped, value: 0 }
    - op: forEach
      in: { randomAlly: 1, where: { minion: { unit: it, types: [seedling], mine: true } } }
      do:
        - { op: set, var: sap, value: { hp: it } }
        - { op: set, var: reaped, value: 1 }
        - { op: kill, to: it }
    - op: forEach
      in: primary
      do:
        - { op: heal, to: it, amount: { sum: [10, { var: sap }] } }
        - { op: macro, id: flourish_it }
    - op: if
      cond: { not: { varTrue: reaped } }
      then:
        - { op: summon, minion: seedling }

summon.life:
  archetype: Summon
  element: Life
  name: Dryad
  description: >-
    Summons a Dryad (20 HP) for 3 turns. Mend (nc): target ally heals 15, which can Flourish.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: dryad, duration: { enemyTurns: 3 } }

channel.life:
  archetype: Channel
  element: Life
  name: Tend the Grove
  description: >-
    For 4 turns, at the end of each of the user's turns, every allied minion heals 15, which can
    Flourish; if the user has no minion, they create a Seedling. Channeled.
  cost: Ir
  cooldown: 3
  tags: [Helpful, Strategic, Channeled]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: tend_the_grove
        name: Tend the Grove
        kind: Neutral
        element: Life
        interruptible: true
        description: At the end of each of the user's turns, allied minions heal 15 (Flourishing), or a Seedling sprouts.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { any: { in: allAllies, cond: { kind: { unit: it, is: minion } } } }
                then:
                  - op: forEach
                    in: { filter: allAllies, where: { kind: { unit: it, is: minion } } }
                    do:
                      - { op: heal, to: it, amount: 15 }
                      - { op: macro, id: flourish_it }
                else:
                  - { op: summon, minion: seedling }

stab.life:
  archetype: Stab
  element: Life
  name: Splinter Spike
  description: >-
    Sacrifices one of the user's Seedlings, if they have one, to deal 25 Piercing damage to target enemy;
    otherwise it deals 10 damage and the user creates a Seedling.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { any: { in: allAllies, cond: { minion: { unit: it, types: [seedling], mine: true } } } }
      then:
        - { op: kill, to: { randomAlly: 1, where: { minion: { unit: it, types: [seedling], mine: true } } } }
        - { op: damage, to: primary, amount: 25, type: Piercing }
      else:
        - { op: damage, to: primary, amount: 10 }
        - { op: summon, minion: seedling }

ravage.life:
  archetype: Ravage
  element: Life
  name: Taproot
  description: >-
    Deals 25 Piercing damage to target enemy. Against a Stunned target, 10 of their max HP moves to
    the user, counting toward the user's Flourish limit.
  cost: Wr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25, type: Piercing }
    - op: if
      cond: { and: [{ stunned: primary }, { compare: { value: { counter: flourish }, atMost: 20 } }] }
      then:
        - { op: addMaxHp, to: primary, amount: -10 }
        - { op: addMaxHp, to: actor, amount: 10 }
        - { op: heal, to: actor, amount: 10, raw: true, quiet: true }
        - { op: setCounter, name: flourish, value: { sum: [{ counter: flourish }, 10] } }

mislead.life:
  archetype: Mislead
  element: Life
  name: Living Screen
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it lands on the user's minions instead of its
    targets. With no minion to take it, it's countered and the user creates a Boulder. Invisible.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: if
      cond: { any: { in: allAllies, cond: { kind: { unit: it, is: minion } } } }
      then:
        - op: apply
          to: primary
          duration: { enemyTurns: 1 }
          effect:
            id: living_screen
            name: Living Screen
            kind: Debuff
            element: Life
            visibility: hidden
            description: The bearer's next Harmful skill hits the screen's minions instead.
            triggers:
              - on: skillUsed
                when: { harmful: true }
                consume: true
                do:
                  - op: apply
                    to: { filter: allAllies, where: { kind: { unit: it, is: character } } }
                    duration: { thisTurn: true }
                    effect:
                      id: living_screen_cover
                      name: Living Screen
                      kind: Buff
                      element: Life
                      description: Damage to the bearer lands on an allied minion this turn.
                      modifiers:
                        - { mod: redirectDamage }
      else:
        - op: apply
          to: primary
          duration: { enemyTurns: 1 }
          effect:
            id: living_screen_wall
            name: Living Screen
            kind: Debuff
            element: Life
            visibility: hidden
            description: The bearer's next Harmful skill is countered, and a Boulder rises for the screen's maker.
            triggers:
              - on: skillUsed
                when: { harmful: true }
                intercept: counter
                consume: true
                do:
                  - { op: summon, minion: boulder }

stun.life:
  archetype: Stun
  element: Life
  name: Overgrow
  description: >-
    Deals 10 damage to target enemy and roots them: a Seedling sprouts for the user, and the target is
    Stunned for 2 turns, or until that Seedling dies.
  cost: Ar
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: summon, minion: seedling }
    - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 2 }, bindTo: lastSummoned }

dance.life:
  archetype: Dance
  element: Life
  name: Evergreen
  description: >-
    For 3 turns, at the start of each of the user's turns, they heal 10, which can Flourish, and
    gain 1 Swiftness if they're above their starting max HP.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: evergreen
        name: Evergreen
        kind: Buff
        element: Life
        description: At the start of the bearer's turn, they heal 10 (Flourishing) and gain Swiftness if they've Flourished.
        triggers:
          - on: turnStart
            do:
              - op: forEach
                in: bearer
                do:
                  - { op: heal, to: it, amount: 10 }
                  - { op: macro, id: flourish_it }
              - op: if
                cond: { compare: { value: { counterOf: { unit: bearer, name: flourish } }, atLeast: 1 } }
                then:
                  - { op: apply, to: bearer, effect: swiftness }

heal.life:
  archetype: Heal
  element: Life
  name: Lifebloom
  description: Target ally heals 20, which can Flourish. If any of it Flourishes, the user creates a Seedling.
  cost: r
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: forEach
      in: primary
      do:
        - { op: heal, to: it, amount: 20 }
        - { op: macro, id: flourish_it }
    - op: if
      cond: { compare: { value: { var: grow }, atLeast: 1 } }
      then:
        - { op: summon, minion: seedling }

bless.life:
  archetype: Bless
  element: Life
  name: Graft
  description: >-
    For 3 turns, target ally gains 1 Might, and their max HP rises by 20; the extra HP arrives
    filled and leaves when it ends.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: graft
        name: Graft
        kind: Buff
        element: Life
        description: +20 max HP.
        modifiers:
          - { mod: maxHp, amount: 20 }
    - { op: heal, to: primary, amount: 20, raw: true, quiet: true }

curse.life:
  archetype: Curse
  element: Life
  name: Tangleweed
  description: Target enemy gains 1 Confusion for 2 turns, and meanwhile their skills can't target the user's minions.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: confusion, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: tangleweed
        name: Tangleweed
        kind: Debuff
        element: Life
        description: The bearer can't target minions.
        modifiers:
          - { mod: targetExclude, where: { kind: { unit: it, is: minion } }, singleOnly: true }

smite.life:
  archetype: Smite
  element: Life
  name: Sunlit Glade
  description: Deals 20 damage to target enemy. Every ally heals 5, which can Flourish.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: forEach
      in: allAllies
      do:
        - { op: heal, to: it, amount: 5 }
        - { op: macro, id: flourish_it }

prayer.life:
  archetype: Prayer
  element: Life
  name: Common Root
  description: >-
    All allies heal 20. For 2 turns, damage dealt to any unit on the user's side is split evenly
    among all of them, minions included.
  cost: Wrr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - op: apply
      to: allAllies
      duration: { enemyTurns: 2 }
      effect:
        id: common_root
        name: Common Root
        kind: Buff
        element: Life
        description: Damage to the bearer is split evenly with every ally sharing the root.
        modifiers:
          - { mod: shareDamage }

cleave.life:
  archetype: Cleave
  element: Life
  name: Whirling Vines
  description: >-
    Deals 10 damage to all enemies, doubled against minions. Each enemy minion it kills becomes a
    Seedling for the user.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: set, var: minionsBefore, value: { countOf: { filter: allEnemies, where: { kind: { unit: it, is: minion } } } } }
    - op: damage
      to: targets
      amount: { if: { kind: { unit: it, is: minion } }, then: 20, else: 10 }
    - op: repeat
      times: { sum: [{ var: minionsBefore }, { mul: [-1, { countOf: { filter: allEnemies, where: { kind: { unit: it, is: minion } } } }] }] }
      do:
        - { op: summon, minion: seedling }

shout.life:
  archetype: Shout
  element: Life
  name: Call of the Grove
  description: >-
    If there's no allied Seedling that hasn't Bloomed yet, the user creates one. Then every allied Seedling Blooms
    now, and every allied minion heals to full.
  cost: S
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: if
      cond: { not: { any: { in: allAllies, cond: { and: [{ minion: { unit: it, types: [seedling] } }, { not: { minion: { unit: it, types: [treant] } } }] } } } }
      then:
        - { op: summon, minion: seedling }
    - op: forEach
      in: { filter: allAllies, where: { and: [{ minion: { unit: it, types: [seedling] } }, { not: { minion: { unit: it, types: [treant] } } }] } }
      do: [{ op: macro, id: bloom_it }]
    - op: forEach
      in: { filter: allAllies, where: { kind: { unit: it, is: minion } } }
      do:
        - { op: heal, to: it, amount: { missingHp: it } }

withstand.life:
  archetype: Withstand
  element: Life
  name: Barkskin
  description: >-
    The user gains 20 Shield for 2 turns. When it ends, whatever is left heals the user, which can
    Flourish.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      value: 20
      duration: { enemyTurns: 2 }
      effect:
        id: barkskin
        name: Barkskin
        kind: Buff
        element: Life
        shield: true
        description: A Shield; when it ends, whatever is left heals the bearer (Flourishing).
        onExpire:
          - op: forEach
            in: bearer
            do:
              - { op: heal, to: it, amount: { effectValue: true } }
              - { op: macro, id: flourish_it }

taunt.life:
  archetype: Taunt
  element: Life
  name: Warden Oak
  description: >-
    Target enemy is Taunted for 2 turns by one of the user's minions, or by the user if they have
    none. A Seedling that survives it Blooms when it ends.
  cost: W
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - op: if
      cond: { any: { in: allAllies, cond: { kind: { unit: it, is: minion } } } }
      then:
        - { op: forEach, in: { randomAlly: 1, where: { kind: { unit: it, is: minion } } }, do: [{ op: set, var: guard, value: 1 }] }
        - op: apply
          to: primary
          from: { randomAlly: 1, where: { kind: { unit: it, is: minion } } }
          effect: taunt
          duration: { enemyTurns: 2 }
        - op: apply
          to: { filter: allAllies, where: { minion: { unit: it, types: [seedling] } } }
          duration: { enemyTurns: 2 }
          effect:
            id: guardian_oak
            name: Warden Oak
            kind: Buff
            element: Life
            description: Blooms when this ends, if it survives.
            onExpire:
              - op: if
                cond: { not: { minion: { unit: bearer, types: [treant] } } }
                then:
                  - { op: forEach, in: bearer, do: [{ op: macro, id: bloom_it }] }
      else:
        - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }

titan.life:
  archetype: Titan
  element: Life
  name: Ancient Treant
  description: For 3 turns, the user gains Immune and 1 Armor per allied minion, and allied minions are Untargetable.
  cost: WW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      effect: armor
      stacks: { countOf: { filter: allAllies, where: { kind: { unit: it, is: minion } } } }
      duration: { enemyTurns: 3 }
    - { op: apply, to: { filter: allAllies, where: { kind: { unit: it, is: minion } } }, effect: untargetable, duration: { enemyTurns: 3 } }

