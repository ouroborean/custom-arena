  description: Deals 15 damage to target enemy.
  cost: nc
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }

acorn_crush:
  archetype: Minion
  element: Life
  name: Crush
  description: Deals damage to target enemy equal to half the Acorn's HP.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: { div: [{ hp: actor }, 2] } }

dryad_mend:
  archetype: Minion
  element: Life
  name: Mend
  description: Target ally heals 15, which can Flourish.
  cost: nc
  cooldown: 0
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: forEach
      in: primary
      do:
        - { op: heal, to: it, amount: 15 }
