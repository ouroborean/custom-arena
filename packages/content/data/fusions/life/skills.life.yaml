      stacks: { countOf: { filter: allAllies, where: { kind: { unit: it, is: minion } } } }
      duration: { enemyTurns: 3 }
    - { op: apply, to: { filter: allAllies, where: { kind: { unit: it, is: minion } } }, effect: untargetable, duration: { enemyTurns: 3 } }

