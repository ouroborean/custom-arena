# Phoenix actions.

# `it` rises from Ashes: back up to 25 HP if they have less.
rise:
  - op: if
    cond: { has: { unit: it, effect: ashes } }
    then:
      - { op: removeEffect, from: it, effect: ashes }
      - { op: heal, to: it, raw: true, amount: { sum: [25, { mul: [-1, { hp: it }] }] } }

# Kindle on the primary target: on an enemy, `burn` damage and Ignite; on an ally, that much healing
# and 2 Renew. Set `burn` first.
kindle:
  - op: if
    cond: { isEnemy: primary }
    then:
      - { op: damage, to: primary, amount: { var: burn } }
      - { op: apply, to: primary, effect: ignite }
    else:
      - { op: heal, to: primary, amount: { var: burn } }
      - { op: apply, to: primary, effect: renew, stacks: 2 }
