# The 30 Phoenix (Fire + Holy) variants, from the "Fusion Spec Kits" design doc.
# Kindle skills are Radiant (they target anyone; Harmful only on an enemy) and run the `kindle`
# macro with `burn` set. Rebirth sends a unit to Ashes instead of dying; `rise` brings it back.

strike.phoenix:
  archetype: Strike
  element: Phoenix
  name: Firebrand Talon
  description: >-
    Gives target unit Firebrand for 2 turns. An enemy takes 10 damage, then 10 Affliction damage each
    time they use a skill meanwhile; an ally heals 10, then heals 10 more each time they use a skill
    meanwhile.
  cost: S
  cooldown: 0
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - op: if
      cond: { isEnemy: primary }
      then:
        - { op: damage, to: primary, amount: 10 }
        - op: apply
          to: primary
          duration: { enemyTurns: 2 }
          effect:
            id: firebrand
            name: Firebrand
            kind: Debuff
            element: Phoenix
            stacking: unique
            description: Each skill the bearer uses deals them 10 Affliction damage.
            triggers:
              - on: skillUsed
                do:
                  - { op: damage, to: bearer, amount: 10, type: Affliction, direct: false }
      else:
        - { op: heal, to: primary, amount: 10 }
        - op: apply
          to: primary
          duration: { enemyTurns: 2 }
          effect:
            id: firebrand_mend
            name: Firebrand
            kind: Buff
            element: Phoenix
            stacking: unique
            description: Each skill the bearer uses heals them 10.
            triggers:
              - on: skillUsed
                do:
                  - { op: heal, to: bearer, amount: 10 }

smash.phoenix:
  archetype: Smash
  element: Phoenix
  name: Pyre Plunge
  description: >-
    The user loses up to 40 HP, never going below 1. Target enemy takes that much damage, and each of
    their allies half as much. The user gains Rebirth for 1 turn.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # The fuel is the user's own HP (as Sacrificial Flame burns it); the hits scale with what burned.
    - op: set
      var: burned
      value:
        if: { hpAbove: { unit: actor, value: 40 } }
        then: 40
        else: { sum: [{ hp: actor }, -1] }
    - { op: damage, to: actor, amount: { var: burned }, raw: true, type: Affliction, direct: false }
    - op: if
      cond: { compare: { value: { var: burned }, atLeast: 1 } }
      then:
        - { op: damage, to: primary, amount: { var: burned } }
        - { op: damage, to: primaryAllies, amount: { div: [{ var: burned }, 2] } }
    - { op: apply, to: actor, effect: rebirth, duration: { enemyTurns: 1 } }

charge.phoenix:
  archetype: Charge
  element: Phoenix
  name: Rising Dive
  description: >-
    Deals 15 damage to target enemy, or heals target ally 15. The user gains Rebirth until their next
    skill lands (for up to 2 turns); if it's still unspent then, that skill also deals 15 more damage to
    its first target if they're an enemy, or heals them 15 more if they're an ally.
  cost: S
  cooldown: 2
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - op: if
      cond: { isEnemy: primary }
      then:
        - { op: damage, to: primary, amount: 15 }
      else:
        - { op: heal, to: primary, amount: 15 }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: rising_dive
        name: Rising Dive
        kind: Buff
        element: Phoenix
        stacking: unique
        countsAs: [rebirth]
        description: Rebirth until the bearer's next skill lands; unspent, that skill deals 15 more to its enemy target or heals its ally target 15 more.
        modifiers:
          - { mod: hpFloor, amount: 1 }
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 1 } }
                then:
                  - { op: removeSelf }
                  - { op: apply, to: bearer, effect: ashes }
          # After resolution: a countered skill spends nothing.
          - on: skillResolved
            consume: true
            do:
              - op: forEach
                in: eventPrimary
                do:
                  - op: if
                    cond: { isEnemy: it }
                    then:
                      - { op: damage, to: it, amount: 15 }
                    else:
                      - { op: heal, to: it, amount: 15 }

riposte.phoenix:
  archetype: Riposte
  element: Phoenix
  name: Searing Rebuttal
  description: >-
    For 1 turn, counters the first Harmful skill used on the user. If its user is Ignited, their Ignite
    burns once immediately, and the user is Anointed until the end of their next turn. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: searing_rebuttal
        name: Searing Rebuttal
        kind: Buff
        element: Phoenix
        visibility: hidden
        description: >-
          Counters the first Harmful skill used on the bearer; if its user is Ignited, their Ignite
          burns once.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: ignite } }
                then:
                  - { op: forEach, in: eventSource, do: [{ op: macro, id: ignite_tick }] }
                  - { op: apply, to: bearer, effect: anointed, duration: { ownTurns: 1 } }

rage.phoenix:
  archetype: Rage
  element: Phoenix
  name: Pyreheart Fury
  description: >-
    For 3 turns, each enemy the user deals direct damage to is Ignited, and the user's direct damage is
    5 more for each Ignited enemy.
  cost: SA
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: pyreheart_fury
        name: Pyreheart Fury
        kind: Buff
        element: Phoenix
        stacking: unique
        description: Direct hits Ignite their enemy target and deal 5 more per Ignited enemy.
        modifiers:
          # Counted as the hit lands, before this hit's own Ignite.
          - mod: damageDealt
            amount: 0
            when: { direct: true }
            value: { mul: [5, { countOf: { filter: allEnemies, where: { has: { unit: it, effect: ignite } } } }] }
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - { op: apply, to: eventTarget, effect: ignite }

shot.phoenix:
  archetype: Shot
  element: Phoenix
  name: Ember Shot
  description: >-
    Deals 10 damage to target enemy. For 1 turn, the next direct hit they take from the user's side
    deals 10 more and Ignites them.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: lodged_ember
        name: Lodged Ember
        kind: Debuff
        element: Phoenix
        description: The next direct hit from the applier's side deals 10 more and Ignites the bearer.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            consume: true
            do:
              - { op: damage, to: bearer, amount: 10 }
              - { op: apply, to: bearer, effect: ignite }

snipe.phoenix:
  archetype: Snipe
  element: Phoenix
  name: Sunfall Lance
  description: >-
    On the following turn, deals 35 damage to target enemy and 15 to each of their allies. The target of
    this skill is invisible. Channeled.
  cost: Srr
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: sunfall_lance
        name: Sunfall Lance (aiming)
        kind: Neutral
        element: Phoenix
        visibility: hiddenTarget
        interruptible: true
        description: At the end of the following turn, deals 35 damage to its target and 15 to each of their allies.
        onExpire:
          - op: forEach
            in: effectTargets
            do:
              - { op: damage, to: it, amount: 35 }
              - { op: damage, to: { filter: allEnemies, exclude: it, where: { not: { isActor: it } } }, amount: 15 }

trap.phoenix:
  archetype: Trap
  element: Phoenix
  name: Smoldering Nest
  description: >-
    For 3 turns, the first time target enemy kills a unit or sends one to Ashes, they take 25 damage and
    are Ignited. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: smoldering_nest
        name: Smoldering Nest
        kind: Debuff
        element: Phoenix
        visibility: hidden
        description: The first time the bearer kills a unit or sends one to Ashes, they take 25 damage and are Ignited.
        triggers:
          - on: dealtDamage
            do:
              - op: if
                cond:
                  or:
                    - { not: { any: { in: eventTarget, cond: { hpAbove: { unit: it, value: 0 } } } } }
                    - { has: { unit: eventTarget, effect: ashes } }
                then:
                  - { op: removeSelf }
                  - { op: damage, to: bearer, amount: 25 }
                  - { op: apply, to: bearer, effect: ignite }

maneuver.phoenix:
  archetype: Maneuver
  element: Phoenix
  name: Banked Embers
  description: >-
    Until the start of their next turn, the user is Untargetable by allies and enemies alike and can't
    lose HP.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    # Like Ashes, but no rise: it never heals.
    - op: apply
      to: actor
      effect:
        id: banked_embers
        name: Banked Embers
        kind: Neutral
        element: Phoenix
        stacking: unique
        description: Untargetable by everyone and can't lose HP until the start of the bearer's next turn.
        modifiers:
          - { mod: untargetable, by: enemies, bypassable: false }
          - { mod: untargetable, by: allies, bypassable: false }
          - { mod: damageTaken, amount: 0, mul: 0 }
          - { mod: hpFloor, amount: 1 }
        triggers:
          - on: turnStart
            do:
              - { op: removeSelf }

companion.phoenix:
  archetype: Companion
  element: Phoenix
  name: Phoenix Chick
  description: >-
    Summons a Phoenix Chick (15 HP) permanently. Peck (r): 10 damage and Ignite. The first time it dies,
    it's replaced at the end of your next turn by a Firebird (30 HP) whose Peck deals 20.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: phoenix_chick }

bolt.phoenix:
  archetype: Bolt
  element: Phoenix
  name: Flare of Mercy
  description: >-
    Kindle: 20 damage and Ignite to target enemy, or 20 healing and 2 Renew to target ally. An ally
    it mends also loses 1 Debuff.
  cost: Sr
  cooldown: 1
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - { op: set, var: burn, value: 20 }
    - { op: macro, id: kindle }
    - op: if
      cond: { not: { isEnemy: primary } }
      then:
        - { op: removeRandom, from: primary, kind: Debuff }

blast.phoenix:
  archetype: Blast
  element: Phoenix
  name: Cleansing Fire
  description: >-
    Deals 25 damage to all enemies, and they lose all their Buffs. Then every ally of the user, the
    user included, loses all their Debuffs.
  cost: IW
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - { op: removeKind, from: targets, kind: Buff }
    - { op: removeKind, from: allAllies, kind: Debuff }

consume.phoenix:
  archetype: Consume
  element: Phoenix
  name: Draw the Flame
  description: >-
    Deals 10 damage to target enemy. If they still have more HP than the user, the user heals half the
    difference (at most 25).
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: set, var: gap, value: { sum: [{ hp: primary }, { mul: [-1, { hp: actor }] }] } }
    - op: if
      cond: { compare: { value: { var: gap }, atLeast: 2 } }
      then:
        - op: heal
          to: actor
          amount: { if: { compare: { value: { var: gap }, atLeast: 50 } }, then: 25, else: { div: [{ var: gap }, 2] } }

summon.phoenix:
  archetype: Summon
  element: Phoenix
  name: Ember Spirit
  description: >-
    Summons an Ember Spirit (20 HP) for 3 turns. Waver (r): Kindle, 15 damage and Ignite to target
    enemy, or 15 healing and 2 Renew to target ally.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: ember_spirit, duration: { enemyTurns: 3 } }

channel.phoenix:
  archetype: Channel
  element: Phoenix
  name: Eternal Pyre
  description: >-
    For up to 3 turns, at the end of each of the user's turns, deals damage to all enemies: 5, then 10,
    then 15. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    # Stacks = the next burn's size in fives.
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: eternal_pyre
        name: Eternal Pyre
        kind: Neutral
        element: Phoenix
        interruptible: true
        description: Each turn, deals damage to all enemies, 5 more than the turn before (5, 10, 15).
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: allEnemies, amount: { mul: [5, { effectStacks: true }] } }
              - { op: addStacksSelf, amount: 1 }

stab.phoenix:
  archetype: Stab
  element: Phoenix
  name: Cautery Needle
  description: >-
    On target enemy: deals 15 damage, and they can't be healed until the end of their next turn. On
    target ally: removes up to 2 of their Debuffs, and they lose 10 HP for each (never below 1).
  cost: r
  cooldown: 0
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - op: if
      cond: { isEnemy: primary }
      then:
        - { op: damage, to: primary, amount: 15 }
        - op: apply
          to: primary
          duration: { enemyTurns: 1 }
          effect:
            id: seared_shut
            name: Seared Shut
            kind: Debuff
            element: Phoenix
            description: Can't be healed.
            modifiers:
              - { mod: healingReceived, mul: 0 }
      else:
        - op: repeat
          times: 2
          do:
            - op: if
              cond: { hasKind: { unit: primary, kind: Debuff } }
              then:
                - { op: removeRandom, from: primary, kind: Debuff }
                - op: damage
                  to: primary
                  amount: { if: { hpAbove: { unit: primary, value: 10 } }, then: 10, else: { sum: [{ hp: primary }, -1] } }
                  type: Affliction
                  direct: false
                  raw: true

ravage.phoenix:
  archetype: Ravage
  element: Phoenix
  name: Pyre Talon
  description: >-
    Deals 20 Piercing damage to target enemy, plus 5 for every 10 HP the user is missing (at most 30
    more).
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: set, var: heat, value: { mul: [5, { div: [{ missingHp: actor }, 10] }] } }
    - op: damage
      to: primary
      type: Piercing
      amount: { sum: [20, { if: { compare: { value: { var: heat }, atLeast: 30 } }, then: 30, else: { var: heat } }] }

mislead.phoenix:
  archetype: Mislead
  element: Phoenix
  name: Flaring Feint
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered and their Ignite burns three times
    at once. Invisible.
  cost: S
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: flaring_feint
        name: Flaring Feint
        kind: Debuff
        element: Phoenix
        visibility: hidden
        description: The bearer's next Harmful skill is countered and their Ignite burns three times.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: forEach, in: bearer, do: [{ op: repeat, times: 3, do: [{ op: macro, id: ignite_tick }] }] }

stun.phoenix:
  archetype: Stun
  element: Phoenix
  name: Cinder Shroud
  description: >-
    Deals 15 damage to target enemy and Stuns them for 2 turns. While they're Stunned, they can't lose
    HP.
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: cinder_shroud
        name: Cinder Shroud
        kind: Debuff
        element: Phoenix
        description: While the bearer is Stunned, they can't lose HP.
        modifiers:
          - { mod: damageTaken, amount: 0, mul: 0, if: { stunned: bearer } }
          - { mod: hpFloor, amount: 1, if: { stunned: bearer } }

dance.phoenix:
  archetype: Dance
  element: Phoenix
  name: Dance of Embers
  description: >-
    For 4 turns, the user gains 2 Swiftness, and each skill they use meanwhile adds 1 stack to this.
    When it ends, each stack deals 10 damage to every enemy and heals every ally 5.
  cost: AW
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: swiftness, stacks: 2, duration: { enemyTurns: 4 } }
    - { op: setCounter, name: dance_embers, value: 0 }
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: dance_of_embers
        name: Dance of Embers
        kind: Buff
        element: Phoenix
        description: >-
          Each skill the bearer uses adds 1 stack; when this ends, each stack deals 10 damage to every
          enemy and heals every ally 5.
        triggers:
          - on: skillUsed
            do:
              - { op: setCounter, name: dance_embers, value: { sum: [{ counter: dance_embers }, 1] } }
        onExpire:
          - op: repeat
            times: { counter: dance_embers }
            do:
              - { op: damage, to: allEnemies, amount: 10, direct: false }
              - { op: heal, to: allAllies, amount: 5 }

heal.phoenix:
  archetype: Heal
  element: Phoenix
  name: Sacrificial Flame
  description: The user loses up to 30 HP, never going below 1. Target ally heals twice as much as the user lost.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: set, var: burned, value: { if: { hpAbove: { unit: actor, value: 30 } }, then: 30, else: { sum: [{ hp: actor }, -1] } } }
    - { op: damage, to: actor, amount: { var: burned }, raw: true, type: Affliction, direct: false }
    - { op: heal, to: primary, amount: { mul: [2, { var: burned }] } }

bless.phoenix:
  archetype: Bless
  element: Phoenix
  name: Phoenix Blessing
  description: >-
    For 3 turns, target ally gains 1 Might and Rebirth. If the Rebirth is still unused when this ends,
    they heal 25.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: phoenix_blessing
        name: Rebirth
        kind: Buff
        element: Phoenix
        countsAs: [rebirth]
        description: When the bearer would die, they gain Ashes instead. If unused, it heals the bearer 25 when it ends.
        modifiers:
          - { mod: hpFloor, amount: 1 }
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 1 } }
                then:
                  - { op: removeSelf }
                  - { op: apply, to: bearer, effect: ashes }
        onExpire:
          - { op: heal, to: bearer, amount: 25 }

curse.phoenix:
  archetype: Curse
  element: Phoenix
  name: Cinders of Doubt
  description: >-
    Ignites target enemy. For 3 turns, at the end of each of the user's turns, if they're still Ignited,
    they gain 1 Weakness or 1 Vulnerable for 1 turn, or 1 Confusion, at random.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: ignite }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: cinders_of_doubt
        name: Cinders of Doubt
        kind: Debuff
        element: Phoenix
        stacking: unique
        description: >-
          At the end of each of the applier's turns, if the bearer is Ignited, they gain 1 Weakness or 1
          Vulnerable for 1 turn, or 1 Confusion, at random.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { has: { unit: bearer, effect: ignite } }
                then:
                  - op: random
                    options:
                      - [{ op: apply, to: bearer, effect: weakness, duration: { enemyTurns: 1 } }]
                      - [{ op: apply, to: bearer, effect: vulnerable, duration: { enemyTurns: 1 } }]
                      - [{ op: apply, to: bearer, effect: confusion }]

smite.phoenix:
  archetype: Smite
  element: Phoenix
  name: Sanctified Pyre
  description: >-
    Deals 20 damage to target enemy and gives them Sanctified Pyre for 1 turn: it counts as Sanctify,
    but instead of healing their attackers, it counts each direct hit they take. When it ends, they take
    15 Affliction damage per hit.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    # Stacks - 1 = hits taken.
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: sanctified_pyre
        name: Sanctified Pyre
        kind: Debuff
        element: Phoenix
        countsAs: [sanctify]
        description: >-
          Counts as Sanctify. Counts each direct hit the bearer takes; when it ends, the bearer takes 15
          Affliction damage per hit.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - { op: addStacksSelf, amount: 1 }
        onExpire:
          - { op: damage, to: bearer, amount: { mul: [15, { sum: [{ effectStacks: true }, -1] }] }, type: Affliction, direct: false }

prayer.phoenix:
  archetype: Prayer
  element: Phoenix
  name: Second Dawn
  description: Every fallen ally of the user returns with 20 HP and no Buffs or Debuffs. Then all allies heal 15.
  cost: Wrr
  cooldown: 5
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: revive, hp: 20 }
    - { op: heal, to: allAllies, amount: 15 }

cleave.phoenix:
  archetype: Cleave
  element: Phoenix
  name: Fanned Flames
  description: >-
    Deals 20 damage to target enemy and 15 to a random other enemy. For 1 turn, each direct hit either
    of them takes also deals 5 damage to the other.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: damage, to: it, amount: 15 }
        # Each of the pair carries a link that remembers the other.
        - op: apply
          to: primary
          remember: it
          duration: { enemyTurns: 1 }
          effect: &fanned_flames
            id: fanned_flames
            name: Fanned Flames
            kind: Debuff
            element: Phoenix
            description: Each direct hit on the bearer deals 5 damage to the unit they're linked to.
            triggers:
              - on: damaged
                when: { direct: true }
                do:
                  - { op: damage, to: effectTargets, amount: 5, direct: false }
        - { op: apply, to: it, remember: primary, duration: { enemyTurns: 1 }, effect: *fanned_flames }

shout.phoenix:
  archetype: Shout
  element: Phoenix
  name: Phoenix Cry
  description: >-
    For 2 turns, each enemy who deals direct damage to an ally of the user is Ignited, and the ally
    they hurt gains 1 Renew.
  cost: W
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: phoenix_cry
        name: Phoenix Cry
        kind: Debuff
        element: Phoenix
        description: Each direct hit the bearer lands on the applier's side Ignites them and gives the one hit 1 Renew.
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - { op: apply, to: bearer, effect: ignite }
              - { op: apply, to: eventTarget, effect: renew }

withstand.phoenix:
  archetype: Withstand
  element: Phoenix
  name: Cocoon of Flame
  description: >-
    The user gains 40 Shield and can't act on their next turn. When the Shield ends, the user and every
    ally heal as much as it has left.
  cost: A
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      value: 40
      duration: { raw: 3 }
      effect:
        id: cocoon_of_flame
        name: Cocoon of Flame
        kind: Buff
        element: Phoenix
        shield: true
        description: A Shield; when it ends, everyone on the bearer's side heals what's left of it.
        onExpire:
          - { op: heal, to: allAllies, amount: { effectValue: true } }
    - op: apply
      to: actor
      duration: { raw: 3 }
      effect:
        id: cocooned
        name: Cocooned
        kind: Neutral
        element: Phoenix
        description: Can't act until Cocoon of Flame ends.
        modifiers:
          - { mod: cannotUseSkills }

taunt.phoenix:
  archetype: Taunt
  element: Phoenix
  name: Blazing Challenge
  description: >-
    Target enemy is Taunted by the user for 1 turn. Each time they hit the user meanwhile, every other
    ally of the user heals 10.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 1 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: blazing_challenge
        name: Blazing Challenge
        kind: Buff
        element: Phoenix
        description: Each hit from the Taunted enemy heals every other ally of the bearer 10.
        triggers:
          - on: damaged
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: taunt, mine: true } }
                then:
                  - { op: heal, to: { filter: allAllies, where: { not: { isActor: it } } }, amount: 10 }

titan.phoenix:
  archetype: Titan
  element: Phoenix
  name: Undying Phoenix
  description: >-
    For 3 turns, the user gains Immune, and each direct hit they take gives them 1 Renew for every 10
    damage, up to 3 Renew at a time.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: undying_phoenix
        name: Undying Phoenix
        kind: Buff
        element: Phoenix
        description: Each direct hit on the bearer gives them 1 Renew per 10 damage, up to 3 Renew at a time.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              # Topped up to at most 3 stacks in all, so big hits can't snowball.
              - op: set
                var: room
                value: { sum: [3, { mul: [-1, { totalStacks: { in: bearer, effect: renew } }] }] }
              - op: set
                var: gain
                value: { if: { compare: { value: { sum: [{ div: [{ eventAmount: true }, 10] }, { mul: [-1, { var: room }] }] }, atLeast: 0 } }, then: { var: room }, else: { div: [{ eventAmount: true }, 10] } }
              - op: if
                cond: { compare: { value: { var: gain }, atLeast: 1 } }
                then:
                  - { op: apply, to: bearer, effect: renew, stacks: { var: gain } }

