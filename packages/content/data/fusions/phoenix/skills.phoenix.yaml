# The 30 Phoenix (Fire + Holy) variants, from the "Fusion Spec Kits" design doc.
# Kindle skills are Radiant (they target anyone; Harmful only on an enemy) and run the `kindle`
# macro with `burn` set. Rebirth sends a unit to Ashes instead of dying; `rise` brings it back.

strike.phoenix:
  archetype: Strike
  element: Phoenix
  name: Firebrand Talon
  description: >-
    Kindle: 20 damage and Ignite to target enemy, or 20 healing and 2 Renew to target ally. Either
    way, the user gains 1 Might.
  cost: S
  cooldown: 0
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - { op: set, var: burn, value: 20 }
    - { op: macro, id: kindle }
    # No duration given: permanent (Q16), as with base Strike.
    - { op: apply, to: actor, effect: might }

smash.phoenix:
  archetype: Smash
  element: Phoenix
  name: Wingbeat
  description: >-
    Deals 25 damage to target enemy and 15 to their allies. The beat fans the user's side: each ally
    in Ashes rises at the end of this turn instead of their next.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - { op: damage, to: primaryAllies, amount: 15 }
    - op: apply
      to: { filter: allUnits, where: { and: [{ has: { unit: it, effect: ashes } }, { not: { isEnemy: it } }] } }
      duration: { raw: 1 }
      effect:
        id: wingbeat
        name: Wingbeat
        kind: Buff
        element: Phoenix
        description: Rises from Ashes at the end of this turn.
        onExpire:
          - { op: forEach, in: bearer, do: [{ op: macro, id: rise }] }

charge.phoenix:
  archetype: Charge
  element: Phoenix
  name: Rising Dive
  description: >-
    Kindle: 15 damage and Ignite to target enemy, or 15 healing and 2 Renew to target ally. The user
    gains 1 Focus for their next skill.
  cost: S
  cooldown: 2
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - { op: set, var: burn, value: 15 }
    - { op: macro, id: kindle }
    - { op: apply, to: actor, effect: focus, until: { skillUsed: {} } }

riposte.phoenix:
  archetype: Riposte
  element: Phoenix
  name: Searing Rebuttal
  description: >-
    For 1 turn, counters the first Harmful skill used on the user. If its user is Ignited, the Ignite
    burns once at once, and the user is Anointed until the end of their next turn. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: searing_rebuttal
        name: Searing Rebuttal
        kind: Buff
        element: Phoenix
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer; an Ignited attacker burns.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: ignite } }
                then:
                  - { op: forEach, in: eventSource, do: [{ op: macro, id: ignite_tick }] }
                  - { op: apply, to: bearer, effect: anointed, duration: { ownTurns: 1 } }

rage.phoenix:
  archetype: Rage
  element: Phoenix
  name: Pyreheart Fury
  description: >-
    For 3 turns, the user gains 2 Might, Immune and Rebirth. If they rise from Ashes meanwhile, the
    Rage starts over for 3 more turns.
  cost: SA
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: rebirth, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: pyreheart_fury
        name: Pyreheart Fury
        kind: Buff
        element: Phoenix
        description: Rising from Ashes starts the Rage over.

shot.phoenix:
  archetype: Shot
  element: Phoenix
  name: Ember Shot
  description: Deals 15 damage to target enemy. If the user is at or below 30 HP, they gain Rebirth for 1 turn.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: if
      cond: { hpAtMost: { unit: actor, value: 30 } }
      then:
        - { op: apply, to: actor, effect: rebirth, duration: { enemyTurns: 1 } }

snipe.phoenix:
  archetype: Snipe
  element: Phoenix
  name: Sunfall Lance
  description: >-
    On the following turn, deals 50 damage to target enemy. It still fires if the user is in Ashes
    when it lands, and then deals 25 more. The target of this skill is invisible. Channeled.
  cost: Srr
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: sunfall_lance
        name: Sunfall Lance (aiming)
        kind: Neutral
        element: Phoenix
        visibility: hiddenTarget
        interruptible: true
        description: Strikes its target at the end of the following turn; 25 more from Ashes.
        onExpire:
          - op: damage
            to: effectTargets
            amount: { if: { has: { unit: bearer, effect: ashes } }, then: 75, else: 50 }

trap.phoenix:
  archetype: Trap
  element: Phoenix
  name: Smoldering Nest
  description: >-
    For 3 turns, the first time target enemy kills a unit or sends one to Ashes, the nest flares: they
    take 25 damage and are Ignited. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: smoldering_nest
        name: Smoldering Nest
        kind: Debuff
        element: Phoenix
        visibility: hidden
        description: The first time the bearer fells a unit, the nest flares.
        triggers:
          - on: dealtDamage
            do:
              - op: if
                cond:
                  or:
                    - { not: { any: { in: eventTarget, cond: { hpAbove: { unit: it, value: 0 } } } } }
                    - { has: { unit: eventTarget, effect: ashes } }
                then:
                  - { op: removeSelf }
                  - { op: damage, to: bearer, amount: 25 }
                  - { op: apply, to: bearer, effect: ignite }

maneuver.phoenix:
  archetype: Maneuver
  element: Phoenix
  name: Anointed Ascent
  description: >-
    The user becomes Invulnerable for 1 turn and is Anointed until the end of their next turn. If they
    were Condemned, it's purged, and they heal 15.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Purifying]
  target: self
  ops:
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - { op: apply, to: actor, effect: anointed, duration: { ownTurns: 1 } }
    # Purifying: the user's Condemned is spent on this use without its Debuff (condemn_fired).
    - op: if
      cond: { check: { cond: condemn_fired, unit: actor } }
      then:
        - { op: heal, to: actor, amount: 15 }

companion.phoenix:
  archetype: Companion
  element: Phoenix
  name: Phoenix Chick
  description: >-
    Summons a Phoenix Chick (15 HP) permanently. Peck (r): 10 damage and Ignite. The first time it
    dies, it rises at the end of your next turn as a Firebird (30 HP) whose Peck deals 20.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: phoenix_chick }

bolt.phoenix:
  archetype: Bolt
  element: Phoenix
  name: Flare of Mercy
  description: >-
    Kindle: 20 damage and Ignite to target enemy, or 20 healing and 2 Renew to target ally. An ally
    it mends also loses 1 Debuff.
  cost: Sr
  cooldown: 1
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - { op: set, var: burn, value: 20 }
    - { op: macro, id: kindle }
    - op: if
      cond: { not: { isEnemy: primary } }
      then:
        - { op: removeRandom, from: primary, kind: Debuff }

blast.phoenix:
  archetype: Blast
  element: Phoenix
  name: Cleansing Fire
  description: >-
    Deals 25 damage to all enemies, and they lose all their Buffs. Then every ally of the user, the
    user included, loses all their Debuffs.
  cost: IW
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - { op: removeKind, from: targets, kind: Buff }
    - { op: removeKind, from: allAllies, kind: Debuff }

consume.phoenix:
  archetype: Consume
  element: Phoenix
  name: Draw the Flame
  description: >-
    Deals 5 damage to target enemy, healing the user for it. If they're Ignited, the Ignite goes out
    and the user's ally with the least HP heals 15 and gains 2 Renew; if not, they're Ignited.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - { op: heal, to: actor, amount: { lastDamage: true } }
    - op: if
      cond: { has: { unit: primary, effect: ignite } }
      then:
        - { op: removeEffect, from: primary, effect: ignite }
        - op: forEach
          in: weakestAlly
          do:
            - { op: heal, to: it, amount: 15 }
            - { op: apply, to: it, effect: renew, stacks: 2 }
      else:
        - { op: apply, to: primary, effect: ignite }

summon.phoenix:
  archetype: Summon
  element: Phoenix
  name: Ember Spirit
  description: >-
    Summons an Ember Spirit (20 HP) for 3 turns. Waver (r): Kindle, 15 damage and Ignite to target
    enemy, or 15 healing and 2 Renew to target ally.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: ember_spirit, duration: { enemyTurns: 3 } }

channel.phoenix:
  archetype: Channel
  element: Phoenix
  name: Eternal Pyre
  description: >-
    For up to 3 turns, at the end of each of the user's turns, the pyre Kindles everyone: 10 damage and
    Ignite to each enemy, and 10 healing and 2 Renew to each ally. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: eternal_pyre
        name: Eternal Pyre
        kind: Neutral
        element: Phoenix
        interruptible: true
        description: Each turn, burns every enemy and mends every ally.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: allEnemies, amount: 10 }
              - { op: apply, to: allEnemies, effect: ignite }
              - { op: heal, to: allAllies, amount: 10 }
              - { op: apply, to: allAllies, effect: renew, stacks: 2 }

stab.phoenix:
  archetype: Stab
  element: Phoenix
  name: Ember Needle
  description: >-
    Kindle: 10 damage and Ignite to target enemy, or 20 if they're at or below 60 HP. On an ally, it's
    10 healing and 2 Renew, or 20 at or below 60 HP.
  cost: r
  cooldown: 0
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - { op: set, var: burn, value: { if: { hpAtMost: { unit: primary, value: 60 } }, then: 20, else: 10 } }
    - { op: macro, id: kindle }

ravage.phoenix:
  archetype: Ravage
  element: Phoenix
  name: Pyre Talon
  description: >-
    Kindle: 25 Piercing damage and Ignite to target enemy, 15 more if they're Stunned. On an ally, it's
    25 healing and 2 Renew, and it ends their Stun.
  cost: Ar
  cooldown: 1
  tags: [Radiant, NonStrategic]
  target: any
  ops:
    - op: if
      cond: { isEnemy: primary }
      then:
        - { op: damage, to: primary, type: Piercing, amount: { if: { stunned: primary }, then: 40, else: 25 } }
        - { op: apply, to: primary, effect: ignite }
      else:
        - { op: heal, to: primary, amount: 25 }
        - { op: apply, to: primary, effect: renew, stacks: 2 }
        - { op: removeEffect, from: primary, effect: stun }

mislead.phoenix:
  archetype: Mislead
  element: Phoenix
  name: Flaring Feint
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered and their Ignite flares: it burns
    three times at once. Invisible.
  cost: S
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: flaring_feint
        name: Flaring Feint
        kind: Debuff
        element: Phoenix
        visibility: hidden
        description: The bearer's next Harmful skill is countered and their Ignite burns three times.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: forEach, in: bearer, do: [{ op: repeat, times: 3, do: [{ op: macro, id: ignite_tick }] }] }

stun.phoenix:
  archetype: Stun
  element: Phoenix
  name: Blinding Plumage
  description: >-
    Deals 15 damage to target enemy and Stuns them for 1 turn. If they're Condemned, the Stun lasts 3
    turns, as their Condemnation can't trigger meanwhile.
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      effect: stun
      duration: { enemyTurns: { if: { has: { unit: primary, effect: condemned } }, then: 3, else: 1 } }

dance.phoenix:
  archetype: Dance
  element: Phoenix
  name: Dance of Embers
  description: >-
    For 4 turns, the user gains 1 Might, 2 Swiftness and 1 Focus. Meanwhile, each Kindle skill they use
    on an enemy also heals the user's ally with the least HP for half its damage.
  cost: AW
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 4 } }
    - { op: apply, to: actor, effect: swiftness, stacks: 2, duration: { enemyTurns: 4 } }
    - { op: apply, to: actor, effect: focus, duration: { enemyTurns: 4 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: dance_of_embers
        name: Dance of Embers
        kind: Buff
        element: Phoenix
        description: The bearer's Kindle damage heals their weakest ally for half.
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { eventSkill: { tags: [Radiant] } }
                then:
                  - { op: heal, to: weakestAlly, amount: { div: [{ eventAmount: true }, 2] } }

heal.phoenix:
  archetype: Heal
  element: Phoenix
  name: Sacrificial Flame
  description: The user burns up to 30 of their own HP, never below 1. Target ally heals twice what was burned.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: set, var: burned, value: { if: { hpAbove: { unit: actor, value: 30 } }, then: 30, else: { sum: [{ hp: actor }, -1] } } }
    - { op: damage, to: actor, amount: { var: burned }, raw: true, type: Affliction, direct: false }
    - { op: heal, to: primary, amount: { mul: [2, { var: burned }] } }

bless.phoenix:
  archetype: Bless
  element: Phoenix
  name: Phoenix Blessing
  description: >-
    For 3 turns, target ally gains 1 Might and Rebirth. If the Rebirth goes unused, it burns off when
    this ends: they heal 25.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: phoenix_blessing
        name: Rebirth
        kind: Buff
        element: Phoenix
        countsAs: [rebirth]
        description: When the bearer would die, they burn to Ashes instead. Unused, it heals 25 when it ends.
        modifiers:
          - { mod: hpFloor, amount: 1 }
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 1 } }
                then:
                  - { op: removeSelf }
                  - { op: apply, to: bearer, effect: ashes }
        onExpire:
          - { op: heal, to: bearer, amount: 25 }

curse.phoenix:
  archetype: Curse
  element: Phoenix
  name: Cinders of Doubt
  description: >-
    Target enemy is Confused for 2 turns and Condemned. For 2 turns, each Weakness, Vulnerable or
    Confusion they gain lasts 1 turn longer.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: confusion, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: condemned }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: cinders_of_doubt
        name: Cinders of Doubt
        kind: Debuff
        element: Phoenix
        description: Each Weakness, Vulnerable or Confusion the bearer gains lasts 1 turn longer.
        triggers:
          - on: effectGained
            when: { effects: [weakness, vulnerable, confusion] }
            do:
              - { op: eventEffect, extendBy: 2 }

smite.phoenix:
  archetype: Smite
  element: Phoenix
  name: Sanctified Pyre
  description: >-
    Deals 20 damage to target enemy and Sanctifies them for 2 turns. Each time the Sanctify heals
    someone, their Ignite burns once.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: sanctify, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: sanctified_pyre
        name: Sanctified Pyre
        kind: Debuff
        element: Phoenix
        description: Each time the bearer's Sanctify heals someone, their Ignite burns once.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - op: if
                cond: { has: { unit: bearer, effect: sanctify } }
                then:
                  - { op: forEach, in: bearer, do: [{ op: macro, id: ignite_tick }] }

prayer.phoenix:
  archetype: Prayer
  element: Phoenix
  name: Second Dawn
  description: Every fallen ally of the user returns with 20 HP and no Buffs or Debuffs. Then all allies heal 15.
  cost: Wrr
  cooldown: 5
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: revive, hp: 20 }
    - { op: heal, to: allAllies, amount: 15 }

cleave.phoenix:
  archetype: Cleave
  element: Phoenix
  name: Fanned Flames
  description: >-
    Deals 25 damage to target enemy and 15 to a random other enemy. Each one's Ignite burns once at
    once, and the user heals as much as those burns deal.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: damage, to: it, amount: 15 }
        - op: if
          cond: { has: { unit: it, effect: ignite } }
          then:
            - { op: macro, id: ignite_tick }
            - { op: heal, to: actor, amount: 5 }
    - op: if
      cond: { has: { unit: primary, effect: ignite } }
      then:
        - { op: forEach, in: primary, do: [{ op: macro, id: ignite_tick }] }
        - { op: heal, to: actor, amount: 5 }

shout.phoenix:
  archetype: Shout
  element: Phoenix
  name: Phoenix Cry
  description: >-
    All enemies are Intimidated for 2 turns. Each ally of the user who is in Ashes or has risen this
    battle gains 1 Might and 1 Swiftness for 2 turns.
  cost: W
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: intimidated, duration: { enemyTurns: 2 } }
    - op: forEach
      in:
        filter: allUnits
        where:
          and:
            - { not: { isEnemy: it } }
            - or:
                - { has: { unit: it, effect: ashes } }
                - { compare: { value: { counterOf: { unit: it, name: risen } }, atLeast: 1 } }
      do:
        - { op: apply, to: it, effect: might, duration: { enemyTurns: 2 } }
        - { op: apply, to: it, effect: swiftness, duration: { enemyTurns: 2 } }

withstand.phoenix:
  archetype: Withstand
  element: Phoenix
  name: Cocoon of Flame
  description: >-
    The user gains 40 Shield and can't act on their next turn. When the cocoon opens, the user and every
    ally heal as much as the Shield has left.
  cost: A
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      value: 40
      duration: { raw: 3 }
      effect:
        id: cocoon_of_flame
        name: Cocoon of Flame
        kind: Buff
        element: Phoenix
        shield: true
        description: A Shield; when the cocoon opens, everyone on the bearer's side heals what's left.
        onExpire:
          - { op: heal, to: allAllies, amount: { effectValue: true } }
    - op: apply
      to: actor
      duration: { raw: 3 }
      effect:
        id: cocooned
        name: Cocooned
        kind: Neutral
        element: Phoenix
        description: Can't act until the cocoon opens.
        modifiers:
          - { mod: cannotUseSkills }

taunt.phoenix:
  archetype: Taunt
  element: Phoenix
  name: Blazing Challenge
  description: >-
    Target enemy is Taunted by the user for 2 turns. Each time they hit the user meanwhile, the user's
    next skill costs 1 less.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: blazing_challenge
        name: Blazing Challenge
        kind: Buff
        element: Phoenix
        description: Each hit from the Taunted enemy makes the bearer's next skill cost 1 less.
        triggers:
          - on: damaged
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: taunt, mine: true } }
                then:
                  - { op: apply, to: bearer, effect: focus, until: { skillUsed: {} } }

titan.phoenix:
  archetype: Titan
  element: Phoenix
  name: Undying Phoenix
  description: >-
    For 3 turns, the user gains 2 Armor, Immune and Rebirth. If they rise from Ashes meanwhile, they
    rise with 40 HP instead of 25, and the Titan starts over.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: armor, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: rebirth, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: undying_phoenix
        name: Undying Phoenix
        kind: Buff
        element: Phoenix
        description: Rises from Ashes with 40 HP, and the Titan starts over.

# Minion skills.

phoenix_chick_peck:
  archetype: Minion
  element: Phoenix
  name: Peck
  description: Deals 10 damage to target enemy and Ignites them.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
