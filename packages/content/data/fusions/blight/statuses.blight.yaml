# Blight (Poison + Unholy) statuses, from the "Fusion Spec Kits" design doc.

# Withered (with Festering): -5 max HP per stack; Toxin grows while it lasts.
withered:
  name: Withered
  kind: Debuff
  element: Blight
  stacking: merge
  maxStacks: 5
  description: >-
    Max HP is 5 lower per stack (max 5), and HP above the new max is lost. Lasts until cleansed. Festering: at the
    end of its applier's turn, the bearer's Toxin gains 1 stack.
  modifiers:
    - { mod: maxHp, amount: -5, perStack: true }
  triggers:
    - on: turnEnd
      do:
        - op: if
          cond: { has: { unit: bearer, effect: toxin } }
          then: [{ op: apply, to: bearer, effect: toxin }]

# Plague Imp's bite: whoever carries it Withers when an Imp dies.
imp_bitten:
  name: Imp-Bitten
  kind: Debuff
  element: Blight
  stacking: unique
  description: When a Plague Imp dies, the bearer gains 1 Withered.
