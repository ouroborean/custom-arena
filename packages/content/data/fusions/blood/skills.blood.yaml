# The 30 Blood (Water + Unholy) variants, from the "Fusion Spec Kits" design doc.
# BloodPrice skills pay their random costs with 10 HP each (the engine stores it in the user's
# `blood_paid` counter). Hemorrhage bleeds and grows until healed.

strike.blood:
  archetype: Strike
  element: Blood
  name: Wringing Cut
  description: >-
    Deals 20 damage to target enemy. The user removes up to 2 Weakness from them and gains a Soul
    Fragment for each one removed.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: set
      var: wrung
      value: { if: { compare: { value: { totalStacks: { in: primary, effect: weakness } }, atLeast: 2 } }, then: 2, else: { totalStacks: { in: primary, effect: weakness } } }
    - { op: removeStacks, from: primary, effect: weakness, amount: 2 }
    - { op: apply, to: actor, effect: soul_fragment, stacks: { var: wrung } }

smash.blood:
  archetype: Smash
  element: Blood
  name: Crimson Wave
  description: >-
    Deals 25 damage to target enemy and 10 to their allies. The target gains 1 Hemorrhage, then each of
    their allies gains half the target's Hemorrhage, rounded up.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - { op: damage, to: primaryAllies, amount: 10 }
    - { op: apply, to: primary, effect: hemorrhage }
    - { op: apply, to: primaryAllies, effect: hemorrhage, stacks: { div: [{ sum: [{ stacks: { unit: primary, effect: hemorrhage } }, 1] }, 2] } }

charge.blood:
  archetype: Charge
  element: Blood
  name: Quickened Pulse
  description: >-
    Deals 10 damage to target enemy, who gains 1 Hemorrhage. When the user's next skill resolves, every
    enemy's Hemorrhage ticks once more, dealing its damage and gaining a stack.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: apply, to: primary, effect: hemorrhage }
    - { op: setCounter, name: pulse_turn, value: { turn: true } }
    # An extra Hemorrhage tick (the status's own turnEnd ops), on the user's next skill (not this one).
    - op: apply
      to: actor
      until: { skillUsed: {} }
      effect:
        id: quickened_pulse
        name: Quickened Pulse
        kind: Buff
        element: Blood
        description: When the bearer's next skill resolves, every enemy's Hemorrhage ticks once more.
        triggers:
          - on: skillResolved
            do:
              - op: if
                cond: { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counter: pulse_turn }] }] }, atLeast: 1 } }
                then:
                  - op: forEach
                    in: { filter: allEnemies, where: { has: { unit: it, effect: hemorrhage } } }
                    do:
                      - op: damage
                        to: it
                        type: Affliction
                        direct: false
                        amount: { mul: [5, { stacks: { unit: it, effect: hemorrhage } }] }
                      - op: if
                        cond: { compare: { value: { stacks: { unit: it, effect: hemorrhage } }, atLeast: 1, atMost: 4 } }
                        then: [{ op: apply, to: it, effect: hemorrhage }]
                  - { op: removeSelf }

riposte.blood:
  archetype: Riposte
  element: Blood
  name: Blood Spite
  description: >-
    For 1 turn, counters the first Harmful skill used on the user; its user gains 1 Hemorrhage for every 20
    HP the user is missing. Blood Price. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible, BloodPrice]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: blood_spite
        name: Blood Spite
        kind: Buff
        element: Blood
        visibility: hidden
        description: >-
          Counters the first Harmful skill used on the bearer; its user gains 1 Hemorrhage for every 20
          HP the bearer is missing.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: eventSource, effect: hemorrhage, stacks: { div: [{ missingHp: bearer }, 20] } }

rage.blood:
  archetype: Rage
  element: Blood
  name: Crimson Frenzy
  description: >-
    For 3 turns, the user gains Lifesteal and 1 Might for every 20 HP they're missing, rechecked as each
    hit lands. Blood Price.
  cost: Ir
  cooldown: 4
  tags: [Helpful, Strategic, BloodPrice]
  target: self
  ops:
    - { op: apply, to: actor, effect: lifesteal, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: crimson_frenzy
        name: Crimson Frenzy
        kind: Buff
        element: Blood
        description: +5 direct damage per 20 HP the bearer is missing.
        modifiers:
          - { mod: damageDealt, amount: 0, when: { direct: true }, value: { mul: [5, { div: [{ missingHp: actor }, 20] }] } }

shot.blood:
  archetype: Shot
  element: Blood
  name: Blood Dart
  description: >-
    Deals 15 damage to target enemy, who gains 1 Hemorrhage. If they already had Hemorrhage, the user
    heals back the HP they paid. Blood Price.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic, BloodPrice]
  target: enemy
  ops:
    - op: if
      cond: { has: { unit: primary, effect: hemorrhage } }
      then:
        - { op: heal, to: actor, amount: { counter: blood_paid } }
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: hemorrhage }

snipe.blood:
  archetype: Snipe
  element: Blood
  name: Crimson Lance
  description: >-
    On the following turn, deals 40 damage to target enemy, plus the damage the user took in between (max
    30 more). The target of this skill is invisible. Blood Price. Channeled.
  cost: Ir
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget, BloodPrice]
  target: enemy
  ops:
    - { op: setCounter, name: crimson_lance, value: 0 }
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: crimson_lance
        name: Crimson Lance (aiming)
        kind: Neutral
        element: Blood
        visibility: hiddenTarget
        interruptible: true
        description: Strikes its target at the end of the following turn, adding the damage the bearer took.
        triggers:
          - on: damaged
            do:
              - { op: setCounter, name: crimson_lance, value: { sum: [{ counter: crimson_lance }, { eventAmount: true }] } }
        onExpire:
          - op: damage
            to: effectTargets
            amount: { sum: [40, { if: { compare: { value: { counter: crimson_lance }, atLeast: 30 } }, then: 30, else: { counter: crimson_lance } }] }

trap.blood:
  archetype: Trap
  element: Blood
  name: Tainted Cure
  description: >-
    For 3 turns, the next healing target enemy receives becomes Hemorrhage instead: 1 stack per 10 HP it
    would have healed (max 5). Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: tainted_cure
        name: Tainted Cure
        kind: Debuff
        element: Blood
        visibility: hidden
        description: The next healing the bearer receives turns into Hemorrhage.
        triggers:
          - on: healed
            consume: true
            do:
              - { op: damage, to: bearer, amount: { eventAmount: true }, raw: true, type: Affliction, direct: false, bypass: true }
              - op: apply
                to: bearer
                effect: hemorrhage
                stacks: { if: { compare: { value: { eventAmount: true }, atLeast: 50 } }, then: 5, else: { div: [{ eventAmount: true }, 10] } }

maneuver.blood:
  archetype: Maneuver
  element: Blood
  name: Pale Step
  description: >-
    The enemy who last damaged the user (or a random enemy, if none has) gains 1 Hemorrhage. For 1 turn,
    the user is Invulnerable to enemies with Hemorrhage (they can't target or damage them), and each
    enemy who damages the user gains 1 Hemorrhage. Invisible.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: if
      cond: { any: { in: lastAttacker, cond: { isEnemy: it } } }
      then:
        - { op: apply, to: lastAttacker, effect: hemorrhage }
      else:
        - { op: apply, to: { randomEnemy: 1 }, effect: hemorrhage }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: pale_step
        name: Pale Step
        kind: Buff
        element: Blood
        description: >-
          Invulnerable to enemies with Hemorrhage; each enemy who damages the bearer gains 1 Hemorrhage.
        modifiers:
          - { mod: invulnerableTo, sourceHas: [hemorrhage] }
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - { op: apply, to: eventSource, effect: hemorrhage }

companion.blood:
  archetype: Companion
  element: Blood
  name: Bloodbound Familiar
  description: >-
    Summons a Bloodbound Familiar permanently. It has no HP of its own and shares the user's: damage and
    healing to it go to the user, and it dies only with them. Bite (r): 15 damage.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: bloodbound_familiar }

bolt.blood:
  archetype: Bolt
  element: Blood
  name: Sanguine Bolt
  description: >-
    Deals 25 damage to target enemy, and the HP the user paid heals their lowest-HP ally, doubled. Blood
    Price.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic, BloodPrice]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - { op: heal, to: weakestAlly, amount: { mul: [2, { counter: blood_paid }] } }

blast.blood:
  archetype: Blast
  element: Blood
  name: Red Rain
  description: >-
    Deals 25 damage to all enemies. The user spends all their Soul Fragments: each one gives every enemy 1
    Hemorrhage. Blood Price.
  cost: SIr
  cooldown: 2
  tags: [Harmful, NonStrategic, BloodPrice]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - { op: set, var: rain, value: { stacks: { unit: actor, effect: soul_fragment } } }
    - { op: removeEffect, from: actor, effect: soul_fragment }
    - { op: apply, to: targets, effect: hemorrhage, stacks: { var: rain } }

consume.blood:
  archetype: Consume
  element: Blood
  name: Transfusion
  description: >-
    Deals 5 damage to target enemy. If they have Hemorrhage, it ends, and the user heals 10 per stack. If
    not, the target gains 1 Hemorrhage.
  cost: I
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - op: if
      cond: { has: { unit: primary, effect: hemorrhage } }
      then:
        - { op: heal, to: actor, amount: { mul: [10, { stacks: { unit: primary, effect: hemorrhage } }] } }
        - { op: removeEffect, from: primary, effect: hemorrhage }
      else:
        - { op: apply, to: primary, effect: hemorrhage }

summon.blood:
  archetype: Summon
  element: Blood
  name: Blood Elemental
  description: >-
    Summons a Blood Elemental for 3 turns, with HP equal to what the user paid. Blood Lash (nc): 10 damage
    and 1 Hemorrhage. Blood Price.
  cost: rr
  cooldown: 1
  tags: [Helpful, Strategic, BloodPrice]
  target: self
  ops:
    - { op: summon, minion: blood_elemental, duration: { enemyTurns: 3 } }
    - { op: addMaxHp, to: lastSummoned, amount: { sum: [{ counter: blood_paid }, -20] } }
    - { op: heal, to: lastSummoned, amount: { sum: [{ counter: blood_paid }, -20] }, raw: true, quiet: true }

channel.blood:
  archetype: Channel
  element: Blood
  name: Exsanguinate
  description: >-
    For up to 3 turns, at the end of each of the user's turns, target enemy gains 1 Hemorrhage, and the user
    heals for what their Hemorrhage deals. Blood Price. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, Strategic, Channeled, BloodPrice]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 3 }
      effect:
        id: exsanguinate
        name: Exsanguinate
        kind: Neutral
        element: Blood
        interruptible: true
        description: >-
          At the end of each of the bearer's turns, the target gains 1 Hemorrhage, and the bearer heals
          for what their Hemorrhage deals.
        triggers:
          - on: turnEnd
            do:
              - { op: apply, to: effectTargets, effect: hemorrhage }
              - { op: heal, to: bearer, amount: { mul: [5, { totalStacks: { in: effectTargets, effect: hemorrhage } }] } }

stab.blood:
  archetype: Stab
  element: Blood
  name: Bloodletter's Knife
  description: >-
    Deals 10 damage to target enemy, then they gain 1 Hemorrhage for every 30 HP they're missing.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: apply, to: primary, effect: hemorrhage, stacks: { div: [{ missingHp: primary }, 30] } }

ravage.blood:
  archetype: Ravage
  element: Blood
  name: Arterial Strike
  description: >-
    Deals 30 Piercing damage to target enemy, who gains 2 Hemorrhage. If they're healed before the user's
    next turn, the healer takes the Hemorrhage instead.
  cost: AS
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 30, type: Piercing }
    - { op: apply, to: primary, effect: hemorrhage, stacks: 2 }
    - op: apply
      to: primary
      duration: { raw: 2 }
      effect:
        id: arterial_strike
        name: Arterial Strike
        kind: Debuff
        element: Blood
        description: Whoever heals the bearer takes their Hemorrhage (see Hemorrhage).

mislead.blood:
  archetype: Mislead
  element: Blood
  name: Red Herring
  description: >-
    Target enemy gains 1 Hemorrhage. Then, for 1 turn, the first Harmful skill used by any enemy with
    Hemorrhage is countered (only one). Blood Price. Invisible.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic, Invisible, BloodPrice]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: hemorrhage }
    # Every enemy bleeding at this moment (the target included) is watched; the first to be
    # countered clears the watch from the rest.
    - op: apply
      to: { filter: allEnemies, where: { has: { unit: it, effect: hemorrhage } } }
      duration: { enemyTurns: 1 }
      effect:
        id: red_herring
        name: Red Herring
        kind: Debuff
        element: Blood
        visibility: hidden
        description: >-
          The first Harmful skill used by an enemy with Red Herring is countered; then it ends on all of
          them.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: removeEffect, from: bearerAllies, effect: red_herring }

stun.blood:
  archetype: Stun
  element: Blood
  name: Swoon
  description: >-
    Deals 15 damage to target enemy, who is Stunned for up to 2 turns. Healing them ends the Stun.
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: swoon
        name: Swoon
        kind: Debuff
        element: Blood
        description: Healing the bearer ends their Stun.
        triggers:
          - on: healed
            consume: true
            do:
              - { op: removeEffect, from: bearer, effect: stun }

dance.blood:
  archetype: Dance
  element: Blood
  name: Danse Sanguine
  description: >-
    Target enemy gains 1 Hemorrhage. For 3 turns, each time the user damages an enemy with
    Hemorrhage, that enemy gains 1 more Hemorrhage and the user gains 1 Swiftness (max 2).
  cost: I
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: hemorrhage }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: danse_sanguine
        name: Danse Sanguine
        kind: Buff
        element: Blood
        description: >-
          Each time the bearer damages an enemy with Hemorrhage, that enemy gains 1 Hemorrhage and the
          bearer gains 1 Swiftness (max 2).
        triggers:
          - on: dealtDamage
            when: { byEnemy: true, direct: true }
            do:
              - op: if
                cond: { has: { unit: eventTarget, effect: hemorrhage } }
                then:
                  - { op: apply, to: eventTarget, effect: hemorrhage }
                  - op: if
                    cond: { not: { stackTotal: { unit: bearer, effects: [swiftness], moreThan: 1 } } }
                    then: [{ op: apply, to: bearer, effect: swiftness, duration: { enemyTurns: 2 } }]

heal.blood:
  archetype: Heal
  element: Blood
  name: Bloodletting
  description: >-
    Removes up to 2 Debuffs from target ally, who heals 15, plus 10 for each Debuff removed.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: set
      var: let
      value: { if: { compare: { value: { kindCount: { unit: primary, kind: Debuff } }, atLeast: 2 } }, then: 2, else: { kindCount: { unit: primary, kind: Debuff } } }
    - { op: removeRandom, from: primary, kind: Debuff, count: 2 }
    - { op: heal, to: primary, amount: { sum: [15, { mul: [10, { var: let }] }] } }

bless.blood:
  archetype: Bless
  element: Blood
  name: Blood Doping
  description: >-
    For 2 turns, target ally gains 2 Might and 2 Swiftness. When it ends, they're Stunned for 1 turn,
    which Swiftness can't stop.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, stacks: 2, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: swiftness, stacks: 2, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: blood_doping
        name: Blood Doping
        kind: Buff
        element: Blood
        description: When this ends, the bearer is Stunned for 1 turn.
        onExpire:
          - op: apply
            to: bearer
            duration: { enemyTurns: 1 }
            effect:
              id: blood_crash
              name: Crash
              kind: Neutral
              element: Blood
              description: Stunned; Swiftness can't stop it.
              modifiers:
                - { mod: cannotUseSkills }

curse.blood:
  archetype: Curse
  element: Blood
  name: Hemophilia
  description: Target enemy gains 2 Hemorrhage, which healing can't remove for 2 turns.
  cost: r
  cooldown: 1
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: hemorrhage, stacks: 2 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: hemophilia
        name: Hemophilia
        kind: Debuff
        element: Blood
        description: Healing doesn't stop the bearer's Hemorrhage.

smite.blood:
  archetype: Smite
  element: Blood
  name: Bloodmark
  description: >-
    Deals 20 damage to target enemy, who gains 1 Hemorrhage. For 2 turns, allies who damage them heal 5 per
    Hemorrhage stack they have.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: hemorrhage }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: bloodmark
        name: Bloodmark
        kind: Debuff
        element: Blood
        description: The applier's allies who damage the bearer heal 5 per Hemorrhage on them.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - { op: heal, to: eventSource, amount: { mul: [5, { stacks: { unit: bearer, effect: hemorrhage } }] } }

prayer.blood:
  archetype: Prayer
  element: Blood
  name: Blood Chant
  description: >-
    All allies heal 20. Until the end of the user's next turn, their allies' random costs are paid in HP, 10
    each. Blood Price.
  cost: Irr
  cooldown: 2
  tags: [Helpful, Strategic, BloodPrice]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - op: apply
      to: { filter: targets, where: { not: { isActor: it } } }
      duration: { ownTurns: 1 }
      effect:
        id: blood_chant
        name: Blood Chant
        kind: Buff
        element: Blood
        description: The bearer's random costs are paid with 10 HP each.
        modifiers:
          - { mod: bloodPrice }

cleave.blood:
  archetype: Cleave
  element: Blood
  name: Crimson Spray
  description: >-
    Deals 20 damage to target enemy. Their Hemorrhage ends, and a random other enemy takes 10 damage
    per stack it had (at least 10).
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: set, var: burst, value: { stacks: { unit: primary, effect: hemorrhage } } }
        - { op: removeEffect, from: primary, effect: hemorrhage }
        - op: damage
          to: it
          amount: { if: { compare: { value: { var: burst }, atLeast: 2 } }, then: { mul: [10, { var: burst }] }, else: 10 }

shout.blood:
  archetype: Shout
  element: Blood
  name: Bloodcurdle
  description: >-
    All enemies gain 1 Hemorrhage. For 2 turns, any of them who's healed is also Intimidated for 2 turns.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: hemorrhage }
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: bloodcurdle
        name: Bloodcurdle
        kind: Debuff
        element: Blood
        description: Healing the bearer Intimidates them for 2 turns.
        triggers:
          - on: healed
            do:
              - { op: apply, to: bearer, effect: intimidated, duration: { enemyTurns: 2 } }

withstand.blood:
  archetype: Withstand
  element: Blood
  name: Clotting Ward
  description: >-
    For 1 turn, direct hits on the user deal half damage, and the user gains 1 Hemorrhage for every 20
    damage this prevents. At the end of their next turn, after their Hemorrhage ticks, it ends.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    # Neutral, so Buff-blockers can't stop it. The stopped half is measured as the half that landed
    # (they differ by at most 1, from rounding); it's added up over the turn, 1 stack per full 20.
    - { op: setCounter, name: clotted, value: 0 }
    - { op: setCounter, name: clots, value: 0 }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: clotting_ward
        name: Clotting Ward
        kind: Neutral
        element: Blood
        description: >-
          Direct hits deal half damage; the bearer gains 1 Hemorrhage for every 20 damage this prevents.
        modifiers:
          - { mod: damageTaken, amount: 0, mul: 0.5, when: { direct: true } }
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - { op: setCounter, on: bearer, name: clotted, value: { sum: [{ counterOf: { unit: bearer, name: clotted } }, { eventAmount: true }] } }
              - op: set
                var: owed
                value:
                  sum:
                    - { div: [{ counterOf: { unit: bearer, name: clotted } }, 20] }
                    - { mul: [-1, { counterOf: { unit: bearer, name: clots } }] }
              - op: if
                cond: { compare: { value: { var: owed }, atLeast: 1 } }
                then:
                  - { op: apply, to: bearer, effect: hemorrhage, stacks: { var: owed } }
                  - { op: setCounter, on: bearer, name: clots, value: { sum: [{ counterOf: { unit: bearer, name: clots } }, { var: owed }] } }
    # The clot closes after the user's next turn's ticks: the deferred damage is paid once, then stops.
    - op: apply
      to: actor
      duration: { ownTurns: 1 }
      effect:
        id: clot_closing
        name: Clotting Ward
        kind: Neutral
        element: Blood
        description: At the end of the bearer's next turn, after their Hemorrhage ticks, it ends.
        onExpire:
          - { op: removeEffect, from: bearer, effect: hemorrhage }

taunt.blood:
  archetype: Taunt
  element: Blood
  name: Open Vein
  description: >-
    The user gains 2 Hemorrhage, and target enemy is Taunted by them for 2 turns. Meanwhile, each time
    an enemy the user Taunted damages them, the user's Hemorrhage moves onto that enemy.
  cost: I
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: actor, effect: hemorrhage, stacks: 2 }
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    # Neutral, so it holds whatever the user's Buff state.
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: open_vein
        name: Open Vein
        kind: Neutral
        element: Blood
        description: Each enemy the bearer Taunted who damages them takes the bearer's Hemorrhage.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: taunt, mine: true } }
                then:
                  - { op: moveEffects, from: bearer, to: eventSource, effects: [hemorrhage] }

