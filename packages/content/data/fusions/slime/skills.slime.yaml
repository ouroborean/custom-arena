      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: gelatinous_giant
        name: Gelatinous Giant
        kind: Buff
        element: Slime
        description: Splits off Oozes when damaged; 1 Armor per allied Ooze.
        modifiers:
          - { mod: damageTaken, amount: 0, armor: true, when: { types: [Normal] }, value: { mul: [-5, { countOf: { filter: allAllies, where: { minion: { unit: it, types: [ooze] } } } }] } }
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - op: if
                cond:
                  and:
                    - { hpAbove: { unit: bearer, value: 19 } }
                    - { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [ooze] } } } }, atMost: 3 } }
                then:
                  - { op: set, var: ooze_hp, value: { div: [{ hp: bearer }, 4] } }
                  - { op: macro, id: make_ooze }
                  - { op: damage, to: bearer, amount: { var: ooze_hp }, raw: true, type: Affliction, direct: false }

