# Stasis minions.

ice_spider:
  name: Ice Spider
  hp: 30
  skills: [ice_spider_frost_web, ice_spider_frozen_fang]

cryo_sprite:
  name: Cryo Sprite
  hp: 20
  passives:
    - id: cryo_sprite_watch
      name: Cryo Sprite
      kind: Neutral
      element: Stasis
      description: At the end of its owner's turn, the enemy with the least HP gains 1 Toxin, or is Suspended for 1 turn instead if they're Prey.
      triggers:
        - on: turnEnd
          do:
            - op: forEach
              in: weakestEnemy
              do:
                - op: if
                  cond: { check: { cond: prey, unit: it } }
                  then:
                    - { op: apply, to: it, effect: suspended, duration: { enemyTurns: 1 } }
                  else:
                    - { op: apply, to: it, effect: toxin }
  skills: []
