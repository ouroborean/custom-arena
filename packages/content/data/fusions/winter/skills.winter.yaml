snow_sprite_flurry:
  archetype: Minion
  element: Winter
  name: Flurry
  description: Deals 5 Piercing damage to target enemy; a target hit twice in one turn is Snowbound for 1 turn.
  cost: nc
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5, type: Piercing }
    - op: if
      cond: { has: { unit: primary, effect: flurried } }
      then:
        - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 1 } }
      else:
        - op: apply
          to: primary
          duration: { raw: 1 }
          effect:
            id: flurried
            name: Flurried
            kind: Debuff
            element: Winter
            description: Another Flurry this turn Snowbinds the bearer.
