# The 30 Winter (Ice + Wind) variants, from the "Fusion Spec Kits" design doc.
# Snowbound pins a unit (Immobile, no mobility buffs, mobility skills cost 1 more). Frost-debuff
# lists here include it.

strike.winter:
  archetype: Strike
  element: Winter
  name: Bitter Blow
  description: >-
    Deals 20 damage to target enemy. If they're moving (they have Swiftness, Rushing or Leaping),
    they're Snowbound for 2 turns.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: if
      cond:
        or:
          - { has: { unit: primary, effect: swiftness } }
          - { has: { unit: primary, effect: rushing } }
          - { has: { unit: primary, effect: leaping } }
      then:
        - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 2 } }

smash.winter:
  archetype: Smash
  element: Winter
  name: Snowslide
  description: >-
    The user Leaps. At the start of their next turn, if they're still Leaping, they land: 25 damage to
    target enemy and 15 to their allies.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: forEach, in: actor, do: [{ op: macro, id: leap }] }
    - op: apply
      to: actor
      remember: primary
      duration: { raw: 2 }
      effect:
        id: snowslide
        name: Snowslide
        kind: Neutral
        element: Winter
        description: Lands at the start of the bearer's next turn if they're still Leaping.
        onExpire:
          - op: if
            cond: { has: { unit: bearer, effect: leaping } }
            then:
              - { op: damage, to: primary, amount: 25 }
              - { op: damage, to: primaryAllies, amount: 15 }
              # Landing spends the Leap.
              - { op: removeEffect, from: bearer, effect: leaping }

charge.winter:
  archetype: Charge
  element: Winter
  name: Ice Skate
  description: >-
    The user gains 2 Swiftness for 2 turns. Their next Harmful skill ends the skate in a spray of ice:
    it spends their Swiftness for 5 more damage per stack, and every enemy it damages is Snowbound for 1
    turn.
  cost: r
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: swiftness, stacks: 2, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      until: { skillUsed: { harmful: true } }
      effect:
        id: ice_skate
        name: Ice Skate
        kind: Buff
        element: Winter
        stacking: unique
        description: >-
          The bearer's next Harmful skill spends their Swiftness for 5 more damage per stack and
          Snowbinds every enemy it damages for 1 turn.
        modifiers:
          - { mod: damageDealt, amount: 0, when: { direct: true }, value: { mul: [5, { stacks: { unit: actor, effect: swiftness } }] } }
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - { op: apply, to: eventTarget, effect: snowbound, duration: { enemyTurns: 1 } }
          - on: skillResolved
            when: { harmful: true }
            do:
              - { op: removeEffect, from: bearer, effect: swiftness }

riposte.winter:
  archetype: Riposte
  element: Winter
  name: Shatterguard
  description: >-
    For 1 turn, counters the first Harmful skill used on the user. Every Frost debuff on its user
    shatters: it ends, and they take 15 Piercing damage for each. Invisible.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: shatterguard
        name: Shatterguard
        kind: Buff
        element: Winter
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer and shatters its user's Frost debuffs.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: set, var: shards, value: { count: { effects: [frostbitten, chilled, numb, frostfire, snowbound], in: eventSource } } }
              - { op: removeEffect, from: eventSource, effect: frostbitten }
              - { op: removeEffect, from: eventSource, effect: chilled }
              - { op: removeEffect, from: eventSource, effect: numb }
              - { op: removeEffect, from: eventSource, effect: frostfire }
              - { op: removeEffect, from: eventSource, effect: snowbound }
              - { op: damage, to: eventSource, amount: { mul: [15, { var: shards }] }, type: Piercing }

rage.winter:
  archetype: Rage
  element: Winter
  name: Heart of Winter
  description: >-
    For 3 turns, the user gains 1 Might and Immune, and any enemy who uses a mobility skill is Snowbound
    for 2 turns.
  cost: I
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: allEnemies
      duration: { enemyTurns: 3 }
      effect:
        id: heart_of_winter
        name: Heart of Winter
        kind: Debuff
        element: Winter
        description: Using a mobility skill Snowbinds the bearer for 2 turns.
        triggers:
          - on: skillUsed
            when: { archetypes: [Charge, Maneuver, Mislead, Dance] }
            do:
              - { op: apply, to: bearer, effect: snowbound, duration: { enemyTurns: 2 } }

shot.winter:
  archetype: Shot
  element: Winter
  name: Snowball
  description: >-
    Deals 10 damage to target enemy, +5 for each turn in a row the user has used Snowball. From the
    third in a row, they're also Snowbound for 1 turn.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: setCounter
      name: snowball
      value:
        if: { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counter: snowball_turn }] }] }, atMost: 2 } }
        then: { sum: [{ counter: snowball }, 1] }
        else: 1
    - { op: setCounter, name: snowball_turn, value: { turn: true } }
    - { op: damage, to: primary, amount: { sum: [5, { mul: [5, { counter: snowball }] }] } }
    - op: if
      cond: { compare: { value: { counter: snowball }, atLeast: 3 } }
      then:
        - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 1 } }

snipe.winter:
  archetype: Snipe
  element: Winter
  name: Whiteout
  description: >-
    On the following turn, the whiteout closes in: 60 Piercing damage, split evenly among the enemy
    characters who aren't Immobile then (or among all of them, if every one is). Channeled.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: whiteout
        name: Whiteout
        kind: Neutral
        element: Winter
        interruptible: true
        description: >-
          At the end of the following turn, 60 Piercing split among the enemy characters who aren't
          Immobile (or all of them), unless interrupted.
        onExpire:
          - op: set
            var: moving
            value: { countOf: { filter: allEnemies, where: { and: [{ kind: { unit: it, is: character } }, { not: { check: { cond: immobile, unit: it } } }] } } }
          - op: if
            cond: { compare: { value: { var: moving }, atLeast: 1 } }
            then:
              - op: damage
                to: { filter: allEnemies, where: { and: [{ kind: { unit: it, is: character } }, { not: { check: { cond: immobile, unit: it } } }] } }
                amount: { div: [60, { var: moving }] }
                type: Piercing
            else:
              - op: damage
                to: { filter: allEnemies, where: { kind: { unit: it, is: character } } }
                amount: { div: [60, { countOf: { filter: allEnemies, where: { kind: { unit: it, is: character } } } }] }
                type: Piercing

trap.winter:
  archetype: Trap
  element: Winter
  name: Snare of Frost
  description: >-
    For 3 turns, if target enemy uses a mobility skill, it's countered, and they take 15 Piercing damage
    and are Snowbound for 2 turns. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: snare_of_frost
        name: Snare of Frost
        kind: Debuff
        element: Winter
        visibility: hidden
        description: The bearer's next mobility skill is countered, and they're hurt and Snowbound.
        triggers:
          - on: skillUsed
            when: { archetypes: [Charge, Maneuver, Mislead, Dance] }
            intercept: counter
            consume: true
            do:
              - { op: damage, to: bearer, amount: 15, type: Piercing }
              - { op: apply, to: bearer, effect: snowbound, duration: { enemyTurns: 2 } }

maneuver.winter:
  archetype: Maneuver
  element: Winter
  name: Powder Leap
  description: >-
    For 2 turns, the user is ready to spring: the first time an enemy uses a Harmful skill on them,
    they Leap before it lands, and that enemy is Snowbound for 1 turn.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: allEnemies
      duration: { enemyTurns: 2 }
      effect:
        id: powder_leap
        name: Powder Leap
        kind: Neutral
        element: Winter
        description: >-
          The bearer's first Harmful skill on the applier makes them Leap before it lands, and
          Snowbinds the bearer for 1 turn.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            do:
              - op: if
                cond: { isEventTarget: actor }
                then:
                  - { op: forEach, in: actor, do: [{ op: macro, id: leap }] }
                  - { op: apply, to: bearer, effect: snowbound, duration: { enemyTurns: 1 } }
                  # Once: the other enemies' watches end too.
                  - { op: removeEffect, from: bearerAllies, effect: powder_leap }
                  - { op: removeSelf }

companion.winter:
  archetype: Companion
  element: Winter
  name: Great Yeti
  description: >-
    Summons a Great Yeti (80 HP) permanently. Yeti Maul (nc): 30 damage to target enemy. At the start of
    each of the user's turns, their player pays 1 random energy to feed it, or it leaves.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: great_yeti }

bolt.winter:
  archetype: Bolt
  element: Winter
  name: Frostwind Bolt
  description: >-
    Deals 20 damage to target enemy. The gust carries on to a random other enemy: 10 damage, and
    they're Snowbound for 1 turn.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: damage, to: it, amount: 10 }
        - { op: apply, to: it, effect: snowbound, duration: { enemyTurns: 1 } }

blast.winter:
  archetype: Blast
  element: Winter
  name: Polar Gale
  description: >-
    Deals 20 damage to all enemies. If the user is Rushing or Leaping, they stop, and every enemy is
    Snowbound for 1 turn, or 2 if they were both.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 20 }
    - { op: set, var: gale, value: { count: { effects: [rushing, leaping], in: actor } } }
    - { op: removeEffect, from: actor, effect: rushing }
    - { op: removeEffect, from: actor, effect: leaping }
    - op: if
      cond: { compare: { value: { var: gale }, atLeast: 1 } }
      then:
        - { op: apply, to: targets, effect: snowbound, duration: { enemyTurns: { var: gale } } }

consume.winter:
  archetype: Consume
  element: Winter
  name: Steal Warmth
  description: >-
    Deals 5 damage to target enemy and passes them the user's chill: every Frost debuff on the user
    (Snowbound included) moves to them. The user heals 10, plus 10 for each one passed.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - { op: set, var: chill, value: { count: { effects: [frostbitten, chilled, numb, frostfire, snowbound], in: actor } } }
    - { op: moveEffects, from: actor, to: primary, effects: [frostbitten, chilled, numb, frostfire, snowbound] }
    - { op: heal, to: actor, amount: { sum: [10, { mul: [10, { var: chill }] }] } }

summon.winter:
  archetype: Summon
  element: Winter
  name: Snow Sprites
  description: >-
    Summons a Snow Sprite (20 HP) for 3 turns. Flurry (nc): 5 Piercing damage to all enemies. When the
    Sprite melts (it's destroyed or its time runs out), every enemy is Snowbound for 1 turn.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: snow_sprite, duration: { enemyTurns: 3 } }

channel.winter:
  archetype: Channel
  element: Winter
  name: Long Winter
  description: >-
    For up to 3 turns, at the end of each of the user's turns, the cold deepens: 5 damage to all
    enemies, then 10, then 15. The third wave also leaves every enemy Snowbound for 2 turns.
    Channeled.
  cost: II
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: long_winter
        name: Long Winter
        kind: Neutral
        element: Winter
        interruptible: true
        description: Each turn, 5 more damage to all enemies than the last; the third wave Snowbinds them.
        triggers:
          # Stacks count the waves.
          - on: turnEnd
            do:
              - { op: damage, to: allEnemies, amount: { mul: [5, { effectStacks: true }] } }
              - op: if
                cond: { compare: { value: { effectStacks: true }, atLeast: 3 } }
                then:
                  - { op: apply, to: allEnemies, effect: snowbound, duration: { enemyTurns: 2 } }
              - { op: addStacksSelf, amount: 1 }

stab.winter:
  archetype: Stab
  element: Winter
  name: Icicle Knife
  description: >-
    Deals 10 damage to target enemy, or 20 if they're Immobile. If the user is Rushing, the target is
    also Snowbound for 1 turn.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: { if: { check: { cond: immobile, unit: it } }, then: 20, else: 10 } }
    - op: if
      cond: { has: { unit: actor, effect: rushing } }
      then:
        - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 1 } }

ravage.winter:
  archetype: Ravage
  element: Winter
  name: Frostbite Lunge
  description: Deals 25 Piercing damage to target enemy. The user is Frostbitten for 1 turn and gains Frostborn for 2.
  cost: A
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25, type: Piercing }
    - { op: apply, to: actor, effect: frostbitten, duration: { enemyTurns: 1 } }
    - { op: apply, to: actor, effect: frostborn, duration: { enemyTurns: 2 } }

mislead.winter:
  archetype: Mislead
  element: Winter
  name: Snatching Gale
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, the gale snatches it: it's countered, and held
    frozen in the wind until the end of the user's next turn. The next Harmful skill the user uses
    meanwhile unleashes it too, as the user's own, on that skill's first target. Invisible.
  cost: Ir
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: snatching_gale
        name: Snatching Gale
        kind: Debuff
        element: Winter
        visibility: hidden
        description: The bearer's next Harmful skill is countered and snatched by the applier.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              # The snatched skill is the bearer's last one (Mimic's lookup), cast by the user later.
              - op: apply
                to: actor
                remember: eventSource
                duration: { ownTurns: 1 }
                effect:
                  id: snatched_skill
                  name: Snatched Skill
                  kind: Buff
                  element: Winter
                  description: >-
                    The bearer's next Harmful skill also unleashes the skill the gale snatched, as their own,
                    on its first target.
                  triggers:
                    - on: skillResolved
                      when: { harmful: true }
                      consume: true
                      do:
                        - { op: castSkill, lastUsedBy: effectTargets, on: eventPrimary }

stun.winter:
  archetype: Stun
  element: Winter
  name: Squall
  description: >-
    Deals 15 damage to target enemy, who is Snowbound for 2 turns. If they're still Snowbound at the end
    of their next turn, the squall freezes them solid: they're Stunned for 1 turn.
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: squall
        name: Squall
        kind: Debuff
        element: Winter
        description: If the bearer is still Snowbound at the end of their next turn, they're Stunned for 1 turn.
        onExpire:
          - op: if
            cond: { has: { unit: bearer, effect: snowbound } }
            then:
              - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }

dance.winter:
  archetype: Dance
  element: Winter
  name: Snow Dance
  description: >-
    For 3 turns, the user gains 1 Might and 2 Swiftness, and begins Rushing. Whenever their Swiftness
    stops a Stun, the Stun's user is Snowbound for 2 turns.
  cost: AA
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: swiftness, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: rushing }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: snow_dance
        name: Snow Dance
        kind: Buff
        element: Winter
        description: When the bearer's Swiftness stops a Stun, its user is Snowbound for 2 turns.
        triggers:
          - on: incomingNegated
            do:
              - { op: apply, to: eventSource, effect: snowbound, duration: { enemyTurns: 2 } }

heal.winter:
  archetype: Heal
  element: Winter
  name: Thawing Wind
  description: >-
    Target ally heals 20. For 2 turns, whenever they damage an enemy with a Frost debuff, they begin
    Rushing.
  cost: A
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: thawing_wind
        name: Thawing Wind
        kind: Buff
        element: Winter
        description: Damaging an enemy with a Frost debuff makes the bearer begin Rushing.
        triggers:
          - on: dealtDamage
            when: { byEnemy: true }
            do:
              - op: if
                cond:
                  or:
                    - { has: { unit: eventTarget, effect: frostbitten } }
                    - { has: { unit: eventTarget, effect: chilled } }
                    - { has: { unit: eventTarget, effect: numb } }
                    - { has: { unit: eventTarget, effect: snowbound } }
                then:
                  - op: if
                    cond: { not: { has: { unit: bearer, effect: rushing } } }
                    then: [{ op: apply, to: bearer, effect: rushing }]

bless.winter:
  archetype: Bless
  element: Winter
  name: Rime Mantle
  description: >-
    Target ally gains Frostborn for 2 turns. Meanwhile, each enemy who damages them is Chilled for 1
    turn.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: frostborn, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: rime_mantle
        name: Rime Mantle
        kind: Buff
        element: Winter
        description: Each enemy who damages the bearer is Chilled for 1 turn.
        triggers:
          - on: damaged
            when: { fromSide: enemy }
            do:
              - { op: apply, to: eventSource, effect: chilled, duration: { enemyTurns: 1 } }

curse.winter:
  archetype: Curse
  element: Winter
  name: Snowbind
  description: >-
    Target enemy is Snowbound for 1 turn. Each skill they use while it lasts packs the snow tighter:
    it lasts 1 turn longer (up to 3 times).
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 1 } }
    - op: apply
      to: primary
      stacks: 3
      duration: { enemyTurns: 4 }
      effect:
        id: snowbind
        name: Snowbind
        kind: Debuff
        element: Winter
        description: Each skill the bearer uses while Snowbound adds 1 turn to it (stacks are the turns left to add).
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { has: { unit: bearer, effect: snowbound } }
                then:
                  - { op: extendEffects, on: bearer, effects: [snowbound], by: 2 }
                  - { op: addStacksSelf, amount: -1 }

smite.winter:
  archetype: Smite
  element: Winter
  name: Frostfeather
  description: >-
    Deals 20 damage to target enemy and coats them in frost for 1 turn: the second time the user's side
    damages them again meanwhile, the frost sets: 10 Piercing damage, and they're Frostbitten for 1 turn.
  cost: Wr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: frostfeather
        name: Frostfeather
        kind: Debuff
        element: Winter
        description: >-
          The second direct hit from the applier's side sets the frost: 10 Piercing, and Frostbitten for 1
          turn.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - op: if
                cond: { flag: once }
                then:
                  - { op: removeSelf }
                  - { op: damage, to: bearer, amount: 10, type: Piercing, direct: false }
                  - { op: apply, to: bearer, effect: frostbitten, duration: { enemyTurns: 1 } }
                else:
                  - { op: setFlag, flag: once }

prayer.winter:
  archetype: Prayer
  element: Winter
  name: Snowed In
  description: >-
    All allies heal 30 and gain 15 Shield for 1 turn. Then every unit on both sides, the user included,
    is Snowbound for 1 turn.
  cost: Wr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 30 }
    - { op: apply, to: targets, effect: shield, value: 15, duration: { enemyTurns: 1 } }
    - { op: apply, to: allUnits, effect: snowbound, duration: { enemyTurns: 1 } }

cleave.winter:
  archetype: Cleave
  element: Winter
  name: Winter's Descent
  description: >-
    Deals 25 damage to target enemy. The descent rolls on through the others: each Immobile one takes
    10, and each one still moving takes 5 and is Snowbound for 1 turn.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - op: forEach
      in: { filter: allEnemies, where: { not: { isPrimary: it } } }
      do:
        - op: if
          cond: { check: { cond: immobile, unit: it } }
          then:
            - { op: damage, to: it, amount: 10 }
          else:
            - { op: damage, to: it, amount: 5 }
            - { op: apply, to: it, effect: snowbound, duration: { enemyTurns: 1 } }

shout.winter:
  archetype: Shout
  element: Winter
  name: Howling Winds
  description: >-
    Enemies with a mobility skill or buff are Snowbound for 2 turns; Immobile enemies are Intimidated
    for 2 turns instead.
  cost: I
  cooldown: 2
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: forEach
      in: targets
      do:
        - op: if
          cond: { check: { cond: immobile, unit: it } }
          then: [{ op: apply, to: it, effect: intimidated, duration: { enemyTurns: 2 } }]
          else: [{ op: apply, to: it, effect: snowbound, duration: { enemyTurns: 2 } }]

withstand.winter:
  archetype: Withstand
  element: Winter
  name: Deepening Drift
  description: >-
    The user gains 10 Shield for 3 turns, and 10 more at the start of each of their turns meanwhile. It
    all melts the moment they use a damaging skill.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      value: 10
      duration: { enemyTurns: 3 }
      effect:
        id: deepening_drift
        name: Deepening Drift
        kind: Buff
        element: Winter
        shield: true
        description: A Shield that grows 10 each turn and melts when the bearer deals direct damage.
        triggers:
          - on: turnStart
            do:
              - { op: boostShields, on: bearer, amount: 10 }
          - on: dealtDamage
            when: { direct: true }
            do:
              - { op: removeSelf }

taunt.winter:
  archetype: Taunt
  element: Winter
  name: Call of the Cold
  description: >-
    Target enemy is Snowbound for 1 turn, and Taunted by the user for as long as they stay Snowbound
    (up to 3 turns).
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: snowbound, duration: { enemyTurns: 1 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: call_of_the_cold
        name: Call of the Cold
        kind: Debuff
        element: Winter
        description: Taunted by the applier while Snowbound.
        modifiers:
          - { mod: forceTarget, if: { has: { unit: bearer, effect: snowbound } } }

titan.winter:
  archetype: Titan
  element: Winter
  name: Dead of Winter
  description: For 3 turns, the user gains 2 Armor and Immune, and no unit in the battle can be healed, the user included.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: armor, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: allUnits
      duration: { enemyTurns: 3 }
      effect:
        id: dead_of_winter
        name: Dead of Winter
        kind: Neutral
        element: Winter
        description: Can't be healed.
        modifiers:
          - { mod: healingReceived, mul: 0 }

