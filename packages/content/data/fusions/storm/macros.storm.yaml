# Storm actions, run on `it`.

# +1 Tempest; at 5, the Eye of the Storm.
gain_tempest:
  - { op: apply, to: it, effect: tempest }
  - op: if
    cond: { and: [{ compare: { value: { stacks: { unit: it, effect: tempest } }, atLeast: 5 } }, { not: { has: { unit: it, effect: eye_of_the_storm } } }] }
    then:
      - { op: apply, to: it, effect: eye_of_the_storm }
      # Which skill use raised it: that skill isn't the one the Eye empowers.
      - { op: setCounter, name: eye_use, on: it, value: { useSeq: true } }
