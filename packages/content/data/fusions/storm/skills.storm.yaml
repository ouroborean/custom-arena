# The 30 Storm (Lightning + Wind) variants, from the "Fusion Spec Kits" design doc.
# Tempest lives on each Storm character (the Storm Heart passive hears every `used:Storm` signal from
# their side). `gain_tempest` adds 1 on `it`.

strike.storm:
  archetype: Strike
  element: Storm
  name: Squall Strike
  description: Deals 15 damage to target enemy, +5 per Tempest the user has (max +15).
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: damage
      to: primary
      amount:
        sum:
          - 15
          - if: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 3 } }
            then: 15
            else: { mul: [5, { stacks: { unit: actor, effect: tempest } }] }

smash.storm:
  archetype: Smash
  element: Storm
  name: Spider Lightning
  description: >-
    Deals 10 damage to target enemy, then hits their allies one at a time, 10 more with each hit (up to 30).
    Each of those hits spends 1 of the user's Tempest; they stop once there's none left.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: set, var: arc, value: 10 }
    # One arc per ally of the target, in random order, while the user has Tempest to spend.
    - op: repeat
      times: { countOf: primaryAllies }
      do:
        - op: if
          cond: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 1 } }
          then:
            - op: forEach
              in:
                randomEnemy: 1
                where: { and: [{ not: { isPrimary: it } }, { not: { has: { unit: it, effect: spider_lightning } } }] }
              do:
                - { op: removeStacks, from: actor, effect: tempest, amount: 1 }
                - op: set
                  var: arc
                  value: { if: { compare: { value: { var: arc }, atLeast: 30 } }, then: 30, else: { sum: [{ var: arc }, 10] } }
                - { op: damage, to: it, amount: { var: arc } }
                - op: apply
                  to: it
                  duration: { thisTurn: true }
                  quiet: true
                  effect: { id: spider_lightning, name: Struck, kind: Neutral, element: Storm, visibility: hidden, description: Already struck by this Spider Lightning. }

charge.storm:
  archetype: Charge
  element: Storm
  name: Ride the Wind
  description: >-
    Deals 15 damage to target enemy. The user's next Harmful skill also deals 5 damage per Tempest to a
    random other enemy.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: ride_the_wind
        name: Ride the Wind
        kind: Buff
        element: Storm
        description: The bearer's next Harmful skill also deals 5 damage per Tempest to a random other enemy.
        triggers:
          - on: skillResolved
            when: { harmful: true }
            consume: true
            do:
              - op: if
                cond: { compare: { value: { stacks: { unit: bearer, effect: tempest } }, atLeast: 1 } }
                then:
                  - { op: damage, to: { randomEnemy: 1, exclude: eventPrimary }, amount: { mul: [5, { stacks: { unit: bearer, effect: tempest } }] } }

riposte.storm:
  archetype: Riposte
  element: Storm
  name: Grounded Arc
  description: >-
    For 1 turn, counters the first Harmful skill used on the user; its user is Sapped once for each energy
    it cost. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: grounded_arc
        name: Grounded Arc
        kind: Buff
        element: Storm
        visibility: hidden
        description: >-
          Counters the first Harmful skill used on the bearer; its user is Sapped once for each energy it
          cost.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: eventSource, effect: sapped, stacks: { skillCost: true } }

rage.storm:
  archetype: Rage
  element: Storm
  name: Storm Within
  description: >-
    For 3 turns, each Harmful Storm skill the user uses that leaves an enemy untargeted spends 1 Tempest to
    deal 10 damage to every enemy it didn't target.
  cost: Sr
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: storm_within
        name: Storm Within
        kind: Buff
        element: Storm
        description: >-
          Each Harmful Storm skill the bearer uses that leaves an enemy untargeted spends 1 Tempest to deal
          10 damage to every enemy it didn't target.
        triggers:
          - on: skillResolved
            when: { harmful: true }
            do:
              - op: if
                cond:
                  and:
                    - { eventSkill: { elements: [Storm] } }
                    - { compare: { value: { countOf: { filter: allEnemies, where: { not: { isEventTarget: it } } } }, atLeast: 1 } }
                    - { compare: { value: { stacks: { unit: bearer, effect: tempest } }, atLeast: 1 } }
                then:
                  - { op: removeStacks, from: bearer, effect: tempest, amount: 1 }
                  - { op: damage, to: { filter: allEnemies, where: { not: { isEventTarget: it } } }, amount: 10, direct: false }

shot.storm:
  archetype: Shot
  element: Storm
  name: Shared Static
  description: >-
    Deals 15 damage to target enemy. Until the user's next turn, each time one of their allies takes damage,
    the user gains 1 Charge.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: { filter: allAllies, where: { not: { isActor: it } } }
      duration: { raw: 2 }
      effect:
        id: shared_static
        name: Shared Static
        kind: Buff
        element: Storm
        description: Damage to the bearer gives the applier 1 Charge.
        triggers:
          - on: damaged
            do:
              - { op: apply, to: actor, effect: charged }

snipe.storm:
  archetype: Snipe
  element: Storm
  name: Stormfront
  description: >-
    On the following turn, deals 15 Piercing damage to all enemies, +5 for each Tempest; it spends all of
    it. Channeled.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: stormfront
        name: Stormfront
        kind: Neutral
        element: Storm
        interruptible: true
        description: >-
          At the end of the following turn, deals 15 Piercing damage to all enemies, +5 per Tempest, and
          spends all of it.
        onExpire:
          - { op: damage, to: allEnemies, type: Piercing, amount: { sum: [15, { mul: [5, { stacks: { unit: bearer, effect: tempest } }] }] } }
          - { op: removeEffect, from: bearer, effect: tempest }
          - { op: removeEffect, from: bearer, effect: eye_of_the_storm }

trap.storm:
  archetype: Trap
  element: Storm
  name: Charged Noose
  description: >-
    For 3 turns, each time target enemy uses a skill, the user gains 1 Tempest, and they take 5 Piercing
    damage per Tempest. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: charged_noose
        name: Charged Noose
        kind: Debuff
        element: Storm
        visibility: hidden
        description: >-
          Each skill the bearer uses gives the applier 1 Tempest and deals the bearer 5 Piercing damage per
          Tempest.
        triggers:
          - on: skillUsed
            do:
              - { op: forEach, in: actor, do: [{ op: macro, id: gain_tempest }] }
              - { op: damage, to: bearer, amount: { mul: [5, { stacks: { unit: actor, effect: tempest } }] }, type: Piercing, direct: false }

maneuver.storm:
  archetype: Maneuver
  element: Storm
  name: Into the Eye
  description: >-
    The user's Tempest rises to 3 if it's lower. For 2 turns, while it's 3 or more, enemies' single-target
    skills can't target them; only skills that hit their whole side can.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: repeat
      times: { sum: [3, { mul: [-1, { stacks: { unit: actor, effect: tempest } }] }] }
      do:
        - { op: forEach, in: actor, do: [{ op: macro, id: gain_tempest }] }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: into_the_eye
        name: Into the Eye
        kind: Buff
        element: Storm
        description: While the bearer's Tempest is 3 or more, enemies' single-target skills can't target them.
    # The rule sits on the enemies (their targeting), keyed to the user's Into the Eye and Tempest.
    - op: apply
      to: allEnemies
      duration: { enemyTurns: 2 }
      linkTo: into_the_eye
      effect:
        id: eye_wall
        name: Eye Wall
        kind: Neutral
        element: Storm
        visibility: hidden
        description: >-
          Can't use single-target skills on a unit with Into the Eye while their Tempest is 3 or more.
        modifiers:
          - mod: targetExclude
            singleOnly: true
            where:
              and:
                - { has: { unit: it, effect: into_the_eye } }
                - { compare: { value: { stacks: { unit: it, effect: tempest } }, atLeast: 3 } }

companion.storm:
  archetype: Companion
  element: Storm
  name: Storm Roc
  description: >-
    Summons a Storm Roc (40 HP) permanently; its skills are Storm skills. Gale Wing (nc): 5 damage to target
    enemy. Thunder Talon (r, only at 3 or more Tempest): 20 damage, and Saps.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: storm_roc }

bolt.storm:
  archetype: Bolt
  element: Storm
  name: Thunderhead
  description: >-
    The user gains Thunderhead on target enemy until the end of their next turn. Meanwhile, their Tempest
    doesn't rise; instead, each Storm skill their team uses adds 1 charge to the Thunderhead (max 3). When
    it ends, the target takes 20 damage, plus 10 per charge.
  cost: I
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # Storm Heart skips the bearer's Tempest gain while they carry this (see statuses.storm.yaml).
    - op: apply
      to: actor
      remember: primary
      duration: { ownTurns: 1 }
      effect:
        id: thunderhead
        name: Thunderhead
        kind: Buff
        element: Storm
        stacking: merge
        maxStacks: 4
        description: >-
          The bearer's Tempest doesn't rise; each Storm skill their team uses adds 1 charge to this instead
          (max 3). When it ends, its target takes 20 damage, plus 10 per charge.
        triggers:
          - on: signal
            signal: "used:Storm"
            when: { side: ally }
            do:
              - op: if
                cond: { compare: { value: { effectStacks: true }, atMost: 3 } }
                then:
                  - { op: addStacksSelf, amount: 1 }
        onExpire:
          - { op: damage, to: effectTargets, amount: { sum: [10, { mul: [10, { effectStacks: true }] }] } }

blast.storm:
  archetype: Blast
  element: Storm
  name: Supercell
  description: >-
    Deals 25 damage to all enemies. Tempest falls by 1, and each ally gains 1 Charge.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - { op: removeStacks, from: actor, effect: tempest, amount: 1 }
    - { op: apply, to: allAllies, effect: charged }

consume.storm:
  archetype: Consume
  element: Storm
  name: Calm Before the Storm
  description: >-
    Deals 5 damage to target enemy. Tempest falls by up to 2, and the user heals the damage dealt plus 10
    for each point it fell.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - op: set
      var: calm
      value: { if: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 2 } }, then: 2, else: { stacks: { unit: actor, effect: tempest } } }
    - { op: removeStacks, from: actor, effect: tempest, amount: 2 }
    - { op: heal, to: actor, amount: { sum: [{ lastDamage: true }, { mul: [10, { var: calm }] }] } }

summon.storm:
  archetype: Summon
  element: Storm
  name: Brewing Squall
  description: >-
    Summons a Squall Cloud (20 HP) for 3 turns; its skills are Storm skills. Rumble (nc): 5 damage to target
    enemy. When it expires, it deals 5 damage per Tempest to all enemies.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: squall_cloud, duration: { enemyTurns: 3 } }

channel.storm:
  archetype: Channel
  element: Storm
  name: Hurricane
  description: >-
    For up to 4 turns, at the end of each of the user's turns, deals 10 damage to all enemies, +5 per
    Tempest, and Tempest rises by 1; it ends early once Tempest reaches 5. Channeled.
  cost: SI
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: hurricane
        name: Hurricane
        kind: Neutral
        element: Storm
        interruptible: true
        description: Each turn, damage scaling with Tempest, and Tempest rises; ends at 5.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: allEnemies, amount: { sum: [10, { mul: [5, { stacks: { unit: bearer, effect: tempest } }] }] } }
              - { op: forEach, in: bearer, do: [{ op: macro, id: gain_tempest }] }
              - op: if
                cond: { compare: { value: { stacks: { unit: bearer, effect: tempest } }, atLeast: 5 } }
                then: [{ op: removeSelf }]

stab.storm:
  archetype: Stab
  element: Storm
  name: Knife in the Gale
  description: >-
    Deals 10 damage to target enemy, then 5 damage per Tempest (max 10) to the enemy with the least HP.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: damage
      to: weakestEnemy
      amount: { if: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 2 } }, then: 10, else: { mul: [5, { stacks: { unit: actor, effect: tempest } }] } }

ravage.storm:
  archetype: Ravage
  element: Storm
  name: Summit Strike
  description: >-
    Deals 25 Piercing damage to the enemy with the most HP, +15 if they're Stunned. It Bypasses.
  cost: A
  cooldown: 1
  tags: [Harmful, NonStrategic, Bypass]
  target: allEnemies
  ops:
    - op: damage
      to: strongestEnemy
      type: Piercing
      bypass: true
      amount: { if: { stunned: it }, then: 40, else: 25 }

mislead.storm:
  archetype: Mislead
  element: Storm
  name: False Front
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered, and they're Sapped once for every 2
    Tempest (at least once). Invisible.
  cost: S
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: false_front
        name: False Front
        kind: Debuff
        element: Storm
        visibility: hidden
        description: >-
          The bearer's next Harmful skill is countered, and they're Sapped once for every 2 of the applier's
          Tempest (at least once).
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - op: apply
                to: bearer
                effect: sapped
                stacks: { if: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 2 } }, then: { div: [{ stacks: { unit: actor, effect: tempest } }, 2] }, else: 1 }

stun.storm:
  archetype: Stun
  element: Storm
  name: Static Buildup
  description: >-
    Deals 15 damage to target enemy. For 2 turns, each skill they use adds 1 turn to a Stun they receive
    when it ends (max 3).
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: setCounter, name: static_buildup, value: 0, on: primary }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: static_buildup
        name: Static Buildup
        kind: Debuff
        element: Storm
        description: >-
          Each skill the bearer uses adds 1 turn to a Stun they receive when this ends (max 3 turns).
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { compare: { value: { counterOf: { unit: bearer, name: static_buildup } }, atMost: 2 } }
                then: [{ op: setCounter, name: static_buildup, on: bearer, value: { sum: [{ counterOf: { unit: bearer, name: static_buildup } }, 1] } }]
        onExpire:
          - op: if
            cond: { compare: { value: { counterOf: { unit: bearer, name: static_buildup } }, atLeast: 1 } }
            then:
              - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: { counterOf: { unit: bearer, name: static_buildup } } } }

dance.storm:
  archetype: Dance
  element: Storm
  name: Storm Rider
  description: >-
    For 3 turns, the user gains 1 Might and begins Rushing; while they're Rushing, all their skills count as
    Storm skills.
  cost: AA
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: rushing }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: storm_rider
        name: Storm Rider
        kind: Buff
        element: Storm
        description: While Rushing, the bearer's skills count as Storm skills.
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { and: [{ has: { unit: bearer, effect: rushing } }, { not: { eventSkill: { elements: [Storm] } } }] }
                then: [{ op: signal, name: "used:Storm" }]

heal.storm:
  archetype: Heal
  element: Storm
  name: Mending Arc
  description: >-
    Target ally heals 25. Then the other ally with the least HP heals 15, and any remaining allies heal 5.
  cost: A
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 25 }
    - op: forEach
      in: { filter: weakestAlly, exclude: primary, where: { kind: { unit: it, is: character } } }
      do:
        - { op: heal, to: it, amount: 15 }
        - { op: setCounter, name: arc_hop, value: 1, on: it }
    - op: heal
      to:
        filter: allAllies
        exclude: primary
        where: { and: [{ kind: { unit: it, is: character } }, { compare: { value: { counterOf: { unit: it, name: arc_hop } }, atMost: 0 } }] }
      amount: 5
    - { op: setCounter, name: arc_hop, value: 0, on: allAllies }

bless.storm:
  archetype: Bless
  element: Storm
  name: Tailwind
  description: For 2 turns, target ally's skills count as Storm skills, and they gain 1 Swiftness.
  cost: S
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: swiftness, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: tailwind
        name: Tailwind
        kind: Buff
        element: Storm
        description: The bearer's skills count as Storm skills.
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { not: { eventSkill: { elements: [Storm] } } }
                then: [{ op: signal, name: "used:Storm" }]

curse.storm:
  archetype: Curse
  element: Storm
  name: Crosswind
  description: >-
    Target enemy loses all their Charge. For 2 turns, any Charge they would gain is added to the user's
    Tempest instead.
  cost: I
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: removeEffect, from: primary, effect: charged }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: crosswind
        name: Crosswind
        kind: Debuff
        element: Storm
        description: Charge the bearer would gain is added to the applier's Tempest instead.
        triggers:
          - on: effectGained
            effect: charged
            do:
              - { op: removeEffect, from: bearer, effect: charged }
              - { op: forEach, in: actor, do: [{ op: macro, id: gain_tempest }] }

smite.storm:
  archetype: Smite
  element: Storm
  name: Rod of the Storm
  description: Deals 20 damage to target enemy. For 1 turn, each time an ally damages them, Tempest rises by 1.
  cost: Wr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: rod_of_the_storm
        name: Rod of the Storm
        kind: Debuff
        element: Storm
        description: Each hit from the applier's side raises their Tempest.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - { op: forEach, in: actor, do: [{ op: macro, id: gain_tempest }] }

prayer.storm:
  archetype: Prayer
  element: Storm
  name: Song of the Storm
  description: All allies heal 20 and gain 10 Shield for 1 turn. For 2 turns, the team's Tempest doesn't fall.
  cost: Wrr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - { op: apply, to: targets, effect: shield, value: 10, duration: { enemyTurns: 1 } }
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: song_of_the_storm
        name: Song of the Storm
        kind: Buff
        element: Storm
        description: The bearer's Tempest doesn't fall.

cleave.storm:
  archetype: Cleave
  element: Storm
  name: Shearing Gale
  description: >-
    Deals 25 damage to target enemy and 5 to every other enemy. For each Tempest beyond the first (max 3
    more), it deals 5 less to the target and 5 more to the others.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: set
      var: widen
      value:
        if: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 4 } }
        then: 3
        else: { if: { compare: { value: { stacks: { unit: actor, effect: tempest } }, atLeast: 1 } }, then: { sum: [{ stacks: { unit: actor, effect: tempest } }, -1] }, else: 0 }
    - { op: damage, to: primary, amount: { sum: [25, { mul: [-5, { var: widen }] }] } }
    - { op: damage, to: primaryAllies, amount: { sum: [5, { mul: [5, { var: widen }] }] } }

shout.storm:
  archetype: Shout
  element: Storm
  name: Storm Warning
  description: >-
    For 2 turns, each time a Storm skill damages an enemy, they're Sapped.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: storm_warning
        name: Storm Warning
        kind: Debuff
        element: Storm
        description: Each time a Storm skill damages the bearer, they're Sapped.
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { eventSkill: { elements: [Storm] } }
                then: [{ op: apply, to: bearer, effect: sapped }]

withstand.storm:
  archetype: Withstand
  element: Storm
  name: Storm Cellar
  description: Every ally, the user included, gains 20 Shield for 1 turn. The user gains 3 Sapped.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: allAllies, effect: shield, value: 20, duration: { enemyTurns: 1 } }
    - { op: apply, to: actor, effect: sapped, stacks: 3 }

taunt.storm:
  archetype: Taunt
  element: Storm
  name: Static Lure
  description: >-
    Target enemy is Taunted by the user for 2 turns. While they're Taunted and Sapped, they generate 1 less
    energy every turn.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: static_lure
        name: Static Lure
        kind: Debuff
        element: Storm
        description: While Taunted and Sapped, the bearer generates 1 less energy each turn.
        modifiers:
          - { mod: energyGain, amount: -1, if: { and: [{ has: { unit: actor, effect: taunt } }, { has: { unit: actor, effect: sapped } }] } }

titan.storm:
  archetype: Titan
  element: Storm
  name: Djinn of the Tempest
  description: >-
    For 3 turns, the user is Immune and gains 1 Armor per 2 Tempest, rechecked as each hit lands; Tempest
    rises by 1 at the start of each of their turns.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: djinn_of_the_tempest
        name: Djinn of the Tempest
        kind: Buff
        element: Storm
        description: 1 Armor per 2 Tempest; Tempest rises each turn.
        modifiers:
          - { mod: damageTaken, amount: 0, armor: true, when: { types: [Normal] }, value: { mul: [-5, { div: [{ stacks: { unit: actor, effect: tempest } }, 2] }] } }
        triggers:
          - on: turnStart
            do:
              - { op: forEach, in: bearer, do: [{ op: macro, id: gain_tempest }] }

# Minion skills.

storm_roc_gale_wing:
  archetype: Minion
  element: Storm
  name: Gale Wing
  description: Deals 5 damage to target enemy.
  cost: nc
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }

storm_roc_thunder_talon:
  archetype: Minion
  element: Storm
  name: Thunder Talon
  description: Deals 20 damage to target enemy and Saps them. Only at 3 or more Tempest.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  requires: { compare: { value: { stacks: { unit: summoner, effect: tempest } }, atLeast: 3 } }
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: sapped }

squall_cloud_rumble:
  archetype: Minion
  element: Storm
  name: Rumble
  description: Deals 5 damage to target enemy.
  cost: nc
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
