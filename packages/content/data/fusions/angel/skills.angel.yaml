    - { op: apply, to: actor, effect: armor, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: seraphic_form
        name: Seraphic Form
        kind: Buff
        element: Angel
        description: Single-target Helpful skills reach every ally; no Harmful skills.
        modifiers:
          - { mod: cannotUseSkills, harmful: true }
        triggers:
          - on: skillResolved
            when: { harmful: false }
            do:
              - op: if
                cond: { eventSkill: { single: true } }
                then:
                  - { op: castSkill, eventSkill: true, on: { filter: allAllies, where: { not: { isEventTarget: it } } } }

