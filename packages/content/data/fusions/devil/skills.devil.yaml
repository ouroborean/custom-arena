  element: Devil
  name: Infernal Toll
  description: >-
    For 2 turns, each skill an enemy uses deals them 5 Affliction damage per energy it cost.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: infernal_toll
        name: Infernal Toll
        kind: Debuff
        element: Devil
        description: Each skill the bearer uses deals them 5 Affliction damage per energy it cost.
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { compare: { value: { skillCost: true }, atLeast: 1 } }
                then:
                  - { op: damage, to: bearer, amount: { mul: [5, { skillCost: true }] }, type: Affliction, direct: false }

withstand.devil:
