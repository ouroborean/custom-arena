# The 30 Devil (Fire + Unholy) variants, from the "Fusion Spec Kits" design doc.
# A Contract is an inline effect that counts as `contract`; its onExpire is the price. Hellfire
# counts as an Ignite and as Horrified.

strike.devil:
  archetype: Strike
  element: Devil
  name: Infernal Edge
  description: >-
    Deals 25 damage to target enemy. If they have Hellfire, it spreads to a random ally of theirs for
    1 turn; if not, they gain it for 1 turn.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - op: if
      cond: { has: { unit: primary, effect: hellfire } }
      then:
        - { op: apply, to: { randomEnemy: 1, exclude: primary }, effect: hellfire, duration: { enemyTurns: 1 } }
      else:
        - { op: apply, to: primary, effect: hellfire, duration: { enemyTurns: 1 } }

smash.devil:
  archetype: Smash
  element: Devil
  name: Infernal Crush
  description: Deals 40 damage to target enemy. For each Buff they have, a random ally of theirs gains Hellfire for 2 turns.
  cost: SS
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 40 }
    - op: repeat
      times: { kindCount: { unit: primary, kind: Buff } }
      do:
        - { op: apply, to: { randomEnemy: 1, exclude: primary }, effect: hellfire, duration: { enemyTurns: 2 } }

charge.devil:
  archetype: Charge
  element: Devil
  name: Hellbent
  description: The user loses 15 HP. Deals 25 damage to target enemy, and the user gains 2 Focus for their next skill.
  cost: nc
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: actor, amount: 15, raw: true, type: Affliction, direct: false }
    - { op: damage, to: primary, amount: 25 }
    - { op: apply, to: actor, effect: focus, stacks: 2, until: { skillUsed: {} } }

riposte.devil:
  archetype: Riposte
  element: Devil
  name: Devil's Due
  description: >-
    For 1 turn, counters any Harmful skill used on the user, and a random Buff of its user's moves
    to the user, or, if they have none, they take 15 Affliction damage. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: devils_due
        name: Devil's Due
        kind: Buff
        element: Devil
        visibility: hidden
        description: >-
          Counters Harmful skills used on the bearer; a random Buff of each one's user moves to the
          bearer, or, if they have none, they take 15 Affliction.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - op: if
                cond: { hasKind: { unit: eventSource, kind: Buff } }
                then:
                  - { op: stealRandom, from: eventSource, to: bearer, kind: Buff }
                else:
                  - { op: damage, to: eventSource, amount: 15, type: Affliction, direct: false }

rage.devil:
  archetype: Rage
  element: Devil
  name: Faustian Fury
  description: >-
    The user gains a Contract (3 turns): 2 Might, Flameborn and Immortal now; price: 30 Affliction
    damage and Horrified for 2 turns.
  cost: Sr
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: flameborn, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immortal, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: faustian_contract
        name: Faustian Contract
        kind: Buff
        element: Devil
        countsAs: [contract]
        description: "Price when it expires: 30 Affliction damage and Horrified for 2 turns."
        onExpire:
          - { op: damage, to: bearer, amount: 30, type: Affliction, direct: false }
          - { op: apply, to: bearer, effect: horrified, duration: { enemyTurns: 2 } }

shot.devil:
  archetype: Shot
  element: Devil
  name: Infernal Coin
  description: >-
    Deals 15 damage to target enemy. An Ignite on them becomes Hellfire for 2 turns; if they already had
    Hellfire, the user gains 1 Soul Fragment.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: if
      cond: { has: { unit: primary, effect: hellfire } }
      then:
        - { op: apply, to: actor, effect: soul_fragment }
      else:
        - op: if
          cond: { has: { unit: primary, effect: ignite, exact: true } }
          then:
            - { op: removeEffect, from: primary, effect: ignite }
            - { op: apply, to: primary, effect: hellfire, duration: { enemyTurns: 2 } }

snipe.devil:
  archetype: Snipe
  element: Devil
  name: Collection Day
  description: >-
    On the following turn, deals 40 damage to target enemy; if they have a Contract, its price is
    collected now, doubled. The target of this skill is invisible. Channeled.
  cost: AS
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: collection_day
        name: Collection Day (aiming)
        kind: Neutral
        element: Devil
        visibility: hiddenTarget
        interruptible: true
        description: Strikes its target at the end of the following turn and collects their Contract, doubled.
        onExpire:
          - { op: damage, to: effectTargets, amount: 40 }
          - { op: expire, on: effectTargets, effect: contract, times: 2 }

trap.devil:
  archetype: Trap
  element: Devil
  name: Fine Print
  description: >-
    For 1 turn, if target enemy uses a skill, they gain a Contract (2 turns): 1 Swiftness now; price:
    Stunned for 1 turn and 2 Weakness. Invisible.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: fine_print
        name: Fine Print
        kind: Debuff
        element: Devil
        visibility: hidden
        description: The bearer's next skill gives them a Contract.
        triggers:
          - on: skillUsed
            consume: true
            do:
              - { op: apply, to: bearer, effect: swiftness, duration: { enemyTurns: 2 } }
              - op: apply
                to: bearer
                duration: { enemyTurns: 2 }
                effect:
                  id: fine_print_contract
                  name: Fine Print
                  kind: Neutral
                  element: Devil
                  countsAs: [contract]
                  description: "Price when it expires: Stunned for 1 turn and 2 Weakness."
                  onExpire:
                    - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }
                    - { op: apply, to: bearer, effect: weakness, stacks: 2, duration: { enemyTurns: 2 } }

maneuver.devil:
  archetype: Maneuver
  element: Devil
  name: Put It on My Tab
  description: >-
    For 1 turn, each hit on the user is delayed and becomes a Contract whose price, at the end of
    their next turn, is half that damage as Affliction. Invisible.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    # Neutral, so Hellfire on the user can't stop it. Each held hit becomes its own devils_tab
    # Contract (statuses.devil.yaml), due at the end of the user's next turn.
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: on_my_tab
        name: Put It on My Tab
        kind: Neutral
        element: Devil
        description: >-
          Each hit on the bearer is delayed and becomes a Contract; its price is half that damage, as
          Affliction.
        modifiers:
          - { mod: deferHits, status: devils_tab, reduceBy: 0, delay: 2 }

companion.devil:
  archetype: Companion
  element: Devil
  name: Imp Notary
  description: >-
    Summons an Imp Notary (25 HP) permanently. Offer (I): target unit gets a Contract (2 turns): 1
    Might now; price: 10 Affliction damage. Sealing Wax (r): 10 Affliction damage, and Hellfire on a
    Contract holder.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: imp_notary }

bolt.devil:
  archetype: Bolt
  element: Devil
  name: Borrowed Fire
  description: >-
    Deals 35 damage to target enemy, and the user gains a Contract (2 turns) whose price is 15
    Affliction damage, waived if that enemy has died by then.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 35 }
    # Neutral, so a Horrified user can't dodge the bill.
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 2 }
      effect:
        id: borrowed_fire
        name: Borrowed Fire
        kind: Neutral
        element: Devil
        countsAs: [contract]
        description: "Price when it expires: 15 Affliction damage, waived if the enemy it hit has died."
        onExpire:
          - op: if
            cond: { any: { in: effectTargets, cond: { hpAbove: { unit: it, value: 0 } } } }
            then:
              - { op: damage, to: bearer, amount: 15, type: Affliction, direct: false }

blast.devil:
  archetype: Blast
  element: Devil
  name: Hellstorm
  description: >-
    Deals 20 damage to all enemies. The user spends all their Soul Fragments (up to 3), and every enemy
    gains Hellfire for 1 turn per fragment spent.
  cost: SIr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 20 }
    - op: set
      var: spent
      value:
        if: { compare: { value: { stacks: { unit: actor, effect: soul_fragment } }, atLeast: 3 } }
        then: 3
        else: { stacks: { unit: actor, effect: soul_fragment } }
    - { op: repeat, times: { var: spent }, do: [{ op: removeStacks, from: actor, effect: soul_fragment, amount: 1 }] }
    - op: if
      cond: { compare: { value: { var: spent }, atLeast: 1 } }
      then:
        - { op: apply, to: targets, effect: hellfire, duration: { enemyTurns: { var: spent } } }

consume.devil:
  archetype: Consume
  element: Devil
  name: Collect
  description: >-
    Deals 5 damage to target enemy, who gains a Contract (2 turns) whose price is 20 Affliction
    damage; the user heals as much as it deals.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    # Forced on an enemy, so Neutral (Horrified doesn't stop it), like Fine Print.
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: collect_debt
        name: Debt
        kind: Neutral
        element: Devil
        countsAs: [contract]
        description: >-
          Price when it expires: 20 Affliction damage, and the applier heals as much.
        onExpire:
          # What it deals: no more than the HP they had left.
          - { op: set, var: had, value: { hp: bearer } }
          - { op: damage, to: bearer, amount: 20, type: Affliction, direct: false }
          - op: heal
            to: actor
            amount: { if: { compare: { value: { sum: [{ lastDamage: true }, { mul: [-1, { var: had }] }] }, atLeast: 1 } }, then: { var: had }, else: { lastDamage: true } }

summon.devil:
  archetype: Summon
  element: Devil
  name: Imp Captain
  description: >-
    Summons an Imp Captain (25 HP) for 3 turns. Ember Whip (r): 10 damage to target enemy. Its hits deal
    5 more per Soul Fragment the user has, without spending them.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: imp_captain, duration: { enemyTurns: 3 } }

channel.devil:
  archetype: Channel
  element: Devil
  name: Soulburn
  description: >-
    For up to 3 turns, target enemy has Hellfire, and at the end of each of the user's turns it burns
    them for 10 more Affliction damage. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: enemy
  ops:
    # 5 ticks: it runs out right after its third burn, at the end of the user's third turn. The
    # Hellfire is linked to it, so breaking the channel puts the fire out.
    - op: apply
      to: actor
      remember: primary
      duration: { raw: 5 }
      effect:
        id: soulburn
        name: Soulburn
        kind: Neutral
        element: Devil
        interruptible: true
        description: Holds Hellfire on the target and burns them for 10 more Affliction each turn.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: effectTargets, amount: 10, type: Affliction }
    - { op: apply, to: primary, effect: hellfire, duration: { raw: 5 }, linkTo: soulburn }

stab.devil:
  archetype: Stab
  element: Devil
  name: Pitchfork
  description: >-
    Deals 10 damage to target enemy and removes a random Buff of theirs; if they have none, it deals 20
    instead.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { hasKind: { unit: primary, kind: Buff } }
      then:
        - { op: damage, to: primary, amount: 10 }
        - { op: removeRandom, from: primary, kind: Buff }
      else:
        - { op: damage, to: primary, amount: 20 }

ravage.devil:
  archetype: Ravage
  element: Devil
  name: Hellraze
  description: >-
    Deals 35 Piercing damage to target enemy. If they have Buffs, those become a Contract: they keep
    them for 1 turn, then lose their Buffs and pay 10 Affliction damage per Buff they had.
  cost: AS
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 35, type: Piercing }
    - op: if
      cond: { hasKind: { unit: primary, kind: Buff } }
      then:
        - op: apply
          to: primary
          value: { kindCount: { unit: primary, kind: Buff } }
          duration: { enemyTurns: 1 }
          effect:
            id: hellraze_contract
            name: Hellraze
            kind: Neutral
            element: Devil
            countsAs: [contract]
            description: "Price when it expires: their Buffs are lost, and 10 Affliction damage per Buff they had."
            onExpire:
              - { op: removeKind, from: bearer, kind: Buff }
              - { op: damage, to: bearer, amount: { mul: [10, { effectValue: true }] }, type: Affliction, direct: false }

mislead.devil:
  archetype: Mislead
  element: Devil
  name: Soul Snare
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered, and the user gains a Soul Fragment
    for each Ignite and Scorch they have. Invisible.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: soul_snare
        name: Soul Snare
        kind: Debuff
        element: Devil
        visibility: hidden
        description: >-
          The bearer's next Harmful skill is countered; the applier gains a Soul Fragment for each
          Ignite and Scorch on the bearer.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: actor, effect: soul_fragment, stacks: { count: { effects: [ignite, hellfire, frostfire, scorched], in: bearer } } }

stun.devil:
  archetype: Stun
  element: Devil
  name: Hellbound
  description: >-
    Deals 10 damage to target enemy, who gains Hellfire for 1 turn. For 3 turns, they're Stunned
    while they have Hellfire, but never on two of their turns in a row.
  cost: AS
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: apply, to: primary, effect: hellfire, duration: { enemyTurns: 1 } }
    # Its own stun (not `stun`), on only while the Hellfire lasts. At the start of each of the
    # bearer's turns it decides whether this turn can be Hellbound: never right after one that was.
    - { op: setCounter, name: hellbound_now, value: 1, on: primary }
    - { op: setCounter, name: hellbound_rest, value: 0, on: primary }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: hellbound
        name: Hellbound
        kind: Debuff
        element: Devil
        description: Stunned while the bearer has Hellfire, but never on two of their turns in a row.
        modifiers:
          - mod: cannotUseSkills
            if:
              and:
                - { has: { unit: bearer, effect: hellfire } }
                - { compare: { value: { counterOf: { unit: bearer, name: hellbound_now } }, atLeast: 1 } }
        triggers:
          - on: turnStart
            do:
              - op: if
                cond: { compare: { value: { counterOf: { unit: bearer, name: hellbound_rest } }, atLeast: 1 } }
                then:
                  - { op: setCounter, name: hellbound_now, value: 0, on: bearer }
                  - { op: setCounter, name: hellbound_rest, value: 0, on: bearer }
                else:
                  - op: if
                    cond: { has: { unit: bearer, effect: hellfire } }
                    then:
                      - { op: setCounter, name: hellbound_now, value: 1, on: bearer }
                      - { op: setCounter, name: hellbound_rest, value: 1, on: bearer }
                    else:
                      - { op: setCounter, name: hellbound_now, value: 0, on: bearer }

dance.devil:
  archetype: Dance
  element: Devil
  name: Dance with the Devil
  description: >-
    For 3 turns, the user gains 1 Swiftness and 1 Focus, and Ignites they apply also burn at the start
    of each of their turns.
  cost: S
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: swiftness, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: focus, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: dance_with_the_devil
        name: Dance with the Devil
        kind: Buff
        element: Devil
        description: The bearer's Ignites also burn at the start of each of their turns.
        triggers:
          - on: turnStart
            do:
              - op: forEach
                in: { filter: allEnemies, where: { has: { unit: it, effect: ignite, mine: true } } }
                do:
                  - { op: macro, id: ignite_tick }

heal.devil:
  archetype: Heal
  element: Devil
  name: Fair Trade
  description: >-
    Target ally and the enemy with the most HP both have their HP set to the average of the two: the
    ally heals exactly what that enemy loses.
  cost: W
  cooldown: 3
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: forEach
      in: strongestEnemy
      do:
        - { op: set, var: trade, value: { div: [{ sum: [{ hp: it }, { mul: [-1, { hp: primary }] }] }, 2] } }
        - op: if
          cond: { compare: { value: { var: trade }, atLeast: 1 } }
          then:
            - { op: damage, to: it, amount: { var: trade }, raw: true, type: Affliction, direct: false, bypass: true }
            - { op: heal, to: primary, amount: { var: trade }, raw: true }

bless.devil:
  archetype: Bless
  element: Devil
  name: Pact of Flame
  description: >-
    Target ally receives a Contract (2 turns): Lifesteal now; price: 20 Affliction damage, minus the HP
    they healed meanwhile.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: lifesteal, duration: { enemyTurns: 2 } }
    - { op: setCounter, name: pact_of_flame, value: 0, on: primary }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: pact_of_flame
        name: Pact of Flame
        kind: Buff
        element: Devil
        countsAs: [contract]
        description: "Price when it expires: 20 Affliction damage, minus the HP healed meanwhile."
        triggers:
          - on: healed
            do:
              - { op: setCounter, name: pact_of_flame, on: bearer, value: { sum: [{ counterOf: { unit: bearer, name: pact_of_flame } }, { eventAmount: true }] } }
        onExpire:
          - op: if
            cond: { compare: { value: { counterOf: { unit: bearer, name: pact_of_flame } }, atMost: 19 } }
            then:
              - { op: damage, to: bearer, amount: { sum: [20, { mul: [-1, { counterOf: { unit: bearer, name: pact_of_flame } }] }] }, type: Affliction, direct: false }

curse.devil:
  archetype: Curse
  element: Devil
  name: Double or Nothing
  description: >-
    Target enemy gains Hellfire for 1 turn. Then, at random, either each of their Debuffs gains 1 more
    stack and lasts 2 turns longer, or the user gains 1 Soul Fragment.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: hellfire, duration: { enemyTurns: 1 } }
    - op: random
      options:
        - - { op: extendEffects, on: primary, kind: Debuff, by: 4 }
          - op: forEach
            in: primary
            do:
              - op: if
                cond: { has: { unit: it, effect: weakness } }
                then: [{ op: apply, to: it, effect: weakness, duration: { enemyTurns: 2 } }]
              - op: if
                cond: { has: { unit: it, effect: vulnerable } }
                then: [{ op: apply, to: it, effect: vulnerable, duration: { enemyTurns: 2 } }]
              - op: if
                cond: { has: { unit: it, effect: toxin } }
                then: [{ op: apply, to: it, effect: toxin }]
              - op: if
                cond: { has: { unit: it, effect: confusion } }
                then: [{ op: apply, to: it, effect: confusion, duration: { enemyTurns: 2 } }]
        - - { op: apply, to: actor, effect: soul_fragment }

smite.devil:
  archetype: Smite
  element: Devil
  name: Price on Their Head
  description: >-
    Deals 20 damage to target enemy. If they die within 2 turns, whoever killed them has their
    cooldowns reset, and the user's player gains 1 random energy.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: price_on_their_head
        name: Price on Their Head
        kind: Debuff
        element: Devil
        description: Whoever kills the bearer has their cooldowns reset; the applier gains 1 energy.

prayer.devil:
  archetype: Prayer
  element: Devil
  name: Choir of the Pit
  description: >-
    All allies heal 20, and all enemies are Horrified for 1 turn. For as long, each Helpful skill used
    on a Horrified enemy (whose Buffs fail) gives a random ally of the user 1 Might instead.
  cost: Srr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - { op: apply, to: allEnemies, effect: horrified, duration: { enemyTurns: 1 } }
    - op: apply
      to: allEnemies
      duration: { enemyTurns: 1 }
      effect:
        id: choir_of_the_pit
        name: Choir of the Pit
        kind: Debuff
        element: Devil
        description: While Horrified, each Helpful skill used on the bearer gives a random enemy of theirs 1 Might.
        triggers:
          - on: skillTargeted
            when: { harmful: false }
            do:
              - op: if
                cond: { has: { unit: bearer, effect: horrified } }
                then:
                  - { op: apply, to: { randomAlly: 1, where: { kind: { unit: it, is: character } } }, effect: might, duration: { enemyTurns: 1 } }

cleave.devil:
  archetype: Cleave
  element: Devil
  name: Co-signed Debt
  description: >-
    Deals 20 damage to target enemy, and a random other enemy gains a Contract (2 turns) whose price is
    half of all the damage the target takes until it's due (this hit included), as Affliction damage.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: set, var: first_cut, value: { lastDamage: true } }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        # The debt is a counter on the co-signer; a second co-signing adds to one still open.
        - op: setCounter
          name: cosign_debt
          on: it
          value:
            sum:
              - { var: first_cut }
              - if: { has: { unit: it, effect: cosigned_debt } }
                then: { counterOf: { unit: it, name: cosign_debt } }
                else: 0
        # Forced on an enemy, so Neutral (Horrified doesn't stop it), like Collect.
        - op: apply
          to: it
          duration: { enemyTurns: 2 }
          effect:
            id: cosigned_debt
            name: Co-signed Debt
            kind: Neutral
            element: Devil
            stacking: unique
            countsAs: [contract]
            description: >-
              Price when it expires: half of the damage the Debtor took meanwhile (rounded down to 5),
              as Affliction damage.
            onExpire:
              - op: damage
                to: bearer
                amount: { mul: [5, { div: [{ counterOf: { unit: bearer, name: cosign_debt } }, 10] }] }
                type: Affliction
                direct: false
              - { op: setCounter, name: cosign_debt, on: bearer, value: 0 }
        - op: apply
          to: primary
          remember: it
          duration: { enemyTurns: 2 }
          effect:
            id: cosigned_debtor
            name: Debtor
            kind: Neutral
            element: Devil
            stacking: independent
            description: >-
              All the damage the bearer takes is added to the price of the other enemy's Co-signed Debt.
            triggers:
              - on: damaged
                do:
                  - op: setCounter
                    name: cosign_debt
                    on: effectTargets
                    value: { sum: [{ counterOf: { unit: effectTargets, name: cosign_debt } }, { eventAmount: true }] }

shout.devil:
