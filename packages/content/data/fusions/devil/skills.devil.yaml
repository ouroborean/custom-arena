taunt.devil:
  archetype: Taunt
  element: Devil
  name: Dare the Damned
  description: >-
    Target enemy is Taunted by the user for up to 3 turns, until they've dealt the user 30 damage in
    total.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: setCounter, name: dare_paid, value: 0, on: primary }
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 3 } }
    # Neutral, so Horrified can't keep the dare off the user. The tally is kept on the payer.
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: dare_the_damned
        name: Dare the Damned
        kind: Neutral
        element: Devil
        description: An enemy the bearer Taunted stays Taunted until they've dealt the bearer 30 damage.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: taunt, mine: true } }
                then:
                  - { op: setCounter, name: dare_paid, on: eventSource, value: { sum: [{ counterOf: { unit: eventSource, name: dare_paid } }, { eventAmount: true }] } }
                  - op: if
                    cond: { compare: { value: { counterOf: { unit: eventSource, name: dare_paid } }, atLeast: 30 } }
                    then:
                      - { op: removeEffect, from: eventSource, effect: taunt }

