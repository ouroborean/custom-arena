# The 30 Prism (Ice + Holy) variants, from the "Fusion Spec Kits" design doc.
# Refract: half strength (rounded down to 5) on one more random unit on the target's side, skipped
# while the user has Lens. Lens is gained until the next skill (macro `gain_lens` on `it`).

strike.prism:
  archetype: Strike
  element: Prism
  name: Glintstrike
  description: >-
    Deals 20 damage to target enemy. Refract; if the refracted hit lands on a Frostbitten enemy, it's
    full strength.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { has: { unit: actor, effect: lens } }
      then:
        - { op: damage, to: primary, amount: 20 }
      else:
        - { op: damage, to: primary, amount: 20 }
        - op: forEach
          in: { randomEnemy: 1, exclude: primary }
          do:
            - { op: damage, to: it, amount: { if: { has: { unit: it, effect: frostbitten } }, then: 20, else: 10 } }

smash.prism:
  archetype: Smash
  element: Prism
  name: Lightfall
  description: >-
    Deals 20 damage to target enemy and 10 to their allies. At the start of the user's next turn, the
    light falls again: 10 more to each of them who still has a Frost debuff.
  cost: Wr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: damage, to: primaryAllies, amount: 10 }
    - op: apply
      to: primary
      duration: { raw: 2 }
      effect: &lightfall
        id: lightfall
        name: Lightfall
        kind: Debuff
        element: Prism
        description: At the start of the applier's next turn, 10 damage if the bearer still has a Frost debuff.
        onExpire:
          - op: if
            cond:
              or:
                - { has: { unit: bearer, effect: frostbitten } }
                - { has: { unit: bearer, effect: chilled } }
                - { has: { unit: bearer, effect: numb } }
                - { has: { unit: bearer, effect: snowbound } }
            then:
              - { op: damage, to: bearer, amount: 10 }
    - { op: apply, to: primaryAllies, duration: { raw: 2 }, effect: *lightfall }

charge.prism:
  archetype: Charge
  element: Prism
  name: Lightspeed
  description: Deals 15 damage to target enemy. The user's next skill costs nothing, but its cooldown is 2 turns longer.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: actor
      until: { skillUsed: {} }
      effect:
        id: lightspeed
        name: Lightspeed
        kind: Buff
        element: Prism
        description: The bearer's next skill costs nothing, but its cooldown is 2 turns longer.
        modifiers:
          - { mod: freeSkills }
          - { mod: cooldownOnUse, amount: 2 }

riposte.prism:
  archetype: Riposte
  element: Prism
  name: Spectrum Ward
  description: >-
    For 1 turn, counters the first Harmful skill used on the user, which Refracts instead: a random ally
    of its user takes 15 damage. Invisible.
  cost: A
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: spectrum_ward
        name: Spectrum Ward
        kind: Buff
        element: Prism
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer and refracts it onto an ally of its user.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: damage, to: { randomEnemy: 1, exclude: eventSource }, amount: 15 }

rage.prism:
  archetype: Rage
  element: Prism
  name: Burning Glass
  description: >-
    For 3 turns, the user is Anointed, and gains Lens each time they damage the enemy they damaged on
    their previous turn.
  cost: I
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: anointed, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: burning_glass
        name: Burning Glass
        kind: Buff
        element: Prism
        description: Damaging the same enemy as on the bearer's previous turn grants Lens.
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventTarget, effect: burning_glass_focus } }
                then:
                  - { op: forEach, in: bearer, do: [{ op: macro, id: gain_lens }] }
              - { op: removeEffect, from: allEnemies, effect: burning_glass_focus }
              - op: apply
                to: eventTarget
                duration: { raw: 3 }
                effect:
                  id: burning_glass_focus
                  name: Focused
                  kind: Debuff
                  element: Prism
                  description: The Burning Glass is focused on the bearer.

shot.prism:
  archetype: Shot
  element: Prism
  name: Glint Shot
  description: Deals 15 damage to target enemy. If they use a Helpful skill on their next turn, they're Numb for 2 turns afterward.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      duration: { raw: 2 }
      effect:
        id: glint_shot
        name: Glint
        kind: Debuff
        element: Prism
        description: A Helpful skill on the bearer's next turn Numbs them for 2 turns.
        triggers:
          - on: skillResolved
            when: { harmful: false }
            consume: true
            do:
              - { op: apply, to: bearer, effect: numb, duration: { enemyTurns: 2 } }

snipe.prism:
  archetype: Snipe
  element: Prism
  name: Focal Point
  description: >-
    On the following turn, deals 50 Piercing damage to target enemy. If it kills them, the damage left
    over Refracts to a random ally of theirs at full strength. The target of this skill is invisible.
    Channeled.
  cost: Arr
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: focal_point
        name: Focal Point (aiming)
        kind: Neutral
        element: Prism
        visibility: hiddenTarget
        interruptible: true
        description: Strikes its target at the end of the following turn; overkill refracts to an ally of theirs.
        onExpire:
          - op: forEach
            in: effectTargets
            do:
              - { op: set, var: before, value: { hp: it } }
              - { op: damage, to: it, amount: 50, type: Piercing }
              - op: if
                cond: { compare: { value: { sum: [50, { mul: [-1, { var: before }] }] }, atLeast: 1 } }
                then:
                  - { op: damage, to: { randomEnemy: 1, exclude: it }, amount: { sum: [50, { mul: [-1, { var: before }] }] }, type: Piercing }

trap.prism:
  archetype: Trap
  element: Prism
  name: Standing Decree
  description: >-
    For 3 turns, target enemy is Condemned; each time it triggers, it returns at the end of the user's
    next turn. Invisible.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: condemned }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: standing_decree
        name: Standing Decree
        kind: Debuff
        element: Prism
        visibility: hidden
        description: The bearer's Condemnation returns at the end of each of the applier's turns.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { not: { has: { unit: bearer, effect: condemned } } }
                then:
                  - { op: apply, to: bearer, effect: condemned }

maneuver.prism:
  archetype: Maneuver
  element: Prism
  name: Afterglow
  description: >-
    The user becomes Invulnerable for 1 turn. At the start of their next turn, the last skill they used
    before this one comes off cooldown, and their next skill costs nothing.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - { op: resetCooldown, lastUsed: true }
    - op: apply
      to: actor
      duration: { raw: 2 }
      effect:
        id: afterglow
        name: Afterglow
        kind: Buff
        element: Prism
        description: At the start of the bearer's next turn, their next skill costs nothing.
        onExpire:
          - op: apply
            to: bearer
            until: { skillUsed: {} }
            effect:
              id: afterglow_free
              name: Afterglow
              kind: Buff
              element: Prism
              description: The bearer's next skill costs nothing.
              modifiers:
                - { mod: freeSkills }

companion.prism:
  archetype: Companion
  element: Prism
  name: Lumen Elk
  description: >-
    Summons a Lumen Elk (45 HP) permanently. Antler Glow (W): target ally gains Lens. Gore (r): 15
    damage to target enemy, and Sanctified for 1 turn.
  cost: II
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: lumen_elk }

bolt.prism:
  archetype: Bolt
  element: Prism
  name: Hallowed Hoarfrost
  description: >-
    Deals 20 damage to target enemy, who is Sanctified for 2 turns. Each time that Sanctify heals
    someone, the target gains 1 turn of Chilled.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: sanctify, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: hallowed_hoarfrost
        name: Hallowed Hoarfrost
        kind: Debuff
        element: Prism
        description: Each direct hit on the Sanctified bearer gives them 1 turn of Chilled.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - op: if
                cond: { has: { unit: bearer, effect: sanctify } }
                then:
                  - op: if
                    cond: { has: { unit: bearer, effect: chilled } }
                    then: [{ op: extendEffects, on: bearer, effects: [chilled], by: 2 }]
                    else: [{ op: apply, to: bearer, effect: chilled, duration: { enemyTurns: 1 } }]

blast.prism:
  archetype: Blast
  element: Prism
  name: Colorless Nova
  description: Deals 25 Piercing damage to all enemies. Each of them loses a Buff.
  cost: IA
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25, type: Piercing }
    - { op: removeRandom, from: targets, kind: Buff }

consume.prism:
  archetype: Consume
  element: Prism
  name: Harvest of Grace
  description: >-
    Deals 5 damage to target enemy. Every Sanctify on the enemy side ends, and the user heals 15 for each;
    if there were none, the target is Sanctified for 2 turns.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - { op: set, var: graces, value: { count: { effects: [sanctify], in: allEnemies } } }
    - op: if
      cond: { compare: { value: { var: graces }, atLeast: 1 } }
      then:
        - { op: removeEffect, from: allEnemies, effect: sanctify }
        - { op: heal, to: actor, amount: { mul: [15, { var: graces }] } }
      else:
        - { op: apply, to: primary, effect: sanctify, duration: { enemyTurns: 2 } }

summon.prism:
  archetype: Summon
  element: Prism
  name: Hovering Prism
  description: >-
    Summons a Hovering Prism (10 HP) for 3 turns. While it stands, the user's direct hits Refract to a
    random other enemy at half strength.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: hovering_prism, duration: { enemyTurns: 3 } }

channel.prism:
  archetype: Channel
  element: Prism
  name: Dispersion
  description: >-
    For 3 turns, at the end of each of the user's turns, deals 10 damage to target enemy, who is
    Sanctified for 1 turn; it Refracts to 1 more enemy each turn (5 damage and Sanctify). Channeled.
  cost: I
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: enemy
  ops:
    - { op: setCounter, name: dispersion, value: 0 }
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 3 }
      effect:
        id: dispersion
        name: Dispersion
        kind: Neutral
        element: Prism
        interruptible: true
        description: Each turn, 10 damage and Sanctify on the target, refracting to one more enemy each time.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: effectTargets, amount: 10 }
              - { op: apply, to: effectTargets, effect: sanctify, duration: { enemyTurns: 1 } }
              - { op: setCounter, name: dispersion, value: { sum: [{ counter: dispersion }, 1] } }
              - op: repeat
                times: { counter: dispersion }
                do:
                  - op: forEach
                    in: { randomEnemy: 1, exclude: effectTargets }
                    do:
                      - { op: damage, to: it, amount: 5 }
                      - { op: apply, to: it, effect: sanctify, duration: { enemyTurns: 1 } }

stab.prism:
  archetype: Stab
  element: Prism
  name: Focused Needle
  description: >-
    Deals 10 damage to target enemy, or 20 if they're Condemned or Frostbitten. If it deals only 10, the
    user gains Lens.
  cost: A
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { or: [{ has: { unit: primary, effect: condemned } }, { has: { unit: primary, effect: frostbitten } }] }
      then:
        - { op: damage, to: primary, amount: 20 }
      else:
        - { op: damage, to: primary, amount: 10 }
        - { op: forEach, in: actor, do: [{ op: macro, id: gain_lens }] }

ravage.prism:
  archetype: Ravage
  element: Prism
  name: Cold Crusade
  description: >-
    Deals 20 Piercing damage to target enemy and every other Condemned enemy. Any it hits above 75 HP are
    Condemned afterward.
  cost: Wr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20, type: Piercing }
    - { op: damage, to: { filter: allEnemies, exclude: primary, where: { has: { unit: it, effect: condemned } } }, amount: 20, type: Piercing }
    - op: if
      cond: { hpAbove: { unit: primary, value: 75 } }
      then: [{ op: apply, to: primary, effect: condemned }]

mislead.prism:
  archetype: Mislead
  element: Prism
  name: Caught Light
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered, and every unit it targeted gains
    Lens. Invisible.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: caught_light
        name: Caught Light
        kind: Debuff
        element: Prism
        visibility: hidden
        description: The bearer's next Harmful skill is countered, and its targets gain Lens.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: forEach, in: eventTargets, do: [{ op: macro, id: gain_lens }] }

stun.prism:
  archetype: Stun
  element: Prism
  name: Shattering Awe
  description: >-
    Deals 10 damage to target enemy. If they have Frost debuffs, those all end, and they're Stunned for 1
    turn and Condemned for 1 turn per Frost debuff ended; otherwise they're Frostbitten for 1 turn.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: set, var: awe, value: { count: { effects: [frostbitten, chilled, numb, frostfire, snowbound], in: primary } } }
    - op: if
      cond: { compare: { value: { var: awe }, atLeast: 1 } }
      then:
        - { op: removeEffect, from: primary, effect: frostbitten }
        - { op: removeEffect, from: primary, effect: chilled }
        - { op: removeEffect, from: primary, effect: numb }
        - { op: removeEffect, from: primary, effect: frostfire }
        - { op: removeEffect, from: primary, effect: snowbound }
        - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 1 } }
        - { op: apply, to: primary, effect: condemned, duration: { enemyTurns: { var: awe } } }
      else:
        - { op: apply, to: primary, effect: frostbitten, duration: { enemyTurns: 1 } }

dance.prism:
  archetype: Dance
  element: Prism
  name: Halo of Ice
  description: >-
    For 3 turns, the user is Immune and gains Lens at the start of each of their turns. While they have
    Lens, they're Invulnerable.
  cost: AI
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: halo_of_ice
        name: Halo of Ice
        kind: Buff
        element: Prism
        description: Gains Lens at the start of each of the bearer's turns; Invulnerable while they have Lens.
        modifiers:
          - { mod: untargetable, by: enemies, bypassable: true, if: { has: { unit: actor, effect: lens } } }
          - { mod: blockIndirectDamage, if: { has: { unit: actor, effect: lens } } }
        triggers:
          - on: turnStart
            do:
              - { op: forEach, in: bearer, do: [{ op: macro, id: gain_lens }] }

heal.prism:
  archetype: Heal
  element: Prism
  name: Diffused Light
  description: Target ally heals 40. It Refracts to the ally with the least HP (if another) for 20.
  cost: Wr
  cooldown: 3
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 40 }
    - op: if
      cond: { not: { has: { unit: actor, effect: lens } } }
      then:
        - { op: heal, to: { filter: weakestAlly, exclude: primary, where: { kind: { unit: it, is: character } } }, amount: 20 }

bless.prism:
  archetype: Bless
  element: Prism
  name: Lens of Favor
  description: Target ally is Anointed until the end of their next turn; if they already were, they also gain Lens.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: if
      cond: { has: { unit: primary, effect: anointed } }
      then:
        - { op: forEach, in: primary, do: [{ op: macro, id: gain_lens }] }
    - { op: apply, to: primary, effect: anointed, duration: { ownTurns: 1 } }

curse.prism:
  archetype: Curse
  element: Prism
  name: Split Verdict
  description: >-
    Target enemy is Condemned until the end of the user's next turn. It Refracts as Sanctify: a random
    ally of theirs is Sanctified for as long.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: condemned, duration: { raw: 3 } }
    - op: if
      cond: { not: { has: { unit: actor, effect: lens } } }
      then:
        - { op: apply, to: { randomEnemy: 1, exclude: primary }, effect: sanctify, duration: { raw: 3 } }

smite.prism:
  archetype: Smite
  element: Prism
  name: Glacial Rebuke
  description: >-
    Deals 20 damage to target enemy, who is Sanctified for 1 turn. The first ally who damages them before
    then gains Lens.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: sanctify, duration: { enemyTurns: 1 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: glacial_rebuke
        name: Glacial Rebuke
        kind: Debuff
        element: Prism
        description: The first of the applier's allies to damage the bearer gains Lens.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            consume: true
            do:
              - { op: forEach, in: eventSource, do: [{ op: macro, id: gain_lens }] }

prayer.prism:
  archetype: Prayer
  element: Prism
  name: Beacon of Mercy
  description: >-
    All allies heal 20 and gain 10 Shield for 1 turn. Then the unit with the least HP on the field,
    whichever side, heals 40 more.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - { op: apply, to: targets, effect: shield, value: 10, duration: { enemyTurns: 1 } }
    - op: if
      cond: { compare: { value: { sum: [{ hp: weakestEnemy }, { mul: [-1, { hp: weakestAlly }] }] }, atMost: -1 } }
      then:
        - { op: heal, to: weakestEnemy, amount: 40 }
      else:
        - { op: heal, to: weakestAlly, amount: 40 }

cleave.prism:
  archetype: Cleave
  element: Prism
  name: Split Beam
  description: >-
    Deals 20 damage to target enemy and 10 to a random other enemy. The first of them to use a skill
    afterward is Chilled for 2 turns.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: damage, to: it, amount: 10 }
        - { op: apply, to: it, duration: { enemyTurns: 2 }, effect: &split_beam { id: split_beam, name: Split Beam, kind: Debuff, element: Prism, description: "The first of the two to use a skill is Chilled for 2 turns.", triggers: [{ on: skillUsed, do: [{ op: apply, to: bearer, effect: chilled, duration: { enemyTurns: 2 } }, { op: removeEffect, from: allEnemies, effect: split_beam }] }] } }
    - { op: apply, to: primary, duration: { enemyTurns: 2 }, effect: *split_beam }

shout.prism:
  archetype: Shout
  element: Prism
  name: Harsh Light
  description: Every ally gains Lens. Every Frostbitten or Sanctified enemy is Condemned for 1 turn.
  cost: W
  cooldown: 3
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: forEach, in: targets, do: [{ op: macro, id: gain_lens }] }
    - op: apply
      to: { filter: allEnemies, where: { or: [{ has: { unit: it, effect: frostbitten } }, { has: { unit: it, effect: sanctify } }] } }
      effect: condemned
      duration: { enemyTurns: 1 }

withstand.prism:
  archetype: Withstand
  element: Prism
  name: Ice Aegis
  description: >-
    The user gains 25 Shield for 2 turns. When it breaks, they gain Lens, and Immune for 1 turn if they're
    Anointed.
  cost: r
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      value: 25
      duration: { enemyTurns: 2 }
      effect:
        id: ice_aegis
        name: Ice Aegis
        kind: Buff
        element: Prism
        shield: true
        description: A Shield; when it breaks, the bearer gains Lens.
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: ice_aegis_watch
        name: Ice Aegis
        kind: Buff
        element: Prism
        description: When the Ice Aegis breaks, the bearer gains Lens (and Immune if Anointed).
        triggers:
          - on: ownEffectEnded
            when: { effects: [ice_aegis], reason: [depleted] }
            consume: true
            do:
              - { op: forEach, in: bearer, do: [{ op: macro, id: gain_lens }] }
              - op: if
                cond: { has: { unit: bearer, effect: anointed } }
                then: [{ op: apply, to: bearer, effect: immune, duration: { enemyTurns: 1 } }]

taunt.prism:
  archetype: Taunt
  element: Prism
  name: Frozen Gleam
  description: >-
    Target enemy is Taunted by the user for 2 turns. Refract: a random ally of theirs is Taunted by the
    user too.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: if
      cond: { not: { has: { unit: actor, effect: lens } } }
      then:
        - { op: apply, to: { randomEnemy: 1, exclude: primary, where: { kind: { unit: it, is: character } } }, effect: taunt, duration: { enemyTurns: 2 } }

titan.prism:
  archetype: Titan
  element: Prism
  name: Colossus of Light
  description: >-
    For 3 turns, the user gains 1 Armor and Immune. Half of each direct hit on them Refracts away,
    striking a random enemy instead.
  cost: Ir
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: armor, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: colossus_of_light
        name: Colossus of Light
        kind: Buff
        element: Prism
        description: Half of each direct hit on the bearer refracts away onto a random enemy.
        modifiers:
          - { mod: damageTaken, amount: 0, mul: 0.5, when: { direct: true } }
        triggers:
          - on: damaged
            when: { direct: true, byEnemy: true }
            do:
              - { op: damage, to: { randomEnemy: 1 }, amount: { eventAmount: true }, direct: false }

