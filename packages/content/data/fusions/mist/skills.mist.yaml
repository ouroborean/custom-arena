# The 30 Mist (Water + Wind) variants, from the "Fusion Spec Kits" design doc.
# Fog (the `fogged` modifier) redirects enemy single-target skills to a random unit of the bearer's
# side; a redirect onto someone else sends `fog_redirect` and stamps the Fogged unit's
# `fog_redirect_turn` counter.

strike.mist:
  archetype: Strike
  element: Mist
  name: Veiled Strike
  description: >-
    Deals 15 damage to target enemy, and the user gains Fog for 1 turn. This Fog condenses on that enemy
    instead of the user: when it ends, they take 15 damage, or 25 if it redirected a skill.
  cost: I
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: veiled_strike
        name: Fog
        kind: Buff
        element: Mist
        countsAs: [fog]
        description: Fog that condenses on the struck enemy instead of into Renew; 25 damage if it redirected a skill, else 15.
        modifiers:
          - { mod: fogged }
        triggers:
          - on: signal
            signal: fog_redirect
            when: { side: ally }
            do:
              - op: if
                cond: { isActor: eventSource }
                then: [{ op: setFlag, flag: redirected }]
        onExpire:
          - { op: damage, to: effectTargets, amount: { if: { flag: redirected }, then: 25, else: 15 } }

smash.mist:
  archetype: Smash
  element: Mist
  name: Gale Spindle
  description: >-
    Deals 20 damage to target enemy and 10 to their allies. The user spends all their Swiftness; each
    stack spent adds 10 to every hit.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: set, var: gale, value: { mul: [10, { totalStacks: { in: actor, effect: swiftness } }] } }
    - { op: removeEffect, from: actor, effect: swiftness }
    - { op: damage, to: primary, amount: { sum: [20, { var: gale }] } }
    - { op: damage, to: primaryAllies, amount: { sum: [10, { var: gale }] } }

charge.mist:
  archetype: Charge
  element: Mist
  name: Mistwalk
  description: >-
    Deals 10 damage to target enemy, and the user's afterimage lingers beside them in the mist until the end
    of the user's next turn. The next time the user deals direct damage to another enemy with a skill, the
    afterimage strikes too: target enemy takes as much (max 25).
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: actor
      remember: primary
      duration: { ownTurns: 1 }
      effect:
        id: mistwalk
        name: Afterimage
        kind: Buff
        element: Mist
        description: The next direct hit the bearer's skills land on another enemy is echoed onto the enemy beside the afterimage (max 25).
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { not: { eventTargetIs: effectTargets } }
                then:
                  - op: damage
                    to: effectTargets
                    amount: { if: { compare: { value: { eventAmount: true }, atLeast: 25 } }, then: 25, else: { eventAmount: true } }
                  - { op: removeSelf }

riposte.mist:
  archetype: Riposte
  element: Mist
  name: Fogbank
  description: >-
    For 1 turn, the user has Fog and counters the first Harmful skill used on them or on any Fogged ally.
    Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - { op: apply, to: actor, effect: fog, duration: { enemyTurns: 1 } }
    - op: apply
      to: { filter: allAllies, where: { has: { unit: it, effect: fog } } }
      duration: { enemyTurns: 1 }
      effect:
        id: fogbank
        name: Fogbank
        kind: Buff
        element: Mist
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer (or on any other Fogbanked ally).
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - { op: removeEffect, from: allAllies, effect: fogbank }

rage.mist:
  archetype: Rage
  element: Mist
  name: Riptide Fury
  description: >-
    For 3 turns, the user begins Rushing and gains 1 Might; at the end of each of their turns they're
    still Rushing, they gain 2 Renew.
  cost: S
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: rushing }
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: riptide_fury
        name: Riptide Fury
        kind: Buff
        element: Mist
        description: Each turn the bearer ends Rushing, they gain 2 Renew.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { has: { unit: bearer, effect: rushing } }
                then: [{ op: apply, to: bearer, effect: renew, stacks: 2 }]

shot.mist:
  archetype: Shot
  element: Mist
  name: Dew Shot
  description: >-
    Fired blind into the fog, the shot lands on a random enemy instead: 20 damage, or 10 if that's target
    enemy after all.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: forEach
      in: { randomEnemy: 1 }
      do:
        - { op: damage, to: it, amount: { if: { isPrimary: it }, then: 10, else: 20 } }

snipe.mist:
  archetype: Snipe
  element: Mist
  name: Mistpiercer
  description: >-
    On the following turn, deals 45 damage to target enemy. The user has Fog while it channels; if a hit
    lands on them anyway, the shot deals 15 less. The target of this skill is invisible. Channeled.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: mistpiercer
        name: Mistpiercer (aiming)
        kind: Neutral
        element: Mist
        visibility: hiddenTarget
        interruptible: true
        description: Strikes its target at the end of the following turn; 15 less if the bearer was hit.
        triggers:
          - on: damaged
            do:
              - { op: setFlag, flag: hit }
        onExpire:
          - { op: damage, to: effectTargets, amount: { if: { flag: hit }, then: 30, else: 45 } }
    - { op: apply, to: actor, effect: fog, duration: { enemyTurns: 1 }, linkTo: mistpiercer }

trap.mist:
  archetype: Trap
  element: Mist
  name: Choking Fog
  description: >-
    For 3 turns, the first time target enemy uses a single-target Harmful skill, it hits a random unit on
    its target's side instead, and they gain 1 Confusion. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: choking_fog
        name: Choking Fog
        kind: Debuff
        element: Mist
        visibility: hidden
        description: The bearer's skills strike a random unit until their first Harmful one, which also Confuses them.
        modifiers:
          - { mod: randomPrimaryTarget }
        triggers:
          - on: skillUsed
            when: { harmful: true }
            consume: true
            do:
              - { op: apply, to: bearer, effect: confusion, duration: { enemyTurns: 2 } }

maneuver.mist:
  archetype: Maneuver
  element: Mist
  name: Dissipate
  description: >-
    The user gains Fog for 1 turn. The first time it sends a skill elsewhere, they dissipate into the mist:
    they become Invulnerable for 1 turn.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: fog, duration: { enemyTurns: 1 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: dissipate
        name: Dissipate
        kind: Buff
        element: Mist
        description: The first skill the bearer's Fog redirects away from them makes them Invulnerable for 1 turn.
        triggers:
          - on: signal
            signal: fog_redirect
            when: { side: ally }
            do:
              - op: if
                cond: { isActor: eventSource }
                then:
                  - { op: apply, to: bearer, effect: invulnerable, duration: { enemyTurns: 1 } }
                  - { op: removeSelf }

companion.mist:
  archetype: Companion
  element: Mist
  name: Mist Heron
  description: >-
    Summons a Mist Heron (35 HP) permanently. It always has Fog. Spear Beak (r): 15 damage to target
    enemy, +10 if they're Immobile.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: mist_heron }

bolt.mist:
  archetype: Bolt
  element: Mist
  name: Burst Spring
  description: Deals 20 damage to target enemy. Every ally's Renew heals once now, without losing a stack.
  cost: I
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: forEach
      in: { filter: allAllies, where: { has: { unit: it, effect: renew } } }
      do:
        - { op: heal, to: it, amount: { mul: [5, { totalStacks: { in: it, effect: renew } }] } }

blast.mist:
  archetype: Blast
  element: Mist
  name: Drowning Squall
  description: >-
    Deals 20 damage to all enemies. For 2 turns, each Confusion an enemy gains comes with 1 Intimidated for
    as long.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 20 }
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: drowning_squall
        name: Drowning Squall
        kind: Debuff
        element: Mist
        description: Each Confusion the bearer gains comes with 1 Intimidated for as long.
        triggers:
          - on: effectGained
            effect: confusion
            do:
              - { op: apply, to: bearer, effect: intimidated, duration: { sameAsEvent: true } }

consume.mist:
  archetype: Consume
  element: Mist
  name: Condensation
  description: >-
    Deals 5 damage to target enemy, healing the user for it. If that enemy was healed since the user's last
    turn, the user heals 20 more.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - op: heal
      to: actor
      amount:
        sum:
          - { lastDamage: true }
          - if:
              and:
                - { compare: { value: { counterOf: { unit: primary, name: healed_turn } }, atLeast: 1 } }
                - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counterOf: { unit: primary, name: healed_turn } }] }] }, atMost: 2 } }
            then: 20
            else: 0

summon.mist:
  archetype: Summon
  element: Mist
  name: Mist Double
  description: >-
    Summons a Mist Double of the user for 2 turns. The first enemy single-target Harmful skill aimed at the
    user strikes the Double instead. The Double can't be hurt, but any enemy Harmful skill that strikes it
    bursts it: it's destroyed, and that skill's user takes 10 damage. When it fades or bursts, it falls back
    into mist around the user: they gain Fog for 1 turn.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: mist_double, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      from: lastSummoned
      bindTo: lastSummoned
      duration: { enemyTurns: 2 }
      effect:
        id: mist_double_decoy
        name: Mist Double
        kind: Buff
        element: Mist
        description: The first enemy single-target Harmful skill aimed at the bearer strikes their Mist Double instead.
        modifiers:
          - { mod: warded }

channel.mist:
  archetype: Channel
  element: Mist
  name: Rolling Fog
  description: >-
    For up to 2 turns, at the end of each of the user's turns, deals 10 damage to all enemies. All allies
    have Fog while it lasts, and enemies whose skills it redirects gain 1 Confusion. Channeled.
  cost: II
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: rolling_fog
        name: Rolling Fog
        kind: Neutral
        element: Mist
        interruptible: true
        description: Each turn, 10 damage to all enemies; enemies whose skills the Fog redirects are Confused.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: allEnemies, amount: 10 }
          - on: signal
            signal: fog_redirect
            when: { side: ally }
            do:
              - { op: apply, to: eventTarget, effect: confusion, duration: { enemyTurns: 2 } }
    - { op: apply, to: allAllies, effect: fog, duration: { enemyTurns: 2 }, linkTo: rolling_fog }

stab.mist:
  archetype: Stab
  element: Mist
  name: Whisper Knife
  description: >-
    Deals 10 damage to target enemy, and the knife waits in the fog until the user's next turn: the first
    time an ally of the user deals that enemy direct damage while they're at or below 60 HP, it strikes too,
    for 15 more.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: whisper_knife
        name: Whisper Knife
        kind: Debuff
        element: Mist
        description: The first direct hit from the applier's side while the bearer is at or below 60 HP brings 15 more damage.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 60 } }
                then:
                  - { op: damage, to: bearer, amount: 15 }
                  - { op: removeSelf }

ravage.mist:
  archetype: Ravage
  element: Mist
  name: Undertow Thrust
  description: >-
    Deals 25 Piercing damage to target enemy, +5 per Renew the user has (max 20). Then the user loses all
    Renew and Leaps.
  cost: A
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: damage
      to: primary
      type: Piercing
      amount:
        sum:
          - 25
          - if: { compare: { value: { totalStacks: { in: actor, effect: renew } }, atLeast: 4 } }
            then: 20
            else: { mul: [5, { totalStacks: { in: actor, effect: renew } }] }
    - { op: removeEffect, from: actor, effect: renew }
    - { op: forEach, in: actor, do: [{ op: macro, id: leap }] }

mislead.mist:
  archetype: Mislead
  element: Mist
  name: Lost in the Fog
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered. If it was aimed at a single unit, the
    fog carries it onto a random one of their own allies instead (if they have any). Invisible.
  cost: I
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: lost_in_the_fog
        name: Lost in the Fog
        kind: Debuff
        element: Mist
        visibility: hidden
        description: The bearer's next Harmful skill is countered; a single-target one lands on a random ally of theirs instead.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            do:
              - op: if
                cond: { eventSkill: { single: true } }
                then:
                  - { op: castSkill, eventSkill: true, on: randomBearerAlly }

stun.mist:
  archetype: Stun
  element: Mist
  name: Squall in the Fog
  description: A random enemy takes 15 damage and is Stunned for 2 turns.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - op: forEach
      in: { randomEnemy: 1 }
      do:
        - { op: damage, to: it, amount: 15 }
        - { op: apply, to: it, effect: stun, duration: { enemyTurns: 2 } }

dance.mist:
  archetype: Dance
  element: Mist
  name: Rain Dance
  description: >-
    For 4 turns, the user has Fog, and each time it redirects a skill, they gain 1 Swiftness and 1 Focus.
  cost: Ar
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: fog, duration: { enemyTurns: 4 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: rain_dance
        name: Rain Dance
        kind: Buff
        element: Mist
        description: Each skill the bearer's Fog redirects gives them 1 Swiftness and 1 Focus.
        triggers:
          - on: signal
            signal: fog_redirect
            when: { side: ally }
            do:
              - op: if
                cond: { isActor: eventSource }
                then:
                  - { op: apply, to: bearer, effect: swiftness, duration: { enemyTurns: 2 } }
                  - { op: apply, to: bearer, effect: focus, until: { skillUsed: {} } }

heal.mist:
  archetype: Heal
  element: Mist
  name: Morning Dew
  description: Target ally heals 20. If they have Fog, it condenses now, giving them 4 Renew instead of 2.
  cost: A
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 20 }
    - op: if
      cond: { has: { unit: primary, effect: fog, exact: true } }
      then:
        - { op: removeEffect, from: primary, effect: fog }
        - { op: apply, to: primary, effect: renew, stacks: 4 }

bless.mist:
  archetype: Bless
  element: Mist
  name: Cloak of Mist
  description: Target ally gains 1 Renew, and has Fog for 3 turns or until they use a Harmful skill.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: renew }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      until: { skillUsed: { harmful: true } }
      effect:
        id: cloak_of_mist
        name: Cloak of Mist
        kind: Buff
        element: Mist
        description: The bearer has Fog until they use a Harmful skill.
        modifiers:
          - { mod: fogged }

curse.mist:
  archetype: Curse
  element: Mist
  name: Heavy Air
  description: >-
    Target enemy counts as Immobile for 2 turns, whatever skills or buffs they have, and gains 1 Weakness.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: heavy_air
        name: Heavy Air
        kind: Debuff
        element: Mist
        countsAs: [low_ceiling]
        description: The bearer counts as Immobile.
    - { op: apply, to: primary, effect: weakness, duration: { enemyTurns: 2 } }

smite.mist:
  archetype: Smite
  element: Mist
  name: Dewfall Ring
  description: >-
    Deals 20 damage to target enemy. For 2 turns, whenever they deal direct damage to one of the user's
    allies, that ally gains Fog for 1 turn.
  cost: I
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: dewfall_ring
        name: Dewfall Ring
        kind: Debuff
        element: Mist
        description: Each of the applier's allies the bearer deals direct damage to gains Fog for 1 turn.
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - { op: apply, to: eventTarget, effect: fog, duration: { enemyTurns: 1 } }

prayer.mist:
  archetype: Prayer
  element: Mist
  name: Mercy of the Mist
  description: >-
    All allies heal 15 and gain Fog for 1 turn that doesn't condense into Renew. Instead, while it lasts,
    each skill Fog redirects heals every ally 10.
  cost: Wrr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 15 }
    - op: apply
      to: targets
      duration: { enemyTurns: 1 }
      effect:
        id: mercy_of_the_mist
        name: Fog
        kind: Buff
        element: Mist
        countsAs: [fog]
        description: Fog that doesn't condense into Renew.
        modifiers:
          - { mod: fogged }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: mercy_of_the_mist_heal
        name: Mercy of the Mist
        kind: Buff
        element: Mist
        description: Each skill Fog redirects on the bearer's side heals every ally 10.
        triggers:
          - on: signal
            signal: fog_redirect
            when: { side: ally }
            do:
              - { op: heal, to: allAllies, amount: 10 }

cleave.mist:
  archetype: Cleave
  element: Mist
  name: Mistcutter
  description: >-
    Deals 20 damage to target enemy. If the user has Fog, it condenses into the blade instead of Renew: the
    Fog ends, and every other enemy takes 15 damage. If they don't, the mist gathers: a random other enemy
    takes 10 damage, and the user gains Fog until the end of their next 2 turns.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: if
      cond: { has: { unit: actor, effect: fog, exact: true } }
      then:
        # Removed, not expired: no Renew.
        - { op: removeEffect, from: actor, effect: fog }
        - { op: damage, to: { filter: allEnemies, where: { not: { isPrimary: it } } }, amount: 15 }
      else:
        - { op: forEach, in: { randomEnemy: 1, exclude: primary }, do: [{ op: damage, to: it, amount: 10 }] }
        # Long enough to still be there when this is ready again (cooldown 1).
        - { op: apply, to: actor, effect: fog, duration: { ownTurns: 2 } }

shout.mist:
  archetype: Shout
  element: Mist
  name: Foghorn
  description: >-
    The horn echoes through the fog: 3 times, a random enemy character is Intimidated for 2 turns (it can
    be the same one).
  cost: I
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: repeat
      times: 3
      do:
        - { op: forEach, in: { randomEnemy: 1, where: { kind: { unit: it, is: character } } }, do: [{ op: apply, to: it, effect: intimidated, duration: { enemyTurns: 2 } }] }

withstand.mist:
  archetype: Withstand
  element: Mist
  name: Veil of Mist
  description: >-
    The user gains 15 Shield for 1 turn. If they have Fog, it condenses now: 15 more Shield and its 2 Renew.
  cost: r
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: if
      cond: { has: { unit: actor, effect: fog, exact: true } }
      then:
        - { op: removeEffect, from: actor, effect: fog }
        - { op: apply, to: actor, effect: shield, value: 30, duration: { enemyTurns: 1 } }
        - { op: apply, to: actor, effect: renew, stacks: 2 }
      else:
        - { op: apply, to: actor, effect: shield, value: 15, duration: { enemyTurns: 1 } }

taunt.mist:
  archetype: Taunt
  element: Mist
  name: Voice in the Fog
  description: For 2 turns, target enemy's single-target Harmful skills hit the user instead, whoever they aim at. Invisible.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: voice_in_the_fog
        name: Voice in the Fog
        kind: Debuff
        element: Mist
        visibility: hidden
        description: The bearer's single-target Harmful skills land on the applier, whoever they aim at.
        modifiers:
          - { mod: lured }

titan.mist:
  archetype: Titan
  element: Mist
  name: Marid Form
  description: >-
    For 3 turns, the user gains Immune and Fog, and their attacks spill through the mist: each of their
    skills that deals direct damage also deals 10 damage to a random enemy.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: fog, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: marid_form
        name: Marid Form
        kind: Buff
        element: Mist
        description: Each of the bearer's skills that deals direct damage also deals 10 damage to a random enemy.
        triggers:
          - on: dealtDamage
            when: { direct: true }
            do:
              - { op: setFlag, flag: hit }
          - on: skillResolved
            do:
              - op: if
                cond: { flag: hit }
                then:
                  - { op: setFlag, flag: hit, value: false }
                  - { op: damage, to: { randomEnemy: 1 }, amount: 10 }

# Minion skills.

mist_heron_spear_beak:
  archetype: Minion
  element: Mist
  name: Spear Beak
  description: Deals 15 damage to target enemy, +10 if they're Immobile.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: { if: { check: { cond: immobile, unit: it } }, then: 25, else: 15 } }
