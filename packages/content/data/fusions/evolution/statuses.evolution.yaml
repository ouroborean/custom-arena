# Evolution (Poison + Poison) statuses, from the "Fusion Spec Kits" design doc.
# Evolve isn't a status: a skill's stage is how many times its user has used it (the `timesUsed`
# value: 0 = Stage I, 1 = Stage II, 2 or more = Stage III).

telltale_venom:
  name: Telltale Venom
  kind: Debuff
  element: Evolution
  stacking: unique
  description: While the bearer has any Toxin, they count as Prey.

delirium:
  name: Delirium
  kind: Debuff
  element: Evolution
  stacking: unique
  description: Each Debuff stack on the bearer counts as 2 toward Prey.

hormesis:
  name: Hormesis
  kind: Buff
  element: Evolution
  stacking: unique
  description: Toxin on the bearer heals them for its damage instead of harming them.

# Exoskeleton (Withstand): a Shield that grows 10 at the start of each of its bearer's turns.
exoskeleton:
  name: Exoskeleton
  kind: Buff
  element: Evolution
  stacking: unique
  shield: true
  description: A Shield that gains 10 at the start of each of the bearer's turns.
  triggers:
    - on: turnStart
      do:
        - { op: growShield, to: bearer, effect: exoskeleton, amount: 10 }

parasite_host:
  name: Parasite Host
  kind: Debuff
  element: Evolution
  stacking: unique
  description: Carries a Parasite. Only this unit can target it, and it dies with them.
