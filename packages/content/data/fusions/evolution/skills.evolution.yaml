# The 30 Evolution (Poison + Poison) variants, from the "Fusion Spec Kits" design doc.
# Evolve: Stage I on the first use, II on the second, III from the third on (the `timesUsed` value),
# unless the skill says otherwise. A later stage keeps the earlier stages' changes.
# "Stage II+" below = { compare: { value: { timesUsed: true }, atLeast: 1 } }; "III" = atLeast 2.

strike.evolution:
  archetype: Strike
  element: Evolution
  name: Mutant Fang
  description: >-
    Mutates every use, I → II → III → I; each stage replaces the last. I: 20 Piercing damage to
    target enemy. II: 10 damage and 2 Toxin. III: 10 damage, and their Toxin ticks twice now.
  cost: W
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # Its own cycle (I → II → III → I), kept in a counter. Unlike other Evolve skills, a stage
    # replaces the one before it.
    - { op: set, var: stage, value: { counter: mutant_fang } }
    - op: if
      cond: { compare: { value: { var: stage }, atMost: 0 } }
      then:
        - { op: damage, to: primary, amount: 20, type: Piercing }
      else:
        - { op: damage, to: primary, amount: 10 }
    - op: if
      cond: { compare: { value: { var: stage }, atLeast: 1 } }
      then:
        - op: if
          cond: { compare: { value: { var: stage }, atLeast: 2 } }
          then:
            - op: repeat
              times: 2
              do:
                - { op: damage, to: primary, amount: { mul: [5, { stacks: { unit: primary, effect: toxin } }] }, type: Affliction, direct: false }
          else:
            - { op: apply, to: primary, effect: toxin, stacks: 2 }
    - op: setCounter
      name: mutant_fang
      value: { if: { compare: { value: { var: stage }, atLeast: 2 } }, then: 0, else: { sum: [{ var: stage }, 1] } }

smash.evolution:
  archetype: Smash
  element: Evolution
  name: Primal Stomp
  description: >-
    Deals 20 damage to target enemy, who gains 2 Toxin. The venom splashes out: each of their allies
    takes 5 damage per Toxin the target has (at most 25).
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # The splash is the target's venom, not a flat number: 10 from this stomp's own 2 Toxin.
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: toxin, stacks: 2 }
    - op: damage
      to: primaryAllies
      amount:
        if: { compare: { value: { stacks: { unit: primary, effect: toxin } }, atLeast: 5 } }
        then: 25
        else: { mul: [5, { stacks: { unit: primary, effect: toxin } }] }

charge.evolution:
  archetype: Charge
  element: Evolution
  name: Scent Trail
  description: >-
    I: 10 damage and 1 Toxin to target enemy, and the user gains 1 Focus. II: 2 Toxin instead. III: the
    scent spreads: a random other enemy gains 1 Toxin too.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: primary
      effect: toxin
      stacks: { if: { compare: { value: { timesUsed: true }, atLeast: 1 } }, then: 2, else: 1 }
    - { op: apply, to: actor, effect: focus, until: { skillUsed: {} } }
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 2 } }
      then:
        - { op: apply, to: { randomEnemy: 1, exclude: primary }, effect: toxin }

riposte.evolution:
  archetype: Riposte
  element: Evolution
  name: Molt
  description: >-
    For 1 turn. I: if the user takes direct damage, they heal 15. II: they also lose their Debuffs.
    III: the skill that hit them is countered instead. Invisible.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 2 } }
      then:
        - op: apply
          to: actor
          duration: { enemyTurns: 1 }
          effect:
            id: molt_iii
            name: Molt
            kind: Buff
            element: Evolution
            visibility: hidden
            description: Counters the first Harmful skill used on the bearer; they heal 15 and lose their Debuffs.
            triggers:
              - on: skillTargeted
                when: { harmful: true }
                intercept: counter
                consume: true
                do:
                  - { op: heal, to: bearer, amount: 15 }
                  - { op: removeKind, from: bearer, kind: Debuff }
      else:
        - op: apply
          to: actor
          duration: { enemyTurns: 1 }
          value: { timesUsed: true }
          effect:
            id: molt
            name: Molt
            kind: Buff
            element: Evolution
            visibility: hidden
            description: The first time the bearer takes direct damage, they heal 15 (and at Stage II lose their Debuffs).
            triggers:
              - on: damaged
                when: { direct: true }
                consume: true
                do:
                  - { op: heal, to: bearer, amount: 15 }
                  - op: if
                    cond: { compare: { value: { effectValue: true }, atLeast: 1 } }
                    then:
                      - { op: removeKind, from: bearer, kind: Debuff }

rage.evolution:
  archetype: Rage
  element: Evolution
  name: Apex Predator
  description: >-
    For 3 turns, the user stalks the weak: each enemy they hit is marked as Prey for 2 turns, and
    their hits deal 10 more damage to Prey.
  cost: S
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    # No Immune and no Might: the bonus is earned by marking enemies (or finding them already Prey).
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: apex_predator
        name: Apex Predator
        kind: Buff
        element: Evolution
        description: Each enemy the bearer hits is marked as Prey for 2 turns; their hits deal 10 more damage to Prey.
        modifiers:
          - { mod: damageDealt, amount: 10, when: { direct: true }, target: { check: { cond: prey, unit: it } } }
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - { op: apply, to: eventTarget, effect: prey, duration: { enemyTurns: 2 } }

shot.evolution:
  archetype: Shot
  element: Evolution
  name: Telltale Venom
  description: >-
    Deals 5 Piercing damage and 1 Toxin to target enemy. Until the end of the user's next turn,
    every enemy with any Toxin counts as Prey.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5, type: Piercing }
    - { op: apply, to: primary, effect: toxin }
    - { op: apply, to: allEnemies, effect: telltale_venom, duration: { raw: 3 } }

snipe.evolution:
  archetype: Snipe
  element: Evolution
  name: Barbed Quill
  description: >-
    On the following turn, a barbed quill lodges in target enemy for 3 turns. At the end of each of
    the user's turns, it works deeper: 10 Affliction damage, then 15, then 20. The target of this
    skill is invisible. Channeled, Uncounterable.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget, Uncounterable]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: barbed_quill
        name: Barbed Quill (aiming)
        kind: Neutral
        element: Evolution
        visibility: hiddenTarget
        interruptible: true
        description: Lodges at the end of the following turn unless interrupted.
        onExpire:
          # No hit when it lands: all its damage comes from the barb, growing while it stays in.
          - op: apply
            to: effectTargets
            duration: { enemyTurns: 3 }
            effect:
              id: barbed_quill_barb
              name: Barbed Quill
              kind: Debuff
              element: Evolution
              # Each quill is its own barb (a second cast doesn't speed up or refresh the first), and
              # its damage stops at 20.
              stacking: independent
              description: At the end of each of the applier's turns, it works deeper; 10 Affliction damage, then 15, then 20.
              triggers:
                # Stacks count the turns it has worked: 1 → 10, 2 → 15, 3 → 20.
                - on: turnEnd
                  do:
                    - { op: damage, to: bearer, amount: { if: { compare: { value: { effectStacks: true }, atLeast: 3 } }, then: 20, else: { mul: [5, { sum: [{ effectStacks: true }, 1] }] } }, type: Affliction, direct: false }
                    - { op: addStacksSelf, amount: 1 }

trap.evolution:
  archetype: Trap
  element: Evolution
  name: Nesting Pit
  description: >-
    For 3 turns, each time target enemy uses a Strategic skill, a Larva hatches on the user's side
    for 2 turns. If none has hatched when it ends, they gain 2 Toxin. Invisible.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: nesting_pit
        name: Nesting Pit
        kind: Debuff
        element: Evolution
        visibility: hidden
        stacking: merge
        description: Each Strategic skill the bearer uses hatches a Larva for the Pit's owner; if none hatches, they gain 2 Toxin when it ends.
        triggers:
          - on: skillUsed
            when: { strategic: true }
            do:
              - { op: summon, minion: larva, duration: { enemyTurns: 2 } }
              - { op: addStacksSelf, amount: 1 }
        onExpire:
          - op: if
            cond: { compare: { value: { effectStacks: true }, atMost: 1 } }
            then:
              - { op: apply, to: bearer, effect: toxin, stacks: 2 }

maneuver.evolution:
  archetype: Maneuver
  element: Evolution
  name: Slough Off
  description: >-
    The user becomes Invulnerable for 1 turn and sheds their skin: they lose all their Debuffs, and
    the last enemy who damaged them gains 1 Toxin per Debuff stack shed (at least 1, at most 3).
    Unstunnable.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic, Unstunnable]
  target: self
  ops:
    - { op: set, var: shed, value: { kindCount: { unit: actor, kind: Debuff, stacks: true } } }
    - { op: removeKind, from: actor, kind: Debuff }
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - op: apply
      to: lastAttacker
      effect: toxin
      stacks:
        if: { compare: { value: { var: shed }, atLeast: 3 } }
        then: 3
        else: { if: { compare: { value: { var: shed }, atLeast: 1 } }, then: { var: shed }, else: 1 }

companion.evolution:
  archetype: Companion
  element: Evolution
  name: Brood Parasite
  description: >-
    Summons a Parasite (20 HP) permanently, lodged in target enemy: only they can target it, and it
    dies with them. Feed (r): its host loses 10 HP, and the user's ally with the least HP heals 10.
  cost: I
  cooldown: 1
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: summon, minion: parasite }
    # From the Parasite, so it knows its own host.
    - { op: apply, to: primary, effect: parasite_host, from: lastSummoned }

bolt.evolution:
  archetype: Bolt
  element: Evolution
  name: Corrosive Glob
  description: >-
    I: 20 damage to target enemy; 1 of their Armor turns into Vulnerable. II: all of it does. III:
    their Shield dissolves too, giving 1 Toxin per 10 removed.
  cost: I
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: set
      var: corroded
      value:
        if: { compare: { value: { timesUsed: true }, atLeast: 1 } }
        then: { stacks: { unit: primary, effect: armor } }
        else: { if: { has: { unit: primary, effect: armor } }, then: 1, else: 0 }
    - op: if
      cond: { compare: { value: { var: corroded }, atLeast: 1 } }
      then:
        - { op: removeStacks, from: primary, effect: armor, amount: 1 }
        - op: if
          cond: { compare: { value: { var: corroded }, atLeast: 2 } }
          then:
            - { op: removeEffect, from: primary, effect: armor }
        - { op: apply, to: primary, effect: vulnerable, stacks: { var: corroded }, duration: { enemyTurns: 2 } }
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 2 } }
      then:
        - { op: set, var: dissolved, value: { effectValueOf: { unit: primary, effect: shield } } }
        - { op: removeShields, from: primary }
        - { op: apply, to: primary, effect: toxin, stacks: { div: [{ var: dissolved }, 10] } }

blast.evolution:
  archetype: Blast
  element: Evolution
  name: Extinction Event
  description: >-
    Deals 30 Affliction damage to every unit on both sides, minions and the user included, except
    those at or above 60 HP.
  cost: II
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: none
  ops:
    - { op: damage, to: { filter: allUnits, where: { not: { hpAbove: { unit: it, value: 59 } } } }, amount: 30, type: Affliction }

consume.evolution:
  archetype: Consume
  element: Evolution
  name: Cull the Weak
  description: >-
    Target enemy gains 3 Toxin, then all their Toxin is culled: they die if their HP is at most 5 per
    stack removed; otherwise the user heals 5 per stack.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: toxin, stacks: 3 }
    - { op: set, var: culled, value: { stacks: { unit: primary, effect: toxin } } }
    - { op: removeEffect, from: primary, effect: toxin }
    - op: if
      cond: { compare: { value: { sum: [{ hp: primary }, { mul: [-5, { var: culled }] }] }, atMost: 0 } }
      then:
        - { op: kill, to: primary }
      else:
        - { op: heal, to: actor, amount: { mul: [5, { var: culled }] } }

summon.evolution:
  archetype: Summon
  element: Evolution
  name: Larva Swarm
  description: >-
    Summons 2 Larvae (15 HP). Nibble (W): 5 Piercing damage and 1 Toxin. I: they last 3 turns. II:
    whoever kills a Larva gains 2 Toxin. III: they no longer expire.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 2 } }
      then:
        - { op: summon, minion: larva, count: 2 }
      else:
        - { op: summon, minion: larva, count: 2, duration: { enemyTurns: 3 } }
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 1 } }
      then:
        - op: apply
          to: actor
          effect:
            id: larva_venom
            name: Larva Swarm
            kind: Buff
            element: Evolution
            stacking: unique
            description: Whoever kills one of the bearer's Larvae gains 2 Toxin.
            triggers:
              - on: signal
                signal: died
                when: { side: enemy }
                do:
                  - op: if
                    cond: { minion: { unit: eventTarget, types: [larva], mine: true } }
                    then:
                      - { op: apply, to: eventSource, effect: toxin, stacks: 2 }

channel.evolution:
  archetype: Channel
  element: Evolution
  name: Plague Strain
  description: >-
    For up to 6 turns; it mutates each turn, I → II → III → I, each stage replacing the last. I: all
    enemies gain 1 Toxin. II: 10 Affliction damage to all enemies. III: each enemy with Toxin gains 1
    Weakness for 1 turn. Channeled.
  cost: Wrr
  cooldown: 5
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 6 }
      effect:
        id: plague_strain
        name: Plague Strain
        kind: Neutral
        element: Evolution
        interruptible: true
        stacking: merge
        description: Mutates each turn, I → II → III → I. I, Toxin to all enemies; II, 10 Affliction to all; III, Weakness to those with Toxin.
        triggers:
          # Its stacks are its stage: 1, 2, 3, then back to 1.
          - on: turnEnd
            do:
              - op: if
                cond: { compare: { value: { effectStacks: true }, atLeast: 3 } }
                then:
                  - { op: apply, to: { filter: allEnemies, where: { has: { unit: it, effect: toxin } } }, effect: weakness, duration: { enemyTurns: 1 } }
                  - { op: addStacksSelf, amount: -2 }
                else:
                  - op: if
                    cond: { compare: { value: { effectStacks: true }, atLeast: 2 } }
                    then:
                      - { op: damage, to: allEnemies, amount: 10, type: Affliction }
                    else:
                      - { op: apply, to: allEnemies, effect: toxin }
                  - { op: addStacksSelf, amount: 1 }

stab.evolution:
  archetype: Stab
  element: Evolution
  name: Opportunist
  description: >-
    I: 5 Piercing damage; against Prey, the user gains 1 random energy. II: 15 Piercing against
    targets at or below 40 HP. III: it executes Prey below 15 HP.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { and: [{ compare: { value: { timesUsed: true }, atLeast: 2 } }, { check: { cond: prey, unit: primary } }, { hpAtMost: { unit: primary, value: 14 } }] }
      then:
        - { op: kill, to: primary }
      else:
        - op: if
          cond: { check: { cond: prey, unit: primary } }
          then:
            - { op: gainEnergy, amount: 1 }
        - op: damage
          to: primary
          type: Piercing
          amount:
            if: { and: [{ compare: { value: { timesUsed: true }, atLeast: 1 } }, { hpAtMost: { unit: it, value: 40 } }] }
            then: 15
            else: 5

ravage.evolution:
  archetype: Ravage
  element: Evolution
  name: Envenomed Rend
  description: >-
    Tears up to 2 Toxin out of target enemy, then deals them 20 Piercing damage, Bypassing
    Invulnerable, plus 10 per Toxin torn out.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic, Bypass]
  target: enemy
  ops:
    - op: set
      var: torn
      value:
        if: { compare: { value: { stacks: { unit: primary, effect: toxin } }, atLeast: 2 } }
        then: 2
        else: { stacks: { unit: primary, effect: toxin } }
    - op: repeat
      times: { var: torn }
      do:
        - { op: removeStacks, from: primary, effect: toxin, amount: 1 }
    - op: damage
      to: primary
      amount: { sum: [20, { mul: [10, { var: torn }] }] }
      type: Piercing
      bypass: true

mislead.evolution:
  archetype: Mislead
  element: Evolution
  name: Warning Colors
  description: >-
    For 1 turn. I: if target enemy uses a Harmful skill, it's countered and they gain 1 Toxin. II: 1
    Toxin per energy it cost. III: it's visible, and any enemy's Harmful skill triggers it.
    Invisible.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 2 } }
      then:
        - op: apply
          to: allEnemies
          duration: { enemyTurns: 1 }
          effect:
            id: warning_colors_iii
            name: Warning Colors
            kind: Debuff
            element: Evolution
            visibility: public
            description: The first Harmful skill any of these enemies uses is countered, and its user gains 1 Toxin per energy it cost.
            triggers:
              - on: skillUsed
                when: { harmful: true }
                intercept: counter
                consume: true
                do:
                  - { op: apply, to: bearer, effect: toxin, stacks: { skillCost: true } }
                  - { op: removeEffect, from: allEnemies, effect: warning_colors_iii }
      else:
        - op: apply
          to: primary
          duration: { enemyTurns: 1 }
          value: { timesUsed: true }
          effect:
            id: warning_colors
            name: Warning Colors
            kind: Debuff
            element: Evolution
            visibility: hidden
            description: The bearer's first Harmful skill is countered and they gain Toxin.
            triggers:
              - on: skillUsed
                when: { harmful: true }
                intercept: counter
                consume: true
                do:
                  - op: apply
                    to: bearer
                    effect: toxin
                    stacks: { if: { compare: { value: { effectValue: true }, atLeast: 1 } }, then: { skillCost: true }, else: 1 }

stun.evolution:
  archetype: Stun
  element: Evolution
  name: Paralytic Bite
  description: >-
    Target enemy gains 2 Toxin, and the venom sets in slowly: at the end of their next turn, if they
    still have any Toxin, they're Stunned for 1 turn.
  cost: W
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: toxin, stacks: 2 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: paralytic_bite
        name: Paralytic Bite
        kind: Debuff
        element: Evolution
        description: When this ends, the bearer is Stunned for 1 turn if they still have any Toxin.
        onExpire:
          - op: if
            cond: { has: { unit: bearer, effect: toxin } }
            then:
              - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }

dance.evolution:
  archetype: Dance
  element: Evolution
  name: Adaptive Hide
  description: >-
    For 3 turns, the user gains 1 Swiftness at the start of each of their turns. Each enemy skill
    that damages them meanwhile deals 5 less to them for the rest of the match (max 15 per skill).
  cost: AA
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: adaptive_hide
        name: Adaptive Hide
        kind: Buff
        element: Evolution
        description: Gains 1 Swiftness each turn; each enemy skill that damages the bearer deals 5 less to them for the rest of the match (max 15).
        modifiers:
          - { mod: adaptiveHide }
        triggers:
          - on: turnStart
            do:
              - { op: apply, to: bearer, effect: swiftness }

heal.evolution:
  archetype: Heal
  element: Evolution
  name: Regenerate
  description: >-
    I: target ally heals 20. II: they lose their Toxin and heal 10 more per stack removed. III: the
    same healing repeats at the start of their next turn.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: set
      var: purge
      value: { if: { compare: { value: { timesUsed: true }, atLeast: 1 } }, then: { stacks: { unit: primary, effect: toxin } }, else: 0 }
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 1 } }
      then:
        - { op: removeEffect, from: primary, effect: toxin }
    - { op: set, var: amount, value: { sum: [20, { mul: [10, { var: purge }] }] } }
    - { op: heal, to: primary, amount: { var: amount } }
    - op: if
      cond: { compare: { value: { timesUsed: true }, atLeast: 2 } }
      then:
        - op: apply
          to: primary
          value: { var: amount }
          duration: { raw: 3 }
          effect:
            id: regenerate
            name: Regenerate
            kind: Buff
            element: Evolution
            description: The healing repeats at the start of the bearer's next turn.
            triggers:
              - on: turnStart
                do:
                  - { op: heal, to: bearer, amount: { effectValue: true } }
                  - { op: removeSelf }

bless.evolution:
  archetype: Bless
  element: Evolution
  name: Hormesis
  description: For 3 turns, target ally gains 1 Might, and Toxin on them heals them for its damage instead of harming them.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, duration: { enemyTurns: 3 } }
    - { op: apply, to: primary, effect: hormesis, duration: { enemyTurns: 3 } }

curse.evolution:
  archetype: Curse
  element: Evolution
  name: Delirium
  description: Target enemy gains 1 Confusion for 2 turns. Meanwhile, each Debuff stack on them counts as 2 toward Prey.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: confusion, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: delirium, duration: { enemyTurns: 2 } }

smite.evolution:
  archetype: Smite
  element: Evolution
  name: Stalking Mark
  description: >-
    Deals 15 damage to target enemy and marks them for 2 turns. The mark grows each time the user or
    an ally damages them; when it ends, they gain 1 Toxin per growth (at least 1, at most 4).
  cost: Wr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: stalking_mark
        name: Stalking Mark
        kind: Debuff
        element: Evolution
        stacking: merge
        description: Grows each time the bearer's enemies damage them; when it ends, they gain 1 Toxin per growth (1 to 4).
        triggers:
          - on: damaged
            when: { byEnemy: true, direct: true }
            silent: true
            do:
              - { op: addStacksSelf, amount: 1 }
        onExpire:
          # Stacks start at 1, so growths = stacks − 1.
          - op: apply
            to: bearer
            effect: toxin
            stacks:
              if: { compare: { value: { effectStacks: true }, atLeast: 5 } }
              then: 4
              else: { if: { compare: { value: { effectStacks: true }, atLeast: 2 } }, then: { sum: [{ effectStacks: true }, -1] }, else: 1 }

prayer.evolution:
  archetype: Prayer
  element: Evolution
  name: Symbiotic Song
  description: >-
    All enemies gain 1 Toxin. For 2 turns, each time an enemy's Toxin ticks, a random ally heals 10.
  cost: Wr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: apply, to: allEnemies, effect: toxin }
    - op: apply
      to: allEnemies
      duration: { enemyTurns: 2 }
      effect:
        id: symbiotic_song
        name: Symbiotic Song
        kind: Debuff
        element: Evolution
        description: Each time the bearer's Toxin ticks, a random ally of the singer heals 10.
        triggers:
          # Simplified: any indirect hit on the bearer while they carry Toxin counts as a tick.
          - on: damaged
            when: { direct: false }
            do:
              - op: if
                cond: { has: { unit: bearer, effect: toxin } }
                then:
                  - { op: heal, to: { randomAlly: 1 }, amount: 10 }

cleave.evolution:
  archetype: Cleave
  element: Evolution
  name: Thrashing Tail
  description: >-
    The tail lashes 4 times, each lash dealing 10 damage to a random enemy. Each enemy lashed more
    than once also gains 1 Toxin.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - op: repeat
      times: 4
      do:
        - op: forEach
          in: { randomEnemy: 1 }
          do:
            - { op: damage, to: it, amount: 10 }
            - op: apply
              to: it
              quiet: true
              effect:
                id: thrashing_tail
                name: Thrashing Tail
                kind: Neutral
                element: Evolution
                stacking: merge
                description: Lashes taken from this Thrashing Tail.
    - op: forEach
      in: { filter: allEnemies, where: { compare: { value: { stacks: { unit: it, effect: thrashing_tail } }, atLeast: 2 } } }
      do:
        - { op: apply, to: it, effect: toxin }
    - { op: removeEffect, from: allEnemies, effect: thrashing_tail }

shout.evolution:
  archetype: Shout
  element: Evolution
  name: Festering Howl
  description: >-
    The user gains 1 Toxin, then all enemies are Intimidated for 1 turn per Toxin the user has (at
    most 3).
  cost: W
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: actor, effect: toxin }
    - op: apply
      to: targets
      effect: intimidated
      duration:
        enemyTurns:
          if: { compare: { value: { stacks: { unit: actor, effect: toxin } }, atLeast: 3 } }
          then: 3
          else: { if: { compare: { value: { stacks: { unit: actor, effect: toxin } }, atLeast: 1 } }, then: { stacks: { unit: actor, effect: toxin } }, else: 1 }

withstand.evolution:
  archetype: Withstand
  element: Evolution
  name: Exoskeleton
  description: >-
    The user gains 10 Shield for 3 turns. The shell hardens as it holds: at the start of each of
    their turns, it gains 10 Shield.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: exoskeleton, value: 10, duration: { enemyTurns: 3 } }

taunt.evolution:
  archetype: Taunt
  element: Evolution
  name: Hypnotic Hood
  description: >-
    Target enemy is Taunted and counts as Prey for 2 turns. If they don't damage the user during it,
    they fall Asleep when it ends.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: prey, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: hypnotic_hood
        name: Hypnotic Hood
        kind: Debuff
        element: Evolution
        description: If the bearer doesn't damage the hood's caster before this ends, they fall Asleep.
        triggers:
          - on: dealtDamage
            do:
              - op: if
                cond: { isEventTarget: actor }
                then:
                  - { op: removeSelf }
        onExpire:
          - { op: apply, to: bearer, effect: sleep, duration: { enemyTurns: 2 } }

titan.evolution:
  archetype: Titan
  element: Evolution
  name: Chrysalis
  description: >-
    The user is Stunned and Invulnerable for 1 turn, cocooned. Then, for 3 turns, they gain 3 Armor,
    2 Might and Immune.
  cost: W
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: stun, duration: { raw: 3 } }
    - { op: apply, to: actor, effect: invulnerable, duration: { raw: 3 } }
    - op: apply
      to: actor
      duration: { raw: 3 }
      effect:
        id: chrysalis
        name: Chrysalis
        kind: Buff
        element: Evolution
        description: When the cocoon opens, the bearer gains 3 Armor, 2 Might and Immune for 3 turns.
        onExpire:
          - { op: apply, to: bearer, effect: armor, stacks: 3, duration: { enemyTurns: 3 } }
          - { op: apply, to: bearer, effect: might, stacks: 2, duration: { enemyTurns: 3 } }
          - { op: apply, to: bearer, effect: immune, duration: { enemyTurns: 3 } }

