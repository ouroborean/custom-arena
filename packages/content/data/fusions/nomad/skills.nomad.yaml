# The 30 Nomad (Wind + Earth) variants, from the "Fusion Spec Kits" design doc.
# Trek (Neutral, max 3) is kept by the Wanderer passive: it compares the skill slot used each turn with the
# one before. `gain_trek` / `reset_trek` send `trek_rose` / `trek_reset` signals.

strike.nomad:
  archetype: Strike
  element: Nomad
  name: Wayfarer's Blow
  description: Deals 15 damage to target enemy. The user spends all their Trek for 10 more per Trek spent.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: { sum: [15, { mul: [10, { stacks: { unit: actor, effect: trek } }] }] } }
    - { op: removeEffect, from: actor, effect: trek }

smash.nomad:
  archetype: Smash
  element: Nomad
  name: Dune Crash
  description: >-
    Deals 20 damage to target enemy and 10 to their allies. At 3 Trek, each one hit is also buried: they lose
    their mobility buffs and are Isolated for 1 turn.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: damage, to: primaryAllies, amount: 10 }
    - op: if
      cond: { compare: { value: { stacks: { unit: actor, effect: trek } }, atLeast: 3 } }
      then:
        - { op: removeEffect, from: allEnemies, effect: swiftness }
        - { op: removeEffect, from: allEnemies, effect: rushing }
        - { op: removeEffect, from: allEnemies, effect: leaping }
        - { op: apply, to: allEnemies, effect: isolated, duration: { enemyTurns: 1 } }

charge.nomad:
  archetype: Charge
  element: Nomad
  name: Break Camp
  description: >-
    The user begins Rushing. If they have an allied Boulder or Seedling, they pack one up: it's removed, and
    they gain 2 Trek.
  cost: nc
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: rushing }
    - op: forEach
      in: { randomAlly: 1, where: { minion: { unit: it, types: [boulder, seedling] } } }
      do:
        - { op: kill, to: it }
        - { op: forEach, in: actor, do: [{ op: macro, id: gain_trek }, { op: macro, id: gain_trek }] }

riposte.nomad:
  archetype: Riposte
  element: Nomad
  name: Stone and Sand
  description: >-
    For 1 turn, counters the first Harmful skill used on the user; its user is Taunted for 1 turn by a Boulder
    the user creates. Invisible.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: stone_and_sand
        name: Stone and Sand
        kind: Buff
        element: Nomad
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer and Taunts its user toward a Boulder.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: summon, minion: boulder }
              - { op: apply, to: eventSource, effect: taunt, from: lastSummoned, duration: { enemyTurns: 1 } }

rage.nomad:
  archetype: Rage
  element: Nomad
  name: Wanderlust
  description: >-
    For 3 turns, the user is Immune, and each time their Trek rises they gain 1 Might, which lasts until their
    Trek next resets.
  cost: W
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: wanderlust
        name: Wanderlust
        kind: Buff
        element: Nomad
        description: Each Trek gained also gives 1 Might until the Trek resets.
        triggers:
          - on: signal
            signal: trek_rose
            when: { side: ally }
            do:
              - op: if
                cond: { isActor: eventSource }
                then:
                  - op: apply
                    to: bearer
                    effect:
                      id: wanderlust_might
                      name: Wanderlust
                      kind: Buff
                      element: Nomad
                      countsAs: [might]
                      description: +5 direct damage until the bearer's Trek resets.
                      modifiers:
                        - { mod: damageDealt, amount: 5, when: { direct: true } }
                      triggers:
                        - on: signal
                          signal: trek_reset
                          when: { side: ally }
                          do:
                            - { op: if, cond: { isActor: eventSource }, then: [{ op: removeSelf }] }

shot.nomad:
  archetype: Shot
  element: Nomad
  name: Sling Stone
  description: >-
    Deals 10 damage to target enemy, +5 for each of the user's turns since they last used it (up to +15).
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # Own turns in between = (turn - last use) / 2 - 1; never used counts as the full +15.
    - op: set
      var: windup
      value:
        if: { compare: { value: { counter: sling_turn }, atMost: 0 } }
        then: 3
        else: { sum: [{ div: [{ sum: [{ turn: true }, { mul: [-1, { counter: sling_turn }] }] }, 2] }, -1] }
    - op: damage
      to: primary
      amount: { sum: [10, { mul: [5, { if: { compare: { value: { var: windup }, atLeast: 3 } }, then: 3, else: { var: windup } }] }] }
    - { op: setCounter, name: sling_turn, value: { turn: true } }

snipe.nomad:
  archetype: Snipe
  element: Nomad
  name: Haboob
  description: >-
    On the following turn, a haboob wanders the enemy team: it strikes a random enemy 3 times, for 20, 25,
    then 30 Piercing damage, never the same enemy twice in a row; with no other enemy left to reach, it dies
    out. Channeled.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: haboob
        name: Haboob
        kind: Neutral
        element: Nomad
        interruptible: true
        description: At the end of the following turn, strikes a random enemy for 20, 25, then 30 Piercing, never the same one twice in a row.
        # Each gust marks the enemy it hit (haboob_trail) so the next one has to wander elsewhere.
        onExpire:
          - op: forEach
            in: { randomEnemy: 1 }
            do:
              - { op: damage, to: it, amount: 20, type: Piercing }
              - { op: apply, to: it, effect: haboob_trail }
          - op: forEach
            in: { randomEnemy: 1, where: { not: { has: { unit: it, effect: haboob_trail } } } }
            do:
              - { op: removeEffect, from: allEnemies, effect: haboob_trail }
              - { op: damage, to: it, amount: 25, type: Piercing }
              - { op: apply, to: it, effect: haboob_trail }
          - op: forEach
            in: { randomEnemy: 1, where: { not: { has: { unit: it, effect: haboob_trail } } } }
            do:
              - { op: damage, to: it, amount: 30, type: Piercing }
          - { op: removeEffect, from: allEnemies, effect: haboob_trail }

trap.nomad:
  archetype: Trap
  element: Nomad
  name: Sinking Sands
  description: >-
    For 3 turns, target enemy stands on sinking sands: if they use the same skill on two of their turns in a
    row, they sink at the end of the user's next turn, taking 25 damage and being Stunned for 1 turn.
    Invisible.
  cost: I
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - { op: setCounter, name: sands_seen, on: primary, value: 0 }
    - op: apply
      to: primary
      duration: { ownTurns: 3 }
      effect:
        id: sinking_sands
        name: Trap
        kind: Debuff
        element: Nomad
        visibility: hidden
        countsAs: [trap]
        description: If the bearer uses the same skill on two of their turns in a row, they sink.
        triggers:
          # Checked at the end of each of the applier's turns, looking back at the bearer's last turn.
          - on: turnEnd
            do:
              - op: if
                cond:
                  and:
                    - { compare: { value: { counterOf: { unit: bearer, name: actedTurn } }, atLeast: 1 } }
                    - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counterOf: { unit: bearer, name: actedTurn } }] }] }, atLeast: 1, atMost: 1 } }
                then:
                  - op: if
                    cond:
                      and:
                        - { compare: { value: { counterOf: { unit: bearer, name: sands_seen } }, atLeast: 1 } }
                        - { compare: { value: { sum: [{ counterOf: { unit: bearer, name: lastSlot } }, { mul: [-1, { counterOf: { unit: bearer, name: sands_slot } }] }] }, atLeast: 0, atMost: 0 } }
                    then:
                      - { op: damage, to: bearer, amount: 25 }
                      - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }
                      - { op: removeSelf }
                    else:
                      - { op: setCounter, name: sands_slot, on: bearer, value: { counterOf: { unit: bearer, name: lastSlot } } }
                      - { op: setCounter, name: sands_seen, on: bearer, value: 1 }
                else:
                  - { op: setCounter, name: sands_seen, on: bearer, value: 0 }

maneuver.nomad:
  archetype: Maneuver
  element: Nomad
  name: Dune Leap
  description: >-
    The user boosts the other ally with the least HP up the dune: that ally Leaps, and the user's Trek rises
    by 1. With no other ally to boost, the user Leaps instead.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: if
      cond: { any: { in: weakestOtherAlly, cond: { kind: { unit: it, is: character } } } }
      then:
        - { op: forEach, in: weakestOtherAlly, do: [{ op: macro, id: leap }] }
        - { op: forEach, in: actor, do: [{ op: macro, id: gain_trek }] }
      else:
        - { op: forEach, in: actor, do: [{ op: macro, id: leap }] }

companion.nomad:
  archetype: Companion
  element: Nomad
  name: Pack Camel
  description: >-
    Summons a Pack Camel (50 HP) permanently; while it stands, a turn in which the user uses no skill doesn't
    reset their Trek. Kick (r): 15 damage.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: pack_camel }

bolt.nomad:
  archetype: Bolt
  element: Nomad
  name: Tent Stake
  description: >-
    Deals 20 damage to target enemy and pins them to the ground for 2 turns: they lose all their mobility
    buffs, can't gain any, and are Immobile.
  cost: I
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: macro, id: remove_mobility }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: tent_stake
        name: Pinned
        kind: Debuff
        element: Nomad
        countsAs: [low_ceiling]
        description: Immobile, and can't gain mobility buffs.
        modifiers:
          - { mod: immuneToEffects, effects: [swiftness, rushing, leaping] }

blast.nomad:
  archetype: Blast
  element: Nomad
  name: Dust Devil
  description: >-
    Deals 20 damage to all enemies; each one hit loses 1 mobility buff, and the user gains 1 Trek per buff
    removed.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 20 }
    - op: forEach
      in:
        filter: targets
        where: { or: [{ has: { unit: it, effect: rushing } }, { has: { unit: it, effect: leaping } }, { has: { unit: it, effect: swiftness } }] }
      do:
        - op: if
          cond: { has: { unit: it, effect: rushing } }
          then: [{ op: removeEffect, from: it, effect: rushing }]
          else:
            - op: if
              cond: { has: { unit: it, effect: leaping } }
              then: [{ op: removeEffect, from: it, effect: leaping }]
              else: [{ op: removeStacks, from: it, effect: swiftness, amount: 1 }]
        - { op: forEach, in: actor, do: [{ op: macro, id: gain_trek }] }

consume.nomad:
  archetype: Consume
  element: Nomad
  name: Road Toll
  description: >-
    Deals 10 damage to target enemy and sets a toll on them: the first skill they use before the user's next
    turn costs 1 more random energy, and the user heals 20 when they pay it.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: road_toll
        name: Road Toll
        kind: Debuff
        element: Nomad
        description: The bearer's next skill costs 1 more random energy; using it heals the applier 20.
        modifiers:
          - { mod: costGeneric, amount: 1 }
        triggers:
          - on: skillUsed
            consume: true
            do:
              - { op: heal, to: actor, amount: 20 }

summon.nomad:
  archetype: Summon
  element: Nomad
  name: Pack Mule
  description: >-
    Summons a Pack Mule (25 HP) for 3 turns. At the end of each of the user's turns, it stores 1 unspent energy
    (max 3); when it leaves, the user's player gets it all back.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: pack_mule, duration: { enemyTurns: 3 } }

channel.nomad:
  archetype: Channel
  element: Nomad
  name: The Long Road
  description: >-
    At the end of each of the user's turns, deals 10 damage to all enemies; it continues only while their Trek
    keeps rising, up to 4 turns. Channeled, but the user's other skills don't end it.
  cost: Ir
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - { op: setCounter, name: long_road_start, value: { turn: true } }
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: the_long_road
        name: The Long Road
        kind: Neutral
        element: Nomad
        interruptible: true
        description: Each turn, 10 damage to all enemies, while the bearer's Trek keeps rising.
        # Walking the road is the point: using skills (which raises Trek) doesn't end this channel.
        modifiers:
          - { mod: keepChannels }
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: allEnemies, amount: 10 }
              - op: if
                cond:
                  and:
                    - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counter: long_road_start }] }] }, atLeast: 1 } }
                    - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counter: trek_rose_turn }] }] }, atLeast: 1 } }
                then: [{ op: removeSelf }]

stab.nomad:
  archetype: Stab
  element: Nomad
  name: Traveler's Knife
  description: >-
    Deals 10 damage to target enemy, 15 if the user also used it on their last turn, and 20 if on their last
    two. The user digs in: repeating it breaks their stride.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # Own previous turn = turn - 2; the streak counts back-to-back uses (max 2).
    - op: if
      cond:
        and:
          - { compare: { value: { counter: knife_turn }, atLeast: 1 } }
          - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counter: knife_turn }] }] }, atMost: 2 } }
      then:
        - { op: setCounter, name: knife_streak, value: { if: { compare: { value: { counter: knife_streak }, atLeast: 2 } }, then: 2, else: { sum: [{ counter: knife_streak }, 1] } } }
      else:
        - { op: setCounter, name: knife_streak, value: 0 }
    - { op: damage, to: primary, amount: { sum: [10, { mul: [5, { counter: knife_streak }] }] } }
    - { op: setCounter, name: knife_turn, value: { turn: true } }

ravage.nomad:
  archetype: Ravage
  element: Nomad
  name: Scour
  description: >-
    The user gives up all their mobility buffs; then 25 Piercing damage to target enemy, +10 for each one given
    up.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: set, var: scoured, value: { count: { effects: [swiftness, rushing, leaping], in: actor } } }
    - { op: removeEffect, from: actor, effect: swiftness }
    - { op: removeEffect, from: actor, effect: rushing }
    - { op: removeEffect, from: actor, effect: leaping }
    - { op: damage, to: primary, type: Piercing, amount: { sum: [25, { mul: [10, { var: scoured }] }] } }

mislead.nomad:
  archetype: Mislead
  element: Nomad
  name: Mirage
  description: >-
    For 4 turns, target enemy's Harmful skills flicker: the next one is countered, the one after lands, the one
    after that is countered, and so on. Invisible.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: mirage, duration: { enemyTurns: 4 } }

stun.nomad:
  archetype: Stun
  element: Nomad
  name: Grit in the Eyes
  description: >-
    Deals 10 damage to target enemy and Stuns them for 2 turns; the grit washes out as soon as an enemy
    damages the user.
  cost: A
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: grit_in_the_eyes
        name: Stunned
        kind: Debuff
        element: Nomad
        countsAs: [stun]
        description: Cannot use skills; ends early if an enemy damages the applier.
        modifiers:
          - { mod: cannotUseSkills }
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 2 }
      effect:
        id: grit_watch
        name: Grit in the Eyes
        kind: Neutral
        element: Nomad
        description: If an enemy damages the bearer, the grit in their target's eyes washes out.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - { op: removeEffect, from: effectTargets, effect: grit_in_the_eyes }
              - { op: removeSelf }

dance.nomad:
  archetype: Dance
  element: Nomad
  name: Endless Journey
  description: For 3 turns, the user's Trek can't reset; while it's at 3, their skills cost 1 less.
  cost: AW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: endless_journey
        name: Endless Journey
        kind: Buff
        element: Nomad
        description: Trek can't reset; at 3 Trek, skills cost 1 less.
        modifiers:
          - { mod: costGeneric, amount: -1, if: { compare: { value: { stacks: { unit: actor, effect: trek } }, atLeast: 3 } } }

heal.nomad:
  archetype: Heal
  element: Nomad
  name: Waterskin
  description: >-
    Target ally heals 15, and 10 more at the end of each of their next 2 turns in which they use a skill.
  cost: A
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 15 }
    - { op: setCounter, name: waterskin_turn, on: primary, value: { turn: true } }
    - op: apply
      to: primary
      duration: { ownTurns: 2 }
      effect:
        id: waterskin
        name: Waterskin
        kind: Buff
        element: Nomad
        description: Heals 10 at the end of each of the bearer's turns in which they use a skill.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond:
                  and:
                    - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counterOf: { unit: bearer, name: waterskin_turn } }] }] }, atLeast: 1 } }
                    - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counterOf: { unit: bearer, name: actedTurn } }] }] }, atMost: 0 } }
                then: [{ op: heal, to: bearer, amount: 10 }]

bless.nomad:
  archetype: Bless
  element: Nomad
  name: Cairn Blessing
  description: >-
    Target ally gains 1 Might for 3 turns. Each time they use a mobility skill meanwhile, the user creates a
    Boulder.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: cairn_blessing
        name: Cairn Blessing
        kind: Buff
        element: Nomad
        description: Each mobility skill the bearer uses raises a Boulder for the applier.
        triggers:
          - on: skillUsed
            when: { archetypes: [Charge, Maneuver, Mislead, Dance] }
            do:
              - { op: summon, minion: boulder }

curse.nomad:
  archetype: Curse
  element: Nomad
  name: Dust in the Wind
  description: >-
    Target enemy gains 1 Confusion for 2 turns. If the user has an allied Boulder, they crumble it into the
    wind and vault off it: the target gains 1 more Confusion, and the user Leaps.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: confusion, duration: { enemyTurns: 2 } }
    - op: forEach
      in: { randomAlly: 1, where: { minion: { unit: it, types: [boulder] } } }
      do:
        - { op: kill, to: it }
        - { op: apply, to: primary, effect: confusion, duration: { enemyTurns: 2 } }
        - { op: forEach, in: actor, do: [{ op: macro, id: leap }] }

smite.nomad:
  archetype: Smite
  element: Nomad
  name: Waymarker
  description: >-
    Deals 20 damage to target enemy. Until the user's Trek next resets (up to 3 turns), allies who damage them
    heal 10.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: waymarker
        name: Waymarker
        kind: Debuff
        element: Nomad
        description: The applier's allies who damage the bearer heal 10, until the applier's Trek resets.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - { op: heal, to: eventSource, amount: 10 }
          - on: signal
            signal: trek_reset
            when: { side: enemy }
            do:
              - { op: if, cond: { isActor: eventSource }, then: [{ op: removeSelf }] }

prayer.nomad:
  archetype: Prayer
  element: Nomad
  name: Campfire Song
  description: >-
    All allies heal 15 and gain 10 Shield for 1 turn. The user makes camp: their Trek resets, and allies heal 10
    more per Trek it had.
  cost: Wrr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: set, var: camp, value: { stacks: { unit: actor, effect: trek } } }
    - { op: heal, to: targets, amount: { sum: [15, { mul: [10, { var: camp }] }] } }
    - { op: apply, to: targets, effect: shield, value: 10, duration: { enemyTurns: 1 } }
    - { op: forEach, in: actor, do: [{ op: macro, id: reset_trek }] }

cleave.nomad:
  archetype: Cleave
  element: Nomad
  name: Sweeping Sands
  description: >-
    Deals 20 damage to target enemy and buries a random other enemy in sand for up to 3 turns: the next time
    the user's Trek resets, the sand collapses on them for 30 damage.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: { randomEnemy: 1, exclude: primary }
      duration: { enemyTurns: 3 }
      effect:
        id: buried_in_sand
        name: Buried in Sand
        kind: Debuff
        element: Nomad
        description: When the applier's Trek next resets, the sand collapses on the bearer for 30 damage.
        triggers:
          - on: signal
            signal: trek_reset
            when: { side: enemy }
            do:
              - op: if
                cond: { isActor: eventSource }
                then:
                  - { op: damage, to: bearer, amount: 30 }
                  - { op: removeSelf }

shout.nomad:
  archetype: Shout
  element: Nomad
  name: Call of the Caravan
  description: >-
    For 2 turns, all enemies are left in the caravan's dust: their direct damage to anyone on the move, with
    Trek or a mobility buff, is 10 lower.
  cost: W
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: caravan_dust
        name: Caravan's Dust
        kind: Debuff
        element: Nomad
        description: Deals 10 less direct damage to units with Trek or a mobility buff.
        modifiers:
          - mod: damageDealt
            amount: -10
            when: { direct: true }
            target:
              or:
                - { has: { unit: it, effect: trek } }
                - { has: { unit: it, effect: swiftness } }
                - { has: { unit: it, effect: rushing } }
                - { has: { unit: it, effect: leaping } }

withstand.nomad:
  archetype: Withstand
  element: Nomad
  name: Rolling Dune
  description: The user gains 15 Shield for 2 turns; it grows by 10 each time their Trek rises.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: rolling_dune, value: 15, duration: { enemyTurns: 2 } }

taunt.nomad:
  archetype: Taunt
  element: Nomad
  name: Challenge in the Sand
  description: >-
    Target enemy is Taunted by the user for up to 2 turns. The first time they damage the user, the Taunt ends
    and the user Leaps away.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: challenge_in_the_sand
        name: Challenge in the Sand
        kind: Buff
        element: Nomad
        description: When the Taunted enemy first damages the bearer, their Taunt ends and the bearer Leaps.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventSource, effect: taunt, mine: true } }
                then:
                  - { op: removeEffect, from: eventSource, effect: taunt }
                  - { op: forEach, in: bearer, do: [{ op: macro, id: leap }] }
                  - { op: removeSelf }

titan.nomad:
  archetype: Titan
  element: Nomad
  name: Colossus of the Dunes
  description: >-
    For 3 turns, the user gains 3 Armor and Immune and their Trek is frozen, but they're Immobile: they lose
    their mobility buffs and can't gain any.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: armor, stacks: 3, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - { op: removeEffect, from: actor, effect: swiftness }
    - { op: removeEffect, from: actor, effect: rushing }
    - { op: removeEffect, from: actor, effect: leaping }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: dune_colossus
        name: Colossus of the Dunes
        kind: Buff
        element: Nomad
        countsAs: [low_ceiling]
        description: Trek frozen; Immobile, and can't gain mobility buffs.
        modifiers:
          - { mod: immuneToEffects, effects: [swiftness, rushing, leaping] }

