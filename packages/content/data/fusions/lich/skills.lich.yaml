# The 30 Lich (Ice + Unholy) variants, from the "Fusion Spec Kits" design doc.
# The Phylactery is a minion that keeps its creator above 0 HP while it stands (`make_phylactery`,
# `feed_phylactery`). Soulfrost yields Soul Fragments to its applier.

strike.lich:
  archetype: Strike
  element: Lich
  name: Deathchill Blade
  description: Deals 20 damage to target enemy. The enemy with the lowest HP is Soulfrosted for 2 turns.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: weakestEnemy, effect: soulfrost, duration: { enemyTurns: 2 } }

smash.lich:
  archetype: Smash
  element: Lich
  name: Winter of Souls
  description: >-
    Deals 35 damage to target enemy, who is Soulfrosted for 2 turns. Each time it yields a Soul Fragment,
    their allies take 10.
  cost: SS
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 35 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: winter_of_souls
        name: Soulfrost
        kind: Debuff
        element: Lich
        countsAs: [soulfrost]
        description: Direct damage gives the applier a Soul Fragment (once per turn), and the bearer's allies take 10.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - op: if
                cond: { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counterOf: { unit: bearer, name: soulfrost_turn } }] }] }, atLeast: 1 } }
                then:
                  - { op: setCounter, name: soulfrost_turn, on: bearer, value: { turn: true } }
                  - { op: apply, to: actor, effect: soul_fragment }
                  - { op: damage, to: { filter: allEnemies, exclude: bearer, where: { kind: { unit: it, is: character } } }, amount: 10, direct: false }

charge.lich:
  archetype: Charge
  element: Lich
  name: Chill Stride
  description: >-
    Deals 15 damage to target enemy, and the user Soulfrosts themselves for 2 turns, so enemy hits on them give
    them Soul Fragments.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: actor, effect: soulfrost, duration: { enemyTurns: 2 } }

riposte.lich:
  archetype: Riposte
  element: Lich
  name: Hidden Vessel
  description: >-
    For 1 turn, counters any Harmful skill used on the user or an allied minion, such as their
    Phylactery; its user is Soulfrosted for 2 turns. Invisible.
  cost: I
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: { filter: allAllies, where: { or: [{ isActor: it }, { kind: { unit: it, is: minion } }] } }
      duration: { enemyTurns: 1 }
      effect:
        id: hidden_vessel
        name: Hidden Vessel
        kind: Buff
        element: Lich
        visibility: hidden
        description: Counters Harmful skills used on the bearer and Soulfrosts their users.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - { op: apply, to: eventSource, effect: soulfrost, duration: { enemyTurns: 2 } }

rage.lich:
  archetype: Rage
  element: Lich
  name: Frozen Undeath
  description: For 3 turns, the user is Immortal and gains 1 Might for every 25 HP they're missing.
  cost: Sr
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immortal, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: frozen_undeath
        name: Frozen Undeath
        kind: Buff
        element: Lich
        description: 1 Might (+5 direct damage) per 25 HP the bearer is missing.
        modifiers:
          - { mod: damageDealt, amount: 0, when: { direct: true }, value: { mul: [5, { div: [{ missingHp: actor }, 25] }] } }

shot.lich:
  archetype: Shot
  element: Lich
  name: Soul Icicle
  description: >-
    Deals 15 damage to target enemy. If the user has a Soul Fragment, they spend it for 10 more, and the
    target is Soulfrosted for 2 turns.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { has: { unit: actor, effect: soul_fragment } }
      then:
        - { op: removeStacks, from: actor, effect: soul_fragment, amount: 1 }
        - { op: damage, to: primary, amount: 25 }
        - { op: apply, to: primary, effect: soulfrost, duration: { enemyTurns: 2 } }
      else:
        - { op: damage, to: primary, amount: 15 }

snipe.lich:
  archetype: Snipe
  element: Lich
  name: Death's Icicle
  description: >-
    On the following turn, deals 40 Piercing damage to target enemy. If it kills them, the user
    creates a Phylactery, or restores theirs to full. The target of this skill is invisible.
    Channeled.
  cost: AS
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: deaths_icicle
        name: Death's Icicle (aiming)
        kind: Neutral
        element: Lich
        visibility: hiddenTarget
        interruptible: true
        description: >-
          At the end of the following turn, deals 40 Piercing damage to its target. If it kills
          them, the bearer creates a Phylactery, or restores theirs to full.
        onExpire:
          - op: forEach
            in: effectTargets
            do:
              - { op: set, var: before, value: { hp: it } }
              - { op: damage, to: it, amount: 40, type: Piercing }
              - op: if
                cond: { compare: { value: { sum: [{ lastDamage: true }, { mul: [-1, { var: before }] }] }, atLeast: 0 } }
                then:
                  - { op: macro, id: make_phylactery }

trap.lich:
  archetype: Trap
  element: Lich
  name: Frozen Shackle
  description: >-
    For 3 turns, the first time target enemy uses a Harmful skill, they're Soulfrosted for 2 turns; the
    second time, they're also Stunned for 1 turn. Invisible.
  cost: II
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: frozen_shackle
        name: Frozen Shackle
        kind: Debuff
        element: Lich
        visibility: hidden
        description: The bearer's first Harmful skill Soulfrosts them; the second Stuns them too.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            do:
              - op: if
                cond: { flag: once }
                then:
                  - { op: removeSelf }
                  - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }
                else:
                  - { op: setFlag, flag: once }
                  - { op: apply, to: bearer, effect: soulfrost, duration: { enemyTurns: 2 } }

maneuver.lich:
  archetype: Maneuver
  element: Lich
  name: Retreat to the Vessel
  description: >-
    If the user has no Phylactery, they create one. They become Invulnerable until it takes damage, for up
    to 2 turns.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: if
      cond: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [phylactery], mine: true } } } }, atMost: 0 } }
      then:
        - { op: summon, minion: phylactery }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: vessel_retreat
        name: Retreat to the Vessel
        kind: Buff
        element: Lich
        description: Invulnerable until the Phylactery takes damage.
        modifiers:
          - { mod: untargetable, by: enemies, bypassable: true }
          - { mod: blockIndirectDamage }

companion.lich:
  archetype: Companion
  element: Lich
  name: Frost Wight
  description: >-
    Summons a Frost Wight (30 HP) permanently. When a hit would kill it, the user spends a Soul Fragment
    instead and it's left at 1 HP. Rime Claw (S): 15 damage and Soulfrost for 2 turns.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: frost_wight }

bolt.lich:
  archetype: Bolt
  element: Lich
  name: Deathfrost Bolt
  description: >-
    Deals 25 damage to target enemy. They lose all Swiftness and Focus, and are Horrified for 1 turn per
    stack lost (max 3).
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - { op: set, var: lost, value: { sum: [{ totalStacks: { in: primary, effect: swiftness } }, { totalStacks: { in: primary, effect: focus } }] } }
    - { op: removeEffect, from: primary, effect: swiftness }
    - { op: removeEffect, from: primary, effect: focus }
    - op: if
      cond: { compare: { value: { var: lost }, atLeast: 1 } }
      then:
        - op: apply
          to: primary
          effect: horrified
          duration: { enemyTurns: { if: { compare: { value: { var: lost }, atLeast: 3 } }, then: 3, else: { var: lost } } }

blast.lich:
  archetype: Blast
  element: Lich
  name: Soul Blizzard
  description: Deals 25 damage to all enemies. Those it leaves below 50 HP are Soulfrosted for 2 turns.
  cost: SIr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - { op: apply, to: { filter: targets, where: { hpAtMost: { unit: it, value: 49 } } }, effect: soulfrost, duration: { enemyTurns: 2 } }

consume.lich:
  archetype: Consume
  element: Lich
  name: Soul Siphon
  description: >-
    Deals 5 damage to target enemy, draining a Soul Fragment. If they're Soulfrosted, it ends, and the
    user drains 1 more.
  cost: I
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - { op: removeStacks, from: primary, effect: soul_fragment, amount: 1 }
    - { op: apply, to: actor, effect: soul_fragment }
    - op: if
      cond: { has: { unit: primary, effect: soulfrost } }
      then:
        - { op: removeEffect, from: primary, effect: soulfrost }
        - { op: removeEffect, from: primary, effect: winter_of_souls }
        - { op: removeEffect, from: primary, effect: heart_of_ice }
        - { op: apply, to: actor, effect: soul_fragment }

summon.lich:
  archetype: Summon
  element: Lich
  name: Skeletal Mage
  description: >-
    Summons a Skeletal Mage (25 HP) for 3 turns. While it's alive, Frost debuffs on enemies don't
    count down. Bone Chill (r): 10 damage to target enemy.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: skeletal_mage, duration: { enemyTurns: 3 } }

channel.lich:
  archetype: Channel
  element: Lich
  name: Drain Warmth
  description: >-
    For 3 turns, at the end of each of the user's turns, deals 10 damage to target enemy, and the
    user's Phylactery's max HP rises by 10 and it heals 10. With no Phylactery, one is created at 10
    HP. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 3 }
      effect:
        id: drain_warmth
        name: Drain Warmth
        kind: Neutral
        element: Lich
        interruptible: true
        description: >-
          At the end of each of the bearer's turns, deals 10 damage to the target, and the bearer's
          Phylactery's max HP rises by 10 and it heals 10 (or one is created at 10 HP).
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: effectTargets, amount: 10 }
              - op: if
                cond: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [phylactery], mine: true } } } }, atLeast: 1 } }
                then:
                  - { op: addMaxHp, to: { filter: allAllies, where: { minion: { unit: it, types: [phylactery], mine: true } } }, amount: 10 }
                  - { op: heal, to: { filter: allAllies, where: { minion: { unit: it, types: [phylactery], mine: true } } }, amount: 10, raw: true }
                else:
                  - { op: set, var: feed, value: 10 }
                  - { op: macro, id: feed_phylactery }

stab.lich:
  archetype: Stab
  element: Lich
  name: Deathly Pallor
  description: >-
    Deals 10 damage to target enemy, or 20 if they're at or below 60 HP. For 2 turns, they can't be
    healed above 60 HP.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: damage
      to: primary
      amount: { if: { hpAtMost: { unit: it, value: 60 } }, then: 20, else: 10 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: deathly_pallor
        name: Deathly Pallor
        kind: Debuff
        element: Lich
        description: Healing can't take the bearer above 60 HP.
        triggers:
          - on: healed
            do:
              - op: if
                cond: { hpAbove: { unit: bearer, value: 60 } }
                then:
                  - { op: damage, to: bearer, amount: { sum: [{ hp: bearer }, -60] }, raw: true, type: Affliction, direct: false, bypass: true }

ravage.lich:
  archetype: Ravage
  element: Lich
  name: Doomfrost
  description: >-
    Deals 25 Piercing damage to target enemy, +10 for each Frost debuff on them. Those debuffs end, and
    they're Horrified for 1 turn per debuff ended.
  cost: AS
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: set, var: doom, value: { count: { effects: [frostbitten, chilled, numb, frostfire, snowbound, soulfrost, winter_of_souls, heart_of_ice], in: primary } } }
    - { op: damage, to: primary, type: Piercing, amount: { sum: [25, { mul: [10, { var: doom }] }] } }
    - { op: removeEffect, from: primary, effect: frostbitten }
    - { op: removeEffect, from: primary, effect: chilled }
    - { op: removeEffect, from: primary, effect: numb }
    - { op: removeEffect, from: primary, effect: frostfire }
    - { op: removeEffect, from: primary, effect: snowbound }
    - { op: removeEffect, from: primary, effect: soulfrost }
    - { op: removeEffect, from: primary, effect: winter_of_souls }
    - { op: removeEffect, from: primary, effect: heart_of_ice }
    - op: if
      cond: { compare: { value: { var: doom }, atLeast: 1 } }
      then:
        - { op: apply, to: primary, effect: horrified, duration: { enemyTurns: { var: doom } } }

mislead.lich:
  archetype: Mislead
  element: Lich
  name: Nightmare of Ice
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered and they're Horrified for 2 turns.
    Meanwhile, the user is Invulnerable to Horrified enemies. Invisible.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: nightmare_of_ice
        name: Nightmare of Ice
        kind: Debuff
        element: Lich
        visibility: hidden
        description: The bearer's next Harmful skill is countered, and they're Horrified for 2 turns.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: bearer, effect: horrified, duration: { enemyTurns: 2 } }
              - op: apply
                to: actor
                duration: { enemyTurns: 2 }
                effect:
                  id: nightmare_ward
                  name: Nightmare Ward
                  kind: Buff
                  element: Lich
                  description: Invulnerable to Horrified enemies.
                  modifiers:
                    - { mod: invulnerableTo, sourceHas: [horrified] }

stun.lich:
  archetype: Stun
  element: Lich
  name: Heart of Ice
  description: >-
    Deals 15 damage to target enemy, who is Soulfrosted for 2 turns. The first time it yields a Soul
    Fragment, they're Stunned for 1 turn.
  cost: AS
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: heart_of_ice
        name: Soulfrost
        kind: Debuff
        element: Lich
        countsAs: [soulfrost]
        description: Direct damage gives the applier a Soul Fragment (once per turn); the first time, the bearer is Stunned.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - op: if
                cond: { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counterOf: { unit: bearer, name: soulfrost_turn } }] }] }, atLeast: 1 } }
                then:
                  - { op: setCounter, name: soulfrost_turn, on: bearer, value: { turn: true } }
                  - { op: apply, to: actor, effect: soul_fragment }
                  - op: if
                    cond: { not: { flag: stunned } }
                    then:
                      - { op: setFlag, flag: stunned }
                      - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }

dance.lich:
  archetype: Dance
  element: Lich
  name: Deathwaltz
  description: >-
    For 3 turns, the user gains 1 Swiftness and 1 Focus. Each time any unit or minion dies meanwhile, all
    the user's cooldowns reset.
  cost: AI
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: swiftness, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: focus, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: deathwaltz
        name: Deathwaltz
        kind: Buff
        element: Lich
        description: Each death resets all the bearer's cooldowns.
        triggers:
          - on: signal
            signal: died
            do:
              - { op: adjustCooldowns, to: bearer, by: -10 }

heal.lich:
  archetype: Heal
  element: Lich
  name: Feed the Vessel
  description: Target ally heals 20. A minion, such as a Phylactery, heals 40 instead and gains 1 Armor for 2 turns.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: if
      cond: { kind: { unit: primary, is: minion } }
      then:
        - { op: heal, to: primary, amount: 40, raw: true }
        - { op: apply, to: primary, effect: armor, duration: { enemyTurns: 2 } }
      else:
        - { op: heal, to: primary, amount: 20 }

bless.lich:
  archetype: Bless
  element: Lich
  name: Embalm
  description: For 3 turns, target ally gains 1 Might, and their other Buffs don't count down.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: embalm
        name: Embalm
        kind: Buff
        element: Lich
        description: The bearer's other Buffs don't count down.
        triggers:
          - on: turnEnd
            do:
              - { op: extendEffects, on: bearer, kind: Buff, except: [embalm, might], by: 2 }

curse.lich:
  archetype: Curse
  element: Lich
  name: Touch of the Grave
  description: >-
    For 2 turns, target enemy can't gain Buffs, and each Helpful skill used on them gives the user a Soul
    Fragment instead (max 3).
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: setCounter, name: grave_souls, value: 0 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: touch_of_the_grave
        name: Touch of the Grave
        kind: Debuff
        element: Lich
        description: Can't gain Buffs; Helpful skills used on the bearer give the applier Soul Fragments.
        modifiers:
          - { mod: immuneTo, kind: Buff }
        triggers:
          - on: skillTargeted
            when: { harmful: false }
            do:
              - op: if
                cond: { compare: { value: { counter: grave_souls }, atMost: 2 } }
                then:
                  - { op: setCounter, name: grave_souls, value: { sum: [{ counter: grave_souls }, 1] } }
                  - { op: apply, to: actor, effect: soul_fragment }

smite.lich:
  archetype: Smite
  element: Lich
  name: Vessel's Due
  description: >-
    Deals 20 damage to target enemy, who is Sanctified for 1 turn. Each time the Sanctify heals an ally,
    the user's Phylactery heals 15 too, or is created at 15 HP.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: sanctify, duration: { enemyTurns: 1 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: vessels_due
        name: Vessel's Due
        kind: Debuff
        element: Lich
        description: Each time the bearer's Sanctify heals an ally of the applier, their Phylactery heals 15.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - op: if
                cond: { has: { unit: bearer, effect: sanctify } }
                then:
                  - { op: set, var: feed, value: 15 }
                  - { op: macro, id: feed_phylactery }

prayer.lich:
  archetype: Prayer
  element: Lich
  name: Frostborn Litany
  description: >-
    All allies heal 20 and gain Frostborn for 1 turn. While it lasts, they're also Invulnerable to Chilled
    and Numb enemies, not just Frostbitten ones.
  cost: Irr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - { op: apply, to: targets, effect: frostborn, duration: { enemyTurns: 1 } }
    - op: apply
      to: targets
      duration: { enemyTurns: 1 }
      effect:
        id: frostborn_litany
        name: Frostborn Litany
        kind: Buff
        element: Lich
        description: Invulnerable to Chilled and Numb enemies.
        modifiers:
          - { mod: invulnerableTo, sourceHas: [chilled, numb] }

cleave.lich:
  archetype: Cleave
  element: Lich
  name: Spreading Rime
  description: >-
    Deals 25 damage to target enemy and 15 to a random other enemy, who also gains a copy of each Frost
    debuff on the target (for 1 turn).
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: damage, to: it, amount: 15 }
        - { op: if, cond: { has: { unit: primary, effect: frostbitten } }, then: [{ op: apply, to: it, effect: frostbitten, duration: { enemyTurns: 1 } }] }
        - { op: if, cond: { has: { unit: primary, effect: chilled } }, then: [{ op: apply, to: it, effect: chilled, duration: { enemyTurns: 1 } }] }
        - { op: if, cond: { has: { unit: primary, effect: numb } }, then: [{ op: apply, to: it, effect: numb, duration: { enemyTurns: 1 } }] }
        - { op: if, cond: { has: { unit: primary, effect: soulfrost } }, then: [{ op: apply, to: it, effect: soulfrost, duration: { enemyTurns: 1 } }] }
        - { op: if, cond: { has: { unit: primary, effect: snowbound } }, then: [{ op: apply, to: it, effect: snowbound, duration: { enemyTurns: 1 } }] }

shout.lich:
  archetype: Shout
  element: Lich
  name: Echo from the Tomb
  description: >-
    All enemies are Intimidated for 2 turns. 3 turns later, all enemies are Intimidated for 2 turns
    again.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: intimidated, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { raw: 6 }
      effect:
        id: echo_from_the_tomb
        name: Echo from the Tomb
        kind: Neutral
        element: Lich
        description: When this ends, every enemy is Intimidated for 2 turns again.
        onExpire:
          - { op: apply, to: allEnemies, effect: intimidated, duration: { enemyTurns: 2 } }

withstand.lich:
  archetype: Withstand
  element: Lich
  name: Hoarded Life
  description: >-
    The user gains 25 Shield for 1 turn. When it ends, the damage it absorbed heals their Phylactery, or
    creates one with that much HP (at least 10).
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: setCounter, name: hoarded, value: 0 }
    - op: apply
      to: actor
      value: 25
      duration: { enemyTurns: 1 }
      effect:
        id: hoarded_life
        name: Hoarded Life
        kind: Buff
        element: Lich
        shield: true
        description: A Shield; what it absorbs is stored for the Phylactery.
        triggers:
          - on: shieldDamaged
            do:
              - { op: setCounter, name: hoarded, value: { sum: [{ counter: hoarded }, { eventAmount: true }] } }
    # Outlives the Shield so it hears it end.
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: hoarded_life_store
        name: Hoarded Life
        kind: Neutral
        element: Lich
        description: When the Hoarded Life Shield ends, what it absorbed goes to the Phylactery.
        triggers:
          - on: ownEffectEnded
            when: { effects: [hoarded_life] }
            consume: true
            do:
              - { op: set, var: feed, value: { if: { compare: { value: { counter: hoarded }, atLeast: 10 } }, then: { counter: hoarded }, else: 10 } }
              - { op: macro, id: feed_phylactery }

taunt.lich:
  archetype: Taunt
  element: Lich
  name: Guarded Urn
  description: >-
    Target enemy is Taunted for 2 turns by the user's Phylactery instead of the user; one is created at 20
    HP if they have none. The Taunted enemy's damage to it is halved.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - op: if
      cond: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [phylactery], mine: true } } } }, atMost: 0 } }
      then:
        - { op: set, var: feed, value: 20 }
        - { op: macro, id: feed_phylactery }
    - op: apply
      to: primary
      effect: taunt
      from: { filter: allAllies, where: { minion: { unit: it, types: [phylactery], mine: true } } }
      duration: { enemyTurns: 2 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: guarded_urn
        name: Guarded Urn
        kind: Debuff
        element: Lich
        description: The bearer's damage to a Phylactery is halved.
        modifiers:
          - { mod: damageDealt, amount: 0, mul: 0.5, target: { minion: { unit: it, types: [phylactery] } } }

titan.lich:
  archetype: Titan
  element: Lich
  name: Archlich
  description: >-
    Creates a Phylactery, or restores the user's to full. For 3 turns, the user gains 2 Armor and
    Frostborn, and every enemy who damages the Phylactery is Soulfrosted for 2 turns.
  cost: IW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: macro, id: make_phylactery }
    - { op: apply, to: actor, effect: armor, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: frostborn, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: archlich
        name: Archlich
        kind: Buff
        element: Lich
        description: Every enemy who damages the bearer's Phylactery is Soulfrosted for 2 turns.

