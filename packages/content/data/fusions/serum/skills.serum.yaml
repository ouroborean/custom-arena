# The 30 Serum (Water + Poison) variants, from the "Fusion Spec Kits" design doc.
# Dose (a merging Buff) heals each turn; at 4 total the bearer Overdoses (macro `overdose`).

strike.serum:
  archetype: Strike
  element: Serum
  name: Hypodermic Strike
  description: Deals 20 damage to target enemy, +5 per Dose they have. Then they gain 2 Dose.
  cost: W
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: { sum: [20, { mul: [5, { totalStacks: { in: primary, effect: dose } }] }] } }
    - { op: apply, to: primary, effect: dose, stacks: 2 }

smash.serum:
  archetype: Smash
  element: Serum
  name: Liquid Courage
  description: >-
    The user downs a vial and gains 1 Dose, then deals 20 damage to target enemy and 10 to their allies,
    5 more to each per Dose the user has.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # The Dose lands first: a 4th stack Overdoses the user before the swing, which then counts none.
    - { op: apply, to: actor, effect: dose }
    - { op: damage, to: primary, amount: { sum: [20, { mul: [5, { totalStacks: { in: actor, effect: dose } }] }] } }
    - { op: damage, to: primaryAllies, amount: { sum: [10, { mul: [5, { totalStacks: { in: actor, effect: dose } }] }] } }

charge.serum:
  archetype: Charge
  element: Serum
  name: Fermenting Jab
  description: >-
    Deals 15 damage to target enemy, who gains 1 Dose. Through the user's next turn, Dose on enemies doesn't
    heal them; each time it would, it grows by 1 stack instead.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    # The Dose status itself checks for Fermenting at each tick (statuses.serum.yaml).
    - op: apply
      to: allEnemies
      duration: { ownTurns: 1 }
      effect:
        id: fermenting
        name: Fermenting
        kind: Debuff
        element: Serum
        description: The bearer's Dose grows by 1 stack instead of healing them.
    - { op: apply, to: primary, effect: dose }

riposte.serum:
  archetype: Riposte
  element: Serum
  name: Reactive Serum
  description: For 1 turn, counters any Harmful skill used on the user; its user gains 3 Dose. Invisible.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: reactive_serum
        name: Reactive Serum
        kind: Buff
        element: Serum
        visibility: hidden
        description: Counters Harmful skills used on the bearer; their users gain 3 Dose.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - { op: apply, to: eventSource, effect: dose, stacks: 3 }

rage.serum:
  archetype: Rage
  element: Serum
  name: Stimulant Binge
  description: >-
    For 3 turns, the user gains Immune and 1 Might at the start of each of their turns (max 3). If they
    use no damaging skill on a turn, it ends and they take 20 Affliction damage.
  cost: S
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: setCounter, name: binge_turn, value: { turn: true } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: stimulant_binge
        name: Stimulant Binge
        kind: Buff
        element: Serum
        description: Immune, and 1 Might each turn (max 3); a turn without a damaging skill ends it painfully.
        modifiers:
          - { mod: immuneTo, kind: Debuff }
        triggers:
          - on: turnStart
            do:
              - op: if
                cond: { compare: { value: { stacks: { unit: bearer, effect: might } }, atMost: 2 } }
                then: [{ op: apply, to: bearer, effect: might, linkTo: stimulant_binge }]
          - on: dealtDamage
            when: { direct: true }
            do:
              - { op: setFlag, flag: dealt }
          - on: turnEnd
            do:
              - op: if
                cond:
                  and:
                    - { not: { flag: dealt } }
                    - { compare: { value: { sum: [{ turn: true }, { mul: [-1, { counter: binge_turn }] }] }, atLeast: 1 } }
                then:
                  - { op: removeSelf }
                  - { op: damage, to: bearer, amount: 20, type: Affliction, direct: false }
              - { op: setFlag, flag: dealt, value: false }

shot.serum:
  archetype: Shot
  element: Serum
  name: Purging Dart
  description: >-
    Deals 5 Piercing damage to target enemy, +10 for each Debuff on the user. Those Debuffs are drawn out
    with the dart and end.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, type: Piercing, amount: { sum: [5, { mul: [10, { kindCount: { unit: actor, kind: Debuff } }] }] } }
    - { op: removeKind, from: actor, kind: Debuff }

snipe.serum:
  archetype: Snipe
  element: Serum
  name: Tracer Dye
  description: >-
    The user deals 25 damage to target enemy on the following turn, plus as much as that enemy was healed
    in the meantime. The target of this skill is invisible. Channeled.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    # The healing is tallied on the user (counter tracer_dye), by a hidden dye on the target.
    - { op: setCounter, name: tracer_dye, value: 0 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: tracer_dye_trace
        name: Tracer Dye
        kind: Neutral
        element: Serum
        visibility: hidden
        description: Healing the bearer receives is tallied for the user's shot.
        triggers:
          - on: healed
            silent: true
            do:
              - { op: setCounter, name: tracer_dye, value: { sum: [{ counter: tracer_dye }, { eventAmount: true }] } }
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: tracer_dye
        name: Tracer Dye (aiming)
        kind: Neutral
        element: Serum
        visibility: hiddenTarget
        interruptible: true
        description: Strikes its target at the end of the following turn for 25, plus the healing they received meanwhile.
        onExpire:
          - op: forEach
            in: effectTargets
            do:
              - { op: damage, to: it, amount: { sum: [25, { counter: tracer_dye }] } }

trap.serum:
  archetype: Trap
  element: Serum
  name: Tainted Supply
  description: For 3 turns, each time target enemy is healed, they gain 1 Dose. Invisible.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: tainted_supply
        name: Tainted Supply
        kind: Debuff
        element: Serum
        visibility: hidden
        description: Each time the bearer is healed, they gain 1 Dose.
        triggers:
          - on: healed
            do:
              - { op: apply, to: bearer, effect: dose }

maneuver.serum:
  archetype: Maneuver
  element: Serum
  name: Stimulant
  description: >-
    The user becomes Invulnerable for 1 turn. Their Dose moves to a random enemy; if they had none, they
    gain 2. Unstunnable.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic, Unstunnable]
  target: self
  ops:
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - op: if
      cond: { has: { unit: actor, effect: dose } }
      then:
        - { op: moveEffects, from: actor, to: { randomEnemy: 1 }, effects: [dose] }
      else:
        - { op: apply, to: actor, effect: dose, stacks: 2 }

companion.serum:
  archetype: Companion
  element: Serum
  name: Giant Leech
  description: >-
    Summons a Giant Leech (25 HP) permanently. Latch (r): 5 Piercing damage and 1 Dose. Bloodletting (rr):
    target ally loses 2 Dose and heals 10.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: giant_leech }

bolt.serum:
  archetype: Bolt
  element: Serum
  name: Pressurized Dose
  description: Deals 20 damage to target enemy, who gains 2 Dose. While they have Dose, they count as Prey.
  cost: I
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: dose, stacks: 2 }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: pressurized
        name: Pressurized
        kind: Debuff
        element: Serum
        description: While the bearer has Dose, they count as Prey.

blast.serum:
  archetype: Blast
  element: Serum
  name: Acid Rain
  description: >-
    Deals 20 damage to all enemies, and each gains 1 Dose. Then all Dose on the enemy team pools on one
    enemy who has it.
  cost: Wr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 20 }
    - { op: apply, to: targets, effect: dose }
    - op: forEach
      in: { randomEnemy: 1, where: { has: { unit: it, effect: dose } } }
      do:
        - { op: moveEffects, from: { filter: allEnemies, exclude: it, where: { has: { unit: it, effect: dose } } }, to: it, effects: [dose] }

consume.serum:
  archetype: Consume
  element: Serum
  name: Extraction
  description: >-
    Removes all Dose from target unit: an enemy takes 10 Affliction damage per stack; an ally heals 10 per
    stack. Either way, it counts at least 2 stacks.
  cost: r
  cooldown: 2
  tags: [Radiant, Strategic]
  target: any
  ops:
    - op: set
      var: extracted
      value:
        if: { compare: { value: { totalStacks: { in: primary, effect: dose } }, atLeast: 2 } }
        then: { totalStacks: { in: primary, effect: dose } }
        else: 2
    - { op: removeEffect, from: primary, effect: dose }
    - op: if
      cond: { isEnemy: primary }
      then: [{ op: damage, to: primary, amount: { mul: [10, { var: extracted }] }, type: Affliction, direct: false }]
      else: [{ op: heal, to: primary, amount: { mul: [10, { var: extracted }] } }]

summon.serum:
  archetype: Summon
  element: Serum
  name: Spriggan Nurse
  description: >-
    Summons a Spriggan Nurse (15 HP) for 3 turns. Titrate (W): target ally gains 1 Dose; if they have 3, a
    random enemy gains 2 instead.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: spriggan_nurse, duration: { enemyTurns: 3 } }

channel.serum:
  archetype: Channel
  element: Serum
  name: Drip
  description: >-
    For up to 4 turns, at the end of each of the user's turns, target enemy gains 1 Dose and takes 5
    Affliction damage per Dose they have. It ends when they Overdose. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, Strategic, Channeled]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 4 }
      effect:
        id: drip
        name: Drip
        kind: Neutral
        element: Serum
        interruptible: true
        description: Each turn, the target gains 1 Dose and takes 5 Affliction per Dose; ends when they Overdose.
        triggers:
          - on: turnEnd
            do:
              - op: forEach
                in: effectTargets
                do:
                  - { op: apply, to: it, effect: dose }
                  - op: if
                    cond: { has: { unit: it, effect: dose } }
                    then:
                      - { op: damage, to: it, amount: { mul: [5, { totalStacks: { in: it, effect: dose } }] }, type: Affliction, direct: false }
                    else:
                      - { op: removeSelf }
          # The Overdose resolves just after the new Dose: the drip ends once its target has none left.
          - on: signal
            signal: overdose
            do:
              - op: if
                cond: { not: { any: { in: effectTargets, cond: { has: { unit: it, effect: dose } } } } }
                then: [{ op: removeSelf }]

stab.serum:
  archetype: Stab
  element: Serum
  name: Microdose
  description: >-
    Deals 5 damage to target enemy now and at the start of each of their next 3 turns. Each dose is 15
    instead while they're at or below 60 HP.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: { if: { hpAtMost: { unit: it, value: 60 } }, then: 15, else: 5 } }
    - op: apply
      to: primary
      duration: { raw: 6 }
      effect:
        id: microdose
        name: Microdose
        kind: Debuff
        element: Serum
        description: At the start of each of the bearer's turns, 5 damage (15 at or below 60 HP).
        triggers:
          - on: turnStart
            do:
              - { op: damage, to: bearer, amount: { if: { hpAtMost: { unit: bearer, value: 60 } }, then: 15, else: 5 }, direct: false }

ravage.serum:
  archetype: Ravage
  element: Serum
  name: Toxic Injection
  description: >-
    Deals 25 Piercing damage to target enemy. For 2 turns, their Toxin also ticks at the start of each of
    their turns.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25, type: Piercing }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: toxic_injection
        name: Toxic Injection
        kind: Debuff
        element: Serum
        description: The bearer's Toxin also ticks at the start of their turns.
        triggers:
          - on: turnStart
            do:
              - { op: damage, to: bearer, amount: { mul: [5, { totalStacks: { in: bearer, effect: toxin } }] }, type: Affliction, direct: false }

mislead.serum:
  archetype: Mislead
  element: Serum
  name: Placebo
  description: >-
    For 1 turn, if target enemy uses a Helpful skill, it's countered, and each of its targets gains 2
    Dose. Invisible.
  cost: W
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: placebo
        name: Placebo
        kind: Debuff
        element: Serum
        visibility: hidden
        description: The bearer's next Helpful skill is countered, and its targets gain 2 Dose.
        triggers:
          - on: skillUsed
            when: { harmful: false }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: eventTargets, effect: dose, stacks: 2 }

stun.serum:
  archetype: Stun
  element: Serum
  name: Sedative
  description: >-
    Deals 15 damage to target enemy and Stuns them for 1 turn, +1 turn per 2 Dose they have (max 3
    turns).
  cost: I
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      effect: stun
      duration:
        enemyTurns:
          if: { compare: { value: { totalStacks: { in: primary, effect: dose } }, atLeast: 4 } }
          then: 3
          else: { sum: [1, { div: [{ totalStacks: { in: primary, effect: dose } }, 2] }] }

dance.serum:
  archetype: Dance
  element: Serum
  name: Rebalance
  description: All Toxin on allies turns into Renew, and all Renew on enemies turns into Toxin.
  cost: A
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: forEach
      in: allAllies
      do:
        - { op: set, var: shift, value: { totalStacks: { in: it, effect: toxin } } }
        - { op: removeEffect, from: it, effect: toxin }
        - { op: apply, to: it, effect: renew, stacks: { var: shift } }
    - op: forEach
      in: allEnemies
      do:
        - { op: set, var: shift, value: { totalStacks: { in: it, effect: renew } } }
        - { op: removeEffect, from: it, effect: renew }
        - { op: apply, to: it, effect: toxin, stacks: { var: shift } }

heal.serum:
  archetype: Heal
  element: Serum
  name: Relief Valve
  description: >-
    Target ally heals 15 and gains 2 Dose. For 2 turns, if they Overdose, the damage hits a random enemy
    instead of them.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    # The valve goes on first, so a dose that tips them to 4 is already vented.
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: relief_valve
        name: Relief Valve
        kind: Buff
        element: Serum
        stacking: unique
        description: If the bearer Overdoses, they still lose all Dose, but a random enemy takes the damage.
        triggers:
          - on: effectGained
            effect: dose
            do:
              - op: if
                cond:
                  and:
                    - { compare: { value: { totalStacks: { in: bearer, effect: dose } }, atLeast: 4 } }
                    - { not: { has: { unit: bearer, effect: mutagen } } }
                then:
                  - { op: set, var: od, value: { totalStacks: { in: bearer, effect: dose } } }
                  - { op: removeEffect, from: bearer, effect: dose }
                  - { op: damage, to: { randomEnemy: 1 }, amount: { mul: [10, { var: od }] }, type: Affliction, direct: false }
                  - { op: signal, name: overdose }
    - { op: heal, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: dose, stacks: 2 }

bless.serum:
  archetype: Bless
  element: Serum
  name: Mithridate
  description: For 1 turn, each Debuff target ally would gain turns into 1 Dose instead.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: mithridate
        name: Mithridate
        kind: Buff
        element: Serum
        description: Each Debuff the bearer would gain becomes 1 Dose instead.
        triggers:
          - on: effectGained
            when: { kind: Debuff }
            do:
              - { op: eventEffect, remove: true }
              - { op: apply, to: bearer, effect: dose }

curse.serum:
  archetype: Curse
  element: Serum
  name: Side Effects
  description: >-
    Target enemy gains 2 Dose. For 2 turns, each skill they use gives them 1 more.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    # Two skills in the window take them from 2 to 4: an Overdose, unless they hold back (and heal).
    - { op: apply, to: primary, effect: dose, stacks: 2 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: side_effects
        name: Side Effects
        kind: Debuff
        element: Serum
        description: Each skill the bearer uses gives them 1 Dose.
        triggers:
          - on: skillUsed
            do:
              - { op: apply, to: bearer, effect: dose }

smite.serum:
  archetype: Smite
  element: Serum
  name: Mercy Dose
  description: >-
    Deals 15 damage to target enemy, who is Sanctified for 1 turn. For 1 turn, an ally who damages them
    executes them if it leaves them below 15 HP.
  cost: Wr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: sanctify, duration: { enemyTurns: 1 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: mercy_dose
        name: Mercy Dose
        kind: Debuff
        element: Serum
        description: An ally of the applier who leaves the bearer below 15 HP executes them.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 14 } }
                then: [{ op: kill, to: bearer }]

prayer.serum:
  archetype: Prayer
  element: Serum
  name: Tonic Round
  description: All allies heal 10 per Dose they have (at least 10) and lose 1 Dose. All enemies gain 1 Dose.
  cost: Ir
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - op: forEach
      in: targets
      do:
        - { op: heal, to: it, amount: { if: { has: { unit: it, effect: dose } }, then: { mul: [10, { totalStacks: { in: it, effect: dose } }] }, else: 10 } }
        - { op: removeStacks, from: it, effect: dose, amount: 1 }
    - { op: apply, to: allEnemies, effect: dose }

cleave.serum:
  archetype: Cleave
  element: Serum
  name: Lashing Spray
  description: >-
    Deals 20 damage to target enemy, who gains 1 Dose. For 2 turns, the first 2 times they're healed, the
    serum sprays out of them: each of their allies takes 10 damage.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: dose }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: lashing_spray
        name: Lashing Spray
        kind: Debuff
        element: Serum
        stacking: unique
        description: The first 2 times the bearer is healed, each of their allies takes 10 damage.
        triggers:
          - on: healed
            do:
              - { op: damage, to: bearerAllies, amount: 10 }
              - op: if
                cond: { flag: sprayed }
                then: [{ op: removeSelf }]
                else: [{ op: setFlag, flag: sprayed }]

shout.serum:
  archetype: Shout
  element: Serum
  name: Bad Batch
  description: >-
    Every unit that has Dose gains 1 more, allies included. If no enemy has Dose, every enemy gains 1
    instead.
  cost: r
  cooldown: 1
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - op: if
      cond: { compare: { value: { countOf: { filter: targets, where: { has: { unit: it, effect: dose } } } }, atLeast: 1 } }
      then:
        - { op: apply, to: { filter: allUnits, where: { has: { unit: it, effect: dose } } }, effect: dose }
      else:
        - { op: apply, to: targets, effect: dose }

withstand.serum:
  archetype: Withstand
  element: Serum
  name: Clotting Agent
  description: >-
    The user gains 2 Dose. For 1 turn, each time they take direct damage, their Dose acts at once: they heal 5
    per stack.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: dose, stacks: 2 }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: clotting_agent
        name: Clotting Agent
        kind: Buff
        element: Serum
        description: Each direct hit on the bearer makes their Dose heal them at once, 5 per stack.
        triggers:
          - on: damaged
            when: { direct: true }
            do:
              - { op: heal, to: bearer, amount: { mul: [5, { totalStacks: { in: bearer, effect: dose } }] } }

taunt.serum:
  archetype: Taunt
  element: Serum
  name: Bitter Tonic
  description: >-
    The user gains 2 Dose and Taunts target enemy for 2 turns. Each time that enemy hits the user
    meanwhile, 1 of the user's Dose moves onto them.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: actor, effect: dose, stacks: 2 }
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: bitter_tonic
        name: Bitter Tonic
        kind: Buff
        element: Serum
        description: Each time the enemy the bearer Taunted hits them, 1 of their Dose moves onto that enemy.
        triggers:
          - on: damaged
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond:
                  and:
                    - { has: { unit: eventSource, effect: taunt, mine: true } }
                    - { has: { unit: bearer, effect: dose } }
                then:
                  - { op: removeStacks, from: bearer, effect: dose, amount: 1 }
                  - { op: apply, to: eventSource, effect: dose }

titan.serum:
  archetype: Titan
  element: Serum
  name: Mutagen
  description: >-
    The user gains 3 Dose and can't Overdose for 3 turns; meanwhile, 2 Might and 2 Armor. When it ends,
    they Overdose if they have 4 or more.
  cost: I
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: mutagen
        name: Mutagen
        kind: Buff
        element: Serum
        description: Can't Overdose; at 4 or more Dose when this ends, they Overdose.
        onExpire:
          - op: if
            cond: { compare: { value: { totalStacks: { in: bearer, effect: dose } }, atLeast: 4 } }
            then:
              - { op: forEach, in: bearer, do: [{ op: macro, id: overdose }] }
    - { op: apply, to: actor, effect: dose, stacks: 3 }
    - { op: apply, to: actor, effect: might, stacks: 2, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: armor, stacks: 2, duration: { enemyTurns: 3 } }

