# The 30 Evil (Unholy + Unholy) variants, from the "Fusion Spec Kits" design doc. Ids are "<base>.evil".
# Keywords: Unhallowed (healing hurts instead) and Tithe N (spend up to N Soul Fragments; macro
# `tithe` with the `tithe` var set first, then `spent` says how many).

strike.evil:
  archetype: Strike
  element: Evil
  name: Cruel Blade
  description: >-
    Deals 25 damage to target enemy. If they were healed since the user's last turn, they take 10
    more and are Unhallowed for 2 turns.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: set
      var: healed
      value:
        if:
          and:
            - { compare: { value: { counterOf: { unit: primary, name: healed_turn } }, atLeast: 1 } }
            - { compare: { value: { sum: [{ counterOf: { unit: primary, name: healed_turn } }, { mul: [-1, { turn: true }] }] }, atLeast: -1 } }
        then: 1
        else: 0
    - { op: damage, to: primary, amount: { sum: [25, { mul: [10, { var: healed }] }] } }
    - op: if
      cond: { varTrue: healed }
      then:
        - { op: apply, to: primary, effect: unhallowed, duration: { enemyTurns: 2 } }

smash.evil:
  archetype: Smash
  element: Evil
  name: Soulgrinder
  description: >-
    Deals 25 damage to target enemy. For 2 turns, at the end of each of the user's turns, they take
    10 Affliction damage, each of their allies takes 5, and the user drains a Soul Fragment from
    them.
  cost: SS
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: soulgrinder
        name: Soulgrinder
        kind: Debuff
        element: Evil
        description: At the end of each of the user's turns, 10 Affliction to the bearer and 5 to each of their allies, and the user drains a Soul Fragment from the bearer.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: bearer, amount: 10, type: Affliction, direct: false }
              - { op: damage, to: bearerAllies, amount: 5, type: Affliction, direct: false }
              - { op: forEach, in: bearer, do: [{ op: macro, id: drain_it }] }

charge.evil:
  archetype: Charge
  element: Evil
  name: Soul Hunt
  description: >-
    Deals 20 damage to target enemy and drains a Soul Fragment from them. If an enemy hits the user
    before their next turn, that enemy drains a Soul Fragment back from the user.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: forEach, in: primary, do: [{ op: macro, id: drain_it }] }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: soul_hunt
        name: Soul Hunt
        kind: Neutral
        element: Evil
        description: The first enemy to hit the bearer drains a Soul Fragment back from them.
        triggers:
          - on: damaged
            when: { byEnemy: true, direct: true }
            consume: true
            do:
              - op: if
                cond: { has: { unit: bearer, effect: soul_fragment } }
                then:
                  - { op: removeStacks, from: bearer, effect: soul_fragment, amount: 1 }
              - { op: apply, to: eventSource, effect: soul_fragment }

riposte.evil:
  archetype: Riposte
  element: Evil
  name: Take You With Me
  description: >-
    For 1 turn, counters any Harmful skill used on the user. If the user dies before the end of
    their next turn, the last enemy it countered dies with them. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: take_you_with_me
        name: Take You With Me
        kind: Buff
        element: Evil
        visibility: hidden
        description: Counters Harmful skills used on the bearer, and gives each countered enemy Doomed Together.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - { op: removeEffect, from: allEnemies, effect: doomed_together }
              - op: apply
                to: eventSource
                duration: { ownTurns: 1 }
                effect:
                  id: doomed_together
                  name: Doomed Together
                  kind: Debuff
                  element: Evil
                  description: If the applier dies before this ends, the bearer dies too.
                  triggers:
                    - on: signal
                      signal: died
                      do:
                        - op: if
                          cond: { isEventTarget: actor }
                          then:
                            - { op: kill, to: bearer }

rage.evil:
  archetype: Rage
  element: Evil
  name: Atrocity
  description: >-
    For 2 turns, the user is Immortal, and each enemy who damages them loses a Soul Fragment to the
    user.
  cost: Sr
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immortal, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: atrocity
        name: Atrocity
        kind: Buff
        element: Evil
        description: Each enemy who damages the bearer loses a Soul Fragment to them.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - { op: forEach, in: eventSource, do: [{ op: macro, id: drain_it }] }

shot.evil:
  archetype: Shot
  element: Evil
  name: Bone Needle
  description: >-
    If the user has a Soul Fragment, they spend it to deal 25 Piercing damage to target enemy.
    Otherwise, deals 10 damage to target enemy and drains a Soul Fragment from them.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: set, var: tithe, value: 1 }
    - { op: macro, id: tithe }
    - op: if
      cond: { varTrue: spent }
      then:
        - { op: damage, to: primary, amount: 25, type: Piercing }
      else:
        - { op: damage, to: primary, amount: 10 }
        - { op: forEach, in: primary, do: [{ op: macro, id: drain_it }] }

snipe.evil:
  archetype: Snipe
  element: Evil
  name: Doom Knell
  description: >-
    In 3 turns, deals 70 Affliction damage to target enemy. Each time they're healed meanwhile, it
    lands a turn sooner. The target of this skill is invisible. Channeled.
  cost: AS
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 3 }
      effect:
        id: doom_knell
        name: Doom Knell (tolling)
        kind: Neutral
        element: Evil
        visibility: hiddenTarget
        interruptible: true
        description: When this ends, deals 70 Affliction damage to its target. It ends sooner each time they're healed.
        onExpire:
          - { op: damage, to: effectTargets, amount: 70, type: Affliction }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: doom_knell_mark
        name: Doom Knell
        kind: Debuff
        element: Evil
        visibility: hidden
        description: Each time the bearer is healed, Doom Knell lands a turn sooner.
        triggers:
          - on: healed
            do:
              - { op: extendEffects, on: actor, effects: [doom_knell], by: -2 }

trap.evil:
  archetype: Trap
  element: Evil
  name: Damning Shackle
  description: >-
    For 2 turns, the first time target enemy would be healed, they take that much Affliction damage
    instead and are Stunned for 1 turn. Invisible.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: damning_shackle
        name: Damning Shackle
        kind: Debuff
        element: Evil
        visibility: hidden
        description: >-
          The first time the bearer would be healed, they take that much Affliction damage instead
          and are Stunned for 1 turn.
        modifiers:
          - { mod: invertHealing }
        triggers:
          - on: healed
            consume: true
            do:
              - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }

maneuver.evil:
  archetype: Maneuver
  element: Evil
  name: Deathless Step
  description: >-
    The user gains a Soul Fragment. For 1 turn, each time they'd lose HP, they lose a Soul Fragment
    instead; once they have none left, HP is lost as usual.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: soul_fragment }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: deathless_step
        name: Deathless Step
        kind: Buff
        element: Evil
        description: Each time the bearer would lose HP, they lose a Soul Fragment instead (while they have one).
        modifiers:
          # Lord of Souls can't spend Fragments, so it can't pay for this either.
          - mod: maxHpLossPerHit
            amount: 0
            if: { and: [{ has: { unit: actor, effect: soul_fragment } }, { not: { has: { unit: actor, effect: lord_of_souls } } }] }
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { compare: { value: { counterOf: { unit: bearer, name: hit_capped } }, atLeast: 1 } }
                then:
                  - { op: removeStacks, from: bearer, effect: soul_fragment, amount: 1 }

companion.evil:
  archetype: Companion
  element: Evil
  name: Fiend
  description: >-
    Summons a Fiend (35 HP) permanently. Rend Soul (S): 15 Affliction damage and Unhallowed for 1
    turn. Feast (r): drains a Soul Fragment from a Horrified enemy for its summoner.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: fiend }

bolt.evil:
  archetype: Bolt
  element: Evil
  name: Profane Bolt
  description: >-
    Deals 25 damage to target enemy. For 2 turns, each Buff they gain costs them 10 HP.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: profane_bolt
        name: Profane Bolt
        kind: Debuff
        element: Evil
        description: Each Buff the bearer gains costs them 10 HP.
        triggers:
          - on: effectGained
            when: { kind: Buff }
            do:
              - { op: damage, to: bearer, amount: 10, type: Affliction, direct: false, raw: true }

blast.evil:
  archetype: Blast
  element: Evil
  name: Soulfire Nova
  description: >-
    Deals 45 damage to all enemies. Then the user and each of their allies are Unhallowed for 2 turns.
  cost: SIr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 45 }
    - { op: apply, to: allAllies, effect: unhallowed, duration: { enemyTurns: 2 } }

consume.evil:
  archetype: Consume
  element: Evil
  name: Reap
  description: >-
    Every enemy takes 5 damage and is Horrified for 1 turn. The user drains a Soul Fragment from the one
    with the least HP and heals 10.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 5 }
    - { op: forEach, in: weakestEnemy, do: [{ op: macro, id: drain_it }] }
    - { op: heal, to: actor, amount: 10 }
    - { op: apply, to: targets, effect: horrified, duration: { enemyTurns: 1 } }

summon.evil:
  archetype: Summon
  element: Evil
  name: Tormentor
  description: >-
    Summons a Tormentor (25 HP) for 3 turns. Barbed Whip (r): 10 Affliction damage. False Mercy (I):
    target enemy is Unhallowed for 1 turn; if it's applied, they then heal 15.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: tormentor, duration: { enemyTurns: 3 } }

channel.evil:
  archetype: Channel
  element: Evil
  name: Undying Thirst
  description: >-
    For 3 turns, deals 10 damage to target enemy each turn, with Lifesteal. While it channels, the
    user is Immortal, but only this Lifesteal can heal them. Channeled.
  cost: rr
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 3 }
      effect:
        id: undying_thirst
        name: Undying Thirst
        kind: Neutral
        element: Evil
        interruptible: true
        description: At the end of each of the user's turns, deals 10 damage to its target, with Lifesteal.
        triggers:
          - on: turnEnd
            do:
              - { op: damage, to: effectTargets, amount: 10 }
              - { op: heal, to: bearer, amount: { lastDamage: true }, raw: true }
    - op: apply
      to: actor
      linkTo: undying_thirst
      duration: { enemyTurns: 3 }
      effect:
        id: undying_thirst_hold
        name: Undying Thirst
        kind: Buff
        element: Evil
        description: Immortal, and only Undying Thirst's own Lifesteal can heal the bearer.
        modifiers:
          - { mod: hpFloor, amount: 5 }
          - { mod: healingReceived, mul: 0 }

stab.evil:
  archetype: Stab
  element: Evil
  name: Heartpiercer
  description: >-
    Deals 15 damage to target enemy. If that leaves them at or below 30 HP, they're Unhallowed for 2
    turns.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: if
      cond: { hpAtMost: { unit: primary, value: 30 } }
      then:
        - { op: apply, to: primary, effect: unhallowed, duration: { enemyTurns: 2 } }

ravage.evil:
  archetype: Ravage
  element: Evil
  name: Mutual Ruin
  description: >-
    Deals 35 Piercing damage to target enemy. Costs no energy: instead, the user loses 25 HP, which
    can't kill them.
  cost: nc
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 35, type: Piercing }
    - op: damage
      to: actor
      type: Affliction
      direct: false
      raw: true
      amount: { if: { hpAbove: { unit: actor, value: 25 } }, then: 25, else: { sum: [{ hp: actor }, -1] } }

mislead.evil:
  archetype: Mislead
  element: Evil
  name: Waking Nightmare
  description: >-
    For 1 turn, if target enemy uses a Helpful skill, it's countered, and its targets take the
    healing it would have given as Affliction damage. Invisible.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: waking_nightmare
        name: Waking Nightmare
        kind: Debuff
        element: Evil
        visibility: hidden
        description: >-
          The bearer's first Helpful skill is countered, and its targets take the healing it would
          have given as Affliction damage.
        triggers:
          - on: skillUsed
            when: { harmful: false }
            intercept: counter
            consume: true
            do:
              # Simplified: the would-be healing is taken as 20.
              - { op: damage, to: eventTargets, amount: 20, type: Affliction }

stun.evil:
  archetype: Stun
  element: Evil
  name: Cruel Mercy
  description: >-
    Target enemy is Stunned for 2 turns, but Immortal for as long: nothing can take them below 5 HP
    meanwhile.
  cost: AS
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: immortal, duration: { enemyTurns: 2 } }

dance.evil:
  archetype: Dance
  element: Evil
  name: Danse Macabre
  description: >-
    Deals 15 Piercing damage to target enemy, and the user gains 1 Confusion for 2 turns. For those 2
    turns, the user's Confusion lowers their skill costs instead of raising them.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15, type: Piercing }
    - { op: apply, to: actor, effect: confusion, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: danse_macabre
        name: Danse Macabre
        kind: Buff
        element: Evil
        description: The bearer's Confusion lowers their skill costs instead of raising them.
        modifiers:
          # Simplified: undoes one Confusion's +1 and gives −1 instead (assumes 1 stack).
          - { mod: costGeneric, amount: -2, if: { has: { unit: actor, effect: confusion } } }

heal.evil:
  archetype: Heal
  element: Evil
  name: Borrowed Blood
  description: >-
    Target ally heals 35. At the end of each of their next 2 turns, they lose 10 HP unless they
    damaged an enemy that turn.
  cost: r
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 35 }
    - op: apply
      to: primary
      duration: { ownTurns: 2 }
      effect:
        id: borrowed_blood
        name: Borrowed Blood
        kind: Debuff
        element: Evil
        description: At the end of the bearer's turn, they lose 10 HP unless they damaged an enemy that turn.
        triggers:
          - on: dealtDamage
            when: { byEnemy: true }
            do:
              - { op: setFlag, flag: paid }
          - on: turnEnd
            do:
              # The cast turn doesn't count; their next 2 turns do.
              - op: if
                cond: { flag: armed }
                then:
                  - op: if
                    cond: { not: { flag: paid } }
                    then:
                      - { op: damage, to: bearer, amount: 10, type: Affliction, direct: false, raw: true }
                else:
                  - { op: setFlag, flag: armed }
              - { op: setFlag, flag: paid, value: false }

bless.evil:
  archetype: Bless
  element: Evil
  name: Dark Gift
  description: >-
    The user gives up 1 Soul Fragment, and target ally gains 2; after 2 turns, the ally loses 1 of
    them. With none to give up, the user loses 15 HP instead, and the ally loses both after 2 turns.
  cost: W
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: set, var: tithe, value: 1 }
    - { op: macro, id: tithe }
    - op: if
      cond: { not: { varTrue: spent } }
      then:
        - op: damage
          to: actor
          type: Affliction
          direct: false
          raw: true
          amount: { if: { hpAbove: { unit: actor, value: 15 } }, then: 15, else: { sum: [{ hp: actor }, -1] } }
    - { op: apply, to: primary, effect: soul_fragment, stacks: 2 }
    # The borrowed part of the gift: 1 Fragment (2 if the user had none to give) crumbles when this ends,
    # if the ally still has it. Nothing is minted for good.
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      value: { if: { varTrue: spent }, then: 1, else: 2 }
      effect:
        id: dark_gift
        name: Dark Gift
        kind: Neutral
        element: Evil
        stacking: independent
        description: When this ends, the bearer loses 1 Soul Fragment, or 2 if the user had none to give up.
        onExpire:
          - op: repeat
            times: { effectValue: true }
            do:
              - { op: removeStacks, from: bearer, effect: soul_fragment, amount: 1 }

curse.evil:
  archetype: Curse
  element: Evil
  name: Eternal Torment
  description: >-
    Target enemy gains 1 Confusion and is Immortal for 3 turns. Each hit that would have taken them
    below 5 HP gives its dealer a Soul Fragment.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: confusion, duration: { enemyTurns: 3 } }
    - { op: apply, to: primary, effect: immortal, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: eternal_torment
        name: Eternal Torment
        kind: Debuff
        element: Evil
        description: Each hit that leaves the bearer at their Immortal floor gives its dealer a Soul Fragment.
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 5 } }
                then:
                  - { op: apply, to: eventSource, effect: soul_fragment }

smite.evil:
  archetype: Smite
  element: Evil
  name: Soul Rot
  description: >-
    Deals 20 damage to target enemy. Tithe 1: for 2 turns, each ally who damages them gains a Soul Fragment.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: set, var: tithe, value: 1 }
    - { op: macro, id: tithe }
    - op: if
      cond: { varTrue: spent }
      then:
        - op: apply
          to: primary
          duration: { enemyTurns: 2 }
          effect:
            id: soul_rot
            name: Soul Rot
            kind: Debuff
            element: Evil
            description: Each enemy who damages the bearer gains a Soul Fragment.
            triggers:
              - on: damaged
                when: { byEnemy: true, direct: true }
                do:
                  - { op: apply, to: eventSource, effect: soul_fragment }

prayer.evil:
  archetype: Prayer
  element: Evil
  name: Black Mass
  description: All allies heal 25. Then each ally at full HP loses 10 HP and gains 1 Soul Fragment.
  cost: Srr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 25 }
    - op: forEach
      in: { filter: targets, where: { compare: { value: { missingHp: it }, atMost: 0 } } }
      do:
        - { op: damage, to: it, amount: 10, type: Affliction, direct: false, raw: true }
        - { op: apply, to: it, effect: soul_fragment }

cleave.evil:
  archetype: Cleave
  element: Evil
  name: Spreading Agony
  description: >-
    Deals 20 damage to target enemy. Each of their allies takes 5 Affliction damage for every 20 HP
    the target is now missing (at least 5, at most 15).
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # Measured as missing before the blow plus what it took, so a blow that kills still counts it all.
    - { op: set, var: missing, value: { missingHp: primary } }
    - { op: damage, to: primary, amount: 20 }
    - { op: set, var: agony, value: { mul: [5, { div: [{ sum: [{ var: missing }, { lastDamage: true }] }, 20] }] } }
    - op: damage
      to: primaryAllies
      type: Affliction
      amount:
        if: { compare: { value: { var: agony }, atLeast: 15 } }
        then: 15
        else: { if: { compare: { value: { var: agony }, atMost: 5 } }, then: 5, else: { var: agony } }

shout.evil:
  archetype: Shout
  element: Evil
  name: Wail of the Damned
  description: >-
    All enemies are Unhallowed until the end of their next turn; any of them healed during it are
    also Horrified for 2 turns.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: unhallowed, duration: { raw: 2 } }
    - op: apply
      to: targets
      duration: { raw: 2 }
      effect:
        id: wail_of_the_damned
        name: Wail of the Damned
        kind: Debuff
        element: Evil
        description: If the bearer is healed, they're Horrified for 2 turns.
        triggers:
          - on: healed
            do:
              - { op: apply, to: bearer, effect: horrified, duration: { enemyTurns: 2 } }

withstand.evil:
  archetype: Withstand
  element: Evil
  name: Wretched Bulwark
  description: >-
    The user gains 20 Shield for 1 turn. Each Unhallowed or Horrified enemy takes 10 Affliction
    damage, and the Shield gains 10 for each of them.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: set
      var: wretched
      value: { countOf: { filter: allEnemies, where: { or: [{ has: { unit: it, effect: unhallowed } }, { has: { unit: it, effect: horrified } }] } } }
    - { op: damage, to: { filter: allEnemies, where: { or: [{ has: { unit: it, effect: unhallowed } }, { has: { unit: it, effect: horrified } }] } }, amount: 10, type: Affliction, direct: false }
    - { op: apply, to: actor, effect: shield, value: { sum: [20, { mul: [10, { var: wretched }] }] }, duration: { enemyTurns: 1 } }

taunt.evil:
  archetype: Taunt
  element: Evil
  name: Tyrant's Gaze
