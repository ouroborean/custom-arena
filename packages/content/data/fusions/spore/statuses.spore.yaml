# Spore (Poison + Earth) statuses, from the "Fusion Spec Kits" design doc.

# Spores: actor in its triggers is the Spore player's unit that applied them.
spores:
  name: Spores
  kind: Debuff
  element: Spore
  stacking: merge
  description: >-
    At the end of its applier's turn, a bearer with 2 or more passes 1 to a random ally. At 3, a Mushroom sprouts
    from the bearer for the applier, and the bearer loses the 3.
  triggers:
    - on: effectGained
      effect: spores
      do:
        - op: if
          cond: { compare: { value: { effectStacks: true }, atLeast: 3 } }
          then:
            - { op: macro, id: sprout }
            - { op: addStacksSelf, amount: -3 }
    - on: turnEnd
      do:
        - op: if
          cond: { compare: { value: { effectStacks: true }, atLeast: 2 } }
          then:
            - op: forEach
              in: randomBearerAlly
              do:
                - { op: apply, to: it, effect: spores }
                - { op: addStacksSelf, amount: -1 }

# A Mushroom's Puff, on the Mushroom: at the end of its side's turns, 1 Spore to a random enemy.
mushroom_puff:
  name: Puff
  kind: Neutral
  element: Spore
  stacking: unique
  description: At the end of each of its side's turns, a random enemy gains 1 Spore.
  triggers:
    - on: turnEnd
      do:
        - { op: apply, to: { randomEnemy: 1 }, effect: spores, from: summoner }

# On a Sporeling: grows whenever a Mushroom sprouts for its side.
sporeling_feed:
  name: Fed by the Colony
  kind: Neutral
  element: Spore
  stacking: unique
  description: Whenever a Mushroom sprouts for this side, +10 max HP and heals 10.
  triggers:
    - on: signal
      signal: mushroom_sprouted
      when: { side: ally }
      do:
        - { op: addMaxHp, to: bearer, amount: 10 }
        - { op: heal, to: bearer, amount: 10 }

# Humus Wall: a Shield that rots by 10 at the end of each of its applier's later turns (the first
# turn end only settles it), seeding a random enemy with 1 Spore each time.
humus_wall:
  name: Humus Wall
  kind: Buff
  element: Spore
  stacking: unique
  shield: true
  description: >-
    A Shield. At the end of each of its applier's later turns, it loses 10 and a random enemy gains 1 Spore.
  triggers:
    - on: turnEnd
      do:
        - op: if
          cond: { flag: settled }
          then:
            - { op: apply, to: { randomEnemy: 1 }, effect: spores }
            - { op: growShield, to: bearer, effect: humus_wall, amount: -10 }
          else:
            - { op: setFlag, flag: settled }

# Infest: a Spore carrier's skills cost 1 more.
infest:
  name: Infested
  kind: Debuff
  element: Spore
  stacking: unique
  description: While the bearer carries Spores, their skills cost 1 more.
  modifiers:
    - { mod: costGeneric, amount: 1, if: { has: { unit: bearer, effect: spores } } }

# Fungal Colossus: a Mushroom sprouts for the bearer at the end of each of their turns, and each
# Mushroom on their side is 1 Armor for them.
fungal_colossus:
  name: Fungal Colossus
  kind: Buff
  element: Spore
  stacking: unique
  description: >-
    A Mushroom sprouts for the bearer at the end of each of their turns; they have 1 Armor for each
    Mushroom on their side.
  modifiers:
    - mod: damageTaken
      amount: 0
      armor: true
      when: { types: [Normal] }
      value: { mul: [-5, { countOf: { filter: allAllies, where: { minion: { unit: it, types: [mushroom] } } } }] }
  triggers:
    - on: turnEnd
      do:
        - { op: macro, id: sprout }
