# The 30 Vigilante (Holy + Shadow) variants, from the "Fusion Spec Kits" design doc.
# Exposed (status `exposed`).

strike.vigilante:
  archetype: Strike
  element: Vigilante
  name: Street Justice
  description: >-
    Deals 20 damage to target enemy. If they were the last enemy to damage the user, they're Exposed for 1 turn
    first, so this deals 10 more.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { isPrimary: lastAttacker }
      then: [{ op: apply, to: primary, effect: exposed, duration: { enemyTurns: 1 } }]
    - { op: damage, to: primary, amount: 20 }

smash.vigilante:
  archetype: Smash
  element: Vigilante
  name: Round Up the Gang
  description: >-
    Deals 25 damage to target enemy, and 25 to each other enemy carrying a Buff.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - { op: damage, to: { filter: allEnemies, where: { hasKind: { unit: it, kind: Buff } }, exclude: primary }, amount: 25 }

charge.vigilante:
  archetype: Charge
  element: Vigilante
  name: Pursuit
  description: >-
    Deals 15 damage to target enemy. If the user is Stealthed, the target is Exposed for 2 turns first, so this deals
    10 more; if not, the user gains Stealth.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # From Stealth: the ambush reveals the target (and, not being Stealthy, ends the user's Stealth).
    - op: if
      cond: { has: { unit: actor, effect: stealth } }
      then:
        - { op: apply, to: primary, effect: exposed, duration: { enemyTurns: 2 } }
        - { op: damage, to: primary, amount: 15 }
      else:
        - { op: damage, to: primary, amount: 15 }
        - { op: apply, to: actor, effect: stealth, duration: { enemyTurns: 2 } }

riposte.vigilante:
  archetype: Riposte
  element: Vigilante
  name: Caught Red-Handed
  description: >-
    For 1 turn, the user keeps watch over their allies instead of themselves: the first Harmful skill an
    enemy uses on any of them is countered, and its user is Exposed for 2 turns. Invisible.
  cost: A
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: { filter: allAllies, where: { not: { isActor: it } } }
      duration: { enemyTurns: 1 }
      effect:
        id: caught_red_handed
        name: Caught Red-Handed
        kind: Buff
        element: Vigilante
        visibility: hidden
        description: The first Harmful skill an enemy uses on the bearer (or on another ally the same watcher covers) is countered, and its user is Exposed for 2 turns.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - { op: apply, to: eventSource, effect: exposed, duration: { enemyTurns: 2 } }
              - { op: removeEffect, from: allAllies, effect: caught_red_handed }

rage.vigilante:
  archetype: Rage
  element: Vigilante
  name: The Hunt Begins
  description: >-
    For 3 turns, the user gains 1 Might, each enemy they damage is Exposed for 2 turns, and they deal 5 more to Exposed
    enemies.
  cost: WA
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: the_hunt_begins
        name: The Hunt Begins
        kind: Buff
        element: Vigilante
        description: The bearer deals 5 more to Exposed enemies, and each enemy they damage is Exposed for 2 turns.
        modifiers:
          - { mod: damageDealt, amount: 5, when: { direct: true }, target: { has: { unit: it, effect: exposed } } }
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - { op: apply, to: eventTarget, effect: exposed, duration: { enemyTurns: 2 } }

shot.vigilante:
  archetype: Shot
  element: Vigilante
  name: Searchlight
  description: >-
    Deals 10 damage to a random enemy, Stealthed ones included. If they had Stealth, they're Exposed for 2 turns.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  # Untargeted: it finds Stealthed enemies itself, so it can be used when every enemy is hidden.
  target: self
  ops:
    - op: forEach
      in: randomAnyEnemy
      do:
        - { op: set, var: hidden, value: { if: { has: { unit: it, effect: stealth } }, then: 1, else: 0 } }
        - op: if
          cond: { varTrue: hidden }
          then: [{ op: apply, to: it, effect: exposed, duration: { enemyTurns: 2 } }]
        - { op: damage, to: it, amount: 10 }

snipe.vigilante:
  archetype: Snipe
  element: Vigilante
  name: From the Rooftops
  description: >-
    On the following turn, deals 40 damage to target enemy; if they gained Stealth or used an Invisible skill
    meanwhile, 20 more and Exposed for 2 turns. The target of this skill is invisible. Channeled.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: rooftop_watch
        name: Watched
        kind: Neutral
        element: Vigilante
        visibility: hidden
        description: Notes whether the bearer hides.
        triggers:
          - on: effectGained
            effect: stealth
            do: [{ op: addStacksSelf, amount: 1 }]
          - on: skillUsed
            do:
              - op: if
                cond: { eventSkill: { tags: [Invisible] } }
                then: [{ op: addStacksSelf, amount: 1 }]
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: from_the_rooftops
        name: From the Rooftops
        kind: Neutral
        element: Vigilante
        visibility: hiddenTarget
        interruptible: true
        description: When this runs out, its target takes 40 damage, or 60 and Exposed if they hid meanwhile.
        onExpire:
          - op: forEach
            in: effectTargets
            do:
              - op: if
                cond: { compare: { value: { stacks: { unit: it, effect: rooftop_watch } }, atLeast: 2 } }
                then:
                  - { op: apply, to: it, effect: exposed, duration: { enemyTurns: 2 } }
                  - { op: damage, to: it, amount: 60 }
                else:
                  - { op: damage, to: it, amount: 40 }

trap.vigilante:
  archetype: Trap
  element: Vigilante
  name: Sting Operation
  description: >-
    For 2 turns, if target enemy uses a Stealthy or Invisible skill, it's countered and they're Exposed for 2 turns.
    Invisible.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: sting_operation
        name: Sting Operation
        kind: Debuff
        element: Vigilante
        visibility: hidden
        description: The bearer's next Stealthy or Invisible skill is countered and Exposes them.
        triggers:
          - on: skillUsed
            when: { harmful: true, anyTags: [Stealthy, Invisible] }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: bearer, effect: exposed, duration: { enemyTurns: 2 } }
          - on: skillUsed
            when: { harmful: false, anyTags: [Stealthy, Invisible] }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: bearer, effect: exposed, duration: { enemyTurns: 2 } }

maneuver.vigilante:
  archetype: Maneuver
  element: Vigilante
  name: Safe Passage
  description: >-
    The user and target ally become Invulnerable for 1 turn. The user can't use Harmful skills on their next turn.
  cost: r
  cooldown: 4
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - { op: apply, to: primary, effect: invulnerable, duration: { enemyTurns: 1 } }
    - op: apply
      to: actor
      duration: { raw: 3 }
      effect:
        id: safe_passage
        name: Safe Passage
        kind: Debuff
        element: Vigilante
        description: Can't use Harmful skills.
        modifiers:
          - { mod: cannotUseSkills, harmful: true }

companion.vigilante:
  archetype: Companion
  element: Vigilante
  name: Bloodhound
  description: >-
    Summons a Bloodhound (30 HP) permanently. Run Down (r): 10 Piercing damage. Scent (r): target enemy is Exposed
    for as long as the Bloodhound lives, until it uses Scent again.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: bloodhound }

bolt.vigilante:
  archetype: Bolt
  element: Vigilante
  name: Cover Fire
  description: >-
    Deals 20 damage to target enemy. The user's other ally with the least HP gains Stealth if they haven't acted yet
    this turn.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    # Only an ally who holds still is covered: one who acts afterwards loses the Stealth at once.
    - op: if
      cond: { not: { actedThisTurn: weakestOtherAlly } }
      then:
        - { op: apply, to: weakestOtherAlly, effect: stealth, duration: { enemyTurns: 2 } }

blast.vigilante:
  archetype: Blast
  element: Vigilante
  name: Floodlight
  description: >-
    Deals 25 damage to all enemies, Stealthed ones included. Those with Stealth or Invulnerable are Exposed for 2
    turns first, and take 10 more.
  cost: Irr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  # Untargeted: it finds Stealthed enemies itself, so it can be used when every enemy is hidden.
  target: self
  ops:
    - op: forEach
      in: { filter: allUnits, where: { isEnemy: it } }
      do:
        - op: if
          cond: { or: [{ has: { unit: it, effect: stealth } }, { has: { unit: it, effect: invulnerable } }] }
          then: [{ op: apply, to: it, effect: exposed, duration: { enemyTurns: 2 } }]
        - { op: damage, to: it, amount: 25 }

consume.vigilante:
  archetype: Consume
  element: Vigilante
  name: Shakedown
  description: >-
    Deals 5 damage to target enemy and takes a random Buff of theirs for the user. If they have none, the user heals
    15 instead.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - op: if
      cond: { hasKind: { unit: primary, kind: Buff } }
      then: [{ op: stealRandom, from: primary, to: actor, kind: Buff }]
      else: [{ op: heal, to: actor, amount: 15 }]

summon.vigilante:
  archetype: Summon
  element: Vigilante
  name: Informant
  description: >-
    Summons an Informant (15 HP) for 3 turns. Whoever damages it is Exposed for 2 turns. Tip Off (r): the user's
    next skill is Stealthy.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: informant, duration: { enemyTurns: 3 } }

channel.vigilante:
  archetype: Channel
  element: Vigilante
  name: Night Patrol
  description: >-
    For 3 turns, at the end of each of the user's turns, every enemy who used a Harmful skill since takes 10 damage
    and is Exposed for 1 turn. Channeled.
  cost: A
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: patrol_watch, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: night_patrol
        name: Night Patrol
        kind: Neutral
        element: Vigilante
        interruptible: true
        description: Each turn, every enemy who used a Harmful skill since takes 10 damage and is Exposed.
        triggers:
          - on: turnEnd
            do:
              - op: forEach
                in:
                  filter: allEnemies
                  where:
                    and:
                      - { compare: { value: { counterOf: { unit: it, name: patrolled } }, atLeast: 1 } }
                      - { compare: { value: { sum: [{ counterOf: { unit: it, name: patrolled } }, { mul: [-1, { turn: true }] }] }, atLeast: -1 } }
                do:
                  - { op: apply, to: it, effect: exposed, duration: { enemyTurns: 1 } }
                  - { op: damage, to: it, amount: 10 }

stab.vigilante:
  archetype: Stab
  element: Vigilante
  name: Quiet Verdict
  description: >-
    At the end of the user's next turn, target enemy takes 10 damage, or 25 if they're at or below 60 HP by then.
    Invisible.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { ownTurns: 1 }
      effect:
        id: quiet_verdict
        name: Quiet Verdict
        kind: Debuff
        element: Vigilante
        visibility: hidden
        description: At the end of the applier's next turn, the bearer takes 10 damage, or 25 at or below 60 HP.
        onExpire:
          - op: damage
            to: bearer
            amount: { if: { hpAtMost: { unit: bearer, value: 60 } }, then: 25, else: 10 }

ravage.vigilante:
  archetype: Ravage
  element: Vigilante
  name: Take Down
  description: >-
    Deals 25 Piercing damage to target enemy. If they're Exposed, it ends, and they're Stunned for 1 turn.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25, type: Piercing }
    - op: if
      cond: { has: { unit: primary, effect: exposed } }
      then:
        - { op: removeEffect, from: primary, effect: exposed }
        - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 1 } }

mislead.vigilante:
  archetype: Mislead
  element: Vigilante
  name: Setup
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered and they're Condemned; for 2 turns, any ally of
    theirs who gives them a Buff is Exposed for 2 turns. Invisible.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: setup
        name: Setup
        kind: Debuff
        element: Vigilante
        visibility: hidden
        description: The bearer's next Harmful skill is countered; they're Condemned and watched.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: bearer, effect: condemned }
              - { op: apply, to: bearer, effect: setup_watch, duration: { enemyTurns: 2 } }

stun.vigilante:
  archetype: Stun
  element: Vigilante
  name: Chokehold
  description: >-
    Deals 10 damage to target enemy, who falls Asleep for 1 turn. An Exposed target is Stunned for 2 turns instead.
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: if
      cond: { has: { unit: primary, effect: exposed } }
      then: [{ op: apply, to: primary, effect: stun, duration: { enemyTurns: 2 } }]
      else: [{ op: apply, to: primary, effect: sleep, duration: { enemyTurns: 1 } }]

dance.vigilante:
  archetype: Dance
  element: Vigilante
  name: Mask On
  description: >-
    The user gains Stealth and 1 Swiftness. While they stay Stealthed, their skills deal 10 more to Exposed enemies.
  cost: A
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: stealth, duration: { enemyTurns: 2 } }
    - { op: apply, to: actor, effect: swiftness, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: mask_on
        name: Mask On
        kind: Buff
        element: Vigilante
        description: While Stealthed, the bearer's hits on Exposed enemies deal 10 more.
        triggers:
          - on: dealtDamage
            when: { direct: true }
            do:
              - op: if
                cond: { and: [{ has: { unit: bearer, effect: stealth } }, { has: { unit: eventTarget, effect: exposed } }] }
                then: [{ op: damage, to: eventTarget, amount: 10, direct: false }]

heal.vigilante:
  archetype: Heal
  element: Vigilante
  name: Witness Statement
  description: >-
    The last enemy to damage target ally takes 10 damage, and the ally heals 10 plus the damage dealt. If no enemy has
    damaged them, they heal 15 instead.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: if
      cond: { compare: { value: { countOf: primaryLastAttacker }, atLeast: 1 } }
      then:
        # Indirect (the skill is Strategic), so Exposed doesn't add to it.
        - { op: damage, to: primaryLastAttacker, amount: 10, direct: false }
        - { op: heal, to: primary, amount: { sum: [10, { lastDamage: true }] } }
      else:
        - { op: heal, to: primary, amount: 15 }

bless.vigilante:
  archetype: Bless
  element: Vigilante
  name: Watcher in the Dark
  description: >-
    For 3 turns, the first time target ally takes damage, they gain 25 Shield and 2 Might for 2 turns. Invisible.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic, Invisible]
  target: ally
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: watcher_in_the_dark
        name: Watcher in the Dark
        kind: Buff
        element: Vigilante
        visibility: hidden
        description: The first time the bearer takes damage, they gain 25 Shield and 2 Might for 2 turns.
        triggers:
          - on: damaged
            consume: true
            do:
              - { op: apply, to: bearer, effect: shield, value: 25, duration: { enemyTurns: 2 } }
              - { op: apply, to: bearer, effect: might, stacks: 2, duration: { enemyTurns: 2 } }

curse.vigilante:
  archetype: Curse
  element: Vigilante
  name: Most Wanted
  description: >-
    Target enemy is Exposed for 3 turns. The first ally of the user to damage them gains Stealth.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: exposed, duration: { enemyTurns: 3 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: most_wanted
        name: Most Wanted
        kind: Debuff
        element: Vigilante
        description: The first of the applier's side to hit the bearer gains Stealth.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            consume: true
            do:
              - { op: apply, to: eventSource, effect: stealth, duration: { enemyTurns: 2 } }

smite.vigilante:
  archetype: Smite
  element: Vigilante
  name: Full Sentence
  description: >-
    Deals 15 damage to target enemy. For 2 turns, they owe restitution: after each Harmful skill they use, each of its
    targets heals 10.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: full_sentence
        name: Full Sentence
        kind: Debuff
        element: Vigilante
        description: After each Harmful skill the bearer uses, each of its targets heals 10.
        triggers:
          # After it resolves (a countered skill owes nothing).
          - on: skillResolved
            when: { harmful: true }
            do:
              - { op: heal, to: eventTargets, amount: 10 }

prayer.vigilante:
  archetype: Prayer
  element: Vigilante
  name: Dawn Vigil
  description: >-
    All allies heal 20 and gain 10 Shield. Each Anointed ally spends their Anointed to remove all their Debuffs.
  cost: Wrr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - { op: apply, to: targets, effect: shield, value: 10, duration: { enemyTurns: 1 } }
    - op: forEach
      in: { filter: targets, where: { has: { unit: it, effect: anointed } } }
      do:
        - { op: removeEffect, from: it, effect: anointed }
        - { op: removeKind, from: it, kind: Debuff }

cleave.vigilante:
  archetype: Cleave
  element: Vigilante
  name: Sweep the Streets
  description: >-
    Deals 20 damage to target enemy and 15 to each other Exposed enemy. If no other enemy is Exposed, a random other
    enemy takes the 15 instead and is Exposed for 1 turn.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: if
      cond: { any: { in: allEnemies, cond: { and: [{ has: { unit: it, effect: exposed } }, { not: { isPrimary: it } }] } } }
      then:
        - { op: damage, to: { filter: allEnemies, where: { has: { unit: it, effect: exposed } }, exclude: primary }, amount: 15 }
      else:
        - op: forEach
          in: { randomEnemy: 1, exclude: primary }
          do:
            - { op: damage, to: it, amount: 15 }
            - { op: apply, to: it, effect: exposed, duration: { enemyTurns: 1 } }

shout.vigilante:
  archetype: Shout
  element: Vigilante
  name: Hue and Cry
  description: >-
    All enemies, Stealthed ones included, are Exposed for 1 turn. For 2 turns, the first Harmful skill each of them
    uses Condemns them once it resolves.
  cost: Wr
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    # The hue and cry finds Stealthed enemies too, not just the skill's targets.
    - { op: apply, to: { filter: allUnits, where: { isEnemy: it } }, effect: exposed, duration: { enemyTurns: 1 } }
    - op: apply
      to: { filter: allUnits, where: { isEnemy: it } }
      duration: { enemyTurns: 2 }
      effect:
        id: hue_and_cry
        name: Hue and Cry
        kind: Debuff
        element: Vigilante
        description: The first Harmful skill the bearer uses Condemns them once it resolves.
        triggers:
          # Condemned after the skill, so it waits for their next one.
          - on: skillResolved
            when: { harmful: true }
            consume: true
            do:
              - { op: apply, to: bearer, effect: condemned }

withstand.vigilante:
  archetype: Withstand
  element: Vigilante
  name: Reinforced Trenchcoat
  description: >-
    The user gains 25 Shield for 1 turn. While it holds, each Debuff an enemy would give them is prevented and costs
    10 of the Shield instead.
  cost: A
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: shield, value: 25, duration: { enemyTurns: 1 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: reinforced_trenchcoat
        name: Reinforced Trenchcoat
        kind: Buff
        element: Vigilante
        description: While the bearer has Shield, Debuffs from enemies are prevented, each costing 10 Shield.
        triggers:
          - on: effectGained
            when: { kind: Debuff }
            do:
              - op: if
                cond: { and: [{ hasShield: bearer }, { isEnemy: eventSource }] }
                then:
                  - { op: eventEffect, remove: true }
                  - { op: boostShields, on: bearer, amount: -10 }

taunt.vigilante:
  archetype: Taunt
  element: Vigilante
  name: Bait and Switch
  description: >-
    Taunts target enemy for 2 turns. The first time they damage the user, the Taunt ends: the user gains Stealth,
    and they're Exposed for 2 turns.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: bait_and_switch
        name: Bait and Switch
        kind: Debuff
        element: Vigilante
        description: The first time the bearer hits the applier, the Taunt ends, the applier hides, and the bearer is Exposed.
        triggers:
          - on: dealtDamage
            when: { direct: true }
            do:
              - op: if
                cond: { isActor: eventTarget }
                then:
                  - { op: removeEffect, from: bearer, effect: taunt }
                  - { op: apply, to: actor, effect: stealth, duration: { enemyTurns: 2 } }
                  - { op: apply, to: bearer, effect: exposed, duration: { enemyTurns: 2 } }
                  - { op: removeSelf }

