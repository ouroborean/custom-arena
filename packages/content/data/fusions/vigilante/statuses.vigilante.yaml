# Vigilante (Holy + Shadow) statuses, from the "Fusion Spec Kits" design doc.

# Exposed: no hiding, and Vigilante skills hit harder.
exposed:
  name: Exposed
  kind: Debuff
  element: Vigilante
  stacking: unique
  description: >-
    Can't become Stealthed, Invulnerable or Untargetable (any they have ends), and the Invisible effects they own
    are revealed. Vigilante skills deal them 10 more.
  modifiers:
    - { mod: immuneToEffects, effects: [stealth, invulnerable, untargetable] }
    - { mod: damageTaken, amount: 10, when: { direct: true }, elements: [Vigilante] }
  triggers:
    - on: effectGained
      effect: exposed
      do:
        - { op: removeEffect, from: bearer, effect: stealth }
        - { op: removeEffect, from: bearer, effect: invulnerable }
        - { op: removeEffect, from: bearer, effect: untargetable }
        - { op: reveal, by: bearer }

# On an Informant: whoever damages it is Exposed.
informant_watch:
  name: Informant
  kind: Neutral
  element: Vigilante
  stacking: unique
  description: Whoever damages the Informant is Exposed for 2 turns.
  triggers:
    - on: damaged
      do:
        - { op: apply, to: eventSource, effect: exposed, duration: { enemyTurns: 2 } }

# Night Patrol's watch: marks the turn the bearer last used a Harmful skill (counter `patrolled`).
patrol_watch:
  name: Night Patrol (watched)
  kind: Neutral
  element: Vigilante
  stacking: unique
  description: The patrol notes each Harmful skill the bearer uses.
  triggers:
    - on: skillUsed
      when: { harmful: true }
      do:
        - { op: setCounter, name: patrolled, on: bearer, value: { turn: true } }

# Setup's after-effect: allies of the bearer who help them are Exposed.
setup_watch:
  name: Setup
  kind: Debuff
  element: Vigilante
  stacking: unique
  description: Any ally of the bearer who gives them a Buff is Exposed for 2 turns.
  triggers:
    - on: effectGained
      when: { kind: Buff }
      do:
        - op: if
          cond: { isEnemy: eventSource }
          then: [{ op: apply, to: eventSource, effect: exposed, duration: { enemyTurns: 2 } }]

# Sweep the Streets: each time the bearer's Condemned triggers, they're Blinded for 1 turn.
swept:
  name: Swept
  kind: Debuff
  element: Vigilante
  stacking: unique
  description: Each skill the bearer uses while Condemned also Blinds them for 1 turn.
  triggers:
    - on: skillResolved
      do:
        - op: if
          cond: { check: { cond: condemn_fired, unit: bearer } }
          then: [{ op: apply, to: bearer, effect: blinded, duration: { enemyTurns: 1 } }]
