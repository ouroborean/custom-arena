# The 30 Dragon (Fire + Fire) variants, from the "Fusion Spec Kits" design doc. Ids are "<base>.dragon".
# Keywords: Dragonfire (an upgraded Ignite) and Hoard (the user's, max 6; Breath skills spend it).
# Durations follow the base convention: "for N turns" = enemyTurns N.

strike.dragon:
  archetype: Strike
  element: Dragon
  name: Wyrmclaw
  description: Deals 20 damage to target enemy, plus 5 for every 2 Hoard the user has. Hoard isn't spent.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: damage
      to: primary
      amount: { sum: [20, { mul: [5, { div: [{ stacks: { unit: actor, effect: hoard } }, 2] }] }] }

smash.dragon:
  archetype: Smash
  element: Dragon
  name: Tail Sweep
  description: >-
    Deals 30 damage to target enemy. Each of their allies then loses a random Buff, and the user
    gains 1 Hoard for each Buff removed.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # The splash is greed, not damage: their allies are robbed instead of hit.
    - { op: damage, to: primary, amount: 30 }
    - op: forEach
      in: { filter: primaryAllies, where: { hasKind: { unit: it, kind: Buff } } }
      do:
        - { op: removeRandom, from: it, kind: Buff }
        - { op: apply, to: actor, effect: hoard }

charge.dragon:
  archetype: Charge
  element: Dragon
  name: Dragon's Descent
  description: >-
    Deals 15 damage to target enemy and Ignites them. The user gains 1 Focus for their next skill,
    and that skill gives Dragonfire to each Ignited enemy it damages.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: ignite }
    - { op: apply, to: actor, effect: focus, until: { skillUsed: {} } }
    - op: apply
      to: actor
      until: { skillUsed: {} }
      effect:
        id: dragons_descent
        name: Dragon's Descent
        kind: Buff
        element: Dragon
        description: The bearer's next skill gives Dragonfire to each Ignited enemy it damages.
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventTarget, effect: ignite } }
                then:
                  - { op: apply, to: eventTarget, effect: dragonfire, from: bearer }

riposte.dragon:
  archetype: Riposte
  element: Dragon
  name: Dragon's Toll
  description: >-
    For 1 turn, the user counters any Harmful skill used on them, and gains 1 Hoard per energy each
    countered skill cost. Invisible.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: dragons_toll
        name: Dragon's Toll
        kind: Buff
        element: Dragon
        visibility: hidden
        description: Counters Harmful skills used on the bearer; they gain 1 Hoard per energy each one cost.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            do:
              - op: if
                cond: { compare: { value: { skillCost: true }, atLeast: 1 } }
                then:
                  - { op: apply, to: actor, effect: hoard, stacks: { skillCost: true } }

rage.dragon:
  archetype: Rage
  element: Dragon
  name: Wyrm's Wrath
  description: For 3 turns, the user gains 2 Might, and 1 Hoard each time an enemy damages them.
  cost: SS
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: might, stacks: 2, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: wyrms_wrath
        name: Wyrm's Wrath
        kind: Buff
        element: Dragon
        description: Gains 1 Hoard each time an enemy damages the bearer.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - { op: apply, to: bearer, effect: hoard }

shot.dragon:
  archetype: Shot
  element: Dragon
  name: Ember Spit
  description: If target enemy is Ignited, deals 25 damage to them. Otherwise, deals 10 damage and gives them Dragonfire.
  cost: r
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: if
      cond: { has: { unit: primary, effect: ignite } }
      then:
        - { op: damage, to: primary, amount: 25 }
      else:
        - { op: damage, to: primary, amount: 10 }
        - { op: forEach, in: primary, do: [{ op: macro, id: dragonfire_it }] }

snipe.dragon:
  archetype: Snipe
  element: Dragon
  name: Skyfall Breath
  description: >-
    The user is Untargetable by enemies until this lands. On the following turn, deals 35 damage to
    target enemy, plus Breath. The target of this skill is invisible. Channeled.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: skyfall_breath
        name: Skyfall Breath (circling)
        kind: Neutral
        element: Dragon
        visibility: hiddenTarget
        interruptible: true
        description: >-
          Untargetable by enemies. At the end of the following turn, deals 35 damage to its target,
          plus Breath, unless interrupted.
        modifiers:
          - { mod: untargetable, by: enemies, bypassable: true }
        onExpire:
          - { op: macro, id: breath }
          - { op: damage, to: effectTargets, amount: { sum: [35, { var: breath }] } }

trap.dragon:
  archetype: Trap
  element: Dragon
  name: Gilded Bait
  description: >-
    For 2 turns, the first time target enemy gains a Buff, they lose it and gain Dragonfire.
    Invisible.
  cost: r
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: gilded_bait
        name: Gilded Bait
        kind: Debuff
        element: Dragon
        visibility: hidden
        description: The first Buff the bearer gains is lost, and they gain Dragonfire.
        triggers:
          - on: effectGained
            when: { kind: Buff }
            consume: true
            do:
              - { op: eventEffect, remove: true }
              - { op: forEach, in: bearer, do: [{ op: macro, id: dragonfire_it }] }

maneuver.dragon:
  archetype: Maneuver
  element: Dragon
  name: Burning Wake
  description: >-
    The user becomes Invulnerable for 1 turn. While it lasts, each Ignite they applied also deals
    its damage at the start of its bearer's turn.
  cost: A
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
    - { op: apply, to: actor, effect: burning_wake, duration: { enemyTurns: 1 } }

companion.dragon:
  archetype: Companion
  element: Dragon
  name: Drake
  description: >-
    Summons a Drake (40 HP) permanently. At the end of each of your turns, if any enemy is Ignited,
    it gives the user 1 Hoard. Drake Claw (r): 15 damage and Scorched for 1 turn.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: drake }

bolt.dragon:
  archetype: Bolt
  element: Dragon
  name: Wyrmbolt
  description: Deals 20 damage to target enemy. If they're Ignited, their Ignite deals its damage twice right now.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: if
      cond: { has: { unit: primary, effect: ignite } }
      then:
        - op: repeat
          times: 2
          do:
            - op: damage
              to: primary
              type: Affliction
              direct: false
              amount: { if: { has: { unit: it, effect: dragonfire } }, then: 10, else: 5 }
            - { op: macro, id: burn_aftermath }

blast.dragon:
  archetype: Blast
  element: Dragon
  name: Great Breath
  description: Deals 20 damage to all enemies, plus Breath. Ignited enemies take 10 more.
  cost: SI
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: macro, id: breath }
    - op: damage
      to: targets
      amount: { sum: [20, { var: breath }, { if: { has: { unit: it, effect: ignite } }, then: 10, else: 0 }] }

consume.dragon:
  archetype: Consume
  element: Dragon
  name: Devour Embers
  description: >-
    Every Ignite on the enemy side ends, and the user heals 10 and gains 1 Hoard for each. Then
    target enemy takes 5 damage and is Ignited.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: forEach
      in: { filter: allEnemies, where: { has: { unit: it, effect: ignite } } }
      do:
        - { op: removeEffect, from: it, effect: ignite }
        - { op: removeEffect, from: it, effect: dragonfire }
        - { op: heal, to: actor, amount: 10 }
        - { op: apply, to: actor, effect: hoard }
    - { op: damage, to: primary, amount: 5 }
    - { op: apply, to: primary, effect: ignite }

summon.dragon:
  archetype: Summon
  element: Dragon
  name: Dragon Egg
  description: >-
    Summons a Dragon Egg (30 HP) for 3 turns. It does nothing, but if it's still alive when it
    expires, it hatches into a permanent Wyrmling (30 HP). Wyrmling Bite (r): 15 damage and Ignite.
  cost: S
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: dragon_egg }

channel.dragon:
  archetype: Channel
  element: Dragon
  name: Wyrmfire Torrent
  description: >-
    For 3 turns, deals 10 damage to all enemies each turn, or 15 to those with Dragonfire; then a
    random enemy without Dragonfire gains it. Channeled.
  cost: SI
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: wyrmfire_torrent
        name: Wyrmfire Torrent
        kind: Neutral
        element: Dragon
        interruptible: true
        description: >-
          At the end of each of the user's turns, deals 10 damage to all enemies (15 to those with
          Dragonfire), then a random enemy without Dragonfire gains it.
        triggers:
          - on: turnEnd
            do:
              - op: damage
                to: allEnemies
                amount: { if: { has: { unit: it, effect: dragonfire } }, then: 15, else: 10 }
              - op: forEach
                in: { randomEnemy: 1, where: { not: { has: { unit: it, effect: dragonfire } } } }
                do: [{ op: macro, id: dragonfire_it }]

stab.dragon:
  archetype: Stab
  element: Dragon
  name: Fang
  description: >-
    Deals 5 damage to target enemy and gives them Fang for 2 turns. If they already have the user's
    Fang, it's removed instead: they take 25 damage, and the user gains 1 Hoard.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    # Bite, then tear: every other use on the same target pays off.
    - op: if
      cond: { has: { unit: primary, effect: fang, mine: true } }
      then:
        - { op: removeEffect, from: primary, effect: fang }
        # Equipment (Scything Claw) listens for Stab bonuses: the tear is this Stab's.
        - { op: signal, name: stab_bonus }
        - { op: damage, to: primary, amount: 25 }
        - { op: apply, to: actor, effect: hoard }
      else:
        - { op: damage, to: primary, amount: 5 }
        - op: apply
          to: primary
          duration: { enemyTurns: 2 }
          effect:
            id: fang
            name: Fang
            kind: Debuff
            element: Dragon
            description: >-
              If the applier uses Fang on the bearer again, this is removed, the bearer takes 25
              damage, and the applier gains 1 Hoard.

ravage.dragon:
  archetype: Ravage
  element: Dragon
  name: Molten Maw
  description: >-
    Deals 25 Piercing damage to target enemy, 15 more if they're Scorched. For 2 turns, each time
    their Ignite deals damage, they're Scorched for 1 turn.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: damage
      to: primary
      type: Piercing
      amount: { if: { has: { unit: it, effect: scorched } }, then: 40, else: 25 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: molten_maw
        name: Molten Maw
        kind: Debuff
        element: Dragon
        description: Each time the bearer's Ignite deals damage to them, they're Scorched for 1 turn.
        triggers:
          # Simplified: any non-direct damage while Ignited counts as the Ignite burning.
          - on: damaged
            when: { direct: false }
            do:
              - op: if
                cond: { has: { unit: bearer, effect: ignite } }
                then:
                  - { op: apply, to: bearer, effect: scorched, duration: { enemyTurns: 1 } }

mislead.dragon:
  archetype: Mislead
  element: Dragon
  name: Covetous Eye
  description: >-
    For 1 turn, the first enemy skill that costs 3 or more energy is countered. Next turn, its user
    generates 1 less energy and the user generates 1 more. Invisible.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: allEnemies
  ops:
    - op: apply
      to: targets
      duration: { enemyTurns: 1 }
      effect:
        id: covetous_eye
        name: Covetous Eye
        kind: Debuff
        element: Dragon
        visibility: hidden
        description: >-
          The bearer's first skill costing 3 or more energy is countered. Next turn, they generate 1
          less energy and the applier 1 more.
        triggers:
          - on: skillUsed
            when: { costAtLeast: 3 }
            intercept: counter
            consume: true
            do:
              - op: apply
                to: bearer
                duration: { raw: 3 }
                effect:
                  id: covetous_eye_loss
                  name: Robbed
                  kind: Debuff
                  element: Dragon
                  description: Generates 1 less energy next turn.
                  modifiers:
                    - { mod: energyGain, amount: -1 }
              - op: apply
                to: actor
                duration: { raw: 2 }
                effect:
                  id: covetous_eye_gain
                  name: Gilded
                  kind: Buff
                  element: Dragon
                  description: Generates 1 more energy next turn.
                  modifiers:
                    - { mod: energyGain, amount: 1 }

stun.dragon:
  archetype: Stun
  element: Dragon
  name: Dragonfear
  description: Target enemy falls Asleep for 2 turns. If damage wakes them, they Explode.
  cost: S
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: dragonfear
        name: Dragonfear
        kind: Debuff
        element: Dragon
        countsAs: [sleep]
        description: Counts as Asleep. If damage wakes the bearer, they Explode.
        modifiers:
          - { mod: cannotUseSkills }
        triggers:
          - on: damaged
            when: { wakes: true }
            do:
              # Gone first, so the Explosion's own damage doesn't set it off again.
              - { op: removeSelf }
              - { op: macro, id: explode }

dance.dragon:
  archetype: Dance
  element: Dragon
  name: Warming Wings
  description: >-
    For 3 turns, the user gains 1 Swiftness and 1 Focus, and each time an Ignite they applied deals
    damage, the ally with the least HP heals as much.
  cost: Sr
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: swiftness, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: focus, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: warming_wings, duration: { enemyTurns: 3 } }

heal.dragon:
  archetype: Heal
  element: Dragon
  name: Hearthfire
  description: Target ally heals 15, plus 10 for each Hoard the user spends, up to 3.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 15 }
    - op: repeat
      times:
        if: { compare: { value: { stacks: { unit: actor, effect: hoard } }, atLeast: 3 } }
        then: 3
        else: { stacks: { unit: actor, effect: hoard } }
      do:
        - { op: heal, to: primary, amount: 10 }
        - { op: removeStacks, from: actor, effect: hoard, amount: 1 }

bless.dragon:
  archetype: Bless
  element: Dragon
  name: Dragonblood
  description: >-
    For 2 turns, target ally's damaging skills also Ignite their targets, or give Dragonfire to
    targets already Ignited.
  cost: S
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: dragonblood
        name: Dragonblood
        kind: Buff
        element: Dragon
        description: The bearer's direct damage Ignites its targets, or gives Dragonfire to those already Ignited.
        triggers:
          - on: dealtDamage
            when: { direct: true, byEnemy: true }
            do:
              - op: if
                cond: { has: { unit: eventTarget, effect: ignite } }
                then:
                  - { op: apply, to: eventTarget, effect: dragonfire, from: bearer }
                else:
                  - { op: apply, to: eventTarget, effect: ignite, from: bearer }

curse.dragon:
  archetype: Curse
  element: Dragon
  name: Slag
  description: Target enemy loses all Armor and Shield, gains 1 Vulnerable for 2 turns, and gains Dragonfire.
  cost: S
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: removeEffect, from: primary, effect: armor }
    - { op: removeEffect, from: primary, effect: shield }
    - { op: apply, to: primary, effect: vulnerable, duration: { enemyTurns: 2 } }
    - { op: forEach, in: primary, do: [{ op: macro, id: dragonfire_it }] }

smite.dragon:
  archetype: Smite
  element: Dragon
  name: Pyre Brand
  description: >-
    Deals 20 damage to target enemy, and they're Scorched for 1 turn. When that Scorch ends, they
    Explode if they're still Ignited.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: scorched, duration: { enemyTurns: 1 } }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: pyre_brand
        name: Pyre Brand
        kind: Debuff
        element: Dragon
        description: When this ends, the bearer Explodes if they're still Ignited.
        onExpire:
          - op: if
            cond: { has: { unit: bearer, effect: ignite } }
            then:
              - { op: macro, id: explode }

prayer.dragon:
  archetype: Prayer
  element: Dragon
  name: Dragon's Slumber
  description: >-
    All allies heal 20 and gain 10 Shield. Then the user falls Asleep for up to 3 turns, and all
    allies heal 20 at the end of each of the user's turns while they're Asleep.
  cost: WS
  cooldown: 3
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - { op: apply, to: targets, effect: shield, value: 10 }
    - { op: apply, to: actor, effect: sleep, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: dragons_slumber
        name: Dragon's Slumber
        kind: Buff
        element: Dragon
        description: While the bearer sleeps, all their allies heal 20 at the end of their turn.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { has: { unit: bearer, effect: sleep } }
                then:
                  - { op: heal, to: allAllies, amount: 20 }
                else:
                  - { op: removeSelf }

cleave.dragon:
  archetype: Cleave
  element: Dragon
  name: Wildfire Wing
  description: >-
    Deals 15 damage to target enemy and gives them Dragonfire. A random other enemy is Ignited, or
    gains Dragonfire if they already were. At the end of the user's next turn, if the target still
    has Dragonfire, this happens once more to a random other enemy.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: forEach, in: primary, do: [{ op: macro, id: dragonfire_it }] }
    - { op: forEach, in: { randomEnemy: 1, exclude: primary }, do: [{ op: macro, id: ignite_or_dragonfire_it }] }
    # Applied after the Dragonfire, so it ticks after that Dragonfire has burned. Stacks: 1 on the turn
    # of use (that tick only primes it), 2 on the user's next turn, when it spreads.
    - op: apply
      to: primary
      duration: { ownTurns: 1 }
      effect:
        id: wildfire_wing
        name: Wildfire
        kind: Debuff
        element: Dragon
        stacking: unique
        maxStacks: 2
        description: >-
          At the end of the applier's next turn, if the bearer still has Dragonfire, a random other enemy is
          Ignited, or gains Dragonfire if they already were.
        triggers:
          - on: turnEnd
            do:
              - op: if
                cond: { compare: { value: { effectStacks: true }, atMost: 1 } }
                then: [{ op: addStacksSelf, amount: 1 }]
                else:
                  - op: if
                    cond: { has: { unit: bearer, effect: dragonfire } }
                    then:
                      - op: forEach
                        in: { randomEnemy: 1, exclude: bearer }
                        do:
                          - { op: macro, id: ignite_or_dragonfire_it }

shout.dragon:
  archetype: Shout
  element: Dragon
  name: Terrible Roar
  description: All enemies are Intimidated for 2 turns. For as long, each time one of them is healed, they're Ignited.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: intimidated, duration: { enemyTurns: 2 } }
    - op: apply
      to: targets
      duration: { enemyTurns: 2 }
      effect:
        id: terrible_roar
        name: Terrible Roar
        kind: Debuff
        element: Dragon
        description: Each time the bearer is healed, they're Ignited.
        triggers:
          - on: healed
            do:
              - { op: apply, to: bearer, effect: ignite }

withstand.dragon:
  archetype: Withstand
  element: Dragon
  name: Furnace Hide
  description: >-
    A random enemy gains Dragonfire. For 2 turns, it doesn't deal damage, and at the end of each of
    the user's turns, if that enemy still has it, the user gains 15 Shield for 1 turn. When the 2
    turns end, that enemy loses their Dragonfire and Ignite.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: forEach
      in: { randomEnemy: 1 }
      do:
        - { op: macro, id: dragonfire_it }
        - { op: apply, to: it, effect: banked_fire, duration: { enemyTurns: 2 } }

taunt.dragon:
  archetype: Taunt
  element: Dragon
  name: Wyrm's Domain
  description: >-
    Taunts target enemy for 2 turns. Meanwhile, any other enemy who uses a Harmful skill on the user or
    their allies takes 10 damage.
  cost: S
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: apply, to: primary, effect: taunt, duration: { enemyTurns: 2 } }
    - op: apply
      to: allAllies
      duration: { enemyTurns: 2 }
      effect:
        id: wyrms_domain
        name: Wyrm's Domain
        kind: Buff
        element: Dragon
        description: Any enemy not Taunted by the applier who uses a Harmful skill on the bearer takes 10 damage.
        triggers:
          - on: skillTargeted
            when: { harmful: true, side: enemy }
            do:
              - op: if
                cond: { not: { has: { unit: eventSource, effect: taunt, mine: true } } }
                then:
                  - { op: damage, to: eventSource, amount: 10 }

titan.dragon:
