titan.ghost:
  archetype: Titan
  element: Ghost
  name: Second Haunting
  description: >-
    For 3 turns, the user is Spectral, but Piercing and Affliction damage hurt them 5 more. The first time
    a hit would leave them at 1 HP or less meanwhile, they vanish instead and return at the start of their
    next turn with 30 HP.
  cost: SW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: spectral, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: second_haunting
        name: Second Haunting
        kind: Buff
        element: Ghost
        description: >-
          Piercing and Affliction damage hurt the bearer 5 more; the first time a hit would leave them at
          1 HP or less, they vanish and return next turn with 30 HP.
        modifiers:
          - { mod: damageTaken, amount: 5, when: { types: [Piercing, Affliction] } }
          - { mod: hpFloor, amount: 1 }
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { hpAtMost: { unit: bearer, value: 1 } }
                then:
                  - { op: removeSelf }
                  - { op: apply, to: bearer, effect: vanished }

