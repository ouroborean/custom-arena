# The 30 Ninja (Wind + Shadow) variants, from the "Fusion Spec Kits" design doc.
# Shadow Clones (macro `make_clone`, max 3): Flurry is the Ninja's passive; Substitution is a Ward
# from each Clone onto its Ninja.

strike.ninja:
  archetype: Strike
  element: Ninja
  name: Twin Strike
  description: Deals 20 damage to target enemy; the user creates a Clone if they have none.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: if
      cond: { not: { any: { in: allAllies, cond: { minion: { unit: it, types: [shadow_clone] } } } } }
      then: [{ op: macro, id: make_clone }]

smash.ninja:
  archetype: Smash
  element: Ninja
  name: Whirlwind of Blades
  description: >-
    Deals 20 damage to target enemy and 10 to the others. If the user has 3 Clones, each is destroyed and deals
    10 damage to a random enemy; otherwise the user creates a Clone.
  cost: Ar
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: damage, to: primaryAllies, amount: 10 }
    - op: if
      cond: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }, atLeast: 3 } }
      then:
        - op: forEach
          in: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } }
          do:
            - { op: damage, to: { randomEnemy: 1 }, amount: 10, direct: false }
            - { op: kill, to: it }
      else:
        - { op: macro, id: make_clone }

charge.ninja:
  archetype: Charge
  element: Ninja
  name: Blur
  description: >-
    The user creates a Clone, and their next Harmful skill Flurries twice.
  cost: r
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: macro, id: make_clone }
    # Read and spent by the Flurry passive.
    - op: apply
      to: actor
      effect:
        id: blur
        name: Blur
        kind: Buff
        element: Ninja
        stacking: unique
        description: The bearer's next Harmful skill Flurries twice.

riposte.ninja:
  archetype: Riposte
  element: Ninja
  name: Log Trick
  description: >-
    For 1 turn, counters the first Harmful skill used on the user; the user creates a Clone, then that skill's
    user takes 10 Piercing damage per Clone the user has. Invisible.
  cost: A
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: log_trick
        name: Log Trick
        kind: Buff
        element: Ninja
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer; the bearer creates a Clone, then that skill's user takes 10 Piercing damage per Clone.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: macro, id: make_clone }
              - { op: damage, to: eventSource, type: Piercing, amount: { mul: [10, { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }] } }

rage.ninja:
  archetype: Rage
  element: Ninja
  name: Shadow Army
  description: >-
    The user creates 2 Clones. For 3 turns, they're Immune and gain 1 Might whenever one of their Clones is
    destroyed.
  cost: SS
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: macro, id: make_clone }
    - { op: macro, id: make_clone }
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: shadow_army
        name: Shadow Army
        kind: Buff
        element: Ninja
        description: Each Clone destroyed gives 1 Might while this lasts.
        triggers:
          - on: signal
            signal: clone_destroyed
            when: { side: ally }
            do:
              - { op: apply, to: bearer, effect: might, linkTo: shadow_army }

shot.ninja:
  archetype: Shot
  element: Ninja
  name: Shuriken
  description: >-
    Three separate hits of 5 damage to target enemy. Everything that adds to or cuts a hit, like Might,
    Vulnerable or Armor, applies to each.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - { op: damage, to: primary, amount: 5 }
    - { op: damage, to: primary, amount: 5 }

snipe.ninja:
  archetype: Snipe
  element: Ninja
  name: Hidden Needle
  description: >-
    On the following turn, target enemy loses half their current HP as Affliction damage. The target of this
    skill is invisible. Channeled.
  cost: Arr
  cooldown: 2
  tags: [Harmful, Strategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: hidden_needle
        name: Hidden Needle (aiming)
        kind: Neutral
        element: Ninja
        visibility: hiddenTarget
        interruptible: true
        description: At the end of the following turn, its target loses half their current HP.
        onExpire:
          - op: forEach
            in: effectTargets
            do:
              - { op: damage, to: it, amount: { div: [{ hp: it }, 2] }, type: Affliction, direct: false }

trap.ninja:
  archetype: Trap
  element: Ninja
  name: Paper Seal
  description: >-
    For 3 turns, whenever target enemy gains a Buff, they take 10 Piercing damage and the Buff lasts 1 turn
    less. Invisible.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 3 }
      effect:
        id: paper_seal
        name: Paper Seal
        kind: Debuff
        element: Ninja
        visibility: hidden
        description: Each Buff the bearer gains deals them 10 Piercing damage and lasts 1 turn less.
        triggers:
          - on: effectGained
            when: { kind: Buff }
            do:
              - { op: damage, to: bearer, amount: 10, type: Piercing, direct: false }
              - { op: eventEffect, extendBy: -2 }

maneuver.ninja:
  archetype: Maneuver
  element: Ninja
  name: Vanishing Smoke
  description: >-
    The user destroys a Clone, if they have one, to gain Stealth; otherwise they become Invulnerable for 1 turn
    and create a Clone.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: if
      cond: { any: { in: allAllies, cond: { minion: { unit: it, types: [shadow_clone] } } } }
      then:
        - { op: kill, to: { randomAlly: 1, where: { minion: { unit: it, types: [shadow_clone] } } } }
        - { op: apply, to: actor, effect: stealth, duration: { enemyTurns: 2 } }
      else:
        - { op: apply, to: actor, effect: invulnerable, duration: { enemyTurns: 1 } }
        - { op: macro, id: make_clone }

companion.ninja:
  archetype: Companion
  element: Ninja
  name: Ninken
  description: >-
    Summons a Ninken (30 HP) permanently. Snap (r): 10 Piercing damage. Track (r, cooldown 2): every enemy
    loses Stealth and can't gain it for 1 turn.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: ninken }

bolt.ninja:
  archetype: Bolt
  element: Ninja
  name: Pinning Kunai
  description: >-
    Deals 20 damage to target enemy, who is Marked for 1 turn. For as long, they can't gain mobility buffs, and
    they lose their Swiftness.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: mark, duration: { enemyTurns: 1 } }
    - { op: removeEffect, from: primary, effect: swiftness }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: pinning_kunai
        name: Pinned
        kind: Debuff
        element: Ninja
        description: Can't gain mobility buffs.
        modifiers:
          - { mod: immuneToEffects, effects: [swiftness, rushing, leaping] }

blast.ninja:
  archetype: Blast
  element: Ninja
  name: Thousand Blades
  description: Deals 20 damage to all enemies. If the user has no Clones, they create 3 first.
  cost: Irr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - op: if
      cond: { not: { any: { in: allAllies, cond: { minion: { unit: it, types: [shadow_clone] } } } } }
      then:
        - { op: macro, id: make_clone }
        - { op: macro, id: make_clone }
        - { op: macro, id: make_clone }
    - { op: damage, to: targets, amount: 20 }

consume.ninja:
  archetype: Consume
  element: Ninja
  name: Steal Sight
  description: >-
    Deals 5 damage to target enemy, healing the user for it; then the user destroys all their Clones, healing 10
    per Clone, or creates one if they have none.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    - { op: set, var: absorbed, value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } } }
    - op: if
      cond: { compare: { value: { var: absorbed }, atLeast: 1 } }
      then:
        - { op: kill, to: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }
        - { op: heal, to: actor, amount: { sum: [5, { mul: [10, { var: absorbed }] }] } }
      else:
        - { op: heal, to: actor, amount: 5 }
        - { op: macro, id: make_clone }

summon.ninja:
  archetype: Summon
  element: Ninja
  name: Shadow Doubles
  description: The user creates 3 Clones.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: macro, id: make_clone }
    - { op: macro, id: make_clone }
    - { op: macro, id: make_clone }

channel.ninja:
  archetype: Channel
  element: Ninja
  name: Blade Tornado
  description: >-
    For 2 turns, at the end of each of the user's turns, they create a Clone; then 10 damage to all enemies,
    and every Clone Flurries each of them. Channeled.
  cost: AI
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: blade_tornado
        name: Blade Tornado
        kind: Neutral
        element: Ninja
        interruptible: true
        description: Each turn, a new Clone, 10 damage to all enemies, and a Flurry on each.
        triggers:
          - on: turnEnd
            do:
              - { op: macro, id: make_clone }
              - { op: damage, to: allEnemies, amount: 10 }
              - { op: damage, to: allEnemies, type: Piercing, direct: false, amount: { mul: [5, { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }] } }

stab.ninja:
  archetype: Stab
  element: Ninja
  name: Second Draw
  description: >-
    Deals 5 damage to target enemy, and a Clone is set on them (a new one, unless the user already has 3): if
    it's still alive at the start of the user's next turn, it deals them 15 damage and is destroyed.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 5 }
    # The new Clone waits in the blind spot; at 3 Clones, one of them goes instead.
    - op: if
      cond: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }, atMost: 2 } }
      then:
        - { op: macro, id: make_clone }
        - op: apply
          to: lastSummoned
          remember: primary
          duration: { raw: 2 }
          effect: &blind_spot
            id: blind_spot
            name: Blind Spot
            kind: Neutral
            element: Ninja
            description: At the start of its owner's next turn, the bearer deals 15 damage to the enemy it was set on and is destroyed.
            onExpire:
              - { op: damage, to: effectTargets, amount: 15 }
              - { op: kill, to: bearer }
      else:
        - op: forEach
          in: { randomAlly: 1, where: { minion: { unit: it, types: [shadow_clone] } } }
          do:
            - { op: apply, to: it, remember: primary, duration: { raw: 2 }, effect: *blind_spot }

ravage.ninja:
  archetype: Ravage
  element: Ninja
  name: Quickdraw
  description: >-
    For 1 turn, the first time target enemy uses a skill, they take 30 Piercing damage before it takes effect;
    if they use none, they take 20 Piercing damage as the turn ends.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: quickdraw
        name: Quickdraw
        kind: Debuff
        element: Ninja
        description: The bearer's next skill deals them 30 Piercing damage first; if they use none, 20 when this ends.
        triggers:
          - on: skillUsed
            consume: true
            do:
              - { op: damage, to: bearer, amount: 30, type: Piercing }
        onExpire:
          - { op: damage, to: bearer, amount: 20, type: Piercing }

mislead.ninja:
  archetype: Mislead
  element: Ninja
  name: Feint
  description: >-
    For 1 turn, if target enemy uses a Harmful skill, it's countered and the user Leaps. If they don't, the user
    is Marked for 1 turn. Invisible.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: feint
        name: Feint
        kind: Debuff
        element: Ninja
        visibility: hidden
        description: The bearer's next Harmful skill is countered and the applier Leaps; if they use none, the applier is Marked.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - op: forEach
                in: actor
                do:
                  - { op: macro, id: leap }
        onExpire:
          - { op: apply, to: actor, effect: mark, duration: { enemyTurns: 1 } }

stun.ninja:
  archetype: Stun
  element: Ninja
  name: Pressure Point
  description: >-
    Deals 10 damage to target enemy. At the end of their next turn, they're Stunned for 1 turn.
  cost: A
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: pressure_point
        name: Pressure Point
        kind: Debuff
        element: Ninja
        description: At the end of the bearer's next turn, they're Stunned for 1 turn.
        onExpire:
          - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }

dance.ninja:
  archetype: Dance
  element: Ninja
  name: Shadow Dance
  description: >-
    The user gains Stealth, 2 Clones and 1 Might for 3 turns; meanwhile, a skill that would end their Stealth
    destroys a Clone instead.
  cost: A
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: stealth, duration: { enemyTurns: 3 } }
    - { op: macro, id: make_clone }
    - { op: macro, id: make_clone }
    - { op: apply, to: actor, effect: might, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: shadow_dance
        name: Shadow Dance
        kind: Buff
        element: Ninja
        description: While the bearer has a Clone, their skills are Stealthy; each non-Stealthy skill costs a Clone.
        modifiers:
          - { mod: nextSkillStealthy, if: { any: { in: allAllies, cond: { minion: { unit: it, types: [shadow_clone] } } } } }
        triggers:
          - on: skillUsed
            do:
              - op: if
                cond: { not: { eventSkill: { tags: [Stealthy] } } }
                then: [{ op: kill, to: { randomAlly: 1, where: { minion: { unit: it, types: [shadow_clone] } } } }]

heal.ninja:
  archetype: Heal
  element: Ninja
  name: Field Dressing
  description: >-
    Target ally heals 30 and falls Asleep for 2 turns; when they wake, they begin Rushing and gain 1 Swiftness.
  cost: A
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 30 }
    - { op: apply, to: primary, effect: sleep, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: field_dressing
        name: Field Dressing
        kind: Neutral
        element: Ninja
        description: When the bearer wakes, they begin Rushing with 1 Swiftness.
        triggers:
          - on: ownEffectEnded
            when: { effects: [sleep] }
            consume: true
            do:
              - { op: apply, to: eventTarget, effect: rushing }
              - { op: apply, to: eventTarget, effect: swiftness, duration: { enemyTurns: 1 } }

bless.ninja:
  archetype: Bless
  element: Ninja
  name: Cloak of Shadows
  description: >-
    Target ally gains 1 Swiftness, and the user creates a Clone; for 2 turns, the user's Clones Substitute for
    that ally too.
  cost: r
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: apply, to: primary, effect: swiftness, duration: { enemyTurns: 2 } }
    - { op: macro, id: make_clone }
    - op: forEach
      in: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } }
      do:
        - { op: apply, to: primary, effect: substitution, from: it, bindTo: it, duration: { enemyTurns: 2 } }

curse.ninja:
  archetype: Curse
  element: Ninja
  name: Haunting Shadows
  description: >-
    The user creates a Clone. For 2 turns, each skill target enemy uses draws a Flurry on them.
  cost: A
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: macro, id: make_clone }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: haunting_shadows
        name: Haunting Shadows
        kind: Debuff
        element: Ninja
        description: Each skill the bearer uses draws a Flurry on them (5 Piercing per Clone on the applier's side).
        triggers:
          - on: skillUsed
            do:
              - { op: damage, to: bearer, type: Piercing, direct: false, amount: { mul: [5, { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }] } }

smite.ninja:
  archetype: Smite
  element: Ninja
  name: Shadow Mark
  description: Deals 20 damage to target enemy. For 1 turn, each ally who damages them gives the user a Clone.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: shadow_mark
        name: Shadow Mark
        kind: Debuff
        element: Ninja
        description: Each hit from the applier's side gives the applier a Clone.
        triggers:
          - on: damaged
            when: { direct: true, fromSide: ally }
            do:
              - { op: macro, id: make_clone }

prayer.ninja:
  archetype: Prayer
  element: Ninja
  name: Scatter
  description: All allies heal 20. For 1 turn, each ally an enemy skill targets gains Stealth.
  cost: Wrr
  cooldown: 2
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 20 }
    - op: apply
      to: targets
      duration: { enemyTurns: 1 }
      effect:
        id: scatter
        name: Scatter
        kind: Buff
        element: Ninja
        description: When targeted by an enemy skill, the bearer gains Stealth.
        triggers:
          - on: skillTargeted
            when: { side: enemy }
            consume: true
            do:
              - { op: apply, to: bearer, effect: stealth, duration: { enemyTurns: 1 } }

cleave.ninja:
  archetype: Cleave
  element: Ninja
  name: Shadow Whirl
  description: >-
    The user creates a Clone. Deals 10 damage to target enemy, and this skill's Flurry hits every enemy, not
    just them. Stealthy.
  cost: Sr
  cooldown: 1
  tags: [Harmful, NonStrategic, Stealthy]
  target: enemy
  ops:
    - { op: macro, id: make_clone }
    # The Flurry passive spreads this skill's Flurry to every enemy.
    - { op: damage, to: primary, amount: 10 }

shout.ninja:
  archetype: Shout
  element: Ninja
  name: Smoke Bomb
  description: >-
    All enemies are Intimidated for 2 turns. Then every character on both sides, the user included, gains
    Stealth for 2 turns.
  cost: A
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: intimidated, duration: { enemyTurns: 2 } }
    - { op: apply, to: { filter: allUnits, where: { kind: { unit: it, is: character } } }, effect: stealth, duration: { enemyTurns: 2 } }

withstand.ninja:
  archetype: Withstand
  element: Ninja
  name: Shadow Guard
  description: >-
    The user creates a Clone, then each of their Clones gains 20 Shield for 1 turn.
  cost: A
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: macro, id: make_clone }
    - { op: apply, to: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } }, effect: shield, value: 20, duration: { enemyTurns: 1 } }

taunt.ninja:
  archetype: Taunt
  element: Ninja
  name: Mocking Shadows
  description: >-
    Every Clone on the user's side is destroyed, and target enemy is Taunted by the user for 1 turn, plus 1 turn
    per Clone destroyed (up to 3 turns).
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: set, var: spent, value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } } }
    - { op: kill, to: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }
    - op: apply
      to: primary
      effect: taunt
      duration: { enemyTurns: { if: { compare: { value: { var: spent }, atLeast: 2 } }, then: 3, else: { sum: [1, { var: spent }] } } }

titan.ninja:
  archetype: Titan
  element: Ninja
  name: Shadow Master
  description: >-
    The user creates Clones until they have 2. For 3 turns, they gain Immune, and enemies can't target them
    until their side has no Clones left.
  cost: AW
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: repeat
      times: 2
      do:
        - op: if
          cond: { compare: { value: { countOf: { filter: allAllies, where: { minion: { unit: it, types: [shadow_clone] } } } }, atMost: 1 } }
          then: [{ op: macro, id: make_clone }]
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: shadow_master
        name: Shadow Master
        kind: Buff
        element: Ninja
        description: Enemies can't target the bearer until their side has no Shadow Clones left.
        modifiers:
          - { mod: untargetable, by: enemies, bypassable: true }
        triggers:
          - on: signal
            signal: clone_destroyed
            when: { side: ally }
            do:
              - op: if
                cond: { not: { any: { in: allAllies, cond: { minion: { unit: it, types: [shadow_clone] } } } } }
                then: [{ op: removeSelf }]

