# The 30 Crystal (Ice + Ice) variants, from the "Fusion Spec Kits" design doc. Ids are "<base>.crystal".
# Keywords: Brittle (max 3; shatters at 3) and Diamond (no hit takes more than 15 HP).

strike.crystal:
  archetype: Strike
  element: Crystal
  name: Faceted Hammer
  description: >-
    Deals 20 damage and 1 Brittle to target enemy. Each of their other Frost debuffs ends, and they
    gain 1 more Brittle for each one.
  cost: I
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: brittle }
    - { op: forEach, in: primary, do: [{ op: macro, id: crystallize_it }] }

smash.crystal:
  archetype: Smash
  element: Crystal
  name: Crystal Quake
  description: >-
    Deals 25 damage and 1 Brittle to target enemy. Then their Brittle is removed, and each of their
    allies takes 10 damage per stack.
  cost: Sr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 25 }
    - { op: apply, to: primary, effect: brittle }
    - { op: set, var: shards, value: { stacks: { unit: primary, effect: brittle } } }
    - { op: removeEffect, from: primary, effect: brittle }
    - { op: damage, to: primaryAllies, amount: { mul: [10, { var: shards }] } }

charge.crystal:
  archetype: Charge
  element: Crystal
  name: Shard Rush
  description: >-
    Deals 15 damage and 1 Brittle to target enemy, and the user has Diamond until they next use a
    skill.
  cost: S
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: brittle }
    - { op: apply, to: actor, effect: diamond, until: { skillUsed: {} } }

riposte.crystal:
  archetype: Riposte
  element: Crystal
  name: Hoarfrost Guard
  description: >-
    For 1 turn, counters the first Harmful skill used on the user. Its user is Frostbitten for 2
    turns, and the user becomes Frostborn for as long, so that enemy can't target or damage them.
    Invisible.
  cost: I
  cooldown: 3
  tags: [Helpful, Strategic, Invisible]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 1 }
      effect:
        id: hoarfrost_guard
        name: Hoarfrost Guard
        kind: Buff
        element: Crystal
        visibility: hidden
        description: Counters the first Harmful skill used on the bearer, Frostbiting its user.
        triggers:
          - on: skillTargeted
            when: { harmful: true }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: eventSource, effect: frostbitten, duration: { enemyTurns: 2 } }
              - { op: apply, to: actor, effect: frostborn, duration: { enemyTurns: 2 } }

rage.crystal:
  archetype: Rage
  element: Crystal
  name: Flawless
  description: For 3 turns, the user gains Diamond and 2 Might, but can't be healed.
  cost: SI
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: diamond, duration: { enemyTurns: 3 } }
    - { op: apply, to: actor, effect: might, stacks: 2, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: flawless
        name: Flawless
        kind: Neutral
        element: Crystal
        description: Can't be healed.
        modifiers:
          - { mod: healingReceived, mul: 0 }

shot.crystal:
  archetype: Shot
  element: Crystal
  name: Rime Splinter
  description: Deals 15 damage to target enemy. For 1 turn, their Frost debuffs can't be removed and don't count down.
  cost: A
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    # "Don't count down for 1 turn": each is extended by the turn that passes.
    - { op: extendEffects, on: primary, effects: [frostbitten, chilled, numb, brittle], by: 2 }

snipe.crystal:
  archetype: Snipe
  element: Crystal
  name: Crystal Lance
  description: >-
    On the following turn, target enemy is hit 3 times, each hit dealing 5 Piercing damage and then
    giving them 1 Brittle. The target of this skill is invisible. Channeled.
  cost: AIr
  cooldown: 2
  tags: [Harmful, NonStrategic, Channeled, HiddenTarget]
  target: enemy
  ops:
    - op: apply
      to: actor
      remember: primary
      duration: { enemyTurns: 1 }
      effect:
        id: crystal_lance
        name: Crystal Lance (aiming)
        kind: Neutral
        element: Crystal
        visibility: hiddenTarget
        interruptible: true
        description: >-
          At the end of the following turn, unless interrupted, its target is hit 3 times for 5 Piercing
          damage, each hit giving them 1 Brittle.
        onExpire:
          - op: repeat
            times: 3
            do:
              - { op: damage, to: effectTargets, type: Piercing, amount: 5 }
              - { op: apply, to: effectTargets, effect: brittle }

trap.crystal:
  archetype: Trap
  element: Crystal
  name: Hairline Fracture
  description: For 2 turns, the first time target enemy uses a Harmful skill, their Brittle rises to 3. Invisible.
  cost: II
  cooldown: 3
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: hairline_fracture
        name: Hairline Fracture
        kind: Debuff
        element: Crystal
        visibility: hidden
        description: The first time the bearer uses a Harmful skill, their Brittle rises to 3.
        triggers:
          - on: skillUsed
            when: { harmful: true }
            consume: true
            do:
              - op: apply
                to: bearer
                effect: brittle
                stacks: { sum: [3, { mul: [-1, { stacks: { unit: bearer, effect: brittle } }] }] }

maneuver.crystal:
  archetype: Maneuver
  element: Crystal
  name: Crystal Cocoon
  description: >-
    The user gains Diamond for 2 turns, and each enemy hit it caps gives the attacker 1 Brittle.
  cost: r
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: diamond, duration: { enemyTurns: 2 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 2 }
      effect:
        id: crystal_cocoon
        name: Crystal Cocoon
        kind: Buff
        element: Crystal
        description: Each enemy hit the bearer's Diamond caps gives the attacker 1 Brittle.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - op: if
                cond: { compare: { value: { counterOf: { unit: bearer, name: hit_capped } }, atLeast: 1 } }
                then:
                  - { op: apply, to: eventSource, effect: brittle }

companion.crystal:
  archetype: Companion
  element: Crystal
  name: Crystal Golem
  description: >-
    Summons a Crystal Golem (40 HP) permanently. Shard Burst (S): 10 damage and 1 Brittle to every
    enemy.
  cost: I
  cooldown: 1
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: crystal_golem }

bolt.crystal:
  archetype: Bolt
  element: Crystal
  name: Quartz Spike
  description: >-
    Deals 20 damage to target enemy. If they have a Buff, a random one ends, and they gain 2
    Brittle. If they have no Buffs, they gain 1 Brittle.
  cost: Ir
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: if
      cond: { hasKind: { unit: primary, kind: Buff } }
      then:
        - { op: removeRandom, from: primary, kind: Buff }
        - { op: apply, to: primary, effect: brittle, stacks: 2 }
      else:
        - { op: apply, to: primary, effect: brittle }

blast.crystal:
  archetype: Blast
  element: Crystal
  name: Hard Freeze
  description: >-
    Deals 25 damage to all enemies. On each of them, Chilled becomes Frostbitten, and Numb becomes
    Chilled, each for 2 turns.
  cost: Irr
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 25 }
    - op: forEach
      in: targets
      do:
        - op: if
          cond: { has: { unit: it, effect: chilled } }
          then:
            - { op: removeEffect, from: it, effect: chilled }
            - { op: apply, to: it, effect: frostbitten, duration: { enemyTurns: 2 } }
          else:
            - op: if
              cond: { has: { unit: it, effect: numb } }
              then:
                - { op: removeEffect, from: it, effect: numb }
                - { op: apply, to: it, effect: chilled, duration: { enemyTurns: 2 } }

consume.crystal:
  archetype: Consume
  element: Crystal
  name: Harvest Shards
  description: >-
    Deals 10 damage and 1 Brittle to target enemy. Then all their Brittle is removed, and the user
    gains 10 Shield per stack.
  cost: r
  cooldown: 2
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: apply, to: primary, effect: brittle }
    - { op: set, var: shards, value: { stacks: { unit: primary, effect: brittle } } }
    - { op: removeEffect, from: primary, effect: brittle }
    - op: if
      cond: { compare: { value: { var: shards }, atLeast: 1 } }
      then:
        - { op: apply, to: actor, effect: shield, value: { mul: [10, { var: shards }] } }

summon.crystal:
  archetype: Summon
  element: Crystal
  name: Sentinel Shards
  description: >-
    Summons 2 Sentinels (15 HP, always have Diamond) for 3 turns. Glint (r): 10 damage and 1
    Brittle.
  cost: Ir
  cooldown: 2
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: summon, minion: sentinel, count: 2, duration: { enemyTurns: 3 } }

channel.crystal:
  archetype: Channel
  element: Crystal
  name: Accretion
  description: >-
    For 3 turns, at the end of each of the user's turns, every enemy without Brittle gains 1, and
    every enemy with Brittle takes 10 damage. Channeled.
  cost: I
  cooldown: 3
  tags: [Harmful, NonStrategic, Channeled]
  target: allEnemies
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: accretion
        name: Accretion
        kind: Neutral
        element: Crystal
        interruptible: true
        description: At the end of each of the user's turns, enemies without Brittle gain 1; those with it take 10 damage.
        triggers:
          - on: turnEnd
            do:
              - op: forEach
                in: allEnemies
                do:
                  - op: if
                    cond: { has: { unit: it, effect: brittle } }
                    then:
                      - { op: damage, to: it, amount: 10 }
                    else:
                      - { op: apply, to: it, effect: brittle }

stab.crystal:
  archetype: Stab
  element: Crystal
  name: Ice Pick
  description: >-
    Deals 10 damage to target enemy, or 20 if they're at or below 60 HP. It removes one of their
    Frost debuffs, other than Brittle, for 10 more damage.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - op: set
      var: chip
      value:
        if:
          or:
            - { has: { unit: primary, effect: frostbitten } }
            - { has: { unit: primary, effect: chilled } }
            - { has: { unit: primary, effect: numb } }
        then: 10
        else: 0
    - op: if
      cond: { has: { unit: primary, effect: frostbitten } }
      then: [{ op: removeEffect, from: primary, effect: frostbitten }]
      else:
        - op: if
          cond: { has: { unit: primary, effect: chilled } }
          then: [{ op: removeEffect, from: primary, effect: chilled }]
          else: [{ op: removeEffect, from: primary, effect: numb }]
    - op: damage
      to: primary
      amount: { sum: [{ if: { hpAtMost: { unit: it, value: 60 } }, then: 20, else: 10 }, { var: chip }] }

ravage.crystal:
  archetype: Ravage
  element: Crystal
  name: Breaking Point
  description: >-
    Deals 40 Piercing damage to target enemy, and the user gains 1 Brittle.
  cost: Ar
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 40, type: Piercing }
    - { op: apply, to: actor, effect: brittle }

mislead.crystal:
  archetype: Mislead
  element: Crystal
  name: Frozen Gambit
  description: >-
    For 2 turns, the first Harmful skill target enemy uses that costs 2 or more energy is countered, and
    they gain 1 Brittle for each energy it cost. Invisible.
  cost: I
  cooldown: 2
  tags: [Harmful, Strategic, Invisible]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: frozen_gambit
        name: Frozen Gambit
        kind: Debuff
        element: Crystal
        visibility: hidden
        description: The bearer's first Harmful skill costing 2 or more is countered, and they gain 1 Brittle per energy it cost.
        triggers:
          - on: skillUsed
            when: { harmful: true, costAtLeast: 2 }
            intercept: counter
            consume: true
            do:
              - { op: apply, to: bearer, effect: brittle, stacks: { skillCost: true } }

stun.crystal:
  archetype: Stun
  element: Crystal
  name: Encrust
  description: >-
    Deals 15 damage to target enemy, who is Stunned for 2 turns and has Diamond for 2 turns.
  cost: AI
  cooldown: 3
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 15 }
    - { op: apply, to: primary, effect: stun, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: diamond, duration: { enemyTurns: 2 } }

dance.crystal:
  archetype: Dance
  element: Crystal
  name: Perfect Form
  description: >-
    For 4 turns, the user gains 2 Might, 2 Swiftness and 1 Focus. The first single hit of 25 or more
    damage on them ends all of it, and the user is Stunned for 1 turn.
  cost: AI
  cooldown: 5
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      duration: { enemyTurns: 4 }
      effect:
        id: perfect_form
        name: Perfect Form
        kind: Buff
        element: Crystal
        description: 2 Might, 2 Swiftness and 1 Focus. A single hit of 25 or more ends it and Stuns the bearer for 1 turn.
        modifiers:
          - { mod: damageDealt, amount: 10, when: { direct: true } }
          - { mod: costGeneric, amount: -1 }
        triggers:
          - on: damaged
            do:
              - op: if
                cond: { compare: { value: { eventAmount: true }, atLeast: 25 } }
                then:
                  - { op: removeEffect, from: bearer, effect: swiftness }
                  - { op: apply, to: bearer, effect: stun, duration: { enemyTurns: 1 } }
                  - { op: removeSelf }
    - { op: apply, to: actor, effect: swiftness, stacks: 2, duration: { enemyTurns: 4 } }

heal.crystal:
  archetype: Heal
  element: Crystal
  name: Faceted Ward
  description: Target ally heals 20. For 2 turns, they can't lose more than 25 HP in a single turn.
  cost: W
  cooldown: 1
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - { op: heal, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: faceted_ward
        name: Faceted Ward
        kind: Buff
        element: Crystal
        description: Can't lose more than 25 HP in a single turn.
        modifiers:
          - { mod: maxHpLossPerTurn, amount: 25 }

bless.crystal:
  archetype: Bless
  element: Crystal
  name: Diamond Skin
  description: Target ally gains Diamond for 2 turns. When it ends, they heal half the damage it prevented, up to 30.
  cost: I
  cooldown: 2
  tags: [Helpful, Strategic]
  target: ally
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: diamond_skin
        name: Diamond Skin
        kind: Buff
        element: Crystal
        description: Diamond. When it ends, the bearer heals half the damage it prevented, up to 30.
        modifiers:
          - { mod: maxHpLossPerHit, amount: 15 }
        onExpire:
          - op: heal
            to: bearer
            amount:
              if: { compare: { value: { effectData: prevented }, atLeast: 60 } }
              then: 30
              else: { div: [{ effectData: prevented }, 2] }

curse.crystal:
  archetype: Curse
  element: Crystal
  name: Fault Lines
  description: For 2 turns, target enemy gains 1 Brittle each time they use a skill.
  cost: I
  cooldown: 2
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - op: apply
      to: primary
      duration: { enemyTurns: 2 }
      effect:
        id: fault_lines
        name: Fault Lines
        kind: Debuff
        element: Crystal
        description: Gains 1 Brittle each time they use a skill.
        triggers:
          - on: skillUsed
            do: [{ op: apply, to: bearer, effect: brittle }]

smite.crystal:
  archetype: Smite
  element: Crystal
  name: Cold Clarity
  description: Deals 20 damage to target enemy. For 1 turn, allies who damage them become Frostborn for 1 turn.
  cost: W
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - op: apply
      to: primary
      duration: { enemyTurns: 1 }
      effect:
        id: cold_clarity
        name: Cold Clarity
        kind: Debuff
        element: Crystal
        description: Enemies who damage the bearer become Frostborn for 1 turn.
        triggers:
          - on: damaged
            when: { byEnemy: true }
            do:
              - { op: apply, to: eventSource, effect: frostborn, duration: { enemyTurns: 1 } }

prayer.crystal:
  archetype: Prayer
  element: Crystal
  name: Diamond Choir
  description: All allies heal 15 and gain Diamond for 1 turn.
  cost: Ir
  cooldown: 3
  tags: [Helpful, Strategic]
  target: allAllies
  ops:
    - { op: heal, to: targets, amount: 15 }
    - { op: apply, to: targets, effect: diamond, duration: { enemyTurns: 1 } }

cleave.crystal:
  archetype: Cleave
  element: Crystal
  name: Seeking Shards
  description: >-
    Deals 20 damage and 1 Brittle to target enemy, then all their Brittle moves to a random other
    enemy, who takes 10 damage.
  cost: S
  cooldown: 1
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 20 }
    - { op: apply, to: primary, effect: brittle }
    - op: forEach
      in: { randomEnemy: 1, exclude: primary }
      do:
        - { op: moveEffects, from: primary, to: it, effects: [brittle] }
        - { op: damage, to: it, amount: 10 }

shout.crystal:
  archetype: Shout
  element: Crystal
  name: Glass Harmonic
  description: >-
    All enemies are Intimidated for 2 turns. Every unit on the field, the user's side included,
    loses its Shield and is Shattered for 1 turn.
  cost: I
  cooldown: 3
  tags: [Harmful, Strategic]
  target: allEnemies
  ops:
    - { op: apply, to: targets, effect: intimidated, duration: { enemyTurns: 2 } }
    - { op: removeShields, from: allUnits }
    - { op: apply, to: allUnits, effect: shattered, duration: { enemyTurns: 1 } }

withstand.crystal:
  archetype: Withstand
  element: Crystal
  name: Latticework
  description: >-
    The user gains 30 Shield for 2 turns, linked to every ally: damage any ally takes comes out of it first.
  cost: I
  cooldown: 3
  tags: [Helpful, Strategic]
  target: self
  ops:
    - op: apply
      to: actor
      value: 30
      duration: { enemyTurns: 2 }
      effect:
        id: latticework
        name: Latticework
        kind: Buff
        element: Crystal
        shield: true
        description: A Shield shared with every ally.
    - op: apply
      to: { filter: allAllies, where: { not: { isActor: it } } }
      linkTo: latticework
      duration: { enemyTurns: 2 }
      effect:
        id: latticework_link
        name: Latticework (linked)
        kind: Buff
        element: Crystal
        description: Damage to the bearer comes out of the Latticework Shield first.
        modifiers:
          - { mod: borrowShield }

taunt.crystal:
  archetype: Taunt
  element: Crystal
  name: Crystal Effigy
  description: >-
    Raises a Crystal Effigy (30 HP, always has Diamond) for 2 turns; target enemy is Taunted by it for as
    long. Each enemy hit on it gives the attacker 1 Brittle.
  cost: r
  cooldown: 3
  tags: [Harmful, Strategic]
  target: enemy
  ops:
    - { op: summon, minion: crystal_effigy, duration: { enemyTurns: 2 } }
    - { op: apply, to: primary, effect: taunt, from: lastSummoned, duration: { enemyTurns: 2 } }

titan.crystal:
  archetype: Titan
  element: Crystal
  name: Diamond Colossus
  description: >-
    For 3 turns, the user gains Diamond and Immune. When it ends, every enemy gains 2 Brittle.
  cost: WI
  cooldown: 4
  tags: [Helpful, Strategic]
  target: self
  ops:
    - { op: apply, to: actor, effect: immune, duration: { enemyTurns: 3 } }
    - op: apply
      to: actor
      duration: { enemyTurns: 3 }
      effect:
        id: diamond_colossus
        name: Diamond Colossus
        kind: Buff
        element: Crystal
        description: Diamond. When it ends, every enemy gains 2 Brittle.
        modifiers:
          - { mod: maxHpLossPerHit, amount: 15 }
        onExpire:
          - { op: apply, to: allEnemies, effect: brittle, stacks: 2 }

# Minion skills.

golem_shard_slam:
  archetype: Minion
  element: Crystal
  name: Shard Burst
  description: Deals 10 damage and 1 Brittle to every enemy.
  cost: S
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: allEnemies
  ops:
    - { op: damage, to: targets, amount: 10 }
    - { op: apply, to: targets, effect: brittle }

sentinel_glint:
  archetype: Minion
  element: Crystal
  name: Glint
  description: Deals 10 damage and 1 Brittle to target enemy.
  cost: r
  cooldown: 0
  tags: [Harmful, NonStrategic]
  target: enemy
  ops:
    - { op: damage, to: primary, amount: 10 }
    - { op: apply, to: primary, effect: brittle }
