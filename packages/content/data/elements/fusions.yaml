# Fusion elements (GDD §7.3), from the Element Arena codex's "Fusion recipe matrix": the element a
# skill takes with two infusions. The pair is unordered (Fire + Ice and Ice + Fire are both
# Apocalypse), and one element twice has its own fusion (Fire + Fire is Dragon): 10 base elements
# make 55 fusions. Listed by matrix row, each pair once. No skill has a fusion variant yet, so two
# infusions on one skill are still reported as not in the game (they'd be ids like strike.dragon).

# Fire + …
dragon:       { name: Dragon,      elements: [Fire, Fire], passives: [wyrm_heart] }
apocalypse:   { name: Apocalypse,  elements: [Fire, Ice], passives: [thermal_shock] }
alchemy:      { name: Alchemy,     elements: [Fire, Water] }
plasma:       { name: Plasma,      elements: [Fire, Lightning], passives: [plasma_core] }
mechanic:     { name: Mechanic,    elements: [Fire, Wind] }
brimstone:    { name: Brimstone,   elements: [Fire, Poison] }
sun:          { name: Sun,         elements: [Fire, Earth], passives: [sun_heart] }
phoenix:      { name: Phoenix,     elements: [Fire, Holy] }
devil:        { name: Devil,       elements: [Fire, Unholy], passives: [devils_ledger] }
ritual:       { name: Ritual,      elements: [Fire, Shadow] }

