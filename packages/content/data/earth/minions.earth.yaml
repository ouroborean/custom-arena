# Earth minions (HP from the sheet). Seedlings are Seedling-type; Forest Stalker counts as one too.

boulder:
  name: Boulder
  hp: 45
  skills: []

seedling:
  name: Seedling
  hp: 15
  skills: [seedling_channel_earth]
  tags: [seedling]
  # Life's Bloom: a Seedling made by a Life character becomes a Treant if it survives.
  onSummon:
    - op: if
      cond: { has: { unit: summoner, effect: life_grove } }
      then:
        - { op: apply, to: actor, effect: bloom_timer, duration: { raw: 5 } }

forest_stalker:
  name: Forest Stalker
  hp: 50
  skills: [stalker_rootlash, seedling_channel_earth]
  tags: [seedling]

worldsprout:
  name: Worldsprout
  hp: 35
  skills: [worldsprout_treant_smash, worldsprout_vitality_transfer]
