# Keywords the game explains beside tooltips (hold Alt; on touch screens, always): see docs/glossary.md.
# `forms` are the exact, case-sensitive words that count as the keyword in a tooltip's text ("Chills",
# "Chilled"); each form belongs to one keyword. A `status` keyword takes that status's name and
# description unless it gives its own. A form followed by "skill"/"skills" ("your Charge skills")
# names a skill, not the keyword, and isn't explained.

# ---------------------------------------------------------------- damage

normal_damage:
  name: Normal damage
  text: "The default damage type. Reduced by Armor, absorbed by Shield."
  forms: [Normal damage]
piercing:
  name: Piercing
  text: "Damage type that ignores Armor but is absorbed by Shield."
  forms: [Piercing]
affliction:
  name: Affliction
  text: "Damage type that ignores Armor and Shield, and gets through Invulnerable when indirect."
  forms: [Affliction]
direct_damage:
  name: Direct damage
  text: "Damage dealt by a skill's use (including delayed hits like Snipe). Gets Might, Weakness and Vulnerable, and triggers \"on direct damage\" effects."
  forms: [direct damage, Direct damage]
indirect_damage:
  name: Indirect damage
  text: "Damage from triggered or ticking effects."
  forms: [indirect damage, Indirect damage]
ticking:
  name: Ticking effect
  text: "An effect with an end-of-turn payload (damage or healing over time, Renew, a channel, a minion's attack). It fires at the end of its applier's turn, in the order that player chooses."
  forms: [ticking, ticks]
bypass:
  name: Bypass
  text: "Ignores Invulnerable and Isolated."
  forms: [Bypass, Bypasses, Bypassing]
counter:
  name: Counter
  text: "Negates a skill as it's used. Its cost stays paid, and its cooldown starts."
  forms: [counter, counters, countered, Counter, Counters, Countered]
reflect:
  name: Reflect
  text: "A counter that also applies the skill to its user (or the user's team, for skills that hit a whole team)."
  forms: [reflect, reflects, reflected, Reflect, Reflects]

# ---------------------------------------------------------------- skills

harmful:
  name: Harmful / Helpful
  text: "Every skill is exactly one. Counters, Traps and Frostbitten key off Harmful."
  forms: [Harmful, Helpful]
strategic:
  name: Strategic
  text: "Skills that aren't explicitly directly damaging. Some stuns stop only Strategic or only non-Strategic skills."
  forms: [Strategic, NonStrategic]
channeled:
  name: Channeled
  text: "An ongoing skill effect on its user. It ends if the user is stunned, dies, or uses another skill."
  forms: [Channeled]
invisible:
  name: Invisible
  text: "Hidden from the opponent until it triggers or expires."
  forms: [Invisible]
hidden_target:
  name: HiddenTarget
  text: "The opponent sees the skill but not its target."
  forms: [HiddenTarget]
uncounterable:
  name: Uncounterable
  text: "Can't be countered or reflected."
  forms: [Uncounterable]
cooldown:
  name: Cooldown
  text: "How many of its owner's own turns a skill stays locked after use."
  forms: [cooldown, cooldowns, Cooldown, Cooldowns, CD]
random_energy:
  name: Random energy
  text: "A wildcard cost (GEN, shown as a dashed square) that you pay with any color when you end your turn."
  forms: [GEN, random energy, random cost, random costs]
buff_debuff:
  name: Buff / Debuff
  text: "Effect kinds: Buffs help their bearer, Debuffs hinder them. Immune blocks Debuffs."
  forms: [Buff, Buffs, Debuff, Debuffs]
minion:
  name: Minion
  text: "A summoned unit. It has Health and maybe skills, generates no energy, and pays for its skills from its owner's energy."
  forms: [minion, minions, Minion, Minions]
trap:
  status: trap
  text: "A hidden effect on an enemy that fires when they use a skill (usually a Harmful one). Trap N: they take N damage the next time they use a Harmful skill."
  forms: [Trap, Traps]

