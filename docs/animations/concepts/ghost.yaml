      # Haunt's ring settles on them.

  wraith_cold_grasp:
    beat: The Wraith is all phantom; only its pale, cold claws rake the target.
    cues:
      - { on: hit, fx: dark_mage_1, face: fromActor, tint: element, tone: light, scale: 0.45 }   # one pale layer, no crimson stroke and no echo: small for 5 damage, and apart from Smite's crimson claws and Restless Dead's claws from the ground
