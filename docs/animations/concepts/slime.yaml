      - { on: apply, status: gelatinous_giant, fx: blood_knight_5, tint: duo, scale: 1.9, speed: 1.2, delay: 200, layer: under, note: "the portrait swells about 15% and stays swollen while it lasts. The opaque portrait hides the oval's fanged interior (it shares the gulp's frames): only the swelling rim shows past the frame, all round, as the giant's outline, then dissolves bottom-up" }
      - { on: trigger, status: gelatinous_giant, fx: directional_splatter_005, tint: duo, scale: 0.7, note: "the split, on the user. Play only when it splits (20+ HP left and fewer than 4 allied Oozes: make_ooze's bud and the quarter-HP self-damage follow); any other hit gets no art" }
