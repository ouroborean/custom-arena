    cues:
      - { on: apply, status: quivering_wall, fx: symmetrical_explosion_003, tint: duo, scale: 1.4, opacity: 0.7, layer: under, frames: [1, 5], note: "only the disc holding its lumpy mass: hold the last frame a beat and fade before it bursts" }
      - { on: trigger, status: quivering_wall, fx: burst_splatter_003, size: small, tint: duo, scale: 0.4, offset: [0, 0.2], note: "each of their turn ends: it loses 10, or ends at 10 or less; base's shieldBreak covers a wall broken by damage" }

  taunt.slime:
