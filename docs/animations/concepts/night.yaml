  titan.night:
    beat: Black ice heaves up into a glacier over the user and a frost cocoon seals the sleeping giant inside; it breathes frost each turn, and when it wakes the ice bursts away.
    note: "Sleeping Giant counts as Dormant: show Dormant's snowfall aura while it lasts. The Dusk every enemy gains on waking plays Dusk's default, owner side only."
    cues:
      - { on: cast, fx: frost_knight_3, tint: duo, scale: 1.2, speed: 1.3 }   # a row of black-ice spikes ruptures around the user
      - { on: apply, status: sleeping_giant, fx: frost_mage_3, tint: duo, scale: 1.7, delay: 150, note: "a glacier towers up over them with a heavy screen shake; it ends on its brightest frame, so hold it a beat, then fade" }
      - { on: apply, status: sleeping_giant, fx: blood_knight_5, tint: duo, scale: 1.6, delay: 500, frames: [0, 4], note: "Dormant's cocoon at giant size; fade out from frame 4 (the closed oval), as Dormant's does" }
      - { on: trigger, status: sleeping_giant, fx: directional_smoke_burst_004, variant: white, scale: 0.8, offset: [0, 0.3], opacity: 0.85, note: "each turn end: a slow breath of frost; Shield's default follows. turnEnd firings only (the 20 Shield): the onExpire wake plays the remove cue instead" }
      - { on: remove, status: sleeping_giant, fx: frost_mage_6, tint: duo, scale: 1.3, note: "reason expired only, the onExpire wake: the giant wakes and the ice cracks and bursts away. Focus's default follows, then Dusk's apply or deepen_dusk's bite on every enemy (owner only). Nothing on death" }

