group: dragon
# Dragon is Fire turned up: both parents are Fire, so the fusion shows in the layering. The crimson body
# is `element` at `tone: dark` (a deeper flame than Fire's orange); the white-hot over-layer is `element2`
# at `tone: light`. Fire's jets, geysers and slate smoke stay, but bigger and stacked. Dragon's own motif
# is the beast. Claws and fangs are rakes and spiked crescents, wings are banded sweeps, and Breath is a
# billowing flame front (frost_mage_7 tinted Fire). The Hoard is molten-gold coins (Fire at `tone: light`).
# Dragonfire is Ignite's geyser grown into a crimson pillar.

statuses:
  dragonfire:
    apply:  [ { fx: directional_fire_burst_001, tone: dark, scale: 0.9 } ]   # Ignite's small geyser grown into a tall crimson pillar
    tick:   [ { fx: directional_fire_burst_001, size: small, tone: dark, scale: 0.55, speed: 1.3 } ]   # its 10-damage burn, at the applier's turn end (and turn start under Burning Wake)
    remove: [ { fx: symmetrical_smoke_burst_002, variant: gray, size: small, scale: 0.5, opacity: 0.7 } ]   # goes out with its Ignite: a ring of soot
  wyrm_heart:
    note: "Set on every Dragon user at battle start. No trigger: each Hoard it grants plays Fire's burn_aftermath and then Hoard's apply. Several burns feeding it at one turn edge play one aftermath and one merged fountain (see hoard)."
    apply:  [ { fx: fire_looping_001, size: small, tone: dark, scale: 0.35, repeat: 2, opacity: 0.85 } ]   # an ember heart kindles in the chest
  hoard:
    note: "One coin fountain per Hoard gain event; a multi-stack gain (Dragon's Toll, Elder Wyrm) plays it once, about 1.2x larger. Gains resolved in the same step (several Ignite or Dragonfire burns feeding Wyrm's Heart at one turn edge) merge into one fountain, about 0.1 scale larger per extra stack. No fountain plays when the stack count doesn't change (already at 6). No aura: the stack count on the icon carries it."
    apply:  [ { fx: directional_coin_burst_001, tint: element2, tone: light, size: small, scale: 0.55, speed: 1.5, frames: [0, 20] } ]   # molten-gold coins fountain up and land at their feet; cut the long settle
    remove: [ { fx: spell_absorb_001, tint: element2, tone: light, size: small, scale: 0.55, speed: 1.8 } ]   # spent or stolen: the gold spirals into them and is gone
  burning_wake:
    apply:  [ { fx: directional_impact_002, scale: 0.9, layer: under } ]   # flames spill out along the ground on both sides: the wake
    remove: [ { fx: directional_smoke_burst_004, tone: dark, size: small, scale: 0.45, opacity: 0.7 } ]
    expire: [ { fx: directional_smoke_burst_004, tone: dark, size: small, scale: 0.45, opacity: 0.7 } ]
  warming_wings:
    note: "Its heals happen inside Fire's burn_aftermath, which plays on the healed ally."
    apply:  [ { fx: directional_sparkle_burst_001, tint: element2, tone: light, scale: 0.8 } ]   # warm motes rise from beneath their wings
    remove: [ { fx: round_sparkle_burst_001, tint: element2, tone: light, size: small, scale: 0.4, opacity: 0.7 } ]
    expire: [ { fx: round_sparkle_burst_001, tint: element2, tone: light, size: small, scale: 0.4, opacity: 0.7 } ]
  elder_wyrm:
    apply:  [ { fx: symbol_crown_001, tint: element2, tone: light, size: small, scale: 0.45, offset: [0, 0.7], speed: 1.5, note: "a small crown tell over the head: the eldest wyrm" } ]
    remove: [ { fx: symmetrical_smoke_burst_002, size: small, tone: dark, scale: 0.5, opacity: 0.7 } ]
    expire: [ { fx: symmetrical_smoke_burst_002, size: small, tone: dark, scale: 0.5, opacity: 0.7 } ]
  banked_fire:
    note: "No expire cue: when it ends, the bearer's Ignite and Dragonfire removes play their own defaults."
    apply:   [ { fx: scifi_charge_up_001, size: small, tone: dark, scale: 0.5, opacity: 0.85 } ]   # their Dragonfire is drawn down into one glowing coal
    tick:    [ { fx: scifi_charge_up_001, size: small, tone: dark, scale: 0.5, speed: 1.5, note: "its periodic grant, at the applier's turn end: the coal pulses once, only when the Shield follows (the bearer still has Dragonfire); Shield's default then forms on the applier" } ]
  drake_hoard:   # the Drake, at its owner's turn end with an enemy Ignited: 1 Hoard to its owner
    trigger: [ { fx: directional_smoke_burst_003, size: small, face: toTarget, scale: 0.5 } ]   # it snorts a puff toward its owner; Hoard's coins land on them

macros:
  dragonfire_it: []   # Ignite's and Dragonfire's apply defaults carry it: the small geyser, then the crimson pillar (space them ~150 ms)
  ignite_or_dragonfire_it:   # only Wildfire Wing: the wildfire leaps onto a random other enemy, then Ignite's or Dragonfire's default
    - { fx: directional_smoke_burst_005, size: small, face: fromActor, scale: 0.55 }
  breath:   # on the user, before every Breath: they draw breath; with Hoard to spend, Hoard's remove (the gold swallowed) layers on it
    - { fx: round_sparkle_burst_003, at: actor, tint: element2, tone: light, size: small, scale: 0.6, speed: 1.3, frames: [5, 16] }

skills:
  strike.dragon:
    beat: Three white-hot talons rake through the target and fling crimson sparks past them.
    note: "Hoard adds 5 per 2: grow the rake about 0.1 scale per 5 bonus damage."
    cues:
      - { on: hit, fx: dark_mage_1, tint: element2, tone: light, face: fromActor, scale: 0.9 }
      - { on: hit, fx: directional_splatter_003, face: fromActor, size: small, tone: dark, scale: 0.5, delay: 80 }

  smash.dragon:
    beat: A spiked tail swings over and crashes onto the target, then sweeps along the row and knocks a Buff loose from each ally.
    cues:
      - { on: hit, only: primary, fx: frost_knight_1, tint: element, face: fromActor, scale: 1.1, frames: [6, 13], note: "skip the club's rocking wind-up; anchor its lower-right crash on the target" }
      - { on: hit, only: primary, fx: directional_impact_003, tone: dark, scale: 0.9, delay: 120 }   # over: under the portrait the whole splash would hide
      - { on: remove, status: buff, only: others, fx: directional_impact_002, tone: dark, size: small, scale: 0.6, layer: under, stagger: 90 }   # the tail's sweep under each robbed ally; Hoard's coins then land on the user

  charge.dragon:
    beat: The user swoops in on a streak of flame and lands on the target claws-first.
    cues:
      - { on: travel, fx: warrior_8, path: arc, tint: element, scale: 0.6, note: "the portrait lunges along the arc and snaps back" }
      - { on: hit, fx: warrior_5, tint: element, face: fromActor, scale: 0.8 }   # flame claws dive into a ground impact
      - { on: trigger, status: dragons_descent, fx: round_firework_burst_001, at: target, size: small, tone: dark, scale: 0.45, note: "on the next skill's damage: only when Dragonfire follows (the hit enemy was Ignited)" }

  riposte.dragon:
    beat: A ring of embers circles the user; whoever strikes is stopped cold and pays the toll in gold.
    cues:
      - { on: cast, fx: frost_mage_1, tint: element, tone: dark, scale: 0.8, opacity: 0.85, note: "Invisible: owner only. Fade out the dim ghost ring of its last frame" }
      - { on: trigger, status: dragons_toll, fx: stylized_impact_001, tint: element2, tone: light, size: small, scale: 0.7 }   # the guard flashes on the user
      - { on: trigger, status: dragons_toll, fx: directional_smoke_burst_003, at: source, face: toActor, size: small, scale: 0.5, delay: 100 }   # the toll is pulled off the attacker toward the user; Hoard's coins land on them

  rage.dragon:
    beat: Crimson flame spikes surge up around the user and their eye flares white; every blow they take after sheds sparks.
    cues:
      - { on: cast, fx: directional_particle_burst_002, tone: dark, scale: 1.8, layer: under }   # past the frame: white-cored spikes tower up the portrait's sides and over its head (Titan keeps the fireball fountain)
      - { on: cast, fx: round_light_burst_001, tint: element2, tone: light, size: small, scale: 0.6, offset: [0, 0.3], delay: 150 }   # the wyrm's eye flashes open
      - { on: trigger, status: wyrms_wrath, fx: scifi_spark_burst_001, tint: element2, tone: light, size: small, scale: 0.55 }   # struck: sparks fly off the hide, then Hoard's coins
      # Might's default plays on the user.

  shot.dragon:
    beat: A gob of molten spit arcs onto the target and splashes.
    note: "On an Ignited target the same hit deals 25: play the splash about 1.3x larger. Otherwise the dragonfire_it macro follows."
    cues:
      - { on: travel, fx: slime_3, path: arc, tint: element, tone: dark, scale: 0.5, frames: [0, 7] }   # cut before its own splat: the hit is the splash
      - { on: hit, fx: burst_splatter_001, tint: element2, tone: light, size: small, scale: 0.6 }

  snipe.dragon:
    beat: The user beats into the sky out of reach; next turn a breath of fire pours straight down on the hidden target and the ground erupts.
    note: "While circling, the portrait lifts about 0.15 and dims. Breath's macro plays on the user before the shot; scale the hit cues about 0.1 per Hoard spent. HiddenTarget: nothing points at the target before the hit."
    cues:
      - { on: cast, fx: directional_impact_002, tone: dark, scale: 0.8, layer: under }   # the downdraft as the wings beat
      - { on: trigger, status: skyfall_breath, fx: scifi_muzzle_flash_002, tint: element2, tone: light, face: up, scale: 0.7, note: "fires when it lands (its onExpire): the user breathes skyward" }
      - { on: hit, fx: frost_mage_7, tint: element, face: down, scale: 1.0, offset: [0, 0.7], note: "the billowing flame front pours straight down; its head ends on the target" }
      - { on: hit, fx: epic_explosion_002, tone: dark, scale: 1.3, delay: 200 }

  trap.dragon:
    beat: Gilded glints are left at the target's feet; when they reach for a Buff, the gold melts and splashes up into dragonfire.
    cues:
      - { on: apply, status: gilded_bait, fx: status_sparkling_001, tint: element2, tone: light, scale: 0.8, offset: [0, -0.3], opacity: 0.75, note: "Invisible: owner only. Over the lower portrait, so the glints show" }
      - { on: trigger, status: gilded_bait, fx: burst_splatter_003, tint: element2, tone: light, scale: 0.7 }   # the bait melts; the lost Buff then the dragonfire_it macro follow

  maneuver.dragon:
    beat: The user darts aside in a kick of smoke and flame, leaving a burning wake under them.
    cues:
      - { on: cast, fx: directional_smoke_burst_005, tone: dark, scale: 1.0, note: "the portrait darts a step aside and back; the wedge fans away from the dash" }
      # Burning Wake's and Invulnerable's defaults play on the user.

  companion.dragon:
    beat: A drake dives in from above, lands in a burst of flame and snorts a jet skyward.
    cues:
      - { on: summon, fx: paladin_6, tint: element, scale: 0.9 }
      - { on: summon, fx: scifi_muzzle_flash_001, face: up, scale: 0.4, delay: 400 }

  bolt.dragon:
    beat: A fireball coils like a wyrm, lunges across the board and bursts in a molten crown.
    note: "Only the direct damage plays these hit cues. The two `direct: false` Affliction hits that follow on an Ignited target are the Ignite burning: play Dragonfire's tick art (directional_fire_burst_001, small, tone dark, 0.55) if they have Dragonfire, else Ignite's (fire_looping_001, small, 0.45), about 200 ms apart; Fire's burn_aftermath follows each."
    cues:
      - { on: travel, fx: blood_knight_4, path: straight, tint: element, scale: 0.7, frames: [12, 18] }   # just the launched comet, without its slow draw-in
      - { on: hit, fx: symmetrical_explosion_003, tint: element2, tone: light, scale: 0.9 }

  blast.dragon:
    beat: The user draws breath and a billowing torrent of fire rolls over the whole enemy side; a column of flame erupts under each enemy.
    note: "Breath's macro plays on the user first. Scale the eruptions about 0.1 per Hoard spent, and about 1.2x on Ignited enemies (+10). One screen shake as the torrent lands."
    cues:
      - { on: travel, fx: frost_mage_7, path: beam, from: actor, to: enemySide, tint: element, scale: 1.4 }
      - { on: hit, fx: epic_explosion_001, scale: 1.0, delay: 100, stagger: 80 }

  consume.dragon:
    beat: Every enemy's flames are drawn off in jets and swallowed by the user, who spits one ember back onto the target.
    cues:
      - { on: remove, status: ignite, fx: scifi_muzzle_flash_002, face: toActor, tint: element2, tone: light, size: small, scale: 0.6, stagger: 100 }   # replaces Ignite's wisp here
      - { on: heal, fx: spell_absorb_001, scale: 0.7, speed: 1.6, stagger: 150 }   # one per Ignite devoured; Hoard's coins layer on each
      - { on: hit, fx: symmetrical_explosion_001, size: small, scale: 0.5 }
      # Ignite's default re-lights the target.

  summon.dragon:
    beat: Embers settle into a nest and a white-hot egg glows in it.
    note: "When the egg hatches (its Hatching runs out), it summons the Wyrmling and then kills itself: the Wyrmling's summon replays the nest, and the death cue bursts the shell."
    cues:
      - { on: summon, fx: directional_sparkle_burst_002, tone: dark, scale: 0.8, layer: under }
      - { on: summon, fx: fire_looping_001, tint: element2, tone: light, size: small, scale: 0.35, delay: 300, repeat: 2, note: "Dragon Egg's summon only: skip it on the Wyrmling's summon, which the shell-burst death cue introduces" }
      - { on: death, fx: symmetrical_impact_003, size: small, tint: element2, tone: light, scale: 0.6, note: "the egg's own kill when Hatching runs out: the shell bursts; replaces the grey death default. An egg destroyed by enemies isn't this skill's kill and keeps the default" }

  channel.dragon:
    beat: The user stokes a white-hot glow, then each turn roars a torrent of flame that rains burning drops on every enemy.
    note: "Enemies with Dragonfire take 15 instead of 10: play their drops about 1.2x larger."
    cues:
      - { on: cast, fx: scifi_charge_up_001, tint: element2, tone: light, size: small, scale: 0.55 }
      - { on: trigger, status: wyrmfire_torrent, fx: scifi_muzzle_flash_003, face: toTarget, tint: element2, tone: light, scale: 1.3 }   # each pulse, toward the enemy side's center
      - { on: hit, fx: spell_forge_001, size: small, scale: 0.7, stagger: 60 }
      # The random new Dragonfire plays the dragonfire_it macro.

  stab.dragon:
    beat: A fang punches a smoldering hole in the target; the second bite tears it open in a spiked crescent of molten spray.
    note: "The tear's hit is 25: the remove cue is its big read, and the hit cue stays a puncture."
    cues:
      - { on: hit, fx: scifi_muzzle_flash_001, face: fromActor, tint: element2, tone: light, scale: 0.55 }
      - { on: apply, status: fang, fx: directional_splatter_001, face: fromActor, scale: 0.7, delay: 100 }   # the puncture smolders: mid Fire and upscaled so the faint streak reads, after the flash
      - { on: remove, status: fang, fx: blood_knight_3, tint: element, face: fromActor, scale: 0.9 }   # the fang tears free; Hoard's coins land on the user

  ravage.dragon:
    beat: A molten maw ringed with white fangs clamps onto the target, claws and a white-hot fang tear through, and lava gouts out.
    note: "Against a Scorched target the same hit deals 40: play the hit cues about 1.25x larger with a short screen shake."
    cues:
      - { on: hit, fx: symmetrical_impact_004, tone: dark, scale: 1.1 }   # the maw: a crimson disc whose ring of white tufts reads as fangs, clamping on
      - { on: hit, fx: warrior_7, tint: element2, tone: light, face: fromActor, scale: 1.0, delay: 120 }   # claw swipes, then the cream fang tears into a jagged U
      - { on: hit, fx: burst_splatter_002, tone: dark, scale: 0.9, delay: 350 }   # molten gore bursts as the fang tears (warrior_7's frames 5-7)
      - { on: trigger, status: molten_maw, fx: directional_splatter_005, tone: dark, size: small, scale: 0.5 }   # as their Ignite burns, molten droplets well up; Scorched's default follows

  mislead.dragon:
    beat: Golden wisps unseen curl around every enemy; the first to try something big has it snatched away, their energy and the user's gilded.
    cues:
      - { on: apply, status: covetous_eye, fx: starcaller_4, tint: element2, tone: light, scale: 0.6, opacity: 0.65, stagger: 80, note: "Invisible: owner only" }
      - { on: trigger, status: covetous_eye, fx: round_sparkle_burst_002, tint: element2, tone: light, size: small, scale: 0.6 }   # the mirage bursts as the skill is countered
      - { on: apply, status: covetous_eye_loss, fx: symmetrical_smoke_burst_002, tone: dark, size: small, scale: 0.45, offset: [0, 0.5] }   # Robbed: their energy puffs away
      - { on: apply, status: covetous_eye_gain, fx: round_sparkle_burst_001, tint: element2, tone: light, size: small, scale: 0.5, offset: [0, 0.5] }   # Gilded, on the user

  stun.dragon:
    beat: The shadow of fanged wings closes over the target and they slump into a terrified sleep; damage jolts them awake and they explode.
    note: "Dragonfear counts as Sleep: while it lasts the renderer should show Sleep's aura (the rising Zs) on the bearer, not just the icon."
    cues:
      - { on: apply, status: dragonfear, fx: blood_knight_5, tint: element, tone: dark, scale: 1.0, opacity: 0.9, note: "the portrait slumps as the wings close" }
      - { on: trigger, status: dragonfear, fx: round_bubble_burst_001, tint: element2, tone: light, size: small, scale: 0.5, offset: [0, 0.6] }   # the nightmare pops
      - { on: trigger, status: dragonfear, fx: symbol_alert_002, tint: element2, size: small, scale: 0.4, offset: [0.35, 0.6], delay: 100 }   # jolted awake; the explode macro follows

  dance.dragon:
    beat: The user's wings beat a warm whirlwind around them that sheds a spray of sparks.
    cues:
      - { on: cast, fx: slime_5, tint: element2, tone: light, scale: 1.3, opacity: 0.85, layer: under }
      - { on: cast, fx: round_firework_burst_002, size: small, scale: 0.6, delay: 350 }
      # Swiftness's, Focus's and Warming Wings' defaults play on the user.

  heal.dragon:
    beat: Hearth-warm hearts rise through the ally, and each Hoard the user spends flies off them to the ally as a spray of coins for more.
    note: "The 15 heal and each +10 heal are separate heal events: space them about 150 ms apart and play the extra ones about 0.8x."
    cues:
      - { on: heal, fx: directional_heart_burst_001, tint: element2, tone: light, scale: 0.8, speed: 1.5 }
      - { on: remove, status: hoard, fx: directional_coin_burst_001, face: toTarget, tint: element2, tone: light, size: small, scale: 0.45, speed: 1.6, frames: [0, 12], note: "replaces Hoard's swallow here: one coin flip per Hoard spent (removeStacks needs an event per spent stack). Turned toward the healed ally, so the coins fly off the user to them instead of reading as Hoard's gain fountain" }

  bless.dragon:
    beat: A drop of crimson dragon's blood falls onto the ally and wells up through them; each blow they land after flares with it.
    cues:
      - { on: apply, status: dragonblood, fx: scifi_warp_003, tone: dark, scale: 0.85 }
      - { on: apply, status: dragonblood, fx: directional_splatter_002, tone: dark, size: small, scale: 0.5, delay: 300 }
      - { on: trigger, status: dragonblood, fx: fire_looping_001, tone: dark, size: small, scale: 0.35, speed: 1.5 }   # the ally's blood flares as they strike; Ignite's or Dragonfire's default lands on their target

  curse.dragon:
    beat: A glob of molten slag drops onto the target, melts their guard and pools at their feet.
    cues:
      - { on: travel, fx: deathbringer_6, path: drop, tint: element, tone: dark, scale: 0.5 }
      - { on: remove, status: buff, fx: directional_smoke_burst_001, variant: white, size: small, scale: 0.6, offset: [0, 0.2], speed: 1.5, frames: [0, 13], opacity: 0.8 }   # Armor and Shield hiss away as a billow of steam (not Ignite's wisp, which the re-ignite would echo); Shield's own break plays too
      - { on: apply, status: debuff, fx: paladin_7, tint: element, tone: dark, scale: 0.8, frames: [3, 7], note: "once, with the first debuff (Vulnerable): the slag splashes and pools, starting at the splash since the travel already dropped the glob. Fade its held last frame, the cooled slag" }

  smite.dragon:
    beat: A black stake in a pillar of flame is driven down into the target; when the brand runs out on a burning target, the pyre lights.
    cues:
      - { on: hit, fx: paladin_5, tint: element, scale: 1.0, note: "the sword silhouette stays black: the charred stake" }
      - { on: hit, fx: directional_impact_003, tone: dark, size: small, scale: 0.7, delay: 150 }   # the ground shock, over the portrait so it shows
      - { on: apply, status: pyre_brand, fx: dark_mage_3, tint: element2, tone: light, scale: 1.2, frames: [0, 3], speed: 0.5, opacity: 0.85 }   # just the ground ring, wider than the portrait and held ~0.4 s: the brand at their feet
      - { on: trigger, status: pyre_brand, fx: dark_mage_3, tint: element2, tone: light, scale: 1.0, frames: [4, 12], note: "fires when it ends with the bearer still Ignited (its onExpire): the ring's pillars shoot up, then the explode macro" }

  prayer.dragon:
    beat: A coil of warm flame curls around each ally and lifts healing light into them; the user sleeps and the warmth keeps coming.
    cues:
      - { on: apply, status: buff, fx: dark_mage_2, tint: element2, tone: light, scale: 1.4, frames: [0, 9], opacity: 0.75, stagger: 100, note: "once per ally, with its Shield (not again for the user's Dragon's Slumber). Over the portrait so the coil shows around each body; per ally because a side's units stack in a column. Cut its last two frames, which turn crimson" }
      - { on: heal, fx: spell_heal_003, tint: element2, tone: light, scale: 0.7, speed: 1.5, stagger: 100 }   # also each Slumber heal
      - { on: trigger, status: dragons_slumber, fx: directional_smoke_burst_004, tint: element2, tone: light, size: small, scale: 0.5, opacity: 0.8, note: "only while the user sleeps (the heals follow): a warm sigh curls up" }
      # Shield's default plays on each ally, Sleep's on the user.

  cleave.dragon:
    beat: A wing of flame sweeps over the target, and wildfire leaps off it onto another enemy, again next turn.
    cues:
      - { on: hit, fx: paladin_8, tint: element, face: fromActor, scale: 0.8 }
      # The leap to the random other enemy is the ignite_or_dragonfire_it macro.
      - { on: trigger, status: wildfire_wing, fx: round_firework_burst_002, tint: element2, tone: light, size: small, scale: 0.5, note: "only on the spreading pulse (the user's next turn end, the target still has Dragonfire); the turn-of-use tick shows nothing" }

  shout.dragon:
    beat: A crimson shockwave bursts from the roaring user and the roar crashes into every enemy as rolling crescents; healing them after only sets them alight.
    cues:
      - { on: cast, fx: blood_knight_6, tint: element, scale: 2.2, layer: under }   # large enough that the ring clears the portrait from its petal frame on
      - { on: apply, status: terrible_roar, fx: slime_1, tint: element2, tone: light, face: fromActor, scale: 0.7, stagger: 80, note: "align the splat (~70% across the canvas) on the enemy: stacked sound-wave crescents roll into each one" }
      - { on: trigger, status: terrible_roar, fx: scifi_spark_burst_002, size: small, scale: 0.6, speed: 2 }   # the healing crackles into sparks; Ignite's default follows
      # Intimidated's default lands on each enemy.

  withstand.dragon:
    beat: Scale plates lock into place around the user over a furnace glow, while one enemy's fire is banked to fuel it.
    cues:
      - { on: cast, fx: fanfx_barrier, tone: dark, scale: 1.3, opacity: 0.85, frames: [0, 12], layer: under, note: "the panel's edges show around the portrait as plated scales. Fade the held full panel; never play the shatter (frames 13 on)" }
      - { on: cast, fx: fire_looping_001, tone: dark, scale: 1.7, repeat: 2, opacity: 0.7, offset: [0, 0.2], delay: 150, layer: under }   # behind the plates: the furnace's tongues lick up around and above the portrait
      # The random enemy plays the dragonfire_it macro and Banked Fire's default; the Shield arrives through Banked Fire's tick.

  taunt.dragon:
    beat: A ridge of flame spines rises under each of the user's team to mark their domain; any other enemy who strikes into it is lashed.
    cues:
      - { on: apply, status: wyrms_domain, fx: frost_knight_3, tint: element, scale: 1.8, layer: under, stagger: 80 }   # per ally (a side stacks in a column): the spike ridge flanks each portrait by about half its width
      - { on: trigger, status: wyrms_domain, fx: directional_impact_003, tone: dark, size: small, scale: 0.6, note: "only when the 10 damage follows (the attacker isn't the Taunted enemy). Over the portrait: under it the whole splash would hide" }
      - { on: hit, fx: starcaller_7, tint: element2, tone: light, face: fromActor, scale: 0.55 }   # the lash on the attacker
      # Taunt's default '!' marks the target.

  titan.dragon:
    beat: A crimson fountain of fire bursts up behind the user and vast white-hot wings sweep open on both sides.
    note: "Screen shake as the fountain peaks; the portrait swells about 15%. Hoard's (3 coins), Immune's and Elder Wyrm's crown defaults follow."
    cues:
      - { on: cast, fx: epic_explosion_002, tone: dark, scale: 2.0, layer: under }
      - { on: cast, fx: paladin_8, tint: element2, tone: light, scale: 1.7, delay: 200, layer: under }
      - { on: cast, fx: paladin_8, tint: element2, tone: light, flip: x, scale: 1.7, delay: 260, layer: under }   # the mirrored wing

  drake_claw:
    beat: The drake pounces and its claws arc over and crash down on the target.
    cues:
      - { on: hit, fx: blood_knight_1, tint: element, face: fromActor, scale: 0.7, note: "align its lower-right crash on the target" }
      # Scorched's default follows.

  wyrmling_bite:
    beat: The wyrmling snaps at the target and a goopy fan of lava spatters off the bite.
    cues:
      - { on: hit, fx: symmetrical_explosion_001, size: small, scale: 0.4 }   # the snap: a white flash eaten by a closing crescent
      - { on: hit, fx: directional_splatter_004, face: fromActor, scale: 0.65, delay: 60 }   # lava spatter carries on past them (not Fang's spiked crescent)
      # Ignite's default follows.
