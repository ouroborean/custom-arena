  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Red striped letter fill tints, and the pale highlight edges stay. Low-contrast tints may make the small text hard to read.
  bestFor: [ UI only (text), self buff, stat increase, empower ]
  caveats: English text that sits as a thin band in the vertical middle of a very wide canvas. The glyphs are small, so they need upscaling to read.
symbol_question_001:
