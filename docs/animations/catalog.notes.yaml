directional_party_burst_001:
  look: "Party popper confetti: red flecks plus yellow, blue, green and purple squiggle streamers spread across the upper canvas."
  motion: A small popper burst near center sprays confetti up into the upper half, which slowly flutters down and outward in an arch, then fades.
  orientation: points-up
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Multi-colored native confetti (yellow, blue, green, purple) alongside the main-hue flecks. Tinting only affects part of it and the rainbow pieces stay.
  bestFor: [ victory/celebration (UI only), confusion or trick status, taunt, level up, jester ability ]
  caveats: Multicolor pieces won't tint to an element color. The tone is comedic, so it only fits whimsical skills. 34 frames, and the last frame is nearly empty.
directional_sparkle_burst_001:
  look: Twinkling cross-shaped sparkles, white and red, rising from two bottom corners and merging into a dense column.
  motion: Two sparkle clusters at bottom-left and bottom-right rise in a V, converge into a dense band at center, then drift to the top and thin out.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue sparkles + white sparkles + darker shade; tints well (holy, arcane, ice).
  bestFor: [ buff applied, heal, cleanse, blessing, shield applied, stat up ]
  caveats: Starts as two separate clusters at the canvas bottom edges, so it converges inward onto the unit. Ends sparse at the top.
directional_sparkle_burst_002:
  look: Puffy dust or cloud mound at ground level with bright star flashes, giving way to rising star sparkles.
  motion: Small starburst at bottom-center swells into a wide puffy mound with flashing stars, breaks into dots, and star sparkles rise and fade.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Main hue puffs + white/light star flashes + darker shade; tints fine (dust, holy, frost).
  bestFor: [ summon arrival, teleport/blink arrival, landing dust, cleanse, ground buff, trap set ]
  caveats: The puff mound sits on the canvas floor, so anchor at the feet. Late frames are only a few small stars.
directional_sparkle_burst_003:
  look: Puffy cloud clusters with sparkles rising upward and forming a dotted halo ring near the top of the canvas.
  motion: A tiny blob at the bottom grows into a puff cluster, rises, spreads into a ring of puffs and sparkles in the upper area, then evaporates.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue puffs + white sparkles + darker shade; tints fine.
  bestFor: [ blessing/halo buff, heal, resurrect, cleanse, spirit release, dodge/evasion buff ]
  caveats: The ring forms in the upper third, so it reads as a halo over the head if anchored at the feet. The final two frames are nearly empty.
directional_star_burst_001:
  look: Five-pointed stars, small sparkles and red bar or capsule shapes rising from the bottom and popping into twinkles.
  motion: Stars and sparkles appear at the bottom, rise together through the middle with slight spread, gather in the upper area, and burst into sparkles.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue stars + lighter/white sparkles + darker shade; tints well (holy, arcane, lightning).
  bestFor: [ buff applied, crit/luck buff, daze/dizzy status, energy gain, stat up, celebratory cast ]
  caveats: Includes odd vertical bar and capsule shapes among the stars. The cluster drifts slightly right of center near the end. Last frame is nearly empty.
round_bubble_burst_001:
  look: Explosion of many outlined bubbles bursting from a center flash and expanding to fill the canvas.
  motion: A small star flash at center becomes a dense bubble cluster, bubbles expand outward in all directions, then thin to dashed outlines and pop.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue bubble outlines + white highlights + darker shade; tints well (water, poison, arcane).
  bestFor: [ water impact, bubble/foam AoE, poison cloud burst, sleep status, shield pop, cleanse ]
  caveats: Bubbles fill the full 128x128 canvas by the end, so scale it down for single-target use. Ends as faint dashed circles.
round_firework_burst_001:
  look: "Willow-style firework: thin streaks spraying out from a white center, then drooping down the sides like trailing embers."
  motion: White dot pops into a starburst of streaks that fly outward and upward, then arc down and fall along the sides, fading to specks.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue streaks + white flash core; tints well.
  bestFor: [ explosion (small), spark/fire impact, crit hit flash, celebration, burst of energy on cast ]
  caveats: Very thin, sparse lines on a 96x96 canvas, so it may read faintly at small scale. The second half is drooping trails that move downward.
round_firework_burst_002:
  look: "Peony firework: round glowing orbs with streak trails bursting radially from a white center, then fizzling into crosses."
  motion: White dot bursts into orbs flying out with trails, which hang in a loose ring, shrink into small cross sparkles and fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue orbs + white/light orb cores + darker trail shade; tints well.
  bestFor: [ explosion, magic missile impact, spark burst, cluster hit, celebration, buff dispel burst ]
  caveats: 96x96 canvas. The orbs hang and fizzle for many frames, giving it a long tail of 27 frames.
round_heart_burst_001:
  look: A single heart swelling at center, flashing with white rays, then exploding into an expanding ring of small hearts.
  motion: Tiny heart grows to medium over several frames, bursts with a white radiant flash, and small hearts expand outward in a ring and shrink away.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue hearts + darker shade + white/cyan flash rays; tints fine, but pink or red reads best.
  bestFor: [ big heal, charm applied, revive, love/affection AoE, lifesteal burst ]
  caveats: About the first 40 percent is a slow single-heart wind-up before the burst. The ring of hearts expands to near the canvas edges.
slime_1:
  look: Stacked lime-green crescent ')' slime waves with a white splat star at the leading edge, trailing dark-green goo drips.
  motion: Small sliver at left grows into triple crescent wave sliding right, flashes white splat on impact, drips smear behind, fades to thin arc.
  orientation: points-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: lime/yellow-green body, dark green drips, white impact star. Greens shift under tint; white star stays."
  bestFor: [ melee hit, slime/acid slash, poison strike impact, wave attack, knockback hit ]
  caveats: 192x128 canvas; starts near left edge and impact occurs at about 70-75% across, vertically centered. Same template as warrior_6. Final frame is a nearly invisible thin arc.
slime_2:
  look: Slime glob rises from ground into a cluster of bubbly orbs, then smears diagonally down-right into a splash burst.
  motion: Small puddle at lower-left bulges up, becomes bubbly floating mass with drips at upper-left, streaks down-right, splashes into spiky goo burst, fades to outline.
  orientation: diagonal-down-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: lime highlights, mid green body, dark green shadow, small white bubble glints. All greens shift under tint."
  bestFor: [ lobbed slime projectile, poison/acid splash, summon slime, debuff applied, ground eruption ]
  caveats: 256x128 canvas but content stays in the left ~60%; starts at bottom-left, peaks upper-left, splash lands at center-lower. Long 15-frame anim with a multi-phase arc; last frame is faint outline.
slime_3:
  look: Slime droplet streaks into a wavy trail, forms a ringed goo ball, then splatters into a puddle with speed lines.
  motion: Tiny drop at left stretches into wavy streak moving right, condenses into ringed orb at center-right, bursts into splattered puddle, droplets fade.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: lime highlights, mid green, dark green ring, white speckles in the orb. Greens shift under tint."
  bestFor: [ slime projectile, acid/poison bolt impact, glob shot, slow/sticky debuff, trap trigger ]
  caveats: 256x128 canvas; travels from left edge to about 70% across at vertical middle, impact splat lingers low and small. Final frame very faint.
slime_4:
  look: Green slime orb erupts into a spiky starburst whose spikes fan out up-right in a half-ring.
  motion: Round orb at lower-left explodes into spiky burst, spikes extend into crescent fan sweeping up-right, breaks into scattered droplets.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: lime/yellow-green core, mid green spikes, dark green outline, white flash at core. Greens shift under tint."
  bestFor: [ impact burst, acid explosion, poison eruption, spray hit, debuff applied ]
  caveats: "Off-center: origin is lower-left (~20%,75%) and spray goes up-right; not centered on canvas. Same template as starcaller_1."
slime_5:
  look: "Green spiral vortex: a tiny three-armed swirl that grows into a large canvas-filling whirlpool."
  motion: Small triskelion at center spins and expands into big swirling vortex with lime highlights, then unravels into thin dark green streaks and fades.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: lime/yellow highlights, mid and dark green spiral arms, white sparkle at peak. Greens shift under tint."
  bestFor: [ vortex/whirlpool, pull/suck in, area debuff, summon portal, confusion, area of effect ]
  caveats: Fills most of 128x128 canvas at peak. Mid frames look rotational but the anim grows then dissolves, so it does not loop cleanly.
starcaller_1:
  look: Violet orb bursts into a spiky cyan/violet starburst fan with sparkle stars, ending in a single white twinkle.
  motion: Purple orb at lower-left explodes into spiky burst, spikes fan up-right with sparkles, fade to motes, then a lone four-point twinkle at center.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: deep violet/indigo body, cyan inner glow, white four-point sparkles. Violet and cyan shift under tint; white sparkles stay."
  bestFor: [ star/arcane impact, magic burst, explosion, celestial hit, debuff applied ]
  caveats: Off-center origin at lower-left with spray up-right; same template as slime_4. Final frame is only a small isolated twinkle at center.
starcaller_2:
  look: "Comet: bright white-star head with a streaming purple tail, traveling diagonally down-left."
  motion: Star head enters upper-right with tail trailing up-right, slides down-left turning cyan, tail disperses into flecks and fades out.
  orientation: diagonal-down-left
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: purple/indigo tail, cyan-blue head glow, white star flare. Purple and cyan shift under tint; white flare stays."
  bestFor: [ meteor/comet strike, falling star, projectile, magic bolt, celestial attack ]
  caveats: Self-contained in 128x128 (moves from ~upper-center-right to lower-left); there is no impact burst, so pair with an explosion for hits.
starcaller_3:
  look: Purple dome rises into an oval cosmic egg with cyan flame-pattern, then becomes a black starry-night void.
  motion: Crescent bowl forms at bottom, grows into enclosing oval with cyan glyph-like pattern, interior darkens to black field with tiny stars, fades out.
  orientation: rises-from-ground
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: indigo/violet shell, cyan inner pattern, black interior with violet/white star dots. Violet/cyan shift under tint; black void stays dark."
  bestFor: [ imprison/encase, cosmic barrier, portal, banish, stun, summon ]
  caveats: Opaque black interior covers the unit in later frames. Cyan pattern mid-anim looks vaguely face-like. Long 15-frame anim.
starcaller_4:
  look: Two star-headed purple wisps curling around each other like a tiny galaxy, then drifting apart.
  motion: Small blob at center grows into curled wisp with star head, second wisp appears, both orbit into a swirl with bright flare, then separate and fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: "Native colors: indigo/violet wisps, cyan core flash, white sparkle heads. Violet/cyan shift under tint; white sparkles stay."
  bestFor: [ self buff, arcane channel, orbiting stars, mark/curse applied, teleport/blink, heal ]
  caveats: Asymmetric, swirling; content wanders around canvas. Last frame nearly empty.
starcaller_5:
  look: Wide violet crescent slash sweeping along the bottom with cyan core and star sparkles.
  motion: Arc appears at left edge, sweeps down and along the bottom to the right, brightest at the upturned right tip, dissolves into purple shreds.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: violet/indigo body, cyan and pink-magenta highlights, white sparkles. Violet/cyan shift under tint; white stays."
  bestFor: [ melee hit, arcane slash, sweeping cleave, multi-target sweep, counter ]
  caveats: Arc travels counterclockwise from left side through bottom up to right; sits in lower half of canvas. Same template as warrior_4.
starcaller_6:
  look: "Solar eclipse: a black disc with a flaring rim, light bursting out into a glowing cyan-white orb."
  motion: Black disc with flare at left rim, bright light erupts from behind, disc slides right and crumbles, leaving glowing orb that dims to blue and fades.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: black disc, white/cyan core light, violet/indigo halo, dims to navy-blue. Cyan/violet shift under tint; black and white stay."
  bestFor: [ eclipse/ultimate, cleanse/reveal, radiant burst, heal, dispel, stun ]
  caveats: First frames are an opaque black disc filling most of the canvas, which hides the unit. Long 15-frame anim; final frames a dim blue disc.
starcaller_7:
  look: Thin violet streak with cyan core strikes down-left, flashes a starburst, then curls into a hook arc.
  motion: Short stroke near center extends down-left, star flash at lower-left end, then curls into a C/hook opening up-right and thins out.
  orientation: diagonal-down-left
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: indigo/violet body, cyan core, white sparkle at impact. Violet/cyan shift under tint; white flare stays."
  bestFor: [ melee hit, arcane whip, slash, counter, debuff applied ]
  caveats: Impact star occurs at lower-left (~30%,70%); content concentrated in lower-left to upper-right diagonal. Same template as warrior_3. First two frames are tiny.
warrior_1:
  look: Two thin red-and-cream crescent slashes that cross into an X, each rising from a lower corner.
  motion: First blade grows from lower-left into a rising arc to upper-right, fades; second grows from lower-right sweeping to upper-left, fades.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: red edges, cream/white blade core, dark red fade. Red shifts under tint; cream/white highlights stay."
  bestFor: [ double strike, melee hit, combo slash, counter, multi-hit ]
  caveats: Two sequential slashes in one clip; thin blades. Final frame very faint at upper-left.
warrior_10:
  look: Tan heraldic shield assembled from two outline halves, with grey and white plus-sign sparkles.
  motion: Shield halves at left/right edges crackle with yellow energy, slam together into a solid shield at center, plus marks twinkle, shield dims to grey outline.
  orientation: none
  anchor: center
  loopable: false
  intensity: light
  tintNote: "Native colors: tan/khaki/cream shield, yellow energy crackle, white and grey plus signs. Tint would recolor the shield; plus marks are grey/white."
  bestFor: [ shield, defense buff, self buff, guard/taunt, damage reduction ]
  caveats: Icon-like emblem rather than an effect; plus signs drift around the lower-right. Long 16-frame anim ending as faint grey outline.
warrior_11:
  look: Two outlined swords converge into a crossed-swords emblem with plus-sign sparkles.
  motion: White-outline swords at left/right edges flash yellow, cross into a cream crossed-swords icon at center, plus marks twinkle, emblem dims to grey outline.
  orientation: none
  anchor: center
  loopable: false
  intensity: light
  tintNote: "Native colors: white outlines, cream/khaki filled swords, yellow energy, grey/white plus signs. Tint would recolor fill; plus marks grey/white."
  bestFor: [ attack buff, self buff, rally/war cry, empower, counter stance ]
  caveats: Icon-like emblem rather than an effect; plus signs sit below-right. Long 16-frame anim ending as faint grey outline.
warrior_2:
  look: Thick cream-and-red crescent blade rising up the right side and arching over the top.
  motion: Sliver at lower-center grows up the right side into a fat crescent, sweeps counterclockwise over the top toward upper-left, thins to red streaks, fades.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: cream/white blade core, red edges, dark red fade. Red shifts under tint; cream/white core stays."
  bestFor: [ melee hit, uppercut slash, rising strike, launch/knock-up, counter ]
  caveats: Content sits mostly in upper half and right side of canvas; counterclockwise rotation from bottom-right to top-left.
warrior_3:
  look: Red streak with cream core strikes down-left, a dark-red starburst flashes, then curls into a hook arc.
  motion: Small stroke near center extends down-left, spiky impact burst at lower-left end, curls into a C/hook opening up-right, fades to dark red.
  orientation: diagonal-down-left
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: red body, cream/white core, dark red burst and fade. Red shifts under tint; cream stays."
  bestFor: [ melee hit, whip/lash, slash, counter, bleed applied ]
  caveats: Impact burst at lower-left (~30%,70%), not centered. Same template as starcaller_7. First two frames tiny.
warrior_4:
  look: Wide red crescent slash with white-hot blade core and shredded red debris along the bottom.
  motion: Arc forms at left edge, sweeps down and along the bottom to the right, white blade tip curling up at right, debris shreds and fades.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: red and dark red body, cream/white blade core, black inner slivers. Red shifts under tint; white/cream stays."
  bestFor: [ heavy melee hit, cleave, sweeping attack, multi-target sweep, bleed ]
  caveats: Counterclockwise sweep from left side through bottom to right; lower half of canvas. Same template as starcaller_5.
warrior_5:
  look: Red flame-claw streaks dive down-right into a white ground impact with grey shockwave ring and debris.
  motion: Three red streaks converge from upper-left into a falling claw-shaped mass, flash cream, slam the ground with white spikes, grey ring expands, red residue fades.
  orientation: diagonal-down-right
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: "Native colors: red streaks, cream flash, white impact spikes, grey dust ellipse/ring. Red shifts under tint; white/grey ground effects stay."
  bestFor: [ ground slam, leap attack landing, heavy impact, stun, falling strike, shockwave ]
  caveats: Impact point lower-center (~50%,80%); the grey ellipse is a flat ground ring, best placed at unit feet.
warrior_6:
  look: Red-and-cream crescent ')' waves striking a white star burst that shatters into arrowhead shards.
  motion: Thin streaks at left grow into a triple crescent sliding right, white star flash on impact, shards fly right, crescents fade to dark red.
  orientation: points-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: red and cream crescents, white impact star, dark red fade. Red shifts under tint; white star stays."
  bestFor: [ melee hit, slash impact, critical hit, knockback, counter ]
  caveats: 192x128 canvas; starts near left edge, impact at ~70-75% across, vertically centered. Same template as slime_1.
warrior_7:
  look: "Multi-phase claw flurry: diagonal claw swipes, then a large cream hooked fang rising and tearing into a jagged U."
  motion: Small claw mark at lower-left whips up-right into curved slashes and a chevron, then a big cream hook rises center-right, crashes into a jagged U, darkens.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: red, cream/pale yellow and white flat fills, dark red at the end. Red shifts under tint; cream/white stay."
  bestFor: [ flurry/combo, claw/rend attack, heavy melee hit, finisher, bleed applied ]
  caveats: Abstract flat shapes that change abruptly between frames; reads as several different swipes rather than one motion. Content drifts from lower-left to center-right.
warrior_8:
  look: "Horizontal blade/thrust streak: parallelogram with triple red-and-cream flame prongs trailing left."
  motion: Thin vertical bar at left expands rightward into a long slanted blade with trailing flame prongs, greys out and fades from the left.
  orientation: points-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: red prongs, cream/white fill, grey-khaki fade. Red shifts under tint; white/grey fill stays."
  bestFor: [ thrust/lance attack, dash/charge, piercing strike, rush, knockback ]
  caveats: 192x128 canvas; content spans ~10% to ~68% across, vertically upper-middle. Leading edge is slanted (parallelogram).
warrior_9:
  look: Outline of a round-headed axe/mace icon hurled right with red speed streaks into a red chevron shock burst.
  motion: Faint white weapon outline sits at left edge, then flies right with red streak trail, bursts into red arrowhead shock at center-right, fades.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: white weapon outline, red/dark red streaks and burst, cream highlights. Red shifts under tint; white outline stays."
  bestFor: [ thrown weapon, projectile, charge/rush, heavy hit, knockback ]
  caveats: 256x128 canvas; first four frames are only a faint white line-art weapon icon near the left edge (windup). Weapon icon is small and line-only; impact around 60-70% across.
round_light_burst_001:
  look: "Horizontal lens-flare: a dot stretches into a bright eye-shaped ellipse, then breaks into radiating thin rays and dashes."
  motion: Pinpoint grows into a wide horizontal ellipse, flashes rays outward in all directions, collapses to a thin horizontal line, and fades.
  orientation: horizontal-band
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue on rays and rim plus a white/pale core ellipse; the rays are thin, so dark tints will barely show.
  bestFor: [ holy/light impact, blind/dazzle, flash crit, divine smite, revive flash, cleanse ]
  caveats: Wide 256x144 canvas, but the art sits in a thin central horizontal band; the first frame is almost empty (a single pixel) and the late frames are sparse dashes. The flare reads as horizontal, so rotating it gives a vertical flare.
round_music_burst_001:
  look: Musical notes (eighth notes, treble clefs) burst out of a central note glyph, around wavy concentric sound rings.
  motion: Small white note icon at the center explodes into a ring of notes flying outward around wobbling sound-wave rings, then the notes scatter and fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Notes in main hue with pale highlights; the center starts white. It tints cleanly, but the note shapes are very literal.
  bestFor: [ song/bard buff, charm, sleep/lull, sonic attack, taunt, party heal ]
  caveats: Literal music-note iconography, so it only fits sound or song themes. Late frames are a few sparse notes near the edges.
round_sparkle_burst_001:
  look: A dense sparkle puff becomes a circular ring full of four-point stars, which scatter outward as twinkling crosses.
  motion: Small glittery puff expands into a solid ring with stars inside; the ring breaks into dashes, the stars spread to the edges and shrink to tiny crosses.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue stars and dots plus a white/pale ring and highlights; the white ring stays bright under any tint.
  bestFor: [ buff applied, heal, cleanse, magic hit, level up/upgrade, blessing ]
  caveats: Small 64x64 canvas, so it needs upscaling to cover a unit. The last frame is a few faint dots.
round_sparkle_burst_002:
  look: A white cloud blob blooms into a big puffy sparkle-filled cloud that erodes into speckles and a ring of twinkles.
  motion: White clover-shaped blob swells to fill the canvas as a puffy cloud with stars, darkens and crumbles into speckles, leaving scattered four-point twinkles that fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue cloud with a dark-shade erosion, a pale/white core and white stars; the dark shade gives depth under tinting.
  bestFor: [ magic explosion, summon puff, teleport arrival, fairy dust/charm, debuff applied, transformation ]
  caveats: The cloud fills the whole 64x64 canvas edge to edge in the early frames, so cropping can show at the canvas border.
round_sparkle_burst_003:
  look: Four sparkles at the canvas edges converge into one bright star, which pops into a ring holding a puffy cloud.
  motion: Edge sparkles drift inward and merge into a white four-point star; it bursts into a thick ring around a puffy cloud, the ring dashes apart, and crosses fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: White converging stars and ring plus a main-hue cloud and crosses; the white elements stay white.
  bestFor: [ charge then release, summon, transformation, power up, revive, delayed buff trigger ]
  caveats: "Converge-then-burst timing: the first ~40% is tiny faint sparkles near the canvas edges before the payoff, so offset the start if you want an immediate hit."
scifi_analyze_001:
  look: Four corner targeting brackets (reticle) with HUD data callout boxes on leader lines popping in around them.
  motion: Brackets stay steady while data panels pop in one after another at the upper-right, lower-left, lower-right and upper-left, then retract, leaving the bare reticle.
  orientation: none
  anchor: center
  loopable: true
  intensity: light
  tintNote: Mostly main hue in two shades with white glints; the HUD boxes and brackets all tint uniformly.
  bestFor: [ scan/analyze, mark/lock-on target, reveal stealth, inspect debuffs, targeting telegraph, weak point exposed ]
  caveats: Very long (120 frames), so speed it up or trim it. The callout boxes hold pseudo-text squiggles (UI glyphs). The look is strongly sci-fi/HUD, and the boxes reach the canvas corners.
scifi_charge_up_001:
  look: A glowing white orb inside pulsing concentric rings, with streaks converging inward and a rotating white needle sweeping around.
  motion: Rings pulse in and out while particles streak in toward the orb and a white bar spins around the center; the cycle repeats.
  orientation: radial
  anchor: center
  loopable: true
  intensity: medium
  tintNote: Main hue rings and streaks, a pale ring shade and a white core orb and needle; the core stays white.
  bestFor: [ charge-up/wind-up, channeling, self buff, energy shield, pending big attack, overload status ]
  caveats: The rotating white needle reads as mechanical/clock-like. Inward streaks reach the canvas edges.
scifi_charge_up_002:
  look: A small core inside a thin ring crackling with jagged electric lines, with thin streaks converging from all sides.
  motion: The ring pulses in size while zig-zag lightning crackles inside it and short lines streak inward toward the core, repeating.
  orientation: radial
  anchor: center
  loopable: true
  intensity: light
  tintNote: Main hue ring and streaks plus white electric zig-zags; some streaks are blue/lavender and may not follow the palette tint.
  bestFor: [ electric charge, channeling, stun pending, overcharge buff, static field, short-circuit status ]
  caveats: Thin lines with the art in the central ~40% of a 128x128 canvas, so scale it up. Off-palette blue streaks appear even in the red variant.
scifi_charge_up_003:
  look: A bright orb inside a thick ring that pulses between thin and thick, with small dots orbiting around it.
  motion: The ring swells, thins and re-thickens around the orb while small particles (some yellow) orbit and flicker; it cycles.
  orientation: radial
  anchor: center
  loopable: true
  intensity: medium
  tintNote: Main hue ring and particles, pale ring shade and white orb core; a few tiny yellow dots are off-palette.
  bestFor: [ charge-up, channel aura, energy shield, orbiting power buff, pending ability, stored counter ]
  caveats: Tiny yellow specks may clash with tints. The orb shifts slightly off-center in some frames.
scifi_heartbeat_fast_001:
  look: An ECG monitor trace with a sharp QRS spike, drawn as a short glowing line segment.
  motion: The trace head enters at the left edge and travels right, drawing two quick heartbeat spikes in sequence, then exits at the right edge.
  orientation: points-right
  anchor: overhead
  loopable: true
  intensity: subtle
  tintNote: Main hue trail fading to a white leading head; it tints cleanly.
  bestFor: [ vitality/regen buff, adrenaline/haste, heal tick, revive pulse, life-link, UI only (status indicator) ]
  caveats: Tiny 64x32 canvas with thin lines. It works best as a small overhead/UI indicator. The first and last frames are nearly empty dots at the edges; it loops as a continuous monitor sweep.
scifi_heartbeat_flatline_001:
  look: A flat horizontal ECG line with no spikes (flatline).
  motion: A straight line is drawn from the left edge toward the right, slides across, and its tail exits at the right edge.
  orientation: points-right
  anchor: overhead
  loopable: true
  intensity: subtle
  tintNote: Main hue line with a white leading head; tints cleanly.
  bestFor: [ death/KO, execute, doom countdown, life drain finish, stop/freeze heart, UI only (status indicator) ]
  caveats: Tiny 64x32 and only a thin line in the vertical middle. It is meaningful only as an indicator, not an impact.
scifi_heartbeat_slow_001:
  look: An ECG trace with a single heartbeat spike passing through, drawn as a glowing line.
  motion: The trace head enters at the left and travels right; one QRS spike forms midway across, then the trace exits at the right edge.
  orientation: points-right
  anchor: overhead
  loopable: true
  intensity: subtle
  tintNote: Main hue trail with a white leading head and pale highlights; tints cleanly.
  bestFor: [ low-HP warning, sleep, weakened/slow debuff, doom, steady heal-over-time, UI only (status indicator) ]
  caveats: Tiny 64x32 canvas, thin lines. It reads as a small indicator above a unit rather than an effect on the body.
scifi_muzzle_flash_001:
  look: "A muzzle blast: a white oval shockwave ring at the left with a chevron flame fan spraying right, breaking into pixel shards."
  motion: A hot dot at the left flashes into an oval ring with a rightward flame fan; both break into red pixel bits that drift right and vanish.
  orientation: points-right
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue shards, pale/white ring and flame core; the white ring stays bright.
  bestFor: [ gunshot/ranged fire, cast release, small blast, counter shot, launch projectile, quick jab impact ]
  caveats: Very small 32x32 canvas with chunky pixels and only 6 frames, so it is fast. The origin sits at the left edge; place it at the caster facing the target and mirror it for the other row.
scifi_muzzle_flash_002:
  look: A muzzle ring at the left with a jet of streaked horizontal flames blasting rightward.
  motion: A dot at the left edge forms a vertical ring and blob, a streaky flame jet shoots right, and the streaks travel to the right side and break into fragments.
  orientation: points-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue streaks with pale bands and a white ring and core; dark shade is used for streak edges.
  bestFor: [ gunfire/blaster, beam launch, dash/charge trail, flamethrower burst, sonic shot, projectile launch ]
  caveats: Wide 96x48 canvas with the origin at the left edge; the effect ends at the right side. Mirror it for units facing left.
scifi_muzzle_flash_003:
  look: A crescent spark becomes a white muzzle ring around a short jet of horizontal streaks spraying right.
  motion: A crescent at the left opens into a white ring with a streaky jet extending right; the ring breaks into white shards near center-left while the streaks scatter.
  orientation: points-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue streaks, pale mid tones and a prominent white ring that stays white.
  bestFor: [ gunfire, cast release, sonic/air blast, launch projectile, counter attack, knockback push ]
  caveats: Similar to muzzle_flash_002 but the ring is more prominent and the effect stays nearer the left/center; it ends with a faint vertical sliver. 96x48 canvas, mirror for the other row.
scifi_spark_burst_001:
  look: A white glint explodes into thin curved spark trails arcing outward and drooping downward like a firework fountain.
  motion: The center glint pops into curling spark lines that arc outward in all directions, sag downward and thin out to fading specks.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue trails with white spark heads; the thin lines need bright tints to read.
  bestFor: [ electric hit, metal impact sparks, short circuit, crit spark, firework, shrapnel ]
  caveats: Very thin 1-pixel lines on a 128x128 canvas, so it reads faint at small scale. There is a slight downward droop (gravity) in the late frames.
scifi_spark_burst_002:
  look: Sparse, small electrical spark sprays popping at random spots around the canvas.
  motion: A tiny glint appears, then brief spark sprays flicker at different off-center spots (right, center, lower-left) one after another before fading.
  orientation: none
  anchor: center
  loopable: false
  intensity: subtle
  tintNote: Main hue spark lines with white heads; the thin lines need bright tints.
  bestFor: [ electrified/shock status tick, malfunction, paralysis, lingering electric damage, sabotage, short-circuit debuff ]
  caveats: Very sparse and faint, with several nearly empty frames over a long 32 frames. The sprays are off-center and placed at random. It could repeat as a status flicker, though the ends do not match exactly.
scifi_warp_001:
  look: A horizontal slit opens into a white oval portal that bursts into a spiky jagged ring and disintegrates.
  motion: A thin horizontal sliver widens into a lens, then a solid white oval; it bursts into a filled spiky ring, hollows out, and breaks into dotted ring fragments.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue ring with a dark-shade outline, white portal and spike outlines; the white flash stays bright.
  bestFor: [ teleport/blink, portal open, summon, dimensional rift, explosion, shockwave ]
  caveats: The early frames are a small horizontal sliver (horizontal-slit start), and the burst fills most of the 128x128 canvas.
scifi_warp_002:
  look: A small orb swells into a bright disc, then explodes into a ring shooting spiky shards and particles outward.
  motion: The orb grows into a large glowing disc, bursts into a thick ring spraying shards outward, and the ring thins to a fading dotted circle.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue ring and particles, pale mid shade, white disc core and shard highlights.
  bestFor: [ explosion/nova, teleport arrival, AoE burst, shockwave, shield break, detonate mark ]
  caveats: The burst fills the 96x96 canvas nearly edge to edge. The last frames are a thin dotted circle.
scifi_warp_003:
  look: A glowing needle streak drops from above and strikes the ground, making a splash cone, a flat shockwave and wavy tendrils rising up.
  motion: A thin streak at the top elongates downward into a beam, hits the bottom, erupts as a spike, a ground ring and wriggling squiggles rising upward, then fades to small arcs.
  orientation: falls-from-above
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue tendrils, pale beam body, white core, spike and ground ellipse; the white impact stays bright.
  bestFor: [ orbital/sky strike, lightning bolt from above, teleport landing, summon descent, smite, ground slam impact ]
  caveats: The impact point is at the bottom of the 128x128 canvas, so anchor the canvas bottom at the unit's feet. The descent phase is a thin streak and easy to miss when small.
directional_smoke_burst_001:
  look: A round puff at the lower center billows up into a large cloud that shifts from white to peach to pink and dissolves.
  motion: A white puff low in the canvas expands upward into clustered billows, warms to pink/magenta tones, and breaks into specks drifting toward the top.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: Starts white, then main hue in several shades; this variant shows pinkish/magenta shades, so the color shifts over the animation.
  bestFor: [ smoke bomb/vanish, dust cloud, explosion aftermath, poison cloud, landing puff, summon poof ]
  caveats: The origin is low in the canvas and the cloud drifts upward, so anchor it near the feet. The white early phase stays white under tint.
directional_smoke_burst_002:
  look: A small puff at the bottom splits into many round smoke balls that billow up into a dome-shaped cloud.
  motion: A puff at the bottom center breaks into clusters that rise and spread into a mound, erode from the bottom up, and leave wisps drifting at the top.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: Mostly a single flat main hue with a slight shade; it tints very uniformly but has little internal contrast.
  bestFor: [ ground explosion smoke, dust cloud, smokescreen, earth slam aftermath, poison gas, burrow/emerge ]
  caveats: Nearly monochrome, so it can look flat; layer a brighter effect on top. The origin is low in the 96x96 canvas.
directional_smoke_burst_003:
  look: A smoke jet enters from the right edge and billows leftward into a C-shaped cloud front (convex to the left).
  motion: A white pill at the right edge blasts left into a mushrooming cloud; its leading front curls into a C-shaped ring on the left that breaks apart and fades.
  orientation: points-left
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue cloud in pale, mid and dark shades with a pale/white core at the start.
  bestFor: [ directional impact puff, knockback blast, back-blast/exhaust, dash launch dust, cannon smoke, wind push ]
  caveats: The source is cut off at the right canvas edge, so the plume travels leftward. Mirror it horizontally for effects heading right. It is only 8 frames, so it is fast.
directional_smoke_burst_004:
  look: A thin curling smoke wisp rising from the bottom into swirling tendrils that dissolve upward.
  motion: A tiny white wisp at the bottom rises and curls into a twisting plume, splits into swirling curls drifting upward, and breaks into specks near the top.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Main hue in several shades with a white starting wisp; the darker shades give the curls depth.
  bestFor: [ burn/afterburn tick, smolder/extinguish, steam, poison tick, vanish wisp, incense/curse ]
  caveats: Tall narrow 48x80 canvas with the origin at the bottom; anchor it at the feet or at the hit point. The first frames are a tiny wisp, so it starts small.
spell_heal_003:
  look: Plump plus-sign crosses and thin edge-on spinning crosses rising, with dashed sparkle rings popping around them.
  motion: Small sparks at canvas bottom sprout crosses that rise, spin (flip to edge-on bars), drift upward and pop into dashed rings; ends with one fading ring upper-right.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: White/peach cross fills + red-variant mid and dark shading; reads cleanly under any tint (green or gold are natural for heals).
  bestFor: [ heal, regen tick, cleanse, self buff, revive, shield restore ]
  caveats: Frame 0 is almost empty (a tiny spark at the bottom). Long (42 frames). Crosses scatter across the full width and end top-right, so it is slightly asymmetric.
spell_ice_001:
  look: Twinkling four-point sparkles, a flash orb, then a large faceted crystal/gem chunk encasing the center, shattering to an outline.
  motion: Tiny glint grows to two sparkles, pops into a round orb, solidifies into a faceted crystal block ringed by particles, holds, then vanishes leaving a thin wobbly outline ring.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White highlights + peach/salmon facets + dark red shadow; tinted blue/cyan it reads as an ice block, tinted other hues as a gem/crystal prison.
  bestFor: [ freeze, stun, encase/petrify, ice impact, crystal shield, debuff applied ]
  caveats: First and last frames nearly empty. Crystal body fills roughly the middle half of the 128 canvas; scale to unit size. The crystal is a solid opaque shape that will hide the unit for several frames.
spell_poison_001:
  look: Toxic skull-faced cloud bursts up from a spiky ground ring, spreads into an arching cloud, then rains droplets.
  motion: Spiky crown at bottom sprouts a small skull, which balloons into a big skull cloud over a dotted ground ring, then flattens into an arch and breaks into falling blobs.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Salmon/peach cloud + dark red shading and droplets, almost no white core; tinted green/purple it reads as poison or curse. The skull face is in the shading, so it survives tinting.
  bestFor: [ poison applied, curse, toxic cloud AoE, debuff applied, death/doom mark ]
  caveats: The skull is explicit and reads as a specific motif. The cloud spreads into a wide arch over the upper canvas, wider than one unit, and the droplets end at the top edge rather than falling to the ground.
spell_sleep_001:
  look: Swirling spiral, puffy cloud bubbles with sparkles, then a row of 'Z Z Z' letters and a final sparkle twinkle.
  motion: Dot unwinds into a spiral, bursts into puff clouds with twinkles, which give way to growing Z glyphs drifting in a row; a last Z sparkles and fades into dots.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Mostly salmon/peach glyphs + white sparkle accents + dark red outlines; tints fine (blue/lavender typical for sleep).
  bestFor: [ sleep applied, drowsy/stun, charm/confuse, daze, UI only (text) ]
  caveats: Contains literal Z letters (text-like), so it only reads as sleep. Content sits in the upper-middle canvas; the Zs drift slightly right. Long (48 frames). First and last frames nearly empty.
status_poison_001:
  look: Outlined soap-bubble circles of varying size appearing and popping around the canvas.
  motion: Bubbles appear at scattered positions, grow, then pop into dashed rings; new ones spawn continuously in a cycle.
  orientation: none
  anchor: aura
  loopable: true
  intensity: subtle
  tintNote: Thin salmon/red outlines with peach highlight glints; no fill, so it stays readable and light over the unit when tinted (green for poison, blue for water/wet).
  bestFor: [ poison tick, persistent poison status, wet/soaked status, bubble shield ambience, confuse ]
  caveats: Outlines only, thin and faint at small scale. Bubbles roam the whole canvas, including corners, rather than staying centered. Loop seam assumed from the status design; verify.
status_sleep_001:
  look: Chunky zigzag Z letters floating upward in a cycle.
  motion: Small z appears at bottom, grows and twists as it rises, exits top while the next Z follows; continuous cycle.
  orientation: points-up
  anchor: overhead
  loopable: true
  intensity: subtle
  tintNote: Salmon body + peach highlight, no white core; tints cleanly.
  bestFor: [ sleep status (persistent), drowsy, UI only (text), stunned/idle indicator ]
  caveats: Literal Z glyphs (text-like). Small 48x48 canvas fills its frame, so place it above the head at a small scale.
status_sparkling_001:
  look: Scattered four-point star sparkles and tiny dots twinkling across the canvas.
  motion: Sparkles pop in at random positions, flare and shrink away, constantly reshuffling; even, ambient twinkle.
  orientation: none
  anchor: aura
  loopable: true
  intensity: subtle
  tintNote: White and peach stars + salmon small dots; very neutral, tints to any hue (gold for blessed, cyan for magic).
  bestFor: [ persistent buff status, blessed/empowered, stealth shimmer, invulnerable, charm, loot/reward ]
  caveats: Very small sparse sprites; may vanish at small scale. Spread over the whole canvas edge to edge.
directional_fire_burst_001:
  look: Tall flame jet erupting upward into a mushroom/skull-like fiery plume, then crumbling to embers.
  motion: Ember at bottom shoots up as a white-hot jet, becomes a full-height column with a bulbous top, then fragments into ember speckles from the top down.
  orientation: points-up
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: White-hot core + peach/salmon flame + dark red embers; tints to any element jet (blue fire, green acid geyser, purple void).
  bestFor: [ fire pillar/geyser, eruption from ground, fire breath (rotated), burn applied, explosion ]
  caveats: Narrow tall canvas (48x96), so the column spans the full height. The top plume's dark-red detail resembles a skull face. Rotate 90 degrees for a horizontal blast toward a target.
directional_fire_burst_002:
  look: Narrow fire column topped by a round mushroom-cloud head, like a small flame geyser.
  motion: Dot at bottom shoots up a stem with a bulbous head, the head swells and holds, then the stem breaks into falling embers and the head crumbles last.
  orientation: points-up
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: White-hot head core + peach/salmon body + dark red drips; tints well.
  bestFor: [ flame pillar, ground eruption, fire torch/brazier, muzzle flash (rotated), burn tick ]
  caveats: Very small canvas (32x64), so scale up. Frame 0 is a single dot. Cleaner and smaller than directional_fire_burst_001.
fire_looping_001:
  look: Roaring fireball/flame with a bright white-hot core low in the frame, tongues and dark smoke wisps above.
  motion: Flames flicker and lick upward, curling smoke tips shifting each frame; steady continuous burn.
  orientation: points-up
  anchor: center
  loopable: true
  intensity: medium
  tintNote: White/pale core + peach and salmon flame + dark red smoke tips; tints to any colored flame (blue soulfire, green hellfire, purple void).
  bestFor: [ burning status (persistent), fire projectile (rotate so core leads), fire aura, brazier/summon flame, enrage ]
  caveats: Fills most of the 64x64 canvas; very opaque, so it covers the unit if scaled to unit size. Flames rise upward, so as a projectile the core leads downward unless rotated.
directional_impact_001:
  look: Fan of leaf-like shard streaks spraying left from a vertical oval shock ring on the right side.
  motion: White shard fan appears, an oval shock ring forms at the right, then streaks shoot outward to the left and scatter into thin dashes.
  orientation: points-left
  anchor: center
  loopable: false
  intensity: medium
  tintNote: White leading shards + peach/salmon streaks + dark red fade; tints cleanly.
  bestFor: [ melee hit (directional), projectile impact, punch/strike, knockback, counter, slash hit ]
  caveats: "Off-center: the impact ring sits right of center and the spray occupies the left/center. The spray travels away from a hit landing on the right, so flip it horizontally so the debris sprays away from the attacker. Short (7 frames)."
directional_impact_002:
  look: "Wide flat ground splash: bright white-yellow blast at center that splits into two swirling dust/spark clouds left and right."
  motion: Center flash sprays up-left and up-right, then divides into two mirrored swirl clouds moving outward along the ground, crumbling to specks.
  orientation: horizontal-band
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: White core + yellow sparks + peach/salmon clouds + dark red swirls; the yellow sparks appear even in the red variant and may not swap with the palette.
  bestFor: [ landing/ground slam, stomp, dash arrival/teleport landing, knockdown, shockwave along ground, dust kick ]
  caveats: Very wide, short canvas (140x50); content sits at the bottom. Yellow accent pixels may not tint with the palette swap. Clouds end at the far left and right edges.
directional_impact_003:
  look: "Ground splash: flat ellipse, then a white crown of spikes erupting upward, breaking into flying shards."
  motion: Small ground ellipse expands to a ring, bursts into a crown-shaped splash, then spikes fly up and outward while side shards splay sideways near the ground.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: White splash body + peach ring/shards + salmon fade; tints well (blue for water, brown/grey for earth).
  bestFor: [ ground impact, stomp, splash (water), earth spike/rupture, landing, trap trigger ]
  caveats: Starts in the lower-middle canvas; the spikes reach the top edge by the end. Only 6 frames (some held), so it is quick.
directional_impact_004:
  look: "Heavier ground eruption: elliptical shock ring with tall white spikes bursting up, ring widening, spikes flung upward."
  motion: Ring with spikes appears at ground, spikes tower up, the ring expands outward while spike tips detach and fly up; a peach residue splash lingers at the base.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: White spike mass + peach ring/residue + salmon tips; tints well.
  bestFor: [ heavy ground slam, eruption/geyser, earth spike, explosion from below, summon arrival, trap trigger ]
  caveats: Ring spans nearly the full 80px width at the bottom. Only 5 frames (some held), so it is very fast.
stylized_impact_001:
  look: "Gyroscopic burst: petal-like leaf blades in a cross, then two intersecting outline ellipses (tall tilted + wide flat) with radial streaks."
  motion: Flat tilted ellipse explodes into a cross of shaded blade-petals, which open into two perspective shock rings expanding past the frame and fading to dotted lines.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White blades with blue-grey/dark hatching + peach streaks + salmon fade; the dark hatching keeps shape under tint.
  bestFor: [ critical hit, heavy magic impact, arcane/wind blast, explosion, stun, counter ]
  caveats: The rings are tilted, not upright (the tall one leans slightly), so it reads as 3D/perspective. Rings grow past the 128 canvas edges in later frames. Has some blue-grey hatching that may or may not tint.
symmetrical_impact_001:
  look: Star flash into a filled disc, then a thin ring with radial spike rays expanding outward.
  motion: Four-point white star flares, becomes a peach disc with star core, then opens into a thin ring with spikes shooting outward and fading.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: White flash + peach/salmon ring + dark red fade; tints cleanly.
  bestFor: [ generic hit, projectile impact, magic impact, stun, explosion (small), crit ]
  caveats: Ring reaches near canvas edges by the end; quick (7 frames).
symmetrical_impact_002:
  look: Spiky white starburst into a disc, then concentric double ring with wedge rays, settling to one ring.
  motion: Spiky star flares to a spiked disc, then splits into an inner thick ring and outer thin ring with radiating wedges, which collapse to a single fading ring.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: White flash + peach thick ring + salmon wedges/fade; tints cleanly.
  bestFor: [ magic impact, shockwave, shield break, buff applied (burst), stun, explosion ]
  caveats: The double-ring phase is busier and reads more 'arcane' than a plain hit. Ends as a clean thin ring at mid canvas.
symmetrical_impact_003:
  look: Dot to spiky star to large filled disc with jagged rays, then a thin ring with ragged shard spikes.
  motion: Dot flares into a spiked star, balloons into a big peach disc with spike fringe, then hollows into a thin ring scattering jagged shards outward.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White spikes + peach disc + salmon ring + dark red debris; tints cleanly.
  bestFor: [ heavy hit, explosion, crit, shatter, burst AoE, death ]
  caveats: Filled-disc frame fully covers the center (opaque flash). Spikes reach the canvas edges.
symmetrical_impact_004:
  look: "Shredded explosion: white spiky blob into a thick peach disc with feathered inner ring, then a ragged double ring of tufts."
  motion: Spiky blob expands into a heavy disc, hollows into concentric rings lined with feathery tufts, which spread outward to the canvas edges and dissolve into specks.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White tufts + peach disc + salmon/dark red feathering; tints well (busy texture holds under any hue).
  bestFor: [ explosion, heavy impact, shockwave AoE, shatter, earth/rock burst, crit ]
  caveats: The outer ring becomes squarish and clips the canvas corners/edges by mid-animation. A dense, noisy texture.
symmetrical_impact_005:
  look: Clean dot to filled disc, then a ring with evenly spaced spoke rays shooting outward.
  motion: Dot swells to a disc, opens into a spoked ring, spokes fly outward while the ring fades to dotted remnants.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: White/peach disc + peach ring and spokes + salmon fade; minimal palette, very tint-friendly.
  bestFor: [ light hit, projectile impact, buff applied, debuff applied, ping/mark target, shield pulse ]
  caveats: Thin lines can get faint at small scale. Spokes reach the canvas edges near the end.
symmetrical_impact_006:
  look: Big white flash disc with spikes, then an oval ring of jagged pink and peach shards scattering.
  motion: Dot swells into a large spiked disc, then breaks into an oval ring of jagged crystal shards flung outward, fading to a dotted ring.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White flash + peach ring + salmon fade + pink/lilac shard accents; the pink shards appear even in the red variant and may not tint with the palette.
  bestFor: [ shatter (ice/crystal), heavy magic impact, crit, explosion, shield break ]
  caveats: Large 160x160 canvas; scale down. The ring is a slightly squashed oval rather than a circle. Contains pink/lilac accent pixels outside the 4-color swap.
toon_impact_001:
  look: "Cartoon starburst: yellow-centered flash disc, then a ring of five-point stars and yellow blobs dispersing outward."
  motion: Dot pops into a peach-ringed yellow disc, explodes into a ring of white stars and yellow puffs, which drift outward, shrink to small stars and fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: White stars + yellow core/blobs + peach/salmon stars; yellow persists in the red variant and may not tint. The five-point stars read as comedic or dizzy.
  bestFor: [ stun/dizzy, comedic bonk hit, charm, crit (playful), reward/level-up pop ]
  caveats: Cartoon stars give a playful tone. Yellow accent pixels are outside the 4-color swap. Late frames are sparse tiny stars spread to the canvas edges.
lightning_burst_001:
  look: "Ornate mirrored burst filling the canvas: concentric rings with curly filigree edges, dissolving into speckle confetti."
  motion: Dot swells to a two-tone disc, explodes into a full-canvas ornamental burst with curled filigree, hollows out, then breaks into dashed specks along a squarish ring.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White inner core + peach/salmon rings + dark red filigree; tints fine but looks more arcane/holy than electric.
  bestFor: [ magic explosion, holy/arcane burst, buff applied (big), summon, teleport arrival, AoE nova ]
  caveats: "Despite the name, nothing bolt-like is drawn: it is a symmetric filigree nova. It fills and clips the full 64x64 canvas from frame 2 onward (squarish silhouette)."
lightning_burst_002:
  look: "Jagged electric flash: spiky starburst with a long horizontal streak, then a crackling jagged ring and zigzag bolt fragments."
  motion: Orb with sparks bursts into a jagged star with a horizontal flare, swells to an irregular flash, breaks into a jagged ring of crackle, leaving zigzag bolts that flicker out.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: White flash and bolts + peach/salmon jagged ring + dark red crackle; tints well (purple/cyan for lightning).
  bestFor: [ lightning strike impact, shock/paralyze, electric explosion, stun, crit ]
  caveats: Frame 1 has a strong horizontal streak (left-right flare). The jagged ring hits and clips the 64x64 canvas edges. Leftover zigzag bolts are scattered asymmetrically.
epic_explosion_001:
  look: "Big ground eruption: fire column topped by a mushroom of slate smoke, with smoke curls rolling along the base."
  motion: Small glowing ellipse at the bottom erupts into a tall flame column. Smoke billows into a cap in the upper half, drifts up and thins.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue fire + dark slate/purple smoke + white-hot core. The smoke stays dark under tinting, which is fine for fire, earth and shadow.
  bestFor: [ ultimate/heavy hit, fire explosion, ground eruption, bomb/meteor landing, AoE on a unit ]
  caveats: Origin is at the bottom-center of the canvas. The second half is mostly smoke hanging in the upper half, so it has a long smoky tail. Anchor it at the unit's feet.
epic_explosion_002:
  look: "Huge fountain blast: cream puffs become an arching spray of fireballs and debris, leaving branching smoke trails."
  motion: Dot at the bottom-center becomes two big cream puffs, then a wide upward arch of fireballs flinging shards up and out. Branching slate smoke trails spread over the upper canvas and fade.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: massive
  tintNote: Main hue fireballs + dark slate smoke + white/cream flash and shards.
  bestFor: [ ultimate, artillery/meteor impact, volcanic eruption, row-wide AoE, massive fire blast ]
  caveats: 192x192 canvas, so it needs scaling down. Origin is at the very bottom-center. The smoke trails are slightly asymmetric, leaning upper-right, and spread across most of the canvas.
epic_explosion_003:
  look: "Mushroom-cloud blast: cream dome with a shockwave skirt turns into a red fire dome capped by olive-green smoke."
  motion: Ground ellipse flash puffs into a cream mushroom with a shock skirt and upward rays. It becomes an arching dome of red fire under green smoke, then a dark green crumbling arch.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue fire + olive/dark-green smoke + white core. The olive smoke in this variant reads toxic; check it under tinting.
  bestFor: [ poison/toxic explosion, grenade/bomb, earth eruption, heavy ground impact, trap trigger ]
  caveats: Bottom-anchored, with the dome sitting in the lower-middle. A faint ring of ground sparks shows in the mid frames. The green smoke may not match non-nature themes.
stylized_explosion_001:
  look: "Comic burst: white flash with radiating spokes becomes a ring of red fireballs, then slate crescent smoke puffs."
  motion: White dot becomes a spiky white flash ring, then bursts into a ring of red fireballs with white streaks shooting outward. It turns into slate crescent puffs that shrink away.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue fireballs + slate/purple smoke crescents + white flash/spokes.
  bestFor: [ melee hit, projectile impact, critical hit, fire impact, generic explosion ]
  caveats: Centered and symmetric, filling most of the 96x96 canvas at its peak.
stylized_explosion_002:
  look: Growing striped energy sphere that becomes a hollow ring with swirling horizontal streaks inside.
  motion: Small orb with a white core swells into a large banded sphere (white/peach/red). It hollows into an outlined ring with swirling streaks, then the ring dots out and the streaks scatter.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue banding + light tint + white streaks. Nearly all of it is the main hue, so it tints cleanly.
  bestFor: [ energy orb impact, barrier/shield pop, wind/vortex burst, magic burst, bubble burst ]
  caveats: At its peak the sphere fills almost the whole canvas. The horizontal swirl streaks read like a planet or a vortex.
stylized_explosion_003:
  look: Ground blast dome with an elliptical shockwave ring, turning into an arch of fire and dark smoke puffs.
  motion: Small bottom ellipse puffs into a cream dome inside a flat shock ring. It flares into a red fire dome with debris streaks up, then breaks into an arching band of slate smoke puffs.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue fire + dark slate smoke + cream/white flash.
  bestFor: [ ground explosion, landmine/trap trigger, bomb, AoE impact, fire impact ]
  caveats: Non-square 128x96 canvas. Origin is near the bottom-center. The final frames are an arch in the upper half.
stylized_explosion_004:
  look: "Delayed detonation: tiny diamond glints twinkle, then a pale crater-like flash dome bursts into a cloud outline."
  motion: For about 12 frames, small diamond glints flicker around center (wind-up). Then a pale bowl flash with a dark center appears, swells into a peach cloud with a dotted outline, and breaks into red puff fragments.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue cloud fragments + grey streaks + near-black dark center + white flash.
  bestFor: [ delayed/timed bomb, charge then blast, crit impact, implosion, magic detonation ]
  caveats: About the first half is only tiny sparse glints; frame 9 is nearly empty. The real blast starts around frame 12. The dome sits slightly low of center and has a near-black core.
stylized_explosion_005:
  look: "Chaotic charged blast: jagged zigzag shards converge on an orb, then a sphere bursts with spiky jagged bands."
  motion: Thin zigzag shard lines flick around center, converge into a small orb, then a ring. It erupts into a bubble with white and red spiky fringe bands, then dissolves to a dotted outline.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue + white + pink and yellow accents. The multi-hue shards (pink, yellow) may not tint uniformly.
  bestFor: [ lightning/charged burst, implosion then explosion, stun, arcane blast, crit impact ]
  caveats: Long sparse wind-up (about 14 frames of thin lines). The burst lands late, around frame 18. The burst is slightly top-heavy, and the last frame is a faint outline with a spike at the upper right.
stylized_explosion_006:
  look: "Gas-cloud blast: puffy cloud cluster, turning olive-green with a red fiery core and veins."
  motion: Peach dot puffs into a cream/olive cloud cluster with a thin ring. It grows into a wide olive smoke mass with a red glowing core, darkens with red veins, and dissolves.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue core/veins + olive/dark-green smoke + cream flash. The green smoke dominates and stays toxic-looking.
  bestFor: [ poison cloud, gas/smoke bomb, toxic burst, decay/rot, disease spread ]
  caveats: Wider than tall, sitting center to slightly low. The olive smoke is the main visual, so it suits poison/nature far better than pure fire.
symmetrical_explosion_001:
  look: "Quick pop: white disc with a halo is eaten by a red crescent, leaving a thin arc."
  motion: White dot swells into a disc with a peach halo and an outer ring. A red crescent consumes it from the lower-left, shrinking to a thin arc at the upper-right that dots out.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue crescent + light halo + white disc. Tints cleanly.
  bestFor: [ quick hit, small projectile impact, pop/puff, crit spark, eclipse/moon flash ]
  caveats: "Only 8 frames on a 64x64 canvas, so it is very fast. The dissipation is lopsided: the leftover arc sits upper-right. Flip or rotate it to vary."
symmetrical_explosion_002:
  look: "Punchy blast: X-shaped star flash, then clustered red fire bubbles with pale smoke and corner sparks."
  motion: Ring with a white core becomes a four-point star flash filling the canvas. Red fire bubbles erupt with sparks to the corners, turn into pale dithered smoke with red drips, and fade top-heavy.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue fire + pale grey-blue smoke + white flash.
  bestFor: [ melee hit, critical hit, fire impact, grenade, explosion ]
  caveats: Fills the 64x64 canvas edge to edge, and sparks touch the corners, so scale it with margin. The late smoke is dithered and drifts to the top.
symmetrical_explosion_003:
  look: Disc flash containing a lumpy red mass that bursts upward into a crown of red blobs.
  motion: White dot becomes a big peach disc with an inner bubble and red lobes. The ring outlines a fringed red mass, then red blobs rise and arch over the top, fading pinkish.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue blobs + pale peach disc + white core. Mostly a single hue.
  bestFor: [ blood/flesh burst, bubble burst, magic impact, death pop, unholy hit ]
  caveats: The second half shifts to the upper half of the canvas as the blobs arch up. The inner shape looks organic, like a jellyfish.
symmetrical_explosion_004:
  look: "Donut shockwave: a ring of spiky puffs and fragments expanding outward from an empty center."
  motion: White dot becomes a ring of white/red puffs with radial spikes. The ring expands into scattered red fragments, which thin to sparse dark-green and red bits around the rim.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue fragments + white spikes + olive/dark-green in the fade.
  bestFor: [ shockwave/nova, self-centered AoE burst, shatter, ground stomp, ring explosion ]
  caveats: The center stays empty after the first frame, so it frames a unit well. The faint olive specks in the fade may clash under some tints.
spell_absorb_001:
  look: Ring of glowing orbs spiraling inward into a dense glowing cluster that dissolves into sparkles.
  motion: Orbs appear on a wide ring around the canvas and converge spiraling toward center. They compress into a glowing mass, crumble into particles and twinkles, and end on a single sparkle.
  orientation: radial
  anchor: aura
  loopable: false
  intensity: medium
  tintNote: Main hue orb rims + white orb cores + white twinkles. Tints cleanly.
  bestFor: [ absorb/drain received, lifesteal on caster, charge-up/gather energy, mana gain, steal buff ]
  caveats: Motion is inward (implosion), so play it on the receiver. The orbs start near the canvas edges, so they need room. Long at 31 frames.
spell_attack_up_001:
  look: Sword icon tilted diagonally with a plus sign beside it, flashing gold then to an outline.
  motion: White wipe streaks slash in to form a red sword (hilt lower-left, blade upper-right) and a '+' with falling speed lines. It gains a gold rim, flashes solid cream, and ends as a thin outline.
  orientation: diagonal-up-right
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue sword/plus + cream/gold rim and flash frame + white wipes.
  bestFor: [ attack up, damage buff, empower, strength buff, UI only (icon pop) ]
  caveats: Iconographic UI-style art (sword and '+') that fills most of the canvas. The solid cream flash near the end does not take the tint. Scale it down to sit over a unit's head.
spell_buff_001:
  look: Several chunky up-arrows popping in and rising, shrinking into streaks and sparkles.
  motion: Tiny arrow at the lower-left grows into a white arrow flash, then three outlined red up-arrows rise. They thin into upward streaks, then sparkle clusters that drift upward and fade.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue arrows + light arrow face + white outline/sparkles.
  bestFor: [ generic buff, stat up, self buff, level up, speed/energy gain ]
  caveats: The arrows are small and start in the lower-left/center rather than centered. They drift upward over 30 frames. The late frames are sparse sparkles.
spell_death_001:
  look: Red brushstroke painting of the kanji for 'death', then a flaming yellow skull bursting over it.
  motion: A white brush tip paints a red kanji stroke by stroke. A blazing yellow-orange skull with dark red smoke appears over it, then everything scatters into dust specks.
  orientation: none
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue kanji + dark red smoke + yellow/orange skull. The yellow skull stays yellow even in the red variant, so it may not tint cleanly.
  bestFor: [ instant death/execute, doom/death mark, killing blow, curse resolves, unholy finisher ]
  caveats: Contains text (Japanese kanji). Very long at 50 frames, and the stroke painting takes most of it. Fills the whole 64x64 canvas. The first frame is just a tiny brush flick at the top-left.
spell_debuff_001:
  look: Chunky outlined down-arrows dropping, thinning into droplets and landing as small puffs.
  motion: A tiny arrow at the top grows into red down-arrows that fall. They thin into droplet streaks, land as small cloud puffs near the bottom, and fade.
  orientation: falls-from-above
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue arrows/puffs + light face + white outline/droplets.
  bestFor: [ debuff applied, stat down, weaken, slow, curse ]
  caveats: Small elements, off-center at the start (upper-left). Long at 33 frames, with sparse puff frames in the second half.
spell_defense_up_001:
  look: Ornate heater shield icon with a plus sign beside it, flashing gold then to an outline.
  motion: White wipes swipe in to form an upright red ornate shield and a '+' with speed lines. It gains a gold rim, flashes solid cream, and ends as a thin white outline.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue shield/plus + cream/gold rim and flash + white wipes.
  bestFor: [ defense up, shield/guard, armor buff, barrier applied, UI only (icon pop) ]
  caveats: Iconographic UI-style art (shield and '+') that fills most of the canvas. The cream flash frame does not take the tint. Pairs with spell_attack_up_001.
spell_dispel_001:
  look: Sparkle glints and several bubble rings full of tiny stars popping one after another.
  motion: Tiny dots become four-point glints, then sparkle-filled rings appear and burst in sequence. The rings drift from lower-center toward the upper area and fade to drifting star specks.
  orientation: none
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue rings/glints + light glint fill + white star sparkles.
  bestFor: [ dispel/cleanse, purify, remove buff, magic sparkle, bubble pop ]
  caveats: The rings wander across the canvas instead of staying centered, ending in the upper half. The first frames are nearly empty.
spell_forge_001:
  look: Small flame drops falling onto a flat ground ring, throwing up spark streaks and a white-hot glow.
  motion: Little flames fall one after another from the upper area onto an elliptical ground ring. Vertical spark streaks shoot up, a white-hot molten glow flares, then the ring dots out.
  orientation: falls-from-above
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Main hue flames/ring + white-hot core + yellow spark streaks.
  bestFor: [ forge/craft, ember rain, burn tick, trap/rune trigger, summon circle ]
  caveats: Small content in a 96x96 canvas, with the ground ring in the lower-middle. Yellow spark streaks may not take the tint.
spell_haste_001:
  look: Roman-numeral clock face with hands spinning fast amid pink motion swirls.
  motion: Clock numerals appear around a center pin. Long arrow-tipped hands whirl rapidly clockwise with pink swirl blur, then the clock collapses into a bubbly outline that fades.
  orientation: radial
  anchor: overhead
  loopable: false
  intensity: medium
  tintNote: Main hue numerals + white hands + pink swirl accents. The pink may not tint uniformly.
  bestFor: [ haste/speed up, cooldown reduction, extra turn, time manipulation, slow (play reversed) ]
  caveats: Contains text-like Roman numerals; the top reads XII, then XIII. It fills most of the canvas. Long at 29 frames. The middle spin frames could be looped separately.
spell_heal_001:
  look: Radial light rays converging to a point that blooms into a white heart, which fades to an outline.
  motion: Faint rays gather toward center, a dot appears, and a white heart pops out with the rays flaring outward. The heart thins to a peach outline and fades.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue heart rim + white heart fill + yellow/white ray accents.
  bestFor: [ heal, charm, regen tick, bond/protect buff, lifesteal received ]
  caveats: The first frame is nearly empty (a few specks). The heart is a heart icon, so it is literal. The yellow rays may not take the tint.
spell_heal_002:
  look: Small orb ring opening into several floating plus-crosses that rise and dissolve into sparkles.
  motion: White dot becomes a ring of small orbs, which breaks into several red plus-crosses. They float upward, shrink into twinkle sparkles, and fade.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue crosses/orbs + light accents + white sparkles. Tints cleanly.
  bestFor: [ heal, regen/HoT tick, restore, minor revive, cleanse ]
  caveats: Small elements. Long at 36 frames, with sparse sparkle frames in the back half. It drifts slightly upward from center.
frost_mage_1:
  look: Cyan frost ring with two small ice orbs orbiting it, inner curling frost swirls; bright cyan/blue on dark.
  motion: Dot swells into a disc, opens into a ring; two orbs circle it with motion arcs, swirls curl inside, then the ring dims to faint teal.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Native icy cyan + deep blue + white highlights; final frame is desaturated teal. Tints cleanly as a single-hue ring.
  bestFor: [ freeze/chill applied, self buff, ward/barrier up, status orbit, channel/charge ]
  caveats: Ring sits centered and occupies about 60% of canvas; the orbiting orbs go out near the edges. Last frame is a dim teal ghost ring, not empty.
frost_mage_3:
  look: Jagged blue ice mass growing into a large triangular glacier/iceberg with white-lit edges.
  motion: Thin ice shards appear at center, thicken and spread with flying ice flecks, harden into a full bright iceberg on the final frame.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Native royal blue + cyan + white edge highlights. Multi-tone blue; tinting keeps the faceted look.
  bestFor: [ freeze/encase target, ice wall, earth/ice eruption, stun, heavy ice impact ]
  caveats: Ends at its brightest (no fade-out). Hold the last frame for a frozen state, or fade it in code. The base fills the lower canvas; it is bottom-heavy.
frost_mage_4:
  look: Small cluster of blue ice crystals jutting from the ground, white frost mist puffing off their right side.
  motion: Low ice ripple rises into a crystal cluster leaning slightly right; white/grey mist curls on the right, then crystals shrink back and dim.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Native blue + cyan crystals, white-to-grey mist. Mist goes grey late, so tinting can muddy it.
  bestFor: [ ice spike from ground, trap trigger, chill/slow applied, small frost hit, ground hazard ]
  caveats: Wide 256x128 canvas but the effect is small, sitting in the lower-middle and covering only about 40% of the width. Lots of empty space; crop or scale up.
frost_mage_5:
  look: Ice crystal shard drops and shatters on the ground with a white splash and grey smoke swirls.
  motion: Tiny shard at top grows as it falls to bottom center, hits with a white star splash, crystal breaks, grey smoke curls spread left and right, then fade.
  orientation: falls-from-above
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: Native blue/cyan crystal, white impact splash, grey smoke. Smoke and splash are neutral and survive tinting.
  bestFor: [ falling ice shard, icicle drop impact, frost strike from above, shatter, debuff landing ]
  caveats: Starts top-center and ends on the ground in the lower third; anchor the bottom to the target's feet. The last frames are mostly grey smoke.
frost_mage_6:
  look: Expanding blue frost sphere with a lobed flower-like crack pattern inside, then shatters into shards.
  motion: Dot grows into a disc, then a large lobed orb filling the canvas, cracks with white veins, breaks into scattered edge fragments and vanishes.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Native deep blue + cyan + white veins. Shares a template with necromancer_7 (minus skull); tints well.
  bestFor: [ frost nova/explosion, AoE freeze, orb impact, shield break, burst ]
  caveats: At its peak it fills nearly the whole 128 canvas. Last frame is almost empty.
frost_mage_7:
  look: Icy blue wind streaks blasting rightward, led by a billowing white frost cloud.
  motion: Small puff at left; a cloud head with blue speed streaks behind it travels to the right edge, streaks thin, cloud turns grey and lingers.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: Native blue streaks + white cloud turning grey. Cloud is mostly white/grey, so tinting mainly shows on the streaks.
  bestFor: [ frost breath/gust, wind blast, knockback, cone/line push, projectile travel ]
  caveats: 256x128 canvas; the effect sits in the middle-lower band. The cloud ends at the right edge, so anchor the right side on the target and flip it for the other row.
necromancer_1:
  look: Green elliptical ground circle (perspective ring) with spectral wisps rising and swirling above it.
  motion: Segmented ring flickers; mid-animation green wisps curl up from it into a hook above, swirl inside, then sink back, leaving the bare ring.
  orientation: none
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Native mint green + very dark green outlines. Single hue that tints easily.
  bestFor: [ summoning circle, curse zone/trap, raise dead/summon, debuff applied, ground marker ]
  caveats: First and last frames are both the bare ring (the last has a tiny center blob), so it nearly loops. The ring spans most of the canvas width in the lower-middle area.
necromancer_2:
  look: Green spectral crescent slash curving along the bottom, leaving a scaly particle trail.
  motion: Arc forms on the left, sweeps down around the bottom and up to the right tip with a bright flash, then breaks into scale-like flecks and fades.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Native mint green + dark green. The peak frame is a solid bright green flash; tints cleanly.
  bestFor: [ melee slash, scythe/claw swipe, dark strike, cleave ]
  caveats: "Sweeps counter-clockwise: from upper-left, down across the bottom, to upper-right. Mirror it for the opposite side. Mostly fills the lower 2/3 of the canvas."
necromancer_3:
  look: Ghostly green tendril wall spraying out to the right in a widening cone of dark mist.
  motion: Vertical band of tendrils at left edge thickens, then fans out rightward as a widening wedge of dark green smoke, which fades out.
  orientation: points-right
  anchor: beam
  loopable: false
  intensity: medium
  tintNote: Native mint green highlights over very dark green smoke. Dark body may read muddy under light tints.
  bestFor: [ cone spray, soul/miasma breath, fear/terror wave, drain wave, line AoE ]
  caveats: Origin is pinned to the left edge and mid-height; the effect only expands rightward to about 2/3 of the canvas. Mostly dark tones, so it is faint on dark backgrounds.
necromancer_4:
  look: Two green ghost spirits with trailing tails spiraling around each other, then turning blood red.
  motion: Spirit appears at center, a second joins; they orbit in a swirl, flash white, then turn red and shrink away into a speck.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Native mint green ghosts that switch to crimson red late. The two-color change is lost or muddied under a single tint.
  bestFor: [ life drain, soul steal, curse applied, haunt, spirit summon ]
  caveats: The green-to-red hue change is baked in. It reads best as 'draining life' and tinting will flatten it. Fairly wispy, about 60% of the canvas.
necromancer_5:
  look: Teal orb bursts into a spiky green crown of spikes around a skull, ending in red blood specks.
  motion: Dark teal orb at lower-left erupts into a jagged burst, spikes shooting up-right around a skull, then crumbles into fading red specks.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Native teal/mint green + white highlights, then crimson red residue. Green-to-red shift is baked in.
  bestFor: [ dark projectile impact, death burst, curse detonation, execute, crit hit ]
  caveats: "Off-center: the orb and skull sit in the lower-left quarter and the spikes spray to the upper-right. Mirror it for the other side. Red end frames tint poorly."
necromancer_6:
  look: Thin horizontal green wavy energy beam across the canvas, with red crossing tendrils pulsing along it.
  motion: Beam flickers thick and thin; red looping tendrils appear at the right end and travel leftward along the beam, then fade, leaving the green beam.
  orientation: horizontal-band
  anchor: beam
  loopable: true
  intensity: medium
  tintNote: Native mint green beam + crimson pulse. The red is baked in; a single tint loses the drain read.
  bestFor: [ life drain beam, tether/link, channel, siphon, soul leash ]
  caveats: 256x128 canvas; the beam is a thin line at mid-height spanning about x 8% to 98%. The red pulse moves right to left (toward the caster if the caster is on the left). Only the green beam loops; the red pulse plays once per cycle.
necromancer_7:
  look: Expanding green orb that becomes a circular seal with a large skull face, then shatters.
  motion: Dot grows to a ringed disc, then a lobed sphere with a skull; it flashes bright, breaks into fragments and dissolves.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Native teal/mint green + dark green with a white rim flash. Same template as frost_mage_6 plus a skull.
  bestFor: [ death mark, curse explosion, doom trigger, AoE dark burst, execute ]
  caveats: The skull is a strong emblem. At its peak the effect fills about 90% of the canvas. Last frame is empty.
necromancer_8:
  look: Green ghostly maw/shroud forming an oval with fang shapes, revealing a skull wrapped in purple shadow.
  motion: Crescent cup forms at the bottom and fills upward into a fanged oval, then purple shadow and a skull face surface, ending as a purple skull smear.
  orientation: rises-from-ground
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Native mint/teal green + dark green + violet/purple skull. Three distinct hues; tinting collapses the purple accent.
  bestFor: [ devour/consume, curse applied, fear, death sentence, body engulf ]
  caveats: Body-sized oval centered on the canvas; the first frame is nearly empty. The ending purple skull is a strong, specific read.
paladin_1:
  look: Golden holy cross with radiating light rays, splitting into a diamond core, then scattering sparks.
  motion: Dot becomes a four-point sparkle, then a big gold cross with rays; a white diamond opens in its center, the cross fragments outward into specks.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Native bright yellow-gold + white center. Flat colors that tint well.
  bestFor: [ holy smite, bless/buff, heal, cleanse, holy mark applied ]
  caveats: The cross is an explicit religious emblem. Centered and about 60% of the canvas.
paladin_10:
  look: Golden double-crescent slash traveling rightward, ending in a star-shaped impact flash and spark arrows.
  motion: Thin streaks at lower-left grow into a crescent sweeping right and upward, hit with a white star burst and three sparks firing right, then fade with a trailing arc.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: Native gold/yellow + white star core; fades to dark ochre. Tints cleanly.
  bestFor: [ sword slash, crescent wave projectile, melee hit, holy strike, crit ]
  caveats: 192x128 canvas. It starts small at the far left and the impact lands about 85% to the right. Flip it horizontally for the other row.
paladin_2:
  look: Two golden swords crossing into an X emblem, flaming with light, with small plus signs floating up.
  motion: Outline swords swing in from both sides and cross, flare with gold flames, solidify into a bright crossed-swords badge; plus signs pop, then it fades to a grey outline.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Native gold/yellow + white highlights; plus signs white/grey. The final grey outline is neutral.
  bestFor: [ attack up buff, self buff, war cry, empower, UI-style status applied ]
  caveats: An iconic emblem (crossed swords) rather than an effect; reads as a status icon. The last frame is a grey outline, not empty.
paladin_3:
  look: Two golden shield halves closing into a single shield emblem, with small plus sparkles around it.
  motion: Outline halves at the sides converge with sparks, form a glowing shield, which fills gold; plus signs drift around, then it fades to a dim outline.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Native gold/ochre + yellow outline + yellow plus signs. Tints well.
  bestFor: [ defense up buff, shield applied, protect ally, guard, UI-style status applied ]
  caveats: An iconic emblem (shield) about 1/3 of the canvas, centered. The last frame is a dim outline.
paladin_4:
  look: Three puffy golden light clouds in a triangle that swell with white-hot cores, then shrink.
  motion: Three small dim blobs appear, swell and overlap with white centers, cool to gold, then shrink back to small dim blobs.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Native yellow/gold + ochre outlines + white cores. Tints into generic puff explosions well.
  bestFor: [ explosion, multi-hit burst, holy blast, smoke/dust puff, AoE impact ]
  caveats: The start and end frames look similar (three small blobs) but the positions differ, so it does not loop cleanly. The cluster stays in the center about 2/3 of the canvas.
paladin_5:
  look: Golden pillar of light drives a dark sword/spire silhouette into the ground, leaving a gold spire that dwindles to a sparkle.
  motion: Gold crest at top drops into a full light column with a black sword shape; it slams down with a ground shock and dust ring, then the gold spire shrinks to a diamond sparkle.
  orientation: falls-from-above
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Native yellow/gold/orange + black silhouette + white outline. The black sword shape stays black under tint.
  bestFor: [ holy sword from above, judgment/smite, ground slam, sanctify ground, heavy impact ]
  caveats: Starts at the very top of the canvas and ends near center-bottom. Contains solid black fills (the sword silhouette) that may look like holes on dark backgrounds.
paladin_6:
  look: Golden comet-like flame streaks diving diagonally, hitting the ground with a white star impact and gold ring.
  motion: Streaks at upper-left dive toward lower-center, burst into a white star flash with a gold ground splash, then a ring expands and the flame fizzles.
  orientation: diagonal-down-right
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Native gold/yellow flames + white starburst + ochre ground ring. Tints well; white stays.
  bestFor: [ meteor/comet strike, holy fire impact, dive attack, falling projectile hit, ground AoE ]
  caveats: Comes in from the upper-left, so mirror it for attacks from the other side. Impact is at bottom-center.
paladin_7:
  look: Golden teardrop falls and splashes into a wide spiky golden flame burst along the ground.
  motion: Drop at upper-center stretches downward into a twin-horned flame, hits the ground, splashes into a wide spiky blaze that darkens to ochre.
  orientation: falls-from-above
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: Native yellow/gold + white core + ochre; the end frames go dark ochre. Tints well.
  bestFor: [ holy drop/blessing landing, consecrate ground, fire on ground, heal splash, ground hazard ]
  caveats: Last frame is a still-visible dark ochre flame patch (it does not fade to empty). Bottom-anchored.
paladin_8:
  look: Many parallel golden bands sweeping around into a dome-shaped multi-slash, like a radiant wing or claw swipe.
  motion: Single streak at lower-center curls up into crescent bands, wraps around the left into a big striped dome at the top, then streaks recede toward the upper-right and fade.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Native gold/yellow + ochre outlines + white highlights. Tints well.
  bestFor: [ multi-hit slash, flurry, wing sweep, big melee hit, cleave ]
  caveats: Sweeps clockwise from bottom, around the left, over the top, and ends upper-right. The peak frames fill about 75% of the canvas, upper-center.
paladin_9:
  look: Thin golden arc slash rising from lower-right and curving over the top to the left, with sparkles.
  motion: Thin streak at lower-center rises along the right side, curls over the top into a broad arch ending upper-left, sheds sparkles and fades.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Native gold/yellow + white core + ochre fade. Tints cleanly.
  bestFor: [ uppercut slash, sword swing, melee hit, counter ]
  caveats: Sweeps counter-clockwise (up the right side, over the top to the left), and sits mostly in the upper-right quadrant. The first frames are tiny specks.
blood_knight_4:
  look: Small blood orb that coils into a swirling blood vortex, then launches as a tendril-trailed blood comet ending in a crescent splash.
  motion: Orb at right edge drifts LEFT to the left edge, coils into a vortex, bursts, then flies RIGHT growing into a comet, crashes as a crescent splash at the right edge.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: heavy
  tintNote: "Native colors: monochrome crimson/red with dark-red shading. Single-hue, so tints cleanly."
  bestFor: [ life drain then strike back, blood siphon, vampiric projectile, lifesteal attack, sacrifice blast ]
  caveats: "256x128 canvas. Travels both ways: first ~8 frames are a tiny faint orb moving right-to-left (draw-in), then the comet travels left-to-right (launch). The left end is the vortex/caster point and the right end is the hit. Mirror for casters on the right. Early frames are very small and faint."
blood_knight_5:
  look: Oval blood cocoon/dome with fanged, bat-wing-like flame patterns inside, framed by a red rim.
  motion: A low smear at the bottom rises into a crescent bowl, closes into a full oval cocoon with an inner bat/fang flame pattern, then dissolves bottom-up, leaving a thin top arc.
  orientation: rises-from-ground
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: bright red + dark crimson + near-black red interior. Monochrome, so tints well."
  bestFor: [ blood shield, self buff, enrage, blood ritual, blood curse applied, cocoon/encase ]
  caveats: Fills most of a 128 canvas. The first frame is a faint smear near the bottom edge. The inner pattern reads somewhat like a bat/fanged face.
blood_knight_6:
  look: "Radial blood nova: a dot becomes a ring, then a four-lobed petal circle, then a full-canvas ring with a white flash rim."
  motion: A tiny dot grows into a ring, then a four-petal circle, expands to the canvas edge with a white rim flash, then shatters into fading fragments.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: red + dark crimson + white rim highlight on the peak frame."
  bestFor: [ blood nova, AoE burst, explosion, impact, shield break ]
  caveats: Same template as dark_mage_4 and deathbringer_4 (recolors). The first two frames are only a small dot.
dark_mage_1:
  look: Cluster of hooked dark-blue claw/flame streaks with white-blue highlights, sweeping like a rake.
  motion: Small streak cluster in the lower-left grows and sweeps upward, curving over into a flowing comb of hooked streaks at the upper-right, then darkens and fades.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: navy/dark blue body + bright blue + white edge highlights."
  bestFor: [ shadow claw rake, rising slash, dark flames, melee hit, curse eruption ]
  caveats: Content drifts across the canvas from lower-left (start) to upper-right (end) rather than staying centered. Mirror for the opposite side.
dark_mage_2:
  look: Two blue crescent blades merging into a swirling horizontal elliptical torus/ring of energy with a white core.
  motion: Two crescents at the left and right orbit inward, join into a spinning elliptical ring, flare bright white-blue, dim, then the last frame turns dark red.
  orientation: horizontal-band
  anchor: aura
  loopable: false
  intensity: medium
  tintNote: "Native colors: dark blue outer + bright blue + white core. The final frame abruptly becomes dark crimson."
  bestFor: [ binding ring, root/stun, curse applied, vortex, shield, debuff applied ]
  caveats: The final frame switches palette to dark red (odd color jump); trim it or accept it. Flat ellipse, so it works as a body ring or a ground ring.
dark_mage_3:
  look: Flat blue ellipse ring on the ground from which vertical light columns/streaks erupt upward.
  motion: A ground ellipse ring shrinks, a bright glow appears at its center, then vertical streak pillars shoot upward from the ring and fade off the top.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: "Native colors: royal blue ring + lighter blue/white streaks + dark navy residue."
  bestFor: [ summon, teleport/blink, trap trigger, pillar buff, heal pillar, dark eruption ]
  caveats: The first ~3 frames are only a thin ring (wind-up). The pillar sits in the lower and middle canvas, and the ring is at the bottom edge.
dark_mage_4:
  look: "Radial nova: grey dot to blue orb to ring, then a four-petal circle, then a full-canvas ring with white lightning rim."
  motion: A dot swells into an orb and a ring, forms a four-lobed petal circle, expands to the canvas edge with a white crackle rim, then breaks into fading fragments.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: blue + light blue + white crackle + grey start dot."
  bestFor: [ dark nova, AoE burst, explosion, impact, shield break ]
  caveats: Same template as blood_knight_6 and deathbringer_4. The first frame is a small grey dot.
dark_mage_5:
  look: Bright blue-white orb comet with streaky dark tail, impacting in a dark smudge with radial streaks and red sparks.
  motion: The orb starts at the left edge, flies right and slightly down while its tail lengthens, splats center-right into dark smoke with radiating lines and red sparks, then fades.
  orientation: diagonal-down-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: blue/white orb + navy-black tail/smoke + small red spark accents on impact."
  bestFor: [ shadow bolt projectile, dark comet, ranged hit, curse projectile ]
  caveats: 192x128 canvas. The impact is mostly a dark smudge with low contrast on dark backgrounds. Red sparks are a native accent. Last frames are nearly empty.
deathbringer_1:
  look: Hooked purple claw streaks arcing over and crashing down in a lime-green and white splash.
  motion: Streaks appear at the lower-left, rise and arc over to the right, curve downward and crash at the bottom-right with a lime/white splash, then fade.
  orientation: sweep-arc
  anchor: projectile
  loopable: false
  intensity: heavy
  tintNote: "Native colors: indigo/purple streaks + lime-green + white impact core."
  bestFor: [ lobbed shadow strike, ground slam at target, ranged cleave, crashing wave, overhead smash ]
  caveats: 192x128 canvas. Travels left to right, with the impact at the bottom-right corner. Same shape template as frost_knight_10. Early frames are small and faint.
deathbringer_2:
  look: Pentagonal sigil with nested circles and a pentagram-like lime pattern inside a blue pentagon border.
  motion: A purple wisp coalesces into a pentagon seal, glows brighter until the inner pattern goes white/lime, then becomes a solid lime blob that melts and drips downward.
  orientation: none
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: indigo/blue border + lime-green pattern + white glow + purple wisps."
  bestFor: [ curse seal, death mark applied, debuff applied, trap set, summoning circle, doom ]
  caveats: 23 frames (long). Drawn front-facing, not as a floor decal. Late frames are a solid lime silhouette melting downward.
deathbringer_3:
  look: Large skull that ignites in lime/blue flame, turns solid lime-green, then crumbles.
  motion: A dark purple skull fades in, lime flames lick up, it flashes blue/lime, holds as a bright lime skull, then disintegrates from the bottom up.
  orientation: none
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: dark purple + lime-green + blue accents."
  bestFor: [ death mark, doom/execute, fear, curse applied, death ]
  caveats: 21 frames. The icon-like skull fills most of the canvas, so it reads strongly as a symbol. The early dark purple frames are low-contrast on dark backgrounds.
deathbringer_4:
  look: "Radial nova: blue dot to ring, then a four-lobed circle with lime highlights, then a full-canvas ring."
  motion: A dot grows into a ring, forms a four-petal circle with a lime rim, expands to the canvas edge, then breaks into fading blue fragments.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: indigo/blue + lime-green rim highlights."
  bestFor: [ death nova, AoE burst, explosion, impact ]
  caveats: Same template as blood_knight_6 and dark_mage_4. The first frame is a tiny dot, and the last two frames are very faint.
deathbringer_5:
  look: Dark skull slashed by a blue/lime scythe-like crescent wisp, then flashing lime-green.
  motion: A black skull brightens to purple, a wisp curls in from the right and slashes diagonally across it in crescent arcs, the skull cracks and flashes lime, then melts away.
  orientation: none
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: black/dark purple skull + blue crescent + lime-green highlights."
  bestFor: [ reaper strike, execute, death mark trigger, doom detonation, death ]
  caveats: 23 frames (long). The first frames are a near-black skull that is nearly invisible on dark backgrounds. The slashing crescents sweep around the right and bottom of the skull.
deathbringer_6:
  look: Lime-cored orb with a purple crescent front and long trailing purple smoke tendrils.
  motion: A faint crescent at the left grows into a glowing orb that travels left to right across the canvas, trailing wispy smoke, then fades at the right edge.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: indigo/purple + lime-green core + white glint."
  bestFor: [ soul bolt, shadow projectile, curse missile, ranged hit ]
  caveats: 256x128 canvas, content in a thin middle band. The head is a right-facing crescent and most of the width is tail. First and last frames are tiny.
frost_knight_1:
  look: Spiky ice-crystal mace head on a thin shaft that swings, leaving wide blue/white arcing streak trails.
  motion: The mace wobbles at the upper-left for ~6 frames (wind-up), then swings right in a downward arc trailing streaks, flashes white at the lower-right impact, and the streaks fade.
  orientation: sweep-arc
  anchor: projectile
  loopable: false
  intensity: heavy
  tintNote: "Native colors: cyan/sky blue + royal blue + white flash + grey impact chips."
  bestFor: [ heavy weapon swing, ice mace blow, melee cleave, charge strike ]
  caveats: 256x128 canvas. Long static wind-up (frames 0-5 show only the mace rocking). The swing travels left to right from the upper-left to the lower-right. Mirror for the other side.
frost_knight_10:
  look: Hooked icy claw streaks arcing over and crashing down in a violet-white splash and ice shards.
  motion: Small streaks at the lower-left rise and arc over to the right, slam down at the bottom-right with a violet/white burst, then settle into a fading blue ice clump.
  orientation: sweep-arc
  anchor: projectile
  loopable: false
  intensity: heavy
  tintNote: "Native colors: cyan + blue + white + violet accent at impact."
  bestFor: [ lobbed ice strike, ground slam at target, frost wave crash, overhead smash ]
  caveats: 192x128 canvas. Impact at the bottom-right corner. Same shape template as deathbringer_1. First frames are small and pale.
frost_knight_2:
  look: Curved blue-white crescent slash with grey frost mist edging.
  motion: A tiny white nick at the lower center grows up the right side into a crescent, curls over the top toward the upper-left (counter-clockwise uppercut), thins and fades.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: cyan + royal blue + white core + grey mist."
  bestFor: [ uppercut slash, rising frost cut, melee hit, counter ]
  caveats: The first two frames are only a tiny streak. The arc travels from the bottom-right up and over to the top-left, so it ends off-center in the upper-left.
frost_knight_3:
  look: Row of jagged ice spikes erupting from the ground, flashing white then crumbling to grey mist.
  motion: Low crystals along the bottom center grow into a tall spiky ridge, flash white, then turn grey and dissolve into drifting frost haze.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: "Native colors: cyan + white + grey/teal mist at the end."
  bestFor: [ ground spikes, ice eruption, trap trigger, row/AoE attack, ice barrier ]
  caveats: 256x128 canvas, content only in the bottom ~third, horizontally centered. The ending is grey/desaturated.
frost_knight_4:
  look: Big icy crescent slash bulging right, breaking into shards.
  motion: An arc at the top-left sweeps clockwise into a large crescent running from the top down the right side, then fragments and dissolves toward the bottom.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: cyan + royal blue + white edge."
  bestFor: [ melee slash, frost cut, downward cleave, counter ]
  caveats: Only 7 frames (quick). The crescent fills the right half of the canvas and the shards settle bottom-center.
frost_knight_5:
  look: "Frost gust: white curling cloud swirls pushed by blue speed streaks, with drifting snowflakes."
  motion: A small cloud puff at the left blasts rightward, growing a long streaked body with curls at the front and snowflakes around it, then greys and fades.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: white clouds + cyan/blue streaks + white/grey snowflakes. It goes grey at the end."
  bestFor: [ frost breath, wind blast, cone attack, chill debuff, knockback ]
  caveats: 256x128 canvas. Snowflakes are separate decorative bits above and below. Last two frames are grey/desaturated.
frost_knight_6:
  look: Six-armed snowflake glyph that flashes white/cyan with radiating spark lines, then turns deep blue.
  motion: A grey cracked outline fills into a grey snowflake, flashes white/cyan with radial sparks, then cools to bright blue and fades to dark blue.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: grey + white + cyan + royal/dark blue."
  bestFor: [ freeze applied, chill debuff, frost status, stun, ice shield ]
  caveats: Front-facing snowflake icon filling the canvas. The first frame is a faint grey outline.
frost_knight_7:
  look: Ring with four spiked compass points expanding into a large thin ring.
  motion: A white dot becomes a blue ring with four short spikes, which lengthen. The ring expands to near canvas size with small arrow tips, then breaks into a crescent.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: "Native colors: light sky blue + white center + darker blue rim."
  bestFor: [ target lock, cast flash, frost nova, shockwave, shield up ]
  caveats: Only 5 frames (very short; the sheet repeats frames). The compass spikes give it a reticle look.
frost_knight_8:
  look: Ice slash that turns into a cresting cyan wave with frost mist, curling over and breaking.
  motion: A small shard at the lower-left whips into a curved white slash moving up-right, forms a cyan wave cresting at the upper-right, curls down, then dissolves into blue fragments.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: cyan + white + light/royal blue + grey-blue mist."
  bestFor: [ ice wave strike, rising slash, frost hit, knockup ]
  caveats: Content migrates from the lower-left to the right half. The middle frames (3-4) are thin and sparse before the wave forms.
frost_knight_9:
  look: Many parallel curved white-blue slash arcs stacking into a striped sphere-like flurry.
  motion: One feather-like slash at the lower-right multiplies into stacked arcs, which wrap into a canvas-filling striped orb, then thin and fade toward the upper-right.
  orientation: sweep-arc
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: "Native colors: white + cyan + royal blue + grey-blue mist."
  bestFor: [ multi-hit flurry, blade barrage, ice cage/encase, heavy melee hit ]
  caveats: Starts small and off-center (lower-right), and the end streaks drift to the upper-right. The peak frames fill the canvas.
