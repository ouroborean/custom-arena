symbol_lightbulb_001:
  look: Pixel light bulb with a grey screw base. It appears as an outline, lights up white with eight short rays, then glows in the tint color.
  motion: Grows from a tiny dot to a grey wireframe bulb, flashes white with radiating ray dashes, shifts to the tint color while the rays break into dots, and ends lit with no rays.
  orientation: radial
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Tint goes to the glow and rays. The bulb outline and base are blue-grey, with a white flash mid-animation. Yellow reads most naturally.
  bestFor: [ insight/idea buff, reveal/scan enemy, learn or copy a skill, cooldown reset, energy/mana gain, plan/strategize stance ]
  caveats: Short (12 frames) and fast. It ends on a held lit bulb rather than fading out, so it needs an alpha fade or cut.
