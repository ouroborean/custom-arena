symbol_alert_text_002:
  look: Warning triangle with '!' and diagonal hazard stripes, with an 'ALERT' label flashing beneath.
  motion: Triangle visible, white-boxed 'ALERT' label wipes in below, holds, glitches and wipes away, triangle remains.
  orientation: none
  anchor: overhead
  loopable: true
  intensity: light
  tintNote: Main hue in 3 tones + dark stripes; label box is white/pale blue.
  bestFor: [ UI only (text), warning, trap armed, hazard zone, danger ]
  caveats: Contains English text 'ALERT'; first and last frames show only the triangle, so it loops cleanly.
symbol_awesome_text_001:
  look: "'Awesome!' word in chunky letters with stripe shading."
  motion: Letters pop in one by one with wobble, settle into full word, then letters shrink apart into dots and vanish.
  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue in 3 tones + white highlight on letters.
  bestFor: [ UI only (text), critical hit, combo, perfect counter ]
  caveats: Contains English text 'Awesome!'; wide 256x128 canvas with text in middle band.
symbol_bonus_text_001:
  look: "'BONUS!' word in chunky capital letters with stripe shading."
  motion: Letters pop in one by one with wobble, settle into full word, then spread apart into dots and vanish.
  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue in 3 tones + white highlight on letters.
  bestFor: [ UI only (text), bonus damage, extra turn, reward/loot ]
  caveats: Contains English text 'BONUS!'; wide 256x128 canvas with text in middle band.
lightning_burst_003:
  look: "Electric starburst: white-hot core ring with jagged rays, then a red ring with zigzag bolts crackling inside it."
  motion: White dot at center blooms into a spiky flash ring, settles into a crackling circle, which breaks into a dotted ring and scattered sparks.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue on rays/ring + white core and bolts + darker shade on sparks; tints cleanly, white core stays white.
  bestFor: [ lightning impact, explosion, stun applied, shock nova / AoE pulse, crit hit, shield break ]
  caveats: Effect fills most of the 96x96 canvas. The last two frames are only a faint dotted ring and a few sparks, so it has a long fade tail.
lightning_strike_001:
  look: White ground splash crown with two wavy forked bolts branching up to the upper-left and upper-right corners in a V or antler shape.
  motion: Small ground glow ellipse grows, erupts into a spiky splash with V-shaped bolts reaching upward, then the bolts shatter into fading fragments.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue on bolts + white splash/core + darker shade on dissolving fragments; tints well.
  bestFor: [ lightning strike on target, ground eruption, shock trap trigger, AoE stun, summon arrival, explosion ]
  caveats: The ground glow shows before any bolt, so it reads as energy erupting up from the ground. It could also pass as bolts landing from both upper corners. The impact sits at bottom-center of the 128x128 canvas, so anchor at the unit's feet. Frames 3 and 4 are duplicates (held frame).
lightning_strike_002A:
  look: Thick wavy lightning bolt running diagonally from the upper-right corner down to a white crown-shaped impact splash at lower-left.
  motion: A spark appears top-right, the bolt snaps fully to lower-left, flashes white with a ground splash, then crumbles into flecks while the splash sputters out.
  orientation: diagonal-down-left
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue + white flash core + pink/magenta accent pixels in the fading bolt (stray off-hue highlights). Tints fine, but those accent pixels may shift oddly.
  bestFor: [ lightning strike from the sky, ranged lightning hit, smite, stun, chain lightning hop, heavy single-target hit ]
  caveats: The impact point is in the bottom-left corner of the 144x128 canvas, not centered, so the sprite must be offset so that corner lands on the target. Mirror it horizontally for strikes leaning the other way. Frames 3 and 4 are a held duplicate.
lightning_strike_002B:
  look: Same diagonal wavy lightning bolt as 002A, upper-right to lower-left, but with no ground impact splash.
  motion: A spark appears top-right, the bolt extends fully to lower-left, flashes white, then breaks into faint flecks and fades.
  orientation: diagonal-down-left
  anchor: beam
  loopable: false
  intensity: medium
  tintNote: Main hue + white flash + some pink/magenta stray accent pixels; tints fine.
  bestFor: [ lightning beam between units, chain lightning hop, zap projectile path, stun link, pairing with a separate impact effect ]
  caveats: No impact element, so pair it with a burst for the hit. It is a fixed diagonal across the 144x128 canvas, so rotate or scale it to span between units. Frames 3 and 4 are a held duplicate.
lightning_strike_003A:
  look: Vertical wavy lightning bolt from the top to the bottom of a tall canvas, ending in a white spiky splash at bottom-center.
  motion: A thin jagged line flickers in, thickens into a fat glowing bolt, the ground splash erupts at its base, then the bolt and splash break into falling fragments.
  orientation: falls-from-above
  anchor: ground
  loopable: false
  intensity: heavy
  tintNote: Main hue + white core/splash + pink/magenta accent pixels on the outlines; tints well.
  bestFor: [ lightning bolt from the sky, smite, stun, heavy single-target hit, thunder strike AoE (several copies), trap trigger ]
  caveats: Tall 96x128 canvas with the impact at bottom-center. Anchor at the unit's feet so the bolt rises above the head.
lightning_strike_003B:
  look: Vertical wavy lightning bolt spanning the full height of a tall canvas, with no ground splash.
  motion: A thin jagged line flickers in, swells into a thick glowing bolt, then thins into an outlined zigzag and dissolves into flecks.
  orientation: vertical-band
  anchor: beam
  loopable: false
  intensity: medium
  tintNote: Main hue + white core + pink/magenta outline accents; tints well.
  bestFor: [ vertical lightning beam, zap from above, chain link (rotated), electrified status pulse, pairing with separate impact ]
  caveats: No impact splash. Rotate 90 degrees to use it as a horizontal beam between the two rows.
directional_bubble_burst_001:
  look: Cluster of outlined bubbles, plus smaller blue bubbles and yellow-white twinkle sparkles, floating upward and popping.
  motion: Two bubbles appear low, multiply into a cluster that rises through center, then drift to the top and pop into tiny sparkles.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue on most bubbles, plus native blue bubbles and pale yellow sparkles that are not part of the main hue. Under tinting the blue and yellow accents may clash or stay off-color.
  bestFor: [ water buff, cleanse, heal over time, sleep/charm status, self buff, bubble shield applied ]
  caveats: 40 frames, so it is long. The last frame is nearly empty. Content drifts to the top third, so anchor low on the unit.
directional_coin_burst_001:
  look: Red ring-shaped coins fountaining out of a white flash, arcing overhead, then bouncing and settling along the ground.
  motion: White flash at center, coins spray up into an arch, spin edge-on as they fall, land and scatter across the bottom, then vanish.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue coins with darker rim shading + white initial flash; tinting to gold works naturally.
  bestFor: [ steal/pickpocket, gold/resource gain, loot drop, bribe, reward (UI), cost paid ]
  caveats: Coins are literal objects, a narrow theme. They end at the bottom edge of the 128x128 canvas, so the ground is the canvas floor. Last frame is nearly empty.
directional_heart_burst_001:
  look: Plump red hearts, some darker or translucent, floating upward in a cluster and popping into sparkles.
  motion: One heart at bottom-center, multiplies into a rising cluster, reaches the top, where the hearts burst into twinkles and fade.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue hearts with darker shade + white sparkle pops; tints fine, but pink or red reads best for hearts.
  bestFor: [ heal, charm applied, love/affection buff, lifesteal received, ally support buff ]
  caveats: Hearts are literal icons, so the theme is narrow. Ends with only a few sparkles in the upper part of the canvas.
directional_heart_burst_002:
  look: A few medium red hearts floating up and spreading out, each popping into a small starburst.
  motion: A tiny heart appears low, several hearts drift upward and grow, pop into starbursts mid-to-upper canvas, leaving a faint dotted ring.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue hearts + darker shade + white/light starburst pops; tints fine.
  bestFor: [ heal, charm, small buff, affection/taunt-style lure, regen tick ]
  caveats: Sparse, only about 4-5 hearts. The first frame is a tiny speck at lower-left of center. Final frame is a faint ring.
directional_heart_burst_003:
  look: Many small hearts with tiny sparkles and up-arrows fanning upward, some turning into outlined hollow hearts at the top.
  motion: A speck at bottom-center sprays a fan of small hearts upward. They spread wide, thin out, and become hollow outline hearts before fading.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: light
  tintNote: Main hue hearts + darker shade + white sparkles/arrow marks; tints fine.
  bestFor: [ group heal, charm AoE, stat up buff, healing received, morale buff ]
  caveats: Small up-arrow glyphs mixed in suggest a stat increase. Long tail (35 frames) ending with a single outline heart near the top.
directional_music_burst_001:
  look: Red beamed music notes, with white sound-wave arcs underneath, rising from the bottom of the canvas.
  motion: A white note and squiggle appear at the bottom, a cluster of notes with pulsing sound arcs forms, then the notes float upward and shrink away.
  orientation: points-up
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Main hue notes + white sound-wave arcs and first-frame note; tints fine.
  bestFor: [ song/bard buff, sleep/lullaby, charm, sonic attack cast, morale buff ]
  caveats: Music notes are literal, so the theme is narrow. Starts at the canvas floor, so anchor at the feet.
directional_music_burst_002:
  look: Red music notes and a treble clef fanned in an arch across the upper canvas after a white flash.
  motion: White dot flash, a white burst of notes with curved arcs, then red notes and treble clef hang in an arch, bob slightly, and shrink away.
  orientation: points-up
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue notes + white flash frames + darker shading; tints fine.
  bestFor: [ song buff, sleep/lullaby, charm, bard ability cast, confusion status ]
  caveats: Starts centered but the notes settle in the upper half, so anchor at mid-body or overhead. Includes a literal treble clef.
directional_particle_burst_001:
  look: White-cored teardrop or flame-shaped particles and round blobs rising upward like bubbles or embers.
  motion: One white teardrop at bottom, several more join and rise as a cluster, drift to the top, and shrink into small droplets and dots.
  orientation: points-up
  anchor: center
  loopable: false
  intensity: subtle
  tintNote: Main hue blobs + white teardrop cores + darker shade; very tint-friendly, a generic abstract shape.
