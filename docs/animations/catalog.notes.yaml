symbol_you_won_text_001:
  look: Bubbly "You Won!" text with striped red fill and pale outline, in a wide 288x128 canvas.
  motion: Letters pop in jumbled, settle into the phrase, then shrink letter by letter left to right into specks and vanish.
  orientation: horizontal-band
  anchor: screen
  loopable: false
  intensity: light
  tintNote: Red striped fill tints and the pale outline stays.
  bestFor: [ UI only (text), match win banner ]
  caveats: English text with no skill use. Small glyphs in a wide canvas.
blood_knight_1:
  look: Cluster of crimson claw-like blood streaks that arc rightward and crash down into a white-hot splash at the right.
  motion: Small streaks start at the far left, sweep right while growing into a curved wave that peaks, crash down at the right edge with a white flash, then decay into a dark blood puddle-spray.
  orientation: points-right
  anchor: projectile
  loopable: false
  intensity: medium
  tintNote: "Native colors: bright red, dark maroon and a white impact core. All of it is blood-red, so a hue shift recolors the whole thing."
  bestFor: [ blood wave projectile, lifesteal strike, travelling slash to target, bleed applied, melee lunge impact ]
  caveats: Wide 192x128 canvas with travel built in from left to right. The impact lands in the lower-right corner, so align that corner to the target. Only 10 frames and fast.
blood_knight_2:
  look: Bundle of jagged crimson claw-gash streaks that rise from lower-left and curl over toward the upper-right.
  motion: Faint streaks appear at lower-left, surge upward and brighten, sweep and curl to the upper-right like a raking slash, then darken and fade in place.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: bright red with dark maroon shades and no white core. It darkens to deep maroon as it fades."
  bestFor: [ claw/rake melee hit, upward slash, bleed applied, blood frenzy self buff ]
  caveats: Content starts in the lower-left and ends in the upper-right, so it is off-centre. 8 frames, quick. Mirror it for left-facing use.
blood_knight_3:
  look: "A blood orb bursts into a spiky crown-shaped explosion: a crescent arc ringed with jagged spikes thrusting up and right."
  motion: A small red orb at lower-left-of-centre erupts into a white-hot spiked burst, settles into a spiky crescent splash, then breaks into scattered droplets and fades.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: "Native colors: bright red, dark maroon, black-red core and a white flash at its peak. A hue shift recolors all of it."
  bestFor: [ blood explosion, bleed burst/detonation, melee hit, blood sacrifice, on-death splatter ]
  caveats: The origin sits at lower-left-of-centre, about 40%/65% of the canvas, and the spikes splay up and right, so it is asymmetric. 7 frames with one held frame. It ends in sparse faint droplets.
directional_smoke_burst_005:
  look: Wedge of billowing smoke with white-hot streaks blasting out of the lower-right corner and fanning leftward, slightly upward.
  motion: Tiny ember at lower-right edge flares into white streaks angled up-left, smoke mass rolls left across canvas, breaks into drifting embers, fades.
  orientation: points-left
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: Main hue in 3 tones + white-hot streak cores; white streaks stay readable under any tint.
  bestFor: [ dash/charge kick-up, forward blast from caster, impact blowback, fire breath (short), jet/thruster burst, melee shockwave ]
  caveats: Origin sits at the lower-right edge of a wide 96x48 canvas and the mass hugs the bottom; offset the anchor so the origin lands on the source unit. Flip horizontally to spray right.
stylized_skull_smoke_burst_001:
  look: Smoke puff that forms a skull-and-crossbones, then a ring outline, then breaks apart.
  motion: Small center puff swells into skull with crossbones, ring outline appears, jaw splits from cranium, pieces scatter into puffs top and bottom, dissipates.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Single hue in 3-4 tones (light face, darker eye sockets/ring); reads well in sickly green or purple.
  bestFor: [ death, poison applied, curse/doom, execute, lethal debuff, necrotic hit ]
  caveats: Iconic skull shape is very literal; best reserved for death/poison/curse moments.
symmetrical_smoke_burst_001:
  look: Puff with white core that expands into a thick donut ring of clumped smoke clouds.
  motion: Small white-cored puff grows into a filled cloud, opens a hollow center, ring widens and darkens, then crumbles to scattered particles.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue in 3 tones + brief white core early; ring darkens to the deepest tone at the end.
  bestFor: [ explosion, smoke bomb, teleport/blink arrival, summon poof, impact, dispel ]
  caveats: Fills most of the 64x64 canvas at peak.
symmetrical_smoke_burst_002:
  look: Small cloud that blooms into a diamond-shaped ring of smoke puffs.
  motion: Dot grows into rounded cloud, opens into diamond ring of puffs that expands outward, thins to outlined fragments, fades.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Single hue in 2-3 soft tones; no white.
  bestFor: [ minor impact, poof/vanish, dust hit, dispel, small explosion, debuff cleared ]
  caveats: Content uses only roughly the middle 60% of a 128x128 canvas; scale accordingly. Diamond (rotated-square) silhouette.
symmetrical_smoke_burst_003:
  look: Large four-lobed (clover) smoke explosion billowing out along the diagonals.
  motion: Small diamond flattens into a horizontal disc, then erupts into four big lobes on the diagonals, lobes billow and hollow, outlines remain, fades.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue in 3-4 tones with dark inner shading; no white.
  bestFor: [ big explosion, AoE detonation, bomb, ultimate impact, summon arrival, shockwave ]
  caveats: Brief horizontal-disc frame before the burst. Fills the 128x128 canvas at peak.
burst_splatter_001:
  look: Liquid blob bursting into droplets with four curved streams arcing up and out then falling.
  motion: Small blob splats into star, droplets spray, four streams arc outward like a fountain and droop downward, leftover drops fall away.
  orientation: radial
  anchor: center
  loopable: false
  intensity: light
  tintNote: Single saturated hue, 2 tones; flat, no white.
  bestFor: [ bleed hit, melee hit, water splash, poison splash, acid impact ]
  caveats: Thin, sparse droplets; small on screen. Arcs fall slightly, giving a fountain read.
burst_splatter_002:
  look: Thick goopy splatter with many curling tendrils radiating outward in all directions.
  motion: Diagonal blob (upper-left to lower-right) erupts into dense star of tendrils, tips curl into droplets, breaks apart into scattered curls, fades.
  orientation: radial
  anchor: center
  loopable: false
  intensity: heavy
  tintNote: Main hue in 3-4 tones with bright highlights; reads as gore/goo/lava depending on tint.
  bestFor: [ heavy bleed, crit hit, slime/acid burst, lava splash, death burst, explosion (liquid) ]
  caveats: Initial blob is diagonal, so early frames are slightly asymmetric. Fills the 96x96 canvas.
burst_splatter_003:
  look: Star-shaped splatter with ~8 straight spoke tendrils radiating evenly outward.
  motion: X-shaped blob grows, spokes shoot out in 8 directions, tips curl into droplets, scatter outward and fade.
  orientation: radial
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue in 3-4 tones with bright highlights.
  bestFor: [ impact, bleed burst, ink/shadow splash, explosion (liquid), crit hit, trap trigger ]
  caveats: More regular and spoked than burst_splatter_002.
directional_splatter_001:
  look: Thin small splatter streak flicking from canvas center toward the upper-right.
  motion: Tiny blob kinks, extends into a short streak aimed up-right, droplets drift up-right and fade.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: subtle
  tintNote: Single hue, 1-2 tones; flat.
  bestFor: [ light hit, bleed tick, small slash spray, poison tick, dodge chip ]
  caveats: Very small and sparse on a 64x64 canvas; needs upscaling to read.
directional_splatter_002:
  look: Mushroom-shaped splash erupting upward from center into a crown of droplets.
  motion: Small blob shoots up into a mushroom/fountain splash, crown breaks into droplets spreading outward in an arch, droplets fall and fade.
  orientation: points-up
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Single saturated hue, 2 tones; flat.
  bestFor: [ splash on ground, geyser/eruption small, bleed hit, water impact, acid burst, trap trigger ]
  caveats: Content sits in the upper-middle of a 96x96 canvas; origin is near center, not bottom. Later frames are sparse dots.
directional_splatter_003:
  look: Splatter spraying from the lower-left corner diagonally toward upper-right with curled tendril tips.
  motion: Blob in lower-left corner stretches diagonally up-right into tendrils, tips curl, breaks into scattered droplets.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue in 3-4 tones with bright highlights.
  bestFor: [ directional hit spray, slash impact, bleed, projectile impact exit spray, acid spit splash ]
  caveats: Origin at the lower-left corner of a small 48x48 canvas; offset so that corner lands on the hit point. Mirror for other directions.
directional_splatter_004:
  look: Fan of goopy tendrils and round droplets bursting up and to the right from the lower-left.
  motion: Blob at lower-left surges up-right into a broad fan of tendrils with ball droplets, tips curl, thins to curly wisps.
  orientation: diagonal-up-right
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue in 3-4 tones with bright highlights.
  bestFor: [ heavy directional hit, bleed spray, slime splash, crit impact, lava spatter ]
  caveats: Origin at the lower-left of a 48x48 canvas; wider and more upward than directional_splatter_003.
directional_splatter_005:
  look: Teardrop blob at bottom splitting into two or three plumes of droplets rising upward.
  motion: Blob at bottom center bursts into upward plumes, droplets climb and curl at the tops, thin out and fade.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: light
  tintNote: Main hue in 3 tones with highlights.
  bestFor: [ ground splash, geyser small, bleed from below, poison bubble up, eruption ]
  caveats: Tall 48x64 canvas with the origin at the bottom edge.
fanfx_barrier:
  look: Wall of faceted triangle/diamond tiles that assembles into a full square lattice panel.
  motion: Tiles snap in from bottom-left building up-right into a full panel, shimmer with white highlights, then shatter from bottom-left leaving white outline bits.
  orientation: none
  anchor: center
  loopable: false
  intensity: medium
  tintNote: Main hue in 3 facet tones + white highlight facets and white edge outlines at breakup.
  bestFor: [ shield, barrier raised, guard/defend, damage blocked, shield broken, ward ]
  caveats: Opaque square panel filling the whole 64x64 canvas; would cover a unit if centered on it. Build and break run diagonally bottom-left to top-right.
fanfx_gaze:
  look: Large single eye with red iris and white glow outline that opens, stares, closes, then puffs apart.
  motion: Horizontal line opens into a glowing eye, holds and narrows, closes back to a line, splits into two smoke puffs flying left and right, fades.
  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Iris/sclera in main hue tones + white outline glow and dark pupil.
  bestFor: [ mark/target, reveal/scout, charm, fear, curse applied, taunt ]
  caveats: Wide 192x128 canvas with the eye occupying a thin middle band; lots of empty space.
fanfx_pain:
  look: Scattered small pins and thorn-like spikes appearing around the center, with long thin needle streaks slashing across.
  motion: Pins pop in at random positions around the unit, two long needle streaks cross diagonally, pins jitter and fade out.
  orientation: radial
  anchor: aura
  loopable: true
  intensity: subtle
  tintNote: Pale main hue + white needle cores; very low coverage.
  bestFor: [ pain/damage-over-time tick, bleed status, curse tick, acupuncture/needle hit, vulnerability applied ]
  caveats: Very sparse and faint on a 128x128 canvas; may need scaling down and brightening. Nearly empty first and last frames, so it loops only with a gap.
fanfx_slow:
  look: Clock face of Roman numerals with white hands and pink arcs, hands moving sluggishly.
  motion: White numerals ring appears, turns red with hands and pink circle, hands jerk to new positions with motion arcs, numerals dissolve to outlines.
  orientation: radial
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Numerals in main hue + white hands + pink accent arcs.
  bestFor: [ slow, haste (tinted), time manipulation, cooldown increase, delay ]
  caveats: Contains Roman numeral glyphs; fills a 128x128 canvas.
fanfx_stop:
  look: Tilted hourglass (upper-left to lower-right) with wood caps and pink sand, cracked by a gold flash and shattered.
  motion: White crescent swoosh, hourglass appears wrapped by white swirl, holds, gold lightning crack flashes across, shatters into pale glass shards and dotted outline, fades.
  orientation: diagonal-down-right
  anchor: overhead
  loopable: false
  intensity: medium
  tintNote: "Native multi-color: brown wood, pink sand, pale blue glass, white, gold crack; poor candidate for tinting."
  bestFor: [ stun, time stop, freeze turn, skip turn, cooldown reset ]
  caveats: Many colors beyond a 4-color palette; tinting will flatten the wood and sand detail. Large 160x160 canvas.
symbol_alert_001:
  look: Single italic exclamation mark leaning right, flashing white then settling red.
  motion: Thin white mark flashes in, swells with glowing outline, outline fades, settles as a solid red-salmon '!' that holds.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue in 3 tones + white flash/outline at entry.
  bestFor: [ UI only (alert), counter ready, taunted, enemy noticed, warning, trap armed ]
  caveats: Ends on a held static glyph; hold the last frame or fade it out yourself.
symbol_alert_002:
  look: Double italic exclamation marks '!!' leaning right, flashing white then settling red.
  motion: Thin white marks flash in, swell with glowing outline, outline fades, settle as solid red '!!' that hold.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Main hue in 3 tones + white flash/outline at entry.
  bestFor: [ UI only (alert), danger/charge warning, enraged, critical incoming, big counter ready ]
  caveats: Ends on a held static glyph.
symbol_alert_text_001:
  look: "'ALERT' word banner with hazard-stripe bars above and below."
  motion: Static banner that jitters and glitches mid-animation, horizontal shifts in letters and stripes, returns to clean state.
  orientation: horizontal-band
  anchor: overhead
  loopable: true
  intensity: light
  tintNote: Main hue in 3 tones + white letter highlights.
  bestFor: [ UI only (text), warning, boss charging, danger zone ]
