# By-eye descriptions of each animation, merged into catalog.yaml by scripts/animations/build-catalog.mts.
# orientation: the drawn direction before rotation; anchor: where it sits on a unit; bestFor: suggested uses.

symbol_bonus_text_002:
  look: Word 'BONUS' in small italic blocky letters with horizontal light-to-dark red stripes, centered in a wide canvas.
  motion: Starts as a tiny cursor dash at left; letters type in left-to-right with glitchy scramble, hold, then collapse into vertical slivers left-to-right and vanish.
  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Single hue in striped light/dark bands plus white highlight specks; tints cleanly.
  bestFor: [ UI only (text), bonus damage callout, extra action gained, resource bonus pickup ]
  caveats: English text. Letters are small relative to the 256x96 canvas (about a fifth of its height). First and last frames are nearly empty.
symbol_clear_text_001:
  look: Word 'CLEAR' in small italic blocky striped letters, centered in a wide canvas.
  motion: Cursor dash at left types the letters in left-to-right with a glitch, holds, then letters shrink into vertical bars left-to-right and disappear.
  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Single hue with horizontal stripe banding plus white glints; tints cleanly.
  bestFor: [ UI only (text), cleanse/status cleared callout, stage cleared, debuff removed ]
  caveats: English text, small within the 256x96 canvas. First and last frames are nearly empty.
symbol_complete_text_001:
  look: Word 'COMPLETE' in small italic blocky striped capitals across a wide canvas.
  motion: Types in left-to-right from a cursor with a scrambled build-up, holds, then letters collapse to slivers left-to-right and vanish.
  orientation: horizontal-band
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Single hue striped light-to-dark plus white glints; tints well.
  bestFor: [ UI only (text), channel/charge complete, quest or tutorial complete, combo finished ]
  caveats: English text. Small letters in a 320x96 canvas. First and last frames are nearly empty.
symbol_cool_text_001:
  look: Bubbly rounded 'Cool!' with horizontally striped fill, large in the canvas.
  motion: White leading glyph sliver, then letters wobble and bounce into place, hold, then shrink into dots left-to-right and vanish.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Single hue with stripe banding; the first frame has white pixels. Tints well.
  bestFor: [ UI only (text), stylish dodge callout, perfect timing praise, combo praise ]
  caveats: English text, casual tone. Wobbly letter entrance, so the letters are not aligned until mid-animation. Last frame is a single dot.
symbol_crown_001:
  look: Five-pointed pixel crown with dark outline and gem-like highlights; sparkle stars and dotted arcs when it appears.
  motion: Small white silhouette pops into a full crown with sparkles and dotted confetti arcs, holds while a white glint moves across, then shatters into scattered pixels.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: medium
  tintNote: Main hue in several shades with a dark outline, white glints and sparkles. Gold would read best; a dark tint loses detail.
  bestFor: [ leader/command buff, king/royal status applied, taunt or mark as priority target, victory or MVP, rank up, dominance stance ]
  caveats: Fills the 64x48 canvas fully. It dissolves into scattered pixels at the end rather than fading.
symbol_danger_text_001:
  look: Large bold italic 'DANGER' banner between two rows of slanted hazard stripes, filling the canvas.
  motion: Present from the first frame and holds the whole time, with letters jittering and flickering and the hazard stripes shimmering. Warning-sign flash.
  orientation: horizontal-band
  anchor: overhead
  loopable: true
  intensity: medium
  tintNote: Main hue with striped shading, dark outlines and white highlights. Reads best in red or yellow.
  bestFor: [ telegraph of big incoming attack, boss charging ultimate, low HP warning, trap armed, marked for death debuff, UI only (text) ]
  caveats: "English text. No intro or outro: it is full-on from frame 0, so fade it in and out with alpha. Wide banner (144x96)."
symbol_failure_001:
  look: Large chunky X cross with striped fill, a pale outline and blue-grey drop shadow.
  motion: Pops in from a tiny dot, holds while a shine band passes over, then squashes into horizontal glitch lines and ends as thin dashes before vanishing.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: medium
  tintNote: Main hue striped fill. The white outline and blue-grey shadow stay neutral under a 4-color swap.
  bestFor: [ miss/whiff, skill fails or is negated, immune/blocked, silence/seal applied, action cancelled/interrupted, invalid target ]
  caveats: Long hold (60 frames). It ends with a CRT-style collapse into horizontal lines rather than a fade.
