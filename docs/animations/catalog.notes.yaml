  motion: A curl draws in from a speck at top-right, the full "?" with its dot forms and wobbles slightly, then it unwinds back into the curl and disappears.
  orientation: none
  anchor: overhead
  loopable: false
  intensity: light
  tintNote: Uses the main hue with dark and mid shades and has no white outline, so the whole glyph tints. Dark tints lose its shape.
  bestFor: [ confuse, blind/miss, stealth target lost, random effect, dodge (attacker confused) ]
  caveats: Short (30 frames). The first and last frames are almost empty specks. There is no outline, so it needs a contrasting tint against dark backgrounds.
