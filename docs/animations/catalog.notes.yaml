directional_particle_burst_002:
  look: Row of tall white-cored flame or energy spikes shooting up from a curved ground line, then rising as embers.
  motion: A thin arc appears at the bottom, flame spikes sprout and stretch tall, detach and rise upward, and break into embers near the top.
  orientation: rises-from-ground
  anchor: ground
  loopable: false
  intensity: medium
  tintNote: Main hue + white hot cores + darker shade embers; tints well (fire, holy, poison).
